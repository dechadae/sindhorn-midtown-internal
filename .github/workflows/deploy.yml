name: Deploy Sindhorn Midtown Internal

on:
  push:
    branches:
      - main
      - design-unification-pass
      - phase1-foundation
      - english-only-interface
      - fnb-action-plan-redesign
      - today-guidance-details-fnb
      - phase9-single-shell-router
      - hotfix-phase9-deploy-gate
      - hotfix-phase8-2-deploy-validation
      - webgl-environment-v1
      - hybrid-shell-v15
      - atmosphere-tester-v1
      - hotfix-rain-svg-pane
      - rain-realism-type-consistency
      - promote-atmosphere-tester
      - fix-duplicate-sun-final
      - fix-celestial-v2-import
      - fix-soft-luminous-sun
      - sun-post-cloud-composite
      - fix-blue-cloudy-sky
      - fix-sun-statusbar
      - revert-capture-dim-sun
      - user-local-location
      - storm-rain-realism
      - capture-normal-layout
      - fix-skip-link-flash
      - fix-lunar-phase-v2
      - fix-lunar-phase-shader
      - live-location-fixtures
      - hotfix-settings-deploy-gate-v2
      - fix-main-release-health-20260831
    paths:
      - "site/**"
      - "scripts/generate-fnb-share.mjs"
      - "scripts/generate-pwa-icons.mjs"
      - ".github/tests/fnb-sharing-regression.test.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate public F&B shares and launcher icons
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3 >/dev/null 2>&1
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export PUBLIC_ORIGIN="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            export PUBLIC_ORIGIN="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi
          node scripts/generate-fnb-share.mjs
          node scripts/generate-pwa-icons.mjs

      - name: Validate shell candidate
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/route-registry.js site/app-transitions.js site/auth-shell.js site/auth-client.js site/login.js \
            site/account.js site/admin.js site/capabilities.js site/settings.js site/settings-route-v3.js \
            site/business-dashboard.js site/business-dashboard-data.js site/fnb.js site/fnb-data.js site/fnb-share-ui.js \
            site/brand.js site/ihg-history.js site/hotel-factsheet-route.js site/ci.js \
            site/location.js site/bootstrap.js site/live-data.js site/betta-environment.js site/betta-fin-presets.js \
            site/betta-fin-shader.js site/betta-satellite.js site/environment.js site/atmosphere-shader.js \
            site/seasonal-sky.js site/rain-layer.js site/rain-layer-legacy-weather.js site/sun-dimmer.js \
            site/screen-capture.js site/notification-inbox.js site/push-client.js site/phase8-2-fixtures.js \
            site/phase8-2-browser-smoke.mjs site/presentation-recovery.js site/app.js site/sw.js \
            worker/src/index.js auth-worker/src/index.js; do
            if ! node --input-type=module --check < "$file" 2>/tmp/modcheck.err; then
              echo "ES module syntax error in $file"; cat /tmp/modcheck.err; exit 1
            fi
          done
          node --input-type=module --check < scripts/generate-fnb-share.mjs
          node --input-type=module --check < scripts/generate-pwa-icons.mjs
          node --input-type=module --check < site/share/fnb-runtime.js
          node --input-type=module --check < site/share/fnb-public-shell.js
          node --input-type=module --check < site/share/fnb-share-ui-public.js
          node .github/tests/fnb-sharing-regression.test.mjs
          node .github/tests/font-architecture.test.mjs
          node --experimental-default-type=module site/phase8-2-seasonal-clouds.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site'); fallback=root/'fallback'
          manifest=json.loads((fallback/'manifest.json').read_text())
          bootstrap=(root/'bootstrap.js').read_text()
          auth_shell=(root/'auth-shell.js').read_text()
          registry=(root/'route-registry.js').read_text()
          transitions=(root/'app-transitions.js').read_text()
          index=(root/'index.html').read_text()
          sw=(root/'sw.js').read_text()
          betta=(root/'betta-environment.js').read_text()
          legacy_env=(root/'environment.js').read_text()
          shader=(root/'atmosphere-shader.js').read_text()
          seasonal=(root/'seasonal-sky.js').read_text()
          rain=(root/'rain-layer.js').read_text()
          location=(root/'location.js').read_text()
          shell_version=int(re.search(r'const SHELL_VERSION=(\d+);',bootstrap).group(1))
          assert manifest['minimumShell']==shell_version==17
          for item in manifest['resources']:
              assert hashlib.sha256((fallback/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']

          assert '/auth-shell.js' in index and '/auth-shell.css' in index
          assert 'src="/location.js"' not in index and 'src="/bootstrap.js"' not in index
          assert "await initAuth" in auth_shell and "location.replace(loginUrl())" in auth_shell
          assert "loadClassicScript('/location.js')" in auth_shell and "await import('./bootstrap.js')" in auth_shell
          assert "const SETTINGS_PATH='/settings'" in auth_shell and "dataset.appRoute='settings'" in auth_shell

          route_tokens=(
            "today:Object.freeze({path:'/'",
            "module:'./business-dashboard.js?v=2'",
            "mount:'mountBusinessDashboardRoute'",
            "fnb:Object.freeze({path:'/fnb'",
            "brand:Object.freeze({path:'/brand'",
            "ihgHistory:Object.freeze({path:'/ihg-history'",
            "hotelFactsheet:Object.freeze({path:'/hotel-factsheet'",
            "messages:Object.freeze({path:'/messages'",
            "settings:Object.freeze({path:'/settings'",
            "ci:Object.freeze({path:'/ci'",
            "mount:'mountFnbRoute'",
            "mount:'mountSettingsRoute'",
          )
          for token in route_tokens: assert token in registry,token
          assert "kind:'pack',resource:'messages.html'" in registry
          assert "account:Object.freeze" not in registry and "admin:Object.freeze" not in registry
          assert "['/account','settings']" in registry and "['/admin','settings']" in registry
          assert "['/guidance','today']" in registry and "['/details','today']" in registry

          assert "import {ROUTES,canonicalRoute,routeForPath}" in bootstrap
          assert 'mountLocalRoute' in bootstrap and "routeHost.dataset.shellRoute=route" in bootstrap
          assert "await import('./betta-environment.js')" in bootstrap
          assert "await environment.initEnvironment()" in bootstrap
          assert "renderer='sindhorn-betta-satellite-v1'" not in bootstrap
          assert "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" in betta
          assert "dataset.environmentInput='satellite-only'" in betta
          assert 'startSatelliteStream' in betta and "const DPR=2" in betta
          assert 'preserveDrawingBuffer:false' in betta
          assert "DEFAULT_PRESET" in betta
          assert 'Legacy weather-visual compatibility no-op' in rain and 'export {}' in rain
          assert (root/'rain-layer-legacy-weather.js').exists()

          # Legacy weather renderer remains deterministic rollback/research coverage only.
          for token in ('seasonalSkyForState','ATMOSPHERE_VERTEX_SHADER','ATMOSPHERE_FRAGMENT_SHADER','createAtmosphereNoiseTexture'):
              assert token in legacy_env,token
          assert "renderer:'bangkok-seasonal-clouds-v2'" in legacy_env and 'const DPR=2' in legacy_env
          assert 'Low convective / monsoon' in shader and 'Visible sun disc' in shader and 'texture2D(uNoise' in shader
          assert 'MONTHLY=[' in seasonal and 'bangkokSeasonalProfile' in seasonal
          assert "open_meteo_used:false" in location and 'sindhorn-weather-core' in location

          redirects=(root/'_redirects').read_text()
          assert redirects.endswith('\n')
          rules=[line.strip() for line in redirects.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          for token in ('/guidance / 301','/details / 301','/account.html /account 301','/admin.html /admin 301'):
              assert token in rules,token
          assert not any('/index.html' in rule and rule.endswith('200') for rule in rules)
          assert not any(rule.startswith('/*') for rule in rules)
          for path in sorted(set(re.findall(r"path:'(/[a-z-]*)'",registry))):
              if path=='/': continue
              assert f'{path} / 200' in rules,f'{path} missing SPA fallback'

          assert '/sky-calibration.js' not in index and '/sky-color-renderer.js' not in index and '/storm-effects.js' not in index
          assert "'/business-dashboard.js'" in sw and "'/betta-environment.js'" in sw and "'/betta-satellite.js'" in sw
          assert "'/environment.js'" in sw and "'/rain-layer-legacy-weather.js'" in sw
          assert 'pwa-v34-betta-dashboard-r1' in sw and 'pwa-v32-betta-satellite-r1' in sw
          assert "addEventListener('push'" in sw and "addEventListener('notificationclick'" in sw
          assert "NOTIFICATION_DB='sindhorn-midtown-notification-inbox'" in sw

          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'
          app=(root/'app.js').read_text(); push=(root/'push-client.js').read_text()
          assert "messages:'/messages'" in app and "navigator.serviceWorker.register('/sw.js',{scope:'/'})" in app
          assert "new Set(['today','messages'])" in app
          assert 'pushManager.subscribe' in push and 'Notification.requestPermission' not in push
          assert 'letter-spacing:0!important' in (root/'auth-shell.css').read_text()
          assert 'font-weight:400' in (root/'auth-brand.css').read_text()
          public=(root/'share/fnb.html').read_text()
          assert 'property="og:title"' in public and 'property="og:url"' in public
          assert 'og:image' not in public.lower() and 'twitter:image' not in public.lower()
          PY

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test deployed shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            BASE_URL="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi
          sleep 8
          for path in \
            / /fnb /messages /brand /ihg-history /hotel-factsheet /settings /ci /account /admin \
            /route-registry.js /app-transitions.js /auth-shell.js /auth-shell.css /auth-client.js /login.html /login.js \
            /business-dashboard.js /business-dashboard-data.js /business-dashboard.css \
            /brand.js /ihg-history.js /hotel-factsheet-route.js /ci.js \
            /capabilities.js /settings.js /settings-route-v3.js /fnb.js /fnb-share-ui.js /location.js /bootstrap.js \
            /betta-environment.js /betta-fin-presets.js /betta-fin-shader.js /betta-satellite.js \
            /environment.js /atmosphere-shader.js /seasonal-sky.js /rain-layer.js /rain-layer-legacy-weather.js \
            /manifest.webmanifest /notification-inbox.js /push-client.js /sw.js /share/fnb; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          for path in / /fnb /messages /brand /ihg-history /hotel-factsheet /settings /ci /account /admin; do
            curl --fail --silent --show-error --location "${BASE_URL}${path}" -o /tmp/app-route.html
            grep -q '/auth-shell.js' /tmp/app-route.html
            grep -q 'id="route-view"' /tmp/app-route.html
          done
          for path in /fnb /messages /brand /ihg-history /hotel-factsheet /settings /ci /account /admin; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}${path}")
            test "$code" = "200" || { echo "FAIL ${path} returned ${code}"; exit 1; }
          done
          for legacy in /guidance /details; do
            curl --fail --silent --show-error --location "${BASE_URL}${legacy}" -o /tmp/legacy.html
            grep -q '/auth-shell.js' /tmp/legacy.html
          done

          curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html
          curl --fail --silent --show-error --location "${BASE_URL}/auth-shell.js" -o /tmp/auth-shell.js
          curl --fail --silent --show-error --location "${BASE_URL}/route-registry.js" -o /tmp/route-registry.js
          curl --fail --silent --show-error --location "${BASE_URL}/bootstrap.js" -o /tmp/bootstrap.js
          curl --fail --silent --show-error --location "${BASE_URL}/betta-environment.js" -o /tmp/betta-environment.js
          curl --fail --silent --show-error --location "${BASE_URL}/business-dashboard.js" -o /tmp/business-dashboard.js
          curl --fail --silent --show-error --location "${BASE_URL}/rain-layer.js" -o /tmp/rain-layer.js
          curl --fail --silent --show-error --location "${BASE_URL}/environment.js" -o /tmp/environment.js
          curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js
          curl --fail --silent --show-error "${BASE_URL}/share/fnb" -o /tmp/share-fnb.html
          curl --fail --silent --show-error "${BASE_URL}/share/fnb/fried-chicken-waffles" -o /tmp/share-promo.html

          grep -q '/auth-shell.js' /tmp/root.html
          ! grep -q 'src="/bootstrap.js"' /tmp/root.html
          ! grep -q 'src="/location.js"' /tmp/root.html
          grep -q "await import('./bootstrap.js')" /tmp/auth-shell.js
          grep -q "loadClassicScript('/location.js')" /tmp/auth-shell.js
          grep -q "module:'./business-dashboard.js?v=2'" /tmp/route-registry.js
          grep -q "mount:'mountBusinessDashboardRoute'" /tmp/route-registry.js
          grep -q "path:'/brand'" /tmp/route-registry.js
          grep -q "path:'/ci'" /tmp/route-registry.js
          grep -q "await import('./betta-environment.js')" /tmp/bootstrap.js
          grep -q "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" /tmp/betta-environment.js
          grep -q "dataset.environmentInput='satellite-only'" /tmp/betta-environment.js
          grep -q 'mountBusinessDashboardRoute' /tmp/business-dashboard.js
          grep -q 'Legacy weather-visual compatibility no-op' /tmp/rain-layer.js
          grep -q 'bangkok-seasonal-clouds-v2' /tmp/environment.js
          grep -q 'pwa-v34-betta-dashboard-r1' /tmp/sw.js
          grep -q "addEventListener('push'" /tmp/sw.js
          grep -q 'property="og:title"' /tmp/share-fnb.html
          grep -q 'property="og:url"' /tmp/share-fnb.html
          ! grep -qi 'og:image' /tmp/share-fnb.html
          ! grep -qi 'twitter:image' /tmp/share-fnb.html
          grep -q 'Fried Chicken &amp; Waffles | Sindhorn Midtown' /tmp/share-promo.html
          ! grep -qiE 'sharepoint\.com|1drv\.ms|onedrive\.live\.com|employee_number|Add / change artwork link|auth-client|id="app-footer"' /tmp/share-promo.html
