name: Deploy Sindhorn Midtown Internal

on:
  push:
    branches:
      - main
      - performance-audit-post-weather-webgl
    paths:
      - "site/**"
      - "scripts/generate-fnb-share.mjs"
      - "scripts/generate-pwa-icons.mjs"
      - ".github/tests/**"
      - ".github/workflows/deploy.yml"
      - "supabase/migrations/**"
      - "docs/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate public F&B shares and launcher icons
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3 >/dev/null 2>&1
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export PUBLIC_ORIGIN="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            export PUBLIC_ORIGIN="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi
          node scripts/generate-fnb-share.mjs
          node scripts/generate-pwa-icons.mjs

      - name: Validate current shell candidate
        shell: bash
        run: |
          set -euo pipefail
          MODULES=(
            site/route-registry.js site/business-dashboard-data.js site/business-dashboard.js
            site/business-dashboard-motion.js site/app-transitions.js site/auth-shell.js site/auth-client.js
            site/login.js site/account.js site/admin.js site/capabilities.js site/settings.js
            site/settings-route-v3.js site/fnb.js site/fnb-data.js site/fnb-share-ui.js
            site/location.js site/bootstrap.js site/live-data.js site/betta-environment.js
            site/betta-satellite.js site/betta-day-periods.js site/rain-now.js site/weather-authority.js
            site/screen-capture.js site/notification-inbox.js site/push-client.js site/presentation-recovery.js
            site/app.js site/sw.js worker/src/index.js auth-worker/src/index.js
          )
          for file in "${MODULES[@]}"; do
            test -s "$file"
            node --input-type=module --check < "$file"
          done
          node --input-type=module --check < scripts/generate-fnb-share.mjs
          node --input-type=module --check < scripts/generate-pwa-icons.mjs
          node --input-type=module --check < site/share/fnb-runtime.js
          node --input-type=module --check < site/share/fnb-public-shell.js
          node --input-type=module --check < site/share/fnb-share-ui-public.js
          node .github/tests/fnb-sharing-regression.test.mjs
          node .github/tests/font-architecture.test.mjs
          node site/betta-day-periods.test.mjs
          node site/betta-vignette-palettes.test.mjs
          node site/weather-authority.test.mjs

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site'); fallback=root/'fallback'
          retired=(
            'environment.js','environment.bundle.js','seasonal-sky.js','atmosphere-shader.js',
            'rain-layer-legacy-weather.js','rain-layer.js','sun-dimmer.js','storm-effects.js',
            'sky-calibration.js','sky-color-renderer.js','cloud-tester.js',
            'phase8-2-fixtures.js','phase8-2-seasonal-clouds.test.mjs'
          )
          for name in retired:
              assert not (root/name).exists(), f'retired weather WebGL file still ships: {name}'

          index=(root/'index.html').read_text()
          sw=(root/'sw.js').read_text()
          bootstrap=(root/'bootstrap.js').read_text()
          auth_shell=(root/'auth-shell.js').read_text()
          betta=(root/'betta-environment.js').read_text()
          location=(root/'location.js').read_text()
          rain_now=(root/'rain-now.js').read_text()
          weather_authority=(root/'weather-authority.js').read_text()
          registry=(root/'route-registry.js').read_text()
          transitions=(root/'app-transitions.js').read_text()

          assert "sindhorn-midtown-internal-pwa-v41-performance-r1" in sw
          for name in retired:
              assert f"'/{name}'" not in sw, f'retired file remains in service-worker cache: {name}'
              assert f'/{name}' not in index, f'retired file remains in app shell: {name}'

          # Performance audit: the tree-shaken Betta runtime is the only Three.js
          # payload in the install path, and capture tooling loads on demand.
          assert "'/betta-runtime.js'" in sw
          assert "'/vendor/three.module.js'" not in sw
          assert "'/vendor/html2canvas.min.js'" not in sw
          assert '/vendor/html2canvas.min.js' not in index
          assert (root/'vendor/three.module.js').exists(), 'Three source must remain available for reproducible Betta builds'
          assert (root/'vendor/html2canvas.min.js').exists(), 'Capture library source must remain available for lazy loading'

          assert "await import('./betta-runtime.js?v=1')" in bootstrap
          assert "import('./betta-runtime.js?v=1')" in auth_shell
          assert "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" in betta
          assert "dataset.environmentInput='satellite-only'" in betta
          assert 'const DPR=2' in betta and 'preserveDrawingBuffer:false' in betta
          assert 'startSatelliteStream' in betta

          # Weather and current-rain remain operational data/UI services, not WebGL visuals.
          assert 'sindhorn-weather-core' in location
          assert 'sindhorn-weather-core' in rain_now
          assert 'resolveWeatherAuthority' in rain_now
          assert 'effectiveWeatherSnapshot' in weather_authority
          assert 'open_meteo_used:false' in location

          assert "today:Object.freeze({path:'/'" in registry
          assert "fnb:Object.freeze({path:'/fnb'" in registry
          assert "messages:Object.freeze({path:'/messages'" in registry
          assert "settings:Object.freeze({path:'/settings'" in registry
          assert 'startViewTransition' not in transitions

          manifest=json.loads((fallback/'manifest.json').read_text())
          shell_version=int(re.search(r'const SHELL_VERSION=(\d+);',bootstrap).group(1))
          assert manifest['minimumShell']==shell_version==17
          for item in manifest['resources']:
              assert hashlib.sha256((fallback/item['path']).read_bytes()).hexdigest()==item['sha256'], item['path']

          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'

          migration=Path('supabase/migrations/20260831121436_archive_legacy_weather_webgl_sources.sql').read_text()
          assert 'private.legacy_weather_webgl_archive' in migration
          assert 'enable row level security' in migration.lower()
          assert 'revoke all' in migration.lower()
          PY

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke deployed shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            BASE_URL="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi

          retired_clean(){
            local retired result code type
            for retired in environment.js environment.bundle.js seasonal-sky.js atmosphere-shader.js rain-layer-legacy-weather.js rain-layer.js sun-dimmer.js storm-effects.js sky-calibration.js sky-color-renderer.js cloud-tester.js phase8-2-fixtures.js phase8-2-seasonal-clouds.test.mjs; do
              result=$(curl --silent --show-error --location --output /tmp/retired-response --write-out '%{http_code}|%{content_type}' "${BASE_URL}/${retired}") || return 1
              code="${result%%|*}"
              type="${result#*|}"
              if [ "$code" = "200" ]; then
                case "$type" in text/html*) ;; *) return 1 ;; esac
                grep -qi '<!doctype html\|<html' /tmp/retired-response || return 1
              elif [ "$code" != "404" ]; then
                return 1
              fi
            done
          }

          # Cloudflare's stable branch aliases can lag the immutable deployment
          # URL. Wait for the alias to expose this exact cache generation AND for
          # every retired source path to stop serving JavaScript; never accept a
          # stale deployment as success.
          promoted=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js \
              && grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/sw.js \
              && retired_clean; then
                promoted=true
                break
            fi
            sleep 3
          done
          test "$promoted" = true

          paths=(
            / /fnb /messages /settings /account /admin /route-registry.js
            /business-dashboard.js /business-dashboard-data.js /business-dashboard.css
            /business-dashboard-motion.js /business-dashboard-motion.css /auth-shell.js /auth-client.js
            /location.js /bootstrap.js /betta-runtime.js /betta-environment.js /betta-satellite.js
            /rain-now.js /weather-authority.js /live-data.js /notification-inbox.js /push-client.js
            /manifest.webmanifest /sw.js /share/fnb
          )
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html
          curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js
          curl --fail --silent --show-error --location "${BASE_URL}/betta-environment.js" -o /tmp/betta.js
          ! grep -q '/rain-layer.js' /tmp/root.html
          ! grep -q '/sun-dimmer.js' /tmp/root.html
          ! grep -q '/vendor/html2canvas.min.js' /tmp/root.html
          grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/sw.js
          ! grep -q "'/vendor/three.module.js'" /tmp/sw.js
          ! grep -q "'/vendor/html2canvas.min.js'" /tmp/sw.js
          grep -q "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" /tmp/betta.js
          grep -q "dataset.environmentInput='satellite-only'" /tmp/betta.js
