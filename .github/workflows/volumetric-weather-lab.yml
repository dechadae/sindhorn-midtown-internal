name: UE-Inspired Volumetric Weather Lab

on:
  push:
    branches:
      - lab-volumetric-clouds
    paths:
      - "site/volumetric-weather-*"
      - "site/seasonal-sky.js"
      - ".github/workflows/volumetric-weather-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: volumetric-weather-lab-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Validate isolated volumetric lab
        shell: bash
        run: |
          set -euo pipefail
          node --check site/volumetric-weather-tester.js
          node --check site/volumetric-weather-browser-smoke.mjs
          node site/volumetric-weather-lab.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('site/volumetric-weather-tester.html').read_text()
          js=Path('site/volumetric-weather-tester.js').read_text()
          assert 'volumetric-weather-tester.js' in html
          assert "from './seasonal-sky.js'" in js
          assert 'const DPR=2' in js
          assert 'sampler3D uBaseNoise' in js
          assert 'sampler3D uErosionNoise' in js
          assert 'wetCanvas' in js and 'refractOffset' in js
          assert 'rainLayer' in js and 'snowLayer' in js
          assert 'heatOffset' in js and 'triggerLightning' in js
          PY

  preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Deploy isolated Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Smoke deployed lab assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME:0:28}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /volumetric-weather-tester.html /volumetric-weather-tester.js /seasonal-sky.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/lab-response
            test -s /tmp/lab-response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/volumetric-weather-tester.js" -o /tmp/lab.js
          grep -q 'sampler3D uBaseNoise' /tmp/lab.js
          grep -q 'rainLayer' /tmp/lab.js
          grep -q 'refractOffset' /tmp/lab.js
          grep -q 'triggerLightning' /tmp/lab.js
      - name: Install Chromium renderer
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render tester evidence
        env:
          VOLUMETRIC_LAB_BASE_URL: https://lab-volumetric-clouds.sindhorn-midtown-internal.pages.dev
        run: node site/volumetric-weather-browser-smoke.mjs
      - name: Upload volumetric weather evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volumetric-weather-lab-evidence
          path: volumetric-weather-artifacts
          if-no-files-found: error
          retention-days: 14
