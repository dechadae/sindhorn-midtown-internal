<script>
/* fg-clock.js — one continuous clock for the atmosphere, across navigations.
   ---------------------------------------------------------------------------
   The glyph field drove u_time from performance.now(), which is zero at every
   page load, so the field snapped back to its first frame on every navigation.
   Nothing else about it reset -- the palette, the ripples, the tilt response
   were all fine -- but restarting the animation read as the whole background
   reloading.
   This keeps a running total in sessionStorage. Not localStorage: the clock
   should be continuous within a visit and start fresh on a new one, which is
   what sessionStorage already means. Per-tab, so two tabs do not fight.

   FGClock.seed()  -> seconds to add to the local frame time
   FGClock.mark(s) -> record the current elapsed value

   mark() is throttled to four writes a second. The value only has to be
   accurate to about a frame at the moment of leaving, and a sessionStorage
   write on every rAF would cost more than the effect is worth. */
(function(){
  /* The glyph layout seed belongs to the same continuity contract as time:
     stable within one tab visit, freshly composed in a new session. */
  try{
    var sd=sessionStorage.getItem("fg:seed");
    if(!sd){ sd=String((Math.random()*4294967296)>>>0); sessionStorage.setItem("fg:seed",sd); }
    window.FGSeed=parseInt(sd,10)>>>0;
  }catch(e){ window.FGSeed=1; }

  var KEY="fg:atmosT";
  var last=0, lastWrite=0;

  function read(){
    try{ var v=parseFloat(sessionStorage.getItem(KEY)); return isFinite(v)&&v>0?v:0; }
    catch(e){ return 0; }
  }
  var base=read();

  function write(v){
    try{ sessionStorage.setItem(KEY,String(v)); }catch(e){}
  }

  window.FGClock={
    seed:function(){ return base; },
    mark:function(sec){
      last=base+sec;
      var n=Date.now();
      if(n-lastWrite<250) return;
      lastWrite=n;
      write(last);
    },
    /* Leaving is the one moment the value has to be exact, and the throttle
       may have skipped the last quarter second. Flushed on the way out. */
    flush:function(){ write(last); }
  };

  /* pagehide rather than beforeunload: beforeunload is unreliable on mobile
     Safari and blocks the back/forward cache. pagehide fires in both. */
  addEventListener("pagehide",function(){ window.FGClock.flush(); },{capture:true});
  addEventListener("visibilitychange",function(){
    if(document.hidden) window.FGClock.flush();
  });
})();
</script>
<script>
/* One ordered loader for database-backed JavaScript shared by interface pages. */
(function(){
  var U="https://sjpvhgxacsiorrtijqua.supabase.co/rest/v1";
  var K="FG_ANON_KEY_REDACTED";
  /* The shell swaps database pages into one long-lived JS world. Keep this
     registry on window, not inside the freshly injected header fragment, or a
     second page visit re-appends modules with top-level const declarations. */
  var loaded=window.FGModuleLoaded||{};
  window.FGModuleLoaded=loaded;
  function grab(path){
    var key="fg:module:"+path;
    return fetch(U+"/site_files?path=eq."+encodeURIComponent(path)+"&select=content",{
      headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"
    }).then(function(r){
      if(!r.ok) throw new Error("module "+r.status);
      return r.json();
    }).then(function(rows){
      var src=rows&&rows[0]&&rows[0].content;
      if(!src) throw new Error("empty module");
      try{ localStorage.setItem(key,src); }catch(e){}
      return src;
    })["catch"](function(){
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    });
  }
  function run(path,src){
    if(!src||loaded[path]) return;
    loaded[path]=true;
    var s=document.createElement("script");
    s.textContent=src;
    document.body.appendChild(s);
  }
  window.FGModules={
    load:function(paths){
      return Promise.all(paths.map(grab)).then(function(all){
        for(var i=0;i<paths.length;i++) run(paths[i],all[i]);
        return all;
      });
    },
    page:function(path){
      var key="fg:"+path;
      return fetch(U+"/site_files?path=eq."+encodeURIComponent(path)+"&select=content",{
        headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"
      }).then(function(r){
        if(!r.ok) throw new Error("page "+r.status);
        return r.json();
      }).then(function(rows){
        var src=rows&&rows[0]&&rows[0].content;
        if(!src) throw new Error("empty page");
        try{ localStorage.setItem(key,src); }catch(e){}
        return src;
      })["catch"](function(err){
        try{
          var cached=localStorage.getItem(key);
          if(cached) return cached;
        }catch(e){}
        throw err;
      });
    }
  };
  window.FGModules.load(["/fg-nav.js"]);
})();
</script>

<script>
/* One measured header height and one remembered skin for every interface page. */
(function(){
  var h=document.querySelector("header");
  if(!h) return;
  var root=document.documentElement;
  function syncHeight(){
    var px=(h.getBoundingClientRect().height||55)+"px";
    root.style.setProperty("--fg-hdr",px);
    root.style.setProperty("--header-h",px);
  }
  function persistSkin(){
    try{
      var cs=getComputedStyle(h);
      var brand=h.querySelector(".brand");
      var mark=h.querySelector(".brand svg");
      sessionStorage.setItem("fg:header-skin",JSON.stringify({
        background:cs.backgroundColor,
        border:cs.borderBottomColor,
        text:brand?getComputedStyle(brand).color:cs.color,
        accent:mark?getComputedStyle(mark).color:
          getComputedStyle(root).getPropertyValue("--accent").trim()
      }));
    }catch(e){}
  }
  syncHeight();
  if(window.ResizeObserver){
    new ResizeObserver(function(){ syncHeight(); }).observe(h);
  }else{
    addEventListener("resize",syncHeight,{passive:true});
  }
  if(window.MutationObserver){
    new MutationObserver(function(){
      setTimeout(function(){ syncHeight(); persistSkin(); },0);
    }).observe(root,{attributes:true,attributeFilter:["data-theme","data-period"]});
  }
  setTimeout(persistSkin,0);
  addEventListener("pagehide",persistSkin,{capture:true});
})();
</script>
<script>
(function(){
  var b=document.getElementById("fsSwitch");
  if(!b) return;
  var root=document.documentElement;
  var request=root.requestFullscreen||root.webkitRequestFullscreen;
  var exit=document.exitFullscreen||document.webkitExitFullscreen;
  function active(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function sync(){
    var on=active();
    b.setAttribute("aria-pressed",on?"true":"false");
    b.setAttribute("aria-label",on?"Exit fullscreen":"Enter fullscreen");
    b.title=on?"Exit fullscreen":"Fullscreen";
  }
  if(!request||!exit){ b.style.display="none"; return; }
  b.addEventListener("click",function(){
    try{
      var p=active()?exit.call(document):request.call(root);
      if(p&&p["catch"]) p["catch"](function(){});
    }catch(e){}
  });
  document.addEventListener("fullscreenchange",sync);
  document.addEventListener("webkitfullscreenchange",sync);
  sync();
})();
</script>

<script>
/* Phase 4 — one readiness gate, one module startup, for every interface page.
   ---------------------------------------------------------------------------
   fgSessionReady used to be created inside fg-devnav.js itself, which is
   fetched over the network -- so any code that read window.fgSessionReady
   before that fetch resolved found it undefined, and Promise.resolve(undefined)
   settles immediately instead of waiting. Six pages had each grown their own
   copy of the fix: publish a gate synchronously, before the fetch even starts,
   then let fg-devnav.js's own assignment feed that gate instead of replacing
   it. That pattern is canonical now, and lives once, here.

   FGInterfaceReady is the same idea one level up: it resolves once session
   AND the shared motion/theme/glyph/atmosphere modules have all loaded, so a
   page or the persistent router has exactly one thing to await instead of
   juggling fgSessionReady and a set of FGModules.load() promises separately. */
(function(){
  if(window.FGInterfaceReady) return;

  var openSession;
  var sessionGate=new Promise(function(res){ openSession=res; });
  window.fgSessionReady=sessionGate;

  function loadDevNav(){
    if(!window.FGModules) return Promise.resolve(null);
    return FGModules.load(["/fg-devnav.js"]).then(function(){
      /* fg-devnav.js's own top level reassigns window.fgSessionReady to its
         real promise as a side effect of running -- FGModules' run() injects
         a plain script element with textContent, which executes synchronously, so
         that reassignment has already happened by the time this .then() runs.
         Adopt it, then put the gate back as the public handle so anything
         already holding a reference to it keeps waiting for the real result
         instead of the early one Promise.resolve(undefined) would have given. */
      var inner=window.fgSessionReady;
      window.fgSessionReady=sessionGate;
      if(inner&&inner!==sessionGate&&typeof inner.then==="function"){
        return inner.then(function(v){ openSession(v); return v; },function(){ openSession(null); return null; });
      }
      openSession(null);
      return null;
    })["catch"](function(){ openSession(null); return null; });
  }

  function loadSharedModules(){
    if(!window.FGModules) return Promise.resolve(null);
    /* Runtime-driven pages (Home, Claude Code, Job Tracking, Moodboard) set
       window.FGRuntimeWillDrive=true in their own <head>, before this
       fragment is even composed into the page -- so by the time fg-theme.js
       and fg-glyph.js each finish fetching and run their own self-drive
       check, the flag is already there to read. That placement is the
       Phase 4 change on those four pages; this loader does not need to know
       which pages they are. */
    return FGModules.load(["/fg-motion.js","/fg-theme.js","/fg-glyph.js","/fg-atmos.js"]);
  }

  window.FGInterfaceReady=Promise.all([loadDevNav(),loadSharedModules()])
    .then(function(all){ return {session:all[0]}; })
    ["catch"](function(){ return {session:null}; });
})();
</script>
