name: Temporary Betta 3D Tilt Pass

on:
  push:
    branches: [betta-reference-rebuild]
    paths:
      - '.github/workflows/tmp-betta-3d-tilt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: betta-reference-rebuild
      - name: Apply 3D composition and calibrated tilt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          presets=Path('site/betta-fin-presets.js')
          s=presets.read_text()
          replacements={
            "scale:.80,rotation:.28,cameraDepth:.10,offsetX:-1.02,offsetY:-.36":"scale:.80,rotation:.28,rotationX:-.30,rotationY:.44,tiltStrength:.18,cameraDepth:.10,offsetX:-1.02,offsetY:-.36",
            "scale:.78,rotation:-.22,cameraDepth:.08,offsetX:-1.05,offsetY:.28":"scale:.78,rotation:-.22,rotationX:.24,rotationY:-.52,tiltStrength:.16,cameraDepth:.08,offsetX:-1.05,offsetY:.28",
            "scale:.82,rotation:.38,cameraDepth:.08,offsetX:-.98,offsetY:-.42":"scale:.82,rotation:.38,rotationX:-.38,rotationY:.26,tiltStrength:.20,cameraDepth:.08,offsetX:-.98,offsetY:-.42",
            "scale:.80,rotation:-.44,cameraDepth:.12,offsetX:-1.00,offsetY:.38":"scale:.80,rotation:-.44,rotationX:.32,rotationY:.56,tiltStrength:.17,cameraDepth:.12,offsetX:-1.00,offsetY:.38",
            "scale:.80,rotation:.12,cameraDepth:.08,offsetX:-1.02,offsetY:-.24":"scale:.80,rotation:.12,rotationX:-.26,rotationY:-.46,tiltStrength:.21,cameraDepth:.08,offsetX:-1.02,offsetY:-.24",
            "scale:.82,rotation:.30,cameraDepth:.09,offsetX:-1.04,offsetY:-.36":"scale:.82,rotation:.30,rotationX:.38,rotationY:.34,tiltStrength:.18,cameraDepth:.09,offsetX:-1.04,offsetY:-.36",
            "scale:.80,rotation:-.28,cameraDepth:.11,offsetX:-.98,offsetY:.30":"scale:.80,rotation:-.28,rotationX:-.34,rotationY:.58,tiltStrength:.22,cameraDepth:.11,offsetX:-.98,offsetY:.30",
            "scale:.84,rotation:.20,cameraDepth:.10,offsetX:-1.06,offsetY:-.20":"scale:.84,rotation:.20,rotationX:.20,rotationY:-.58,tiltStrength:.19,cameraDepth:.10,offsetX:-1.06,offsetY:-.20",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'preset composition target not found: {old}')
              s=s.replace(old,new,1)
          presets.write_text(s)

          env=Path('site/betta-environment.js')
          s=env.read_text()
          old="const dayCycle={mode:'live',period:null,targetPeriod:null,from:null,to:null,t0:0,duration:0,mix:1,rawMix:1,reason:'initial',pin:null,preview:null};"
          new=old+"\nconst tilt={supported:'DeviceOrientationEvent' in window,enabled:false,listening:false,permission:'unknown',calibrated:false,beta0:0,gamma0:0,targetX:0,targetY:0,currentX:0,currentY:0,lastAt:0};"
          if old not in s: raise SystemExit('tilt state insertion target missing')
          s=s.replace(old,new,1)

          old="const scale=lerp(from.params.scale*(a.scale||1),to.params.scale*(b.scale||1),e);mesh.scale.setScalar(scale);mesh.rotation.z=lerpAngle(from.params.rotation+(a.rotation||0),to.params.rotation+(b.rotation||0),e);mesh.position.set(lerp(from.params.offsetX+(a.offset[0]||0),to.params.offsetX+(b.offset[0]||0),e),lerp(from.params.offsetY+(a.offset[1]||0),to.params.offsetY+(b.offset[1]||0),e),lerp(from.params.cameraDepth+(a.offset[2]||0),to.params.cameraDepth+(b.offset[2]||0),e));"
          new="const scale=lerp(from.params.scale*(a.scale||1),to.params.scale*(b.scale||1),e);mesh.scale.setScalar(scale);mesh.rotation.order='YXZ';mesh.userData.baseRotationX=lerpAngle(from.params.rotationX||0,to.params.rotationX||0,e);mesh.userData.baseRotationY=lerpAngle(from.params.rotationY||0,to.params.rotationY||0,e);mesh.userData.baseRotationZ=lerpAngle(from.params.rotation+(a.rotation||0),to.params.rotation+(b.rotation||0),e);mesh.userData.tiltStrength=lerp(from.params.tiltStrength||.16,to.params.tiltStrength||.16,e);mesh.rotation.set(mesh.userData.baseRotationX,mesh.userData.baseRotationY,mesh.userData.baseRotationZ,'YXZ');mesh.position.set(lerp(from.params.offsetX+(a.offset[0]||0),to.params.offsetX+(b.offset[0]||0),e),lerp(from.params.offsetY+(a.offset[1]||0),to.params.offsetY+(b.offset[1]||0),e),lerp(from.params.cameraDepth+(a.offset[2]||0),to.params.cameraDepth+(b.offset[2]||0),e));mesh.userData.baseZ=mesh.position.z;"
          if old not in s: raise SystemExit('3D mesh transform target missing')
          s=s.replace(old,new,1)

          marker="function resize(){if(!renderer||!stage||webglContextLost)return;"
          insert="""function handleDeviceOrientation(event){
  if(!Number.isFinite(event.beta)||!Number.isFinite(event.gamma))return;
  if(!tilt.calibrated){tilt.beta0=event.beta;tilt.gamma0=event.gamma;tilt.calibrated=true}
  tilt.targetX=clamp((event.beta-tilt.beta0)/24,-1,1);tilt.targetY=clamp((event.gamma-tilt.gamma0)/24,-1,1);tilt.lastAt=performance.now();tilt.enabled=true;document.body.dataset.bettaTilt='active';requestRender();
}
async function enableTilt(){
  if(!tilt.supported){tilt.permission='unsupported';document.body.dataset.bettaTilt='unsupported';return false}
  try{
    const permissionRequest=globalThis.DeviceOrientationEvent?.requestPermission;
    if(typeof permissionRequest==='function'){const result=await permissionRequest.call(globalThis.DeviceOrientationEvent);tilt.permission=result;if(result!=='granted'){document.body.dataset.bettaTilt='denied';return false}}
    else tilt.permission='granted';
    if(!tilt.listening){addEventListener('deviceorientation',handleDeviceOrientation,{passive:true});tilt.listening=true}
    tilt.calibrated=false;tilt.targetX=tilt.targetY=tilt.currentX=tilt.currentY=0;document.body.dataset.bettaTilt='ready';return true;
  }catch(error){tilt.permission='error';document.body.dataset.bettaTilt='error';return false}
}
function recenterTilt(){tilt.calibrated=false;tilt.targetX=tilt.targetY=0;return true}
function stepTilt(deltaMs){
  const response=1-Math.exp(-Math.max(0,deltaMs)*.010);tilt.currentX=lerp(tilt.currentX,tilt.targetX,response);tilt.currentY=lerp(tilt.currentY,tilt.targetY,response);
  for(let index=0;index<meshes.length;index++){const mesh=meshes[index],strength=Number(mesh.userData.tiltStrength)||.16,layer=index?0.82:1;mesh.rotation.x=(mesh.userData.baseRotationX||0)+tilt.currentX*strength*layer;mesh.rotation.y=(mesh.userData.baseRotationY||0)+tilt.currentY*strength*layer;mesh.rotation.z=(mesh.userData.baseRotationZ||0)+tilt.currentY*strength*.12*layer;mesh.position.z=(mesh.userData.baseZ||0)+tilt.currentX*strength*.18*layer}
}
"""
          if marker not in s: raise SystemExit('tilt function insertion target missing')
          s=s.replace(marker,insert+marker,1)

          old="function render(now){raf=0;if(!pageVisible||webglContextLost)return;const delta=Math.min(50,Math.max(0,now-previousNow));previousNow=now;activeTime+=delta*.001*(matchMedia('(prefers-reduced-motion: reduce)').matches?.35:1);easeSatellite(delta);applySatelliteUniforms();stepDayCycle(now);for(const material of materials)material.uniforms.uTime.value=activeTime;renderer.render(scene,camera);"
          new="function render(now){raf=0;if(!pageVisible||webglContextLost)return;const delta=Math.min(50,Math.max(0,now-previousNow));previousNow=now;activeTime+=delta*.001*(matchMedia('(prefers-reduced-motion: reduce)').matches?.35:1);easeSatellite(delta);applySatelliteUniforms();stepDayCycle(now);stepTilt(delta);for(const material of materials)material.uniforms.uTime.value=activeTime;renderer.render(scene,camera);"
          if old not in s: raise SystemExit('render tilt target missing')
          s=s.replace(old,new,1)

          old="document.body.dataset.bettaBaselineAuthority='bangkok-day-cycle';document.body.dataset.bettaContext='active';setLifecycle(pageVisible?'active':'suspended','initial');"
          new="document.body.dataset.bettaBaselineAuthority='bangkok-day-cycle';document.body.dataset.bettaContext='active';document.body.dataset.bettaTilt=tilt.supported?'available':'unsupported';setLifecycle(pageVisible?'active':'suspended','initial');if(tilt.supported&&typeof globalThis.DeviceOrientationEvent?.requestPermission!=='function')enableTilt().catch(()=>{});"
          if old not in s: raise SystemExit('init tilt target missing')
          s=s.replace(old,new,1)

          old="window.SindhornEnvironment={refreshWeather:()=>fetchWeather().catch(()=>weather),renderExport,setBettaBaseline:setBaseline,setBettaPeriod,useLiveBettaDayCycle,previewBettaDayCycle,getState:()=>({"
          new="window.SindhornEnvironment={refreshWeather:()=>fetchWeather().catch(()=>weather),renderExport,setBettaBaseline:setBaseline,setBettaPeriod,useLiveBettaDayCycle,previewBettaDayCycle,enableBettaTilt:enableTilt,recenterBettaTilt:recenterTilt,getState:()=>({"
          if old not in s: raise SystemExit('environment API tilt target missing')
          s=s.replace(old,new,1)

          old="satelliteStreaming:Boolean(stopSatellite),rendering:Boolean(raf),firstFrameRendered}}),applyConfig:()=>{}};"
          new="satelliteStreaming:Boolean(stopSatellite),rendering:Boolean(raf),firstFrameRendered,tilt:{supported:tilt.supported,enabled:tilt.enabled,listening:tilt.listening,permission:tilt.permission,calibrated:tilt.calibrated,x:tilt.currentX,y:tilt.currentY}}}),applyConfig:()=>{}};"
          if old not in s: raise SystemExit('environment state tilt target missing')
          s=s.replace(old,new,1)
          env.write_text(s)

          html=Path('site/betta-vignette-test.html')
          s=html.read_text()
          s=s.replace('<button type="button" data-preview>Preview 24h · 3 min</button>','<button type="button" data-preview>Preview 24h · 3 min</button><button type="button" data-tilt>Tilt</button>',1)
          s=s.replace('betta-vignette-test.js?v=fine-tune-iphone-1','betta-vignette-test.js?v=fine-tune-3d-tilt-1')
          html.write_text(s)

          js=Path('site/betta-vignette-test.js')
          s=js.read_text()
          old="const previewButton=document.querySelector('[data-preview]');"
          new=old+"\nconst tiltButton=document.querySelector('[data-tilt]');"
          if old not in s: raise SystemExit('tester tilt const target missing')
          s=s.replace(old,new,1)
          old="previewButton.addEventListener('click',()=>{window.SindhornEnvironment?.previewBettaDayCycle?.(180);updateUrl({period:null});paint()});"
          new=old+"\ntiltButton?.addEventListener('click',async()=>{const ok=await window.SindhornEnvironment?.enableBettaTilt?.();tiltButton.textContent=ok?'Tilt On':'Tilt unavailable';paint()});"
          if old not in s: raise SystemExit('tester tilt handler target missing')
          s=s.replace(old,new,1)
          s=s.replace("const {initEnvironment}=await import('./betta-environment.js?v=fine-tune-gradient-2');","const {initEnvironment}=await import('./betta-environment.js?v=fine-tune-3d-tilt-1');")
          js.write_text(s)

          test=Path('site/betta-vignette-palettes.test.mjs')
          s=test.read_text()
          target="  assert.ok(p.params.scale>=.76&&p.params.scale<=.86,`${key} live-wallpaper framing scale`);"
          repl=target+"\n  assert.ok(Math.abs(p.params.rotationX)>=.18&&Math.abs(p.params.rotationX)<=.42,`${key} has deliberate x-axis perspective`);\n  assert.ok(Math.abs(p.params.rotationY)>=.24&&Math.abs(p.params.rotationY)<=.62,`${key} has deliberate y-axis perspective`);\n  assert.ok(p.params.tiltStrength>=.15&&p.params.tiltStrength<=.24,`${key} has bounded device tilt response`);"
          if target not in s: raise SystemExit('CI 3D target missing')
          s=s.replace(target,repl,1)
          test.write_text(s)
          PY
      - name: Syntax and contract checks
        run: |
          for file in site/betta-fin-presets.js site/betta-environment.js site/betta-vignette-test.js site/betta-vignette-palettes.test.mjs; do node --input-type=module --check < "$file"; done
          node site/betta-vignette-palettes.test.mjs
      - name: Commit 3D tilt pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/betta-fin-presets.js site/betta-environment.js site/betta-vignette-test.html site/betta-vignette-test.js site/betta-vignette-palettes.test.mjs
          git commit -m "Add 3D Betta poses and calibrated device tilt"
          git push origin HEAD:betta-reference-rebuild
