name: One-shot F&B CI Polish Repair

on:
  push:
    branches: [fnb-live-integration]
    paths: [".github/workflows/fnb-ci-polish-once.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fnb-live-integration
          fetch-depth: 0
      - name: Apply F&B CI polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('site/fnb.js')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label} anchor missing')
              s=s.replace(old,new,1)

          rep("link.href='/fnb.css?v=2'","link.href='/fnb.css?v=2&ui=2'",'css cache bust')
          rep("function uniqueValue(values,fallback='Varies by outlet'){const unique=[...new Set(values)];return unique.length===1?unique[0]:fallback}\n",
          """function uniqueValue(values,fallback='Varies by outlet'){const unique=[...new Set(values)];return unique.length===1?unique[0]:fallback}
function outletLabel(value){return value==='ALL'?'All outlets':value}
function monthLabel(value){return value==='ALL'?'All months':value[0]+value.slice(1).toLowerCase()}
function filterField(kind,label,values,selected,labelFor){const menuId=`fnb-${kind}-menu`;return`<div class=\"fnb-select\" data-filter-field=\"${kind}\"><span class=\"fnb-select-label\">${esc(label)}</span><button class=\"fnb-select-trigger\" type=\"button\" data-filter-trigger=\"${kind}\" aria-label=\"${esc(label)} filter\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-controls=\"${menuId}\"><span data-filter-value>${esc(labelFor(selected))}</span><svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5.5 7.5 10 12l4.5-4.5\"/></svg></button><select data-${kind}-select hidden tabindex=\"-1\" aria-hidden=\"true\">${values.map(value=>`<option value=\"${esc(value)}\">${esc(labelFor(value))}</option>`).join('')}</select><div class=\"fnb-select-menu\" id=\"${menuId}\" role=\"listbox\" aria-label=\"${esc(label)}\" aria-hidden=\"true\">${values.map(value=>`<button class=\"fnb-select-option${value===selected?' is-selected':''}\" type=\"button\" role=\"option\" aria-selected=\"${value===selected}\" data-filter-option=\"${kind}\" data-value=\"${esc(value)}\"><span>${esc(labelFor(value))}</span><i aria-hidden=\"true\"></i></button>`).join('')}</div></div>`}
""",'filter helpers')
          rep("""      <label class=\"fnb-select\"><span class=\"fnb-select-label\">Outlet</span><select data-outlet-select aria-label=\"Filter by outlet\">${OUTLETS.map(outlet=>`<option value=\"${esc(outlet)}\">${esc(outlet==='ALL'?'All outlets':outlet)}</option>`).join('')}</select></label>
      <label class=\"fnb-select\"><span class=\"fnb-select-label\">Month</span><select data-month-select aria-label=\"Filter by month\">${MONTHS.map(key=>`<option value=\"${key}\">${key==='ALL'?'All months':key[0]+key.slice(1).toLowerCase()}</option>`).join('')}</select></label>
""",
          """      ${filterField('outlet','Outlet',OUTLETS,'ALL',outletLabel)}
      ${filterField('month','Month',MONTHS,'ALL',monthLabel)}
""",'filter markup')
          rep("let disposed=false,filter='ALL',month='ALL',current=null,indexScroll=0,scrollSpyRaf=0,viewAnimating=false;","let disposed=false,filter='ALL',month='ALL',current=null,indexScroll=0,scrollSpyRaf=0,viewAnimating=false,sectionTarget=null,sectionTargetTimer=0;",'section lock state')
          rep("""  function renderFilters(){const select=q('[data-outlet-select]');if(select.value!==filter)select.value=filter}
  function renderMonthRail(){const select=q('[data-month-select]');if(select.value!==month)select.value=month}
""",
          """  function closeFilterMenus(except=null){qa('[data-filter-field]').forEach(field=>{if(field.dataset.filterField===except)return;field.classList.remove('is-open');field.querySelector('[data-filter-trigger]')?.setAttribute('aria-expanded','false');field.querySelector('.fnb-select-menu')?.setAttribute('aria-hidden','true')})}
  function toggleFilterMenu(kind){const field=q(`[data-filter-field=\"${kind}\"]`),trigger=field?.querySelector('[data-filter-trigger]'),menu=field?.querySelector('.fnb-select-menu');if(!field||!trigger||!menu)return;const open=!field.classList.contains('is-open');closeFilterMenus(kind);field.classList.toggle('is-open',open);trigger.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-hidden',String(!open));if(open)requestAnimationFrame(()=>field.querySelector('.fnb-select-option.is-selected')?.focus({preventScroll:true}))}
  function renderFilterField(kind,value,labelFor){const field=q(`[data-filter-field=\"${kind}\"]`);if(!field)return;const select=field.querySelector(`select[data-${kind}-select]`);if(select&&select.value!==value)select.value=value;const valueNode=field.querySelector('[data-filter-value]');if(valueNode)valueNode.textContent=labelFor(value);field.querySelectorAll('[data-filter-option]').forEach(option=>{const selected=option.dataset.value===value;option.classList.toggle('is-selected',selected);option.setAttribute('aria-selected',String(selected))})}
  function renderFilters(){renderFilterField('outlet',filter,outletLabel);renderFilterField('month',month,monthLabel)}
""",'custom filter controller')
          rep("function renderIndex(){renderFilters();renderMonthRail();renderSummary();renderCards()}","function renderIndex(){renderFilters();renderSummary();renderCards()}",'render index')
          rep("${expandable?'<button class=\"fnb-expand\" type=\"button\">Show full</button>':''}","${expandable?'<button class=\"fnb-expand\" type=\"button\" aria-expanded=\"false\">Show full</button>':''}",'expand aria')
          rep("""  function setSectionActive(id){qa('[data-section]').forEach(button=>{const active=button.dataset.section===id;button.classList.toggle('is-active',active);if(active)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')})}
  function updateSectionFromScroll(){
    if(!current)return;
""",
          """  function setSectionActive(id){qa('[data-section]').forEach(button=>{const active=button.dataset.section===id;button.classList.toggle('is-active',active);if(active)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')})}
  function holdSectionTarget(id){sectionTarget=id;clearTimeout(sectionTargetTimer);setSectionActive(id);sectionTargetTimer=setTimeout(()=>{sectionTarget=null;updateSectionFromScroll()},900)}
  function releaseSectionTarget(){if(!sectionTarget)return;clearTimeout(sectionTargetTimer);sectionTargetTimer=0;sectionTarget=null;updateSectionFromScroll()}
  function updateSectionFromScroll(){
    if(!current)return;
    if(sectionTarget){setSectionActive(sectionTarget);return}
""",'scroll target lock')
          rep("if(!current)indexScroll=scrollY;viewAnimating=true;","if(!current)indexScroll=scrollY;viewAnimating=true;closeFilterMenus();",'detail close filter')
          rep("if(viewAnimating)return;viewAnimating=true;\n    const detail=q('[data-detail]'),index=q('[data-index]');","if(viewAnimating)return;viewAnimating=true;releaseSectionTarget();\n    const detail=q('[data-detail]'),index=q('[data-index]');",'detail release rail')
          rep("button.textContent=collapsed?'Show full':'Show less'","button.textContent=collapsed?'Show full':'Show less';button.setAttribute('aria-expanded',String(!collapsed))",'disclosure aria state')
          rep("""  const onClick=event=>{
    const card=event.target.closest('[data-open]');if(card){openDetail(card.dataset.open);return}
    const section=event.target.closest('[data-section]');if(section&&current){const id=section.dataset.section,target=q('#'+id);setSectionActive(id);if(target){const top=Math.max(0,target.getBoundingClientRect().top+scrollY-72);scrollTo({top,behavior:reducedMotion()?'auto':'smooth'})}return}
""",
          """  const onClick=event=>{
    const option=event.target.closest('[data-filter-option]');if(option){const kind=option.dataset.filterOption,value=option.dataset.value;if(kind==='outlet')filter=value;else if(kind==='month')month=value;closeFilterMenus();renderIndex();q(`[data-filter-trigger=\"${kind}\"]`)?.focus({preventScroll:true});return}
    const trigger=event.target.closest('[data-filter-trigger]');if(trigger){toggleFilterMenu(trigger.dataset.filterTrigger);return}
    closeFilterMenus();
    const card=event.target.closest('[data-open]');if(card){openDetail(card.dataset.open);return}
    const section=event.target.closest('[data-section]');if(section&&current){const id=section.dataset.section,target=q('#'+id);holdSectionTarget(id);if(target){const top=Math.max(0,target.getBoundingClientRect().top+scrollY-72);scrollTo({top,behavior:reducedMotion()?'auto':'smooth'});if(reducedMotion())releaseSectionTarget()}return}
""",'click controls')
          rep("""  route.addEventListener('click',onClick);
  const onChange=event=>{
""",
          """  route.addEventListener('click',onClick);
  const onKeyDown=event=>{if(event.key==='Escape'){closeFilterMenus();return}const option=event.target.closest?.('[data-filter-option]');if(!option)return;const options=[...option.closest('.fnb-select-menu').querySelectorAll('[data-filter-option]')],index=options.indexOf(option);let next=-1;if(event.key==='ArrowDown')next=Math.min(options.length-1,index+1);else if(event.key==='ArrowUp')next=Math.max(0,index-1);else if(event.key==='Home')next=0;else if(event.key==='End')next=options.length-1;else return;event.preventDefault();options[next]?.focus({preventScroll:true})};
  const onChange=event=>{
""",'filter keyboard')
          rep("""  route.addEventListener('change',onChange);
  addEventListener('scroll',scheduleScrollSpy,{passive:true});
  addEventListener('resize',scheduleScrollSpy,{passive:true});
""",
          """  route.addEventListener('keydown',onKeyDown);
  route.addEventListener('change',onChange);
  addEventListener('scroll',scheduleScrollSpy,{passive:true});
  addEventListener('scrollend',releaseSectionTarget,{passive:true});
  addEventListener('resize',scheduleScrollSpy,{passive:true});
""",'listeners')
          rep("return()=>{disposed=true;void disposed;route.removeEventListener('click',onClick);route.removeEventListener('change',onChange);removeEventListener('scroll',scheduleScrollSpy);removeEventListener('resize',scheduleScrollSpy);if(scrollSpyRaf)cancelAnimationFrame(scrollSpyRaf);clearTimeout(toast.timer);delete document.body.dataset.fnbDetail};",
          "return()=>{disposed=true;void disposed;route.removeEventListener('click',onClick);route.removeEventListener('keydown',onKeyDown);route.removeEventListener('change',onChange);removeEventListener('scroll',scheduleScrollSpy);removeEventListener('scrollend',releaseSectionTarget);removeEventListener('resize',scheduleScrollSpy);if(scrollSpyRaf)cancelAnimationFrame(scrollSpyRaf);clearTimeout(sectionTargetTimer);clearTimeout(toast.timer);delete document.body.dataset.fnbDetail};",'cleanup')
          p.write_text(s)

          p=Path('site/fnb.css')
          s=p.read_text()
          s += r'''

/* CI polish v2 — three-up metrics, custom dropdowns, unified disclosures and scroll-stable glass. */
:root{--fnb-disclosure-ms:420ms;--fnb-disclosure-ease:cubic-bezier(.22,1,.36,1)}
.fnb-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.fnb-stat{min-width:0}
.fnb-stat span{white-space:nowrap}
.fnb-select{position:relative}
.fnb-select select[hidden]{display:none!important}
.fnb-select-trigger{width:100%;height:40px;min-height:40px;padding:0 11px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--fnb-glass-brd)!important;border-radius:12px;background:rgba(46,39,59,.72);color:var(--sm-text);text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(250,247,245,.025);transition:border-color var(--fnb-motion-base) ease,background var(--fnb-motion-base) ease,box-shadow var(--fnb-motion-base) ease,transform var(--fnb-motion-fast) var(--fnb-motion-ease)}
.fnb-select-trigger>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.fnb-select-trigger svg{flex:0 0 15px;width:15px;height:15px;fill:none;stroke:rgba(250,247,245,.55);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--fnb-motion-base) var(--fnb-motion-ease),stroke var(--fnb-motion-base) ease}
.fnb-select.is-open .fnb-select-trigger{border-color:rgba(var(--fnb-accent-rgb),.48)!important;background:rgba(46,39,59,.88);box-shadow:0 0 0 3px rgba(var(--fnb-accent-rgb),.055)}
.fnb-select.is-open .fnb-select-trigger svg{transform:rotate(180deg);stroke:var(--fnb-accent)}
.fnb-select-trigger:active{transform:scale(.992)}
.fnb-select-menu{position:absolute;z-index:128;top:calc(100% + 7px);min-width:100%;padding:5px;border:1px solid rgba(250,247,245,.13);border-radius:14px;background:rgba(38,32,49,.98);box-shadow:0 18px 48px rgba(8,6,12,.34),inset 0 1px 0 rgba(250,247,245,.03);visibility:hidden;opacity:0;pointer-events:none;transform:translateY(-5px) scale(.988);transform-origin:top left;transition:opacity 210ms ease,transform 260ms var(--fnb-motion-ease),visibility 0s linear 260ms}
.fnb-select[data-filter-field="outlet"] .fnb-select-menu{left:0;width:min(280px,calc(100vw - 48px))}
.fnb-select[data-filter-field="month"] .fnb-select-menu{right:0;left:auto;width:100%}
.fnb-select.is-open .fnb-select-menu{visibility:visible;opacity:1;pointer-events:auto;transform:none;transition-delay:0s}
.fnb-select-option{width:100%;min-height:42px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:10px;background:transparent;color:rgba(250,247,245,.70);text-align:left;cursor:pointer;transition:background var(--fnb-motion-base) ease,color var(--fnb-motion-base) ease,transform var(--fnb-motion-fast) var(--fnb-motion-ease)}
.fnb-select-option+ .fnb-select-option{border-top:1px solid rgba(250,247,245,.07)}
.fnb-select-option>span{white-space:nowrap;font-size:12.5px}
.fnb-select-option i{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:transparent;box-shadow:0 0 0 1px rgba(250,247,245,.24)}
.fnb-select-option.is-selected{background:rgba(var(--fnb-accent-rgb),.08);color:var(--fnb-accent)}
.fnb-select-option.is-selected i{background:var(--fnb-accent);box-shadow:0 0 0 3px rgba(var(--fnb-accent-rgb),.10)}
.fnb-select-option:active{transform:scale(.992)}
.fnb-text-copy{max-height:1400px;opacity:1;transition:max-height var(--fnb-disclosure-ms) var(--fnb-disclosure-ease),opacity 300ms ease;-webkit-mask-image:none;mask-image:none}
.fnb-text-copy.is-collapsed{max-height:170px;opacity:.88;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%)}
.fnb-task-list{transition:max-height var(--fnb-disclosure-ms) var(--fnb-disclosure-ease),opacity 300ms ease,padding var(--fnb-disclosure-ms) var(--fnb-disclosure-ease)}
.fnb-card,.fnb-text-card,.fnb-art-card{background:rgba(46,39,59,.66);backdrop-filter:none;-webkit-backdrop-filter:none}
@media(max-width:355px){.fnb-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px}.fnb-stat span{font-size:8px!important}}
@media(prefers-reduced-motion:reduce){.fnb-select-trigger,.fnb-select-menu,.fnb-select-option,.fnb-text-copy,.fnb-task-list{transition:none!important}}
'''
          p.write_text(s)

          p=Path('site/environment.css')
          s=p.read_text()
          old='.environment-stage{position:fixed;z-index:0;inset:0;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#536b83 0%,#8a8585 62%,#2E273B 100%);pointer-events:none;isolation:isolate;contain:strict}'
          new='.environment-stage{position:fixed;z-index:0;top:0;left:0;right:0;bottom:auto;width:100vw;height:100vh;height:100lvh;overflow:hidden;background:linear-gradient(180deg,#536b83 0%,#8a8585 62%,#2E273B 100%);pointer-events:none;isolation:isolate;contain:strict;transform:translateZ(0);backface-visibility:hidden}'
          if old not in s: raise SystemExit('environment stage anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('will-change:opacity;transition:opacity .75s','backface-visibility:hidden;will-change:opacity,transform;transition:opacity .75s',1)
          p.write_text(s)

          p=Path('site/footer-route-guard.js')
          s=p.read_text()
          old='    const module=await import(FNB_MODULE_URL);'
          new='    const module=await import(`${FNB_MODULE_URL}&ui=2`);'
          if old not in s: raise SystemExit('F&B import anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('site/index.html')
          s=p.read_text()
          if '<link rel="stylesheet" href="/environment.css">' not in s: raise SystemExit('environment css link missing')
          s=s.replace('<link rel="stylesheet" href="/environment.css">','<link rel="stylesheet" href="/environment.css?v=2">',1)
          if '<script type="module" src="/footer-route-guard.js?v=6"></script>' not in s: raise SystemExit('footer js link missing')
          s=s.replace('<script type="module" src="/footer-route-guard.js?v=6"></script>','<script type="module" src="/footer-route-guard.js?v=6&ui=2"></script>',1)
          p.write_text(s)
          PY
      - name: Validate repaired assets
        shell: bash
        run: |
          set -euo pipefail
          node --check site/fnb.js
          node --check site/footer-route-guard.js
          git diff --check
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' site/fnb.css
          grep -q 'fnb-select-trigger' site/fnb.css
          grep -q 'data-filter-option' site/fnb.js
          grep -q 'sectionTarget' site/fnb.js
          grep -q 'height:100lvh' site/environment.css
          grep -q 'backdrop-filter:none' site/fnb.css
          grep -q 'FNB_MODULE_URL.*v=6' site/footer-route-guard.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site/fnb.js site/fnb.css site/environment.css site/footer-route-guard.js site/index.html
          git commit -m "Polish F&B metrics dropdowns disclosures and scroll stability"
          git push origin HEAD:fnb-live-integration
