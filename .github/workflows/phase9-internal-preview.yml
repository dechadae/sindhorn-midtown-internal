name: Phase 9 Internal Login Preview

on:
  push:
    branches:
      - phase9-internal-auth-broadcast
      - phase9-contact-otp
      - hotfix-phase9-auth-gate
      - phase9-permanent-pin
    paths:
      - "site/index.html"
      - "site/auth-shell.js"
      - "site/auth-shell.css"
      - "site/auth-client.js"
      - "site/login.html"
      - "site/login.js"
      - "site/account.html"
      - "site/account.js"
      - "site/account.css"
      - "site/admin.html"
      - "site/admin.js"
      - "site/qr-v6.js"
      - "site/internal-auth.css"
      - "site/auth-brand.css"
      - "supabase/migrations/*phase9*"
      - ".github/workflows/phase9-internal-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-phase9-internal-preview
  cancel-in-progress: true

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Supabase-only auth surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check site/auth-shell.js
          node --check site/auth-client.js
          node --check site/login.js
          node --check site/account.js
          node --check site/admin.js
          node --check site/qr-v6.js
          grep -q 'Employee ID' site/login.html
          grep -q 'Permanent code' site/login.html
          grep -q 'Administrator one-time code' site/login.html
          grep -q 'pinSetupForm' site/login.html
          test "$(grep -o 'data-otp-digit=' site/login.html | wc -l)" -eq 6
          test "$(grep -o 'data-pin-login-digit=' site/login.html | wc -l)" -eq 6
          test "$(grep -o 'data-new-pin-digit=' site/login.html | wc -l)" -eq 6
          test "$(grep -o 'data-confirm-pin-digit=' site/login.html | wc -l)" -eq 6
          grep -q 'auth-brand.css' site/login.html
          grep -q 'auth-brand.css' site/admin.html
          grep -q '#2E273B' site/auth-brand.css
          grep -q '#FAF7F5' site/auth-brand.css
          grep -q '#E5ECBE' site/auth-brand.css
          grep -q 'letter-spacing:0!important' site/auth-brand.css
          grep -q -- '-webkit-tap-highlight-color:transparent' site/auth-brand.css
          ! grep -q 'Personal email' site/login.html
          ! grep -qi 'turnstile' site/login.html
          ! grep -q 'login-contact-otp.js' site/login.html
          grep -q 'sindhorn_manual_activate' site/auth-client.js
          grep -q 'sindhorn_pin_login' site/auth-client.js
          grep -q 'sindhorn_set_permanent_pin' site/auth-client.js
          grep -q 'pin_configured_at' site/auth-client.js
          grep -q "authBackend:'supabase'" site/auth-client.js
          grep -q 'auth-shell.css' site/index.html
          grep -q 'auth-shell.js' site/index.html
          ! grep -q 'src="/bootstrap.js"' site/index.html
          ! grep -q 'src="/location.js"' site/index.html
          grep -q "await initAuth" site/auth-shell.js
          grep -q 'pin_configured_at' site/auth-shell.js
          grep -q "location.replace(loginUrl())" site/auth-shell.js
          grep -q "loadClassicScript('/location.js')" site/auth-shell.js
          grep -q "await import('./bootstrap.js')" site/auth-shell.js
          grep -q 'masthead-user' site/auth-shell.js
          grep -q '/account.html' site/auth-shell.js
          grep -q 'letter-spacing:0!important' site/auth-shell.css
          grep -q 'My account' site/account.html
          grep -q 'Permanent code' site/account.html
          grep -q 'accountSignOut' site/account.html
          grep -q 'pin_configured_at' site/account.js
          grep -q 'letter-spacing:0!important' site/account.css
          grep -q 'sindhorn_admin_issue_activation_code_v2' site/admin.js
          grep -q 'sindhorn_admin_list_users_v3' site/admin.js
          grep -q 'sindhorn_admin_upsert_contact_v2' site/admin.js
          grep -q 'sindhorn_admin_revoke_access_v2' site/admin.js
          grep -q 'qrSvg' site/admin.js
          grep -q '#i=' site/admin.js
          grep -q 'history.replaceState' site/login.js
          grep -q 'setPermanentPin' site/login.js
          grep -q 'signInWithPin' site/login.js
          grep -q 'phase9_permanent_employee_pin' <(basename supabase/migrations/20260827163101_phase9_permanent_employee_pin.sql)
          grep -q 'employee_pin_credentials' supabase/migrations/20260827163101_phase9_permanent_employee_pin.sql
          grep -q 'failed_attempt_count' supabase/migrations/20260827163101_phase9_permanent_employee_pin.sql
          grep -q "interval '15 minutes'" supabase/migrations/20260827163101_phase9_permanent_employee_pin.sql
          ! grep -R -q 'workers.dev' site/auth-client.js site/login.html site/login.js site/account.js site/admin.js
          ! grep -R -q -E 'BREVO|TURNSTILE|/otp/request|/otp/verify' site/auth-client.js site/login.html site/login.js site/account.js site/admin.js
          grep -q 'noto-sans-400.woff2' site/internal-auth.css
          grep -q 'noto-sans-thai-400.woff2' site/internal-auth.css
          test -f site/assets/brand/sindhorn-midtown-vignette-black.png
          test -f site/assets/fonts/noto-sans-400.woff2
          test -f site/assets/fonts/noto-sans-thai-400.woff2
          ! grep -R -E 'sb_secret_|SUPABASE_SECRET_KEY[[:space:]]*=' site/index.html site/auth-shell.js site/auth-shell.css site/login.html site/login.js site/account.html site/account.js site/account.css site/admin.html site/admin.js site/auth-client.js site/internal-auth.css site/auth-brand.css

      - name: QR encoder smoke
        run: |
          node --input-type=module - <<'NODE'
          import {qrMatrix,qrSvg} from './site/qr-v6.js';
          const value='https://phase9-contact-otp.sindhorn-midtown-internal.pages.dev/login.html#i=10639&c=123456';
          const matrix=qrMatrix(value);
          if(matrix.length!==41||matrix.some(row=>row.length!==41)) throw new Error('QR matrix shape failed');
          const svg=qrSvg(value);
          if(!svg.includes('<svg')||!svg.includes('viewBox="0 0 49 49"')) throw new Error('QR SVG failed');
          NODE

      - name: Deploy Phase 9 branch Pages preview
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test auth gate, account, login and admin preview
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
          BASE_URL="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          CACHE_BUST="phase9=${GITHUB_SHA}"
          sleep 8
          for path in / /auth-shell.js /auth-shell.css /login.html /login.js /account.html /account.js /account.css /admin.html /admin.js /qr-v6.js /auth-client.js /internal-auth.css /auth-brand.css /assets/brand/sindhorn-midtown-vignette-black.png; do
            echo "smoke ${path}"
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 \
              -H 'Cache-Control: no-cache' "${BASE_URL}${path}?${CACHE_BUST}" -o /tmp/phase9-smoke
            test -s /tmp/phase9-smoke
          done
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/?${CACHE_BUST}" -o /tmp/phase9-index.html
          grep -q 'auth-shell.js' /tmp/phase9-index.html
          ! grep -q 'src="/bootstrap.js"' /tmp/phase9-index.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/auth-shell.js?${CACHE_BUST}" -o /tmp/phase9-auth-shell.js
          grep -q 'masthead-user' /tmp/phase9-auth-shell.js
          grep -q '/account.html' /tmp/phase9-auth-shell.js
          grep -q 'pin_configured_at' /tmp/phase9-auth-shell.js
          grep -q "await import('./bootstrap.js')" /tmp/phase9-auth-shell.js
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/login.html?${CACHE_BUST}" -o /tmp/phase9-login.html
          grep -q 'Permanent code' /tmp/phase9-login.html
          grep -q 'Administrator one-time code' /tmp/phase9-login.html
          grep -q 'pinSetupForm' /tmp/phase9-login.html
          test "$(grep -o 'data-otp-digit=' /tmp/phase9-login.html | wc -l)" -eq 6
          test "$(grep -o 'data-pin-login-digit=' /tmp/phase9-login.html | wc -l)" -eq 6
          ! grep -q 'Personal email' /tmp/phase9-login.html
          ! grep -qi 'turnstile' /tmp/phase9-login.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/account.html?${CACHE_BUST}" -o /tmp/phase9-account.html
          grep -q 'My account' /tmp/phase9-account.html
          grep -q 'Permanent code' /tmp/phase9-account.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/auth-client.js?${CACHE_BUST}" -o /tmp/phase9-auth-client.js
          grep -q 'sindhorn_manual_activate' /tmp/phase9-auth-client.js
          grep -q 'sindhorn_pin_login' /tmp/phase9-auth-client.js
          grep -q 'sindhorn_set_permanent_pin' /tmp/phase9-auth-client.js
          ! grep -q 'workers.dev' /tmp/phase9-auth-client.js
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/admin.js?${CACHE_BUST}" -o /tmp/phase9-admin.js
          grep -q 'sindhorn_admin_list_users_v3' /tmp/phase9-admin.js
          grep -q 'sindhorn_admin_upsert_contact_v2' /tmp/phase9-admin.js
          grep -q 'sindhorn_admin_revoke_access_v2' /tmp/phase9-admin.js
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/auth-brand.css?${CACHE_BUST}" -o /tmp/phase9-auth-brand.css
          grep -q 'letter-spacing:0!important' /tmp/phase9-auth-brand.css
          grep -q '#2E273B' /tmp/phase9-auth-brand.css
          echo "Phase 9 permanent PIN preview verified at ${BASE_URL}"
