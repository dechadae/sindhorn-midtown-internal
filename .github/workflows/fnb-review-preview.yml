name: F&B Promotions Review Preview

on:
  push:
    branches:
      - fnb-promotions-review-v2
    paths:
      - "site/fnb-promotions-review.html"
      - "scripts/fnb-review-v4-patch.py"
      - "scripts/fnb-review-v5-patch.py"
      - ".github/workflows/fnb-review-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-promotions-review-preview
  cancel-in-progress: true

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6

      - name: Apply review-only presentation patches
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/let filter="ALL",view="promotions",current=null;/let filter="ALL", view="promotions", current=null;/' site/fnb-promotions-review.html
          python scripts/fnb-review-v4-patch.py
          python scripts/fnb-review-v5-patch.py

      - name: Validate isolated review page
        shell: bash
        run: |
          set -euo pipefail
          test -s site/fnb-promotions-review.html
          grep -q 'F&B Promotions' site/fnb-promotions-review.html
          grep -q 'Editor · 10639' site/fnb-promotions-review.html
          grep -q 'Noto Sans Thai' site/fnb-promotions-review.html
          grep -q 'F&B Review v4' site/fnb-promotions-review.html
          grep -q 'F&B Review v5' site/fnb-promotions-review.html
          grep -q 'data-month="SEP"' site/fnb-promotions-review.html
          grep -q 'Horizon Pool Bar' site/fnb-promotions-review.html
          grep -q 'The Lobby Lounge' site/fnb-promotions-review.html
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' site/fnb-promotions-review.html
          grep -q 'artwork-folder-bottom' site/fnb-promotions-review.html
          ! grep -q '<div class="view-switch">' site/fnb-promotions-review.html
          ! grep -qi 'flipgazine' site/fnb-promotions-review.html

      - name: Deploy isolated branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test review URL
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb-promotions-review.html" -o /tmp/fnb-review.html
          grep -q 'F&B Promotions' /tmp/fnb-review.html
          grep -q 'F&B Review v5' /tmp/fnb-review.html
          grep -q 'data-month="DEC"' /tmp/fnb-review.html
          grep -q 'The Lobby Lounge' /tmp/fnb-review.html
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' /tmp/fnb-review.html
          grep -q 'artwork-folder-bottom' /tmp/fnb-review.html
          ! grep -q '<div class="view-switch">' /tmp/fnb-review.html
