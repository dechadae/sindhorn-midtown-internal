name: Verify push client v12
on:
  push:
    branches: [push-client-v12]
    paths: ['.github/workflows/push-client-v12-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          node --check site/sw.js
          node --check site/app.js
          grep -q "addEventListener('push'" site/sw.js
          grep -q "addEventListener('notificationclick'" site/sw.js
          grep -q 'pwa-v12' site/sw.js
          grep -q 'push-client: ios-android-service-worker-receiver-v12' site/version.txt
      - name: Service worker registration QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/push-check.cjs <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:60000});
            const info=await page.evaluate(async()=>{
              if(!('serviceWorker' in navigator))return{supported:false};
              const reg=await navigator.serviceWorker.ready;
              return{
                supported:true,
                active:!!reg.active,
                scope:reg.scope,
                notification:'Notification' in window,
                pushManager:!!reg.pushManager
              };
            });
            console.log(JSON.stringify(info));
            if(!info.supported||!info.active||!info.pushManager)throw new Error('service-worker push client unavailable in QA browser');
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/push-check.cjs
      - name: Commit verified client and remove helper
        run: |
          rm -f .github/workflows/push-client-v12-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site .github/workflows/push-client-v12-once.yml
          git commit -m "Verify cross-platform Web Push receiving layer"
          git push origin HEAD:push-client-v12
