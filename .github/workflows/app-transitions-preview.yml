name: Appwide Premium Transitions Preview

on:
  push:
    branches:
      - phase9-appwide-transitions
      - hotfix-app-transitions-v2
    paths:
      - "site/app-transitions.css"
      - "site/app-transitions.js"
      - "site/index.html"
      - "site/login.html"
      - "site/account.html"
      - "site/admin.html"
      - ".github/workflows/app-transitions-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-app-transitions-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shared transition layer
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app-transitions.js
          grep -q -- '--app-transition-ms:280ms' site/app-transitions.css
          grep -q 'app-document-veil' site/app-transitions.css
          grep -q 'routeOnlyFade' site/app-transitions.js
          grep -q 'navigateDocument' site/app-transitions.js
          grep -q 'data-app-route' site/app-transitions.js
          grep -q 'SindhornAppPack' site/app-transitions.js
          grep -q 'prefers-reduced-motion:reduce' site/app-transitions.css
          ! grep -q '@view-transition' site/app-transitions.css
          ! grep -q 'view-transition-old(root)' site/app-transitions.css
          ! grep -q 'startViewTransition' site/app-transitions.js
          for page in site/index.html site/login.html site/account.html site/admin.html; do
            grep -q '/app-transitions.css' "$page"
            grep -q '/app-transitions.js' "$page"
          done
          ! grep -E -q 'letter-spacing:[^0]' site/app-transitions.css

      - name: Deploy transition branch preview
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke transition assets and pages
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
          BASE_URL="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          CACHE_BUST="transition=${GITHUB_SHA}"
          sleep 8
          for path in / /login.html /account.html /admin.html /app-transitions.css /app-transitions.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' "${BASE_URL}${path}?${CACHE_BUST}" -o /tmp/transition-smoke
            test -s /tmp/transition-smoke
          done
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/app-transitions.css?${CACHE_BUST}" -o /tmp/app-transitions.css
          grep -q -- '--app-transition-ms:280ms' /tmp/app-transitions.css
          grep -q 'app-document-veil' /tmp/app-transitions.css
          ! grep -q '@view-transition' /tmp/app-transitions.css
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${BASE_URL}/app-transitions.js?${CACHE_BUST}" -o /tmp/app-transitions.js
          grep -q 'routeOnlyFade' /tmp/app-transitions.js
          grep -q 'navigateDocument' /tmp/app-transitions.js
          ! grep -q 'startViewTransition' /tmp/app-transitions.js
          echo "Appwide transition hotfix preview verified at ${BASE_URL}"
