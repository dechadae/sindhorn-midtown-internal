name: Weather fidelity and premium UI v13
on:
  push:
    branches: [weather-quality-v13]
    paths:
      - '.github/workflows/weather-quality-v13-once.yml'
      - '.github/scripts/v13_patch.py'
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install build and QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install @fontsource/noto-sans @fontsource/noto-sans-thai html2canvas@1.4.1 playwright@1.55.0 >/dev/null 2>&1

      - name: Apply v13 app patch
        run: python3 .github/scripts/v13_patch.py

      - name: Build Three.js bundle
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js
          node --check site/app.js
          node --check site/sw.js

      - name: Static contract checks
        run: |
          grep -q 'precision highp float' site/environment.js
          grep -q 'const activePixelRatio=2' site/environment.js
          grep -q 'uWeatherType' site/environment.js
          grep -q 'DeviceOrientationEvent.requestPermission' site/environment.js
          ! grep -q 'lowPowerDevice' site/environment.js
          ! grep -q 'adaptQuality' site/environment.js
          grep -q 'Noto Sans Thai' site/index.html
          grep -q 'id="connectionTh" lang="th"' site/index.html
          grep -q 'Save full page' site/index.html
          grep -q 'html2canvas.min.js' site/index.html
          grep -q 'Air quality care' site/app.js
          grep -q 'Current observation' site/app.js
          grep -q 'bottom-nav' site/app.js
          grep -q 'pwa-v13' site/sw.js
          test -s site/vendor/html2canvas.min.js
          test -s site/assets/fonts/noto-sans-300.woff2
          test -s site/assets/fonts/noto-sans-thai-400.woff2

      - name: Browser QA mobile and desktop
        run: |
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/v13-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/v13_qa.cjs

      - name: Commit verified v13
        run: |
          rm -f .github/workflows/weather-quality-v13-once.yml .github/scripts/v13_patch.py .github/scripts/v13_qa.cjs
          rm -f package.json package-lock.json
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site docs AGENTS.md .github/workflows/weather-quality-v13-once.yml .github/scripts
          git commit -m "Upgrade weather fidelity and premium mobile experience"
          git push origin HEAD:weather-quality-v13
