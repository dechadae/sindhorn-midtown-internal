<script>
(()=>{
  const KEY='sindhorn-startup-audit:v1',MAX=12,id=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const read=()=>{try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}};
  const cleanUrl=value=>{try{const url=new URL(typeof value==='string'?value:value?.url||'',location.href);return`${url.origin}${url.pathname}`}catch{return'unknown'}};
  const kindFor=value=>{try{const url=new URL(typeof value==='string'?value:value?.url||'',location.href),path=url.pathname;if(url.hostname.endsWith('supabase.co')&&path.includes('/auth/v1/token'))return'auth-refresh';if(url.hostname.endsWith('supabase.co')&&path.includes('/rest/v1/rpc/sindhorn_current_employee_profile'))return'employee-profile';if(url.hostname.endsWith('supabase.co')&&path.includes('/rest/v1/sindhorn_app_files'))return'ui-pack';if(url.hostname.endsWith('supabase.co')&&path.includes('/functions/v1/sindhorn-weather-core'))return'weather-core';if(url.origin===location.origin&&path==='/api/betta-satellite')return'satellite';if(path==='/air-current')return'air-current';return'other'}catch{return'other'}};
  let history=read();
  const session={id,startedAt:Date.now(),timeOrigin:performance.timeOrigin,href:`${location.pathname}${location.search}`,standalone:matchMedia('(display-mode: standalone)').matches,userAgent:navigator.userAgent,sw:{supported:'serviceWorker'in navigator,controller:navigator.serviceWorker?.controller?.scriptURL||null},events:[],fetches:[],marks:[],paints:[],resources:[],navigation:null};
  history.push(session);history=history.slice(-MAX);
  const persist=()=>{try{const index=history.findIndex(item=>item.id===id);if(index>=0)history[index]=session;localStorage.setItem(KEY,JSON.stringify(history))}catch{}};
  const record=(name,detail={})=>{session.events.push({name,t:+performance.now().toFixed(1),at:Date.now(),detail});if(session.events.length>160)session.events=session.events.slice(-160);persist()};
  const snapshot=()=>{const nav=performance.getEntriesByType('navigation')[0];if(nav)session.navigation={type:nav.type,workerStart:+nav.workerStart.toFixed(1),fetchStart:+nav.fetchStart.toFixed(1),requestStart:+nav.requestStart.toFixed(1),responseStart:+nav.responseStart.toFixed(1),responseEnd:+nav.responseEnd.toFixed(1),domInteractive:+nav.domInteractive.toFixed(1),domContentLoadedEventEnd:+nav.domContentLoadedEventEnd.toFixed(1),loadEventEnd:+nav.loadEventEnd.toFixed(1),transferSize:Number(nav.transferSize)||0,encodedBodySize:Number(nav.encodedBodySize)||0,decodedBodySize:Number(nav.decodedBodySize)||0,nextHopProtocol:nav.nextHopProtocol||'',deliveryType:nav.deliveryType||''};session.marks=performance.getEntriesByType('mark').filter(item=>item.name.startsWith('sindhorn-')).map(item=>({name:item.name,startTime:+item.startTime.toFixed(1)}));session.paints=performance.getEntriesByType('paint').map(item=>({name:item.name,startTime:+item.startTime.toFixed(1)}));session.resources=performance.getEntriesByType('resource').map(item=>({path:cleanUrl(item.name),kind:kindFor(item.name),initiatorType:item.initiatorType,duration:+item.duration.toFixed(1),transferSize:Number(item.transferSize)||0,encodedBodySize:Number(item.encodedBodySize)||0})).sort((a,b)=>b.duration-a.duration).slice(0,40);session.sw.controller=navigator.serviceWorker?.controller?.scriptURL||null;persist();return structuredClone(session)};
  window.SindhornStartupAudit={record,snapshot,getHistory:()=>structuredClone(history),clear:()=>{history=[];try{localStorage.removeItem(KEY)}catch{}}};
  record('audit-script-start',{standalone:session.standalone,controlled:Boolean(session.sw.controller)});

  const originalFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){const started=performance.now(),kind=kindFor(input),path=cleanUrl(input),method=String(init?.method||input?.method||'GET').toUpperCase();try{const response=await originalFetch(input,init);session.fetches.push({kind,path,method,status:response.status,ok:response.ok,start:+started.toFixed(1),duration:+(performance.now()-started).toFixed(1)});if(session.fetches.length>120)session.fetches=session.fetches.slice(-120);persist();return response}catch(error){session.fetches.push({kind,path,method,status:0,ok:false,start:+started.toFixed(1),duration:+(performance.now()-started).toFixed(1),error:error?.name||'error'});persist();throw error}};

  const watchWorker=worker=>{if(!worker||worker.__sindhornStartupAudit)return;try{worker.__sindhornStartupAudit=true}catch{}record('sw-worker-state',{state:worker.state||'unknown'});worker.addEventListener('statechange',()=>{record('sw-worker-state',{state:worker.state||'unknown'});snapshot()})};
  const watchRegistration=registration=>{if(!registration||registration.__sindhornStartupAudit)return registration;try{registration.__sindhornStartupAudit=true}catch{}record('sw-registration',{active:registration.active?.state||null,waiting:registration.waiting?.state||null,installing:registration.installing?.state||null});watchWorker(registration.installing);registration.addEventListener('updatefound',()=>{record('sw-updatefound');watchWorker(registration.installing);snapshot()});return registration};
  if('serviceWorker'in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',()=>{record('sw-controllerchange',{controller:navigator.serviceWorker.controller?.scriptURL||null});snapshot()});
    navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='SINDHORN_STARTUP_AUDIT')record('sw-message',event.data.detail||{})});
    navigator.serviceWorker.getRegistration('/').then(watchRegistration).catch(()=>{});
    try{const proto=ServiceWorkerRegistration.prototype,originalUpdate=proto.update;if(!proto.__sindhornStartupAuditUpdate){Object.defineProperty(proto,'__sindhornStartupAuditUpdate',{value:true});proto.update=function(...args){const started=performance.now();record('sw-update-start');return Promise.resolve(originalUpdate.apply(this,args)).then(registration=>{record('sw-update-end',{duration:+(performance.now()-started).toFixed(1)});watchRegistration(registration);snapshot();return registration},error=>{record('sw-update-error',{duration:+(performance.now()-started).toFixed(1),error:error?.name||'error'});snapshot();throw error})}}}catch{}
    try{const proto=ServiceWorkerContainer.prototype,originalRegister=proto.register;if(!proto.__sindhornStartupAuditRegister){Object.defineProperty(proto,'__sindhornStartupAuditRegister',{value:true});proto.register=function(...args){const started=performance.now();record('sw-register-start',{script:cleanUrl(args[0])});return Promise.resolve(originalRegister.apply(this,args)).then(registration=>{record('sw-register-end',{duration:+(performance.now()-started).toFixed(1)});watchRegistration(registration);snapshot();return registration},error=>{record('sw-register-error',{duration:+(performance.now()-started).toFixed(1),error:error?.name||'error'});throw error})}}}catch{}
  }

  const root=document.documentElement;
  new MutationObserver(()=>{const enter=root.dataset.startupEnter,loading=root.dataset.shellLoading;if(enter==='visible'&&!session.events.some(item=>item.name==='startup-enter-visible'))record('startup-enter-visible');if(loading==='false'&&!session.events.some(item=>item.name==='shell-loading-false'))record('shell-loading-false');snapshot()}).observe(root,{attributes:true,attributeFilter:['data-startup-enter','data-shell-loading']});
  const onRoute=()=>{const host=document.getElementById('route-view');if(host?.childElementCount&&!session.events.some(item=>item.name==='route-content-mounted')){record('route-content-mounted',{route:host.dataset.shellRoute||document.body?.dataset.route||null});snapshot()}};
  addEventListener('DOMContentLoaded',()=>{record('dom-content-loaded');const host=document.getElementById('route-view');if(host)new MutationObserver(onRoute).observe(host,{childList:true,subtree:false});onRoute();snapshot()},{once:true});
  document.addEventListener('sindhorn:betta-first-frame',()=>{record('betta-first-frame');snapshot()});
  document.addEventListener('sindhorn:route-mounted',event=>{record('route-mounted',{route:event.detail?.route||null});snapshot()});
  addEventListener('load',()=>{record('window-load');snapshot();setTimeout(snapshot,2500);setTimeout(snapshot,7000)},{once:true});
  addEventListener('pagehide',event=>{record('pagehide',{persisted:Boolean(event.persisted)});snapshot()});
  document.addEventListener('visibilitychange',()=>{record('visibilitychange',{hidden:document.hidden});snapshot()});
  try{new PerformanceObserver(list=>{for(const item of list.getEntries())if(item.entryType==='paint'||(item.entryType==='mark'&&item.name.startsWith('sindhorn-')))snapshot()}).observe({entryTypes:['paint','mark']})}catch{}
  snapshot();
})();
</script>
