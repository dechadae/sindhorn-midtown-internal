name: Today Startup Gap Preview

on:
  push:
    branches:
      - fix-today-startup-gap
      - sync-today-betta-fade
      - fix-betta-first-frame-startup
    paths:
      - "site/index.html"
      - "site/bootstrap.js"
      - "site/route-registry.js"
      - "site/auth-shell.js"
      - "site/shell.css"
      - "site/environment.css"
      - "site/betta-environment.js"
      - "site/betta-runtime.js"
      - "site/sw.js"
      - "scripts/today-startup-gap-smoke.mjs"
      - ".github/workflows/today-startup-gap-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: today-startup-gap-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate progressive startup contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < scripts/today-startup-gap-smoke.mjs
          node --input-type=module --check < site/bootstrap.js
          node --input-type=module --check < site/route-registry.js
          node --input-type=module --check < site/auth-shell.js
          node --input-type=module --check < site/betta-environment.js
          node --input-type=module --check < site/betta-runtime.js
          node --check site/sw.js
          test "$(wc -c < site/betta-runtime.js)" -lt 700000
          grep -q 'data-startup-enter="pending"' site/index.html
          grep -q 'sindhorn-startup-enter-visible' site/index.html
          grep -q 'mountBusinessDashboardStartupRoute' site/route-registry.js
          grep -q 'host.append(placeholder,staging)' site/route-registry.js
          grep -q 'await waitForStartupReveal()' site/route-registry.js
          grep -q "const environment=await import('./betta-runtime.js?v=1');await environment.initEnvironment();" site/bootstrap.js
          grep -q "import('./betta-runtime.js?v=1')" site/auth-shell.js
          grep -q 'modulepreload" href="/betta-runtime.js?v=1"' site/index.html
          grep -q "const live=await import('./live-data.js');await live.initLiveData();" site/bootstrap.js
          grep -q "function markFirstFrame()" site/betta-environment.js
          grep -q "renderer.render(scene,camera);markFirstFrame()" site/betta-environment.js
          grep -q "dataset.bettaFirstFrame='pending'" site/betta-environment.js
          ! grep -q "classList.add('environment-ready').*buildFins" site/betta-environment.js
          grep -q "sindhorn-midtown-internal-pwa-v39-betta-first-frame-r1" site/sw.js
          grep -q "'/betta-runtime.js'" site/sw.js
          grep -q 'html\[data-startup-enter="visible"\].*#route-view' site/shell.css
          grep -q 'html\[data-startup-enter="visible"\] body.environment-ready .environment-canvas' site/environment.css
          grep -q 'transition:opacity .32s cubic-bezier(.22,1,.36,1)' site/shell.css
          grep -q 'transition:opacity .32s cubic-bezier(.22,1,.36,1)' site/environment.css
          ! grep -q 'opacity:.001' site/shell.css
          grep -q '/shell.css?v=5' site/index.html
          grep -q '/environment.css?v=4' site/index.html
          grep -q '/auth-shell.js?v=4' site/index.html

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Validate delayed-data startup on mobile
        shell: bash
        run: |
          set -euo pipefail
          export BASE_URL="https://${GITHUB_REF_NAME:0:28}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /shell.css?v=5 /environment.css?v=4 /route-registry.js /business-dashboard.js /bootstrap.js '/betta-runtime.js?v=1' /betta-environment.js /sw.js '/auth-shell.js?v=4'; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/today-startup-gap-smoke.mjs | tee /tmp/today-startup-gap-report.json
          node scripts/business-dashboard-browser-smoke.mjs | tee /tmp/business-dashboard-browser-report.json

      - name: Upload startup report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: today-startup-gap-preview
          path: |
            /tmp/today-startup-gap-report.json
            /tmp/business-dashboard-browser-report.json
            /tmp/business-dashboard-preview
          if-no-files-found: warn
          retention-days: 14
