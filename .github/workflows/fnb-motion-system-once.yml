name: One-shot F&B Motion System Repair

on:
  push:
    branches: [fnb-live-integration]
    paths: [".github/workflows/fnb-motion-system-once.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fnb-live-integration
          fetch-depth: 0
      - name: Apply motion repair
        run: python3 .github/scripts/fnb_motion_repair.py
      - name: Validate repaired assets
        shell: bash
        run: |
          set -euo pipefail
          node --check site/fnb.js
          node --check site/footer-route-guard.js
          node --check site/sw.js
          git diff --check
          grep -q "updateSectionFromScroll" site/fnb.js
          grep -q "translateX(18px)" site/fnb.js
          grep -q "fnb-motion-base" site/fnb.css
          grep -q -- "--sm-control-radius:12px" site/footer-route-guard.css
          grep -q "pwa-v31-fnb-motion-preview" site/sw.js
      - name: Commit motion repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/fnb-live-preview.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site/fnb.js site/fnb.css site/footer-route-guard.css site/footer-route-guard.js site/index.html site/sw.js
          git commit -m "Standardize F&B motion, scrollspy and controls"
          git push origin HEAD:fnb-live-integration
