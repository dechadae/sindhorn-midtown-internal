name: PWA Fast Startup Preview

on:
  push:
    branches:
      - fix-pwa-fast-startup
      - preview-ci-glass
      - ui-centralization-audit
      - ui-centralization
    paths:
      - "site/**"
      - "scripts/ci-glass-browser-smoke.mjs"
      - "scripts/glass-route-browser-smoke.mjs"
      - "scripts/utility-action-browser-smoke.mjs"
      - "scripts/pull-refresh-browser-smoke.mjs"
      - "scripts/shell-precache-parity-smoke.mjs"
      - "scripts/sw-install-resilience-smoke.mjs"
      - "scripts/nested-glass-smoke.mjs"
      - "scripts/ui-centralization-budget.mjs"
      - "ui-centralization-budget.json"
      - ".github/workflows/pwa-fast-startup-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Shared with business-dashboard-preview: see the note there.
concurrency:
  group: cf-pages-preview-${{ github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate startup, centralized CI glass, utilities and pull reload
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sw.js
          for file in \
            site/pwa-version-guard.js site/betta-runtime.js site/betta-runtime-full.js site/auth-shell.js site/bootstrap.js site/app.js \
            site/app-glass-runtime.js site/startup-skeleton.js site/ui-system-registry.js site/ci-day-cycle-route.js site/ci-glass-audit.js \
            site/settings-route-v3.js site/brand-route-controls.js site/fnb-share-ui.js site/notification-inbox.js \
            scripts/ci-glass-browser-smoke.mjs scripts/glass-route-browser-smoke.mjs \
            scripts/utility-action-browser-smoke.mjs scripts/pull-refresh-browser-smoke.mjs; do
            node --input-type=module --check < "$file"
          done

          # Startup / Betta / PWA invariants.
          grep -q "sindhorn-midtown-internal-pwa-v86-fnb-r14c" site/sw.js
          grep -q "PRECACHE_CONCURRENCY=8" site/sw.js
          grep -q "betta-runtime-full.js?v=1" site/betta-runtime.js
          grep -q "betta-runtime.js?v=2" site/index.html
          grep -q "auth-shell.js?v=8" site/index.html
          grep -q "bootstrap.js?v=4" site/auth-shell.js site/index.html
          grep -q "app-glass-runtime.js?v=1" site/bootstrap.js site/index.html
          grep -q "app.js?v=2" site/bootstrap.js
          grep -q "pwa.css?v=2" site/index.html
          grep -q "startup-skeleton.css?v=2" site/index.html
          grep -q "startup-skeleton.js?v=1" site/index.html
          grep -q "data-startup-skeleton" site/startup-skeleton.js
          grep -q "sindhorn-skeleton-surface-pulse" site/startup-skeleton.css
          grep -q "sindhorn-skeleton-line-pulse" site/startup-skeleton.css
          grep -q "sindhorn-betta-bootstrap-first-frame" site/betta-runtime.js
          grep -q "sindhorn:betta-first-frame" site/pwa-version-guard.js
          grep -q '"name":"Sindhorn Midtown Internal"' site/manifest.webmanifest
          grep -q "addEventListener('fetch'" site/sw.js

          # One CI-owned glass material only: 30% Vignette + proven 18px blur.
          grep -q "app-glass.css?v=6" site/index.html
          grep -q -- "--app-glass-fill:rgba(46,39,59,.30)" site/app-glass.css
          grep -q -- "--app-glass-filter:blur(18px) saturate(1.18)" site/app-glass.css
          grep -q -- "--app-glass-surface-fill:var(--app-glass-fill)" site/app-glass.css
          grep -q -- "--app-glass-control-fill:var(--app-glass-fill)" site/app-glass.css
          grep -q "\.app-glass-surface" site/app-glass.css
          grep -q "\.app-glass-control" site/app-glass.css
          grep -q "initGlassMaterial" site/bootstrap.js site/app-glass-runtime.js
          grep -q "applyGlassMaterial(headerHost)" site/bootstrap.js
          grep -q "applyGlassMaterial(routeHost)" site/bootstrap.js
          grep -q "\.masthead" site/app-glass-runtime.js
          grep -q "\.app-tabbar" site/app-glass-runtime.js
          grep -q "\.bd-metric" site/app-glass-runtime.js
          grep -q "\.fnb-card" site/app-glass-runtime.js
          grep -q "\.settings-user-card" site/app-glass-runtime.js
          grep -q "\.brand-card" site/app-glass-runtime.js
          grep -q "\.factsheet-room-card" site/app-glass-runtime.js
          grep -q "\.ihg-history-card" site/app-glass-runtime.js
          grep -q "\.message-card" site/app-glass-runtime.js
          # /ci declares .app-card / .app-control in markup and owns no registry entries.
          grep -q "app-card" site/ci.js
          grep -qE "^\.app-card," site/app-glass.css
          grep -qE "^\.app-overlay\{" site/app-glass.css
          ! grep -q "'\.ci-" site/app-glass-runtime.js
          grep -q "1.4.0-preview" site/ui-system-registry.js
          grep -q "One glass material only" site/ui-system-registry.js
          grep -q "rgba(46,39,59,.30) + blur(18px) saturate(1.18)" site/ui-system-registry.js
          grep -q "ci-glass-audit.js?v=2" site/ci-day-cycle-route.js
          grep -q "ci-day-cycle-route.js?v=4" site/route-registry.js

          # app-glass.css owns material only; route-selector mapping lives in the runtime.
          if grep -Eq '#route-view|\.fnb-card|\.settings-user-card|\.ci-status|\.brand-card|\.factsheet-room-card|\.ihg-history-card|\.bd-metric' site/app-glass.css; then
            echo 'app-glass.css must remain a semantic material primitive, not a page selector patch' >&2
            exit 1
          fi
          if grep -Eq -- '--app-glass-filter:blur\((32|20)px\)' site/app-glass.css; then
            echo 'Experimental stronger blur must not return' >&2
            exit 1
          fi
          if grep -q '\.ci-route \.fnb-chip' site/index.html; then
            echo 'CI route styling must not return as an inline index.html patch' >&2
            exit 1
          fi

          # Route roots must preserve the real WebGL backdrop.
          if grep -q 'isolation:isolate' site/fnb.css site/settings.css; then
            echo 'F&B/Settings must not isolate backdrop composition' >&2
            exit 1
          fi
          if grep -q 'linear-gradient(180deg,rgba(24,20,32,.72)' site/fnb.css site/settings.css; then
            echo 'F&B/Settings route-wide dark overlay must not return' >&2
            exit 1
          fi
          GLASS_FILES='site/fnb.css site/fnb-approved-polish.css site/settings.css site/business-dashboard.css site/brand.css site/hotel-factsheet.css site/ihg-history.css site/ci.css site/business-card-component.css'
          if grep -Eq -- '-webkit-;backdrop-filter:|easebackdrop-filter:|pxbackdrop-filter:|[0-9]backdrop-filter:|\)backdrop-filter:' $GLASS_FILES; then
            echo 'Malformed backdrop-filter declaration detected' >&2
            exit 1
          fi

          # Utility actions remain intentionally frameless / transparent / unblurred.
          grep -q "app-controls.css?v=2" site/index.html
          grep -q "backdrop-filter:none!important" site/app-controls.css site/app-glass.css
          grep -q "\.app-utility-action" site/app-controls.css site/ui-system-registry.js
          grep -q "Sign out, Share and Back to top" site/app-controls.css site/ui-system-registry.js
          grep -q "fresh.className='app-utility-action settings-hero-signout'" site/settings-route-v3.js
          grep -q "className='app-utility-action fnb-action-control fnb-share-button'" site/fnb-share-ui.js
          grep -q "button.className='app-utility-action'" site/brand-route-controls.js
          grep -q "classList.add('app-utility-action')" site/ci-day-cycle-route.js

          # Appwide pull-to-reload contract.
          grep -q "dataset.shellPullRefresh='true'" site/app.js
          grep -q "pull-refresh-spinner" site/app.js site/pwa.css
          grep -q "Release to reload" site/app.js
          grep -q "mountRoute?.(routeAtStart,{animate:false})" site/app.js
          grep -q "sindhornPullReloadRing" site/pwa.css
          if grep -q "ENVIRONMENT_ROUTES" site/app.js; then
            echo 'Pull-to-reload must not be route-gated' >&2
            exit 1
          fi
          if grep -q "pull-refresh-icon" site/app.js; then
            echo 'Legacy pull arrow/icon container must not return' >&2
            exit 1
          fi
          if grep -q "navigator.vibrate" site/app.js; then
            echo 'Pull-to-reload must remain haptic-free' >&2
            exit 1
          fi

          # Existing startup safety gates.
          if grep -Eq "fresh\.className=.*fnb-.*settings-hero-signout" site/settings-route-v3.js; then
            echo 'Hero sign out must never inherit framed F&B button classes' >&2
            exit 1
          fi
          if grep -Eq "sindhorn-skeleton-sheen|translateX\(" site/startup-skeleton.css; then
            echo 'Directional skeleton sweep must not return' >&2
            exit 1
          fi
          if grep -Eq "bezierCurveTo|\.ellipse\(" site/betta-runtime.js; then
            echo 'Temporary bootstrap fish artwork must not return' >&2
            exit 1
          fi
          if grep -q "client.navigate(client.url)" site/sw.js; then
            echo 'Activation-time client navigation must not return' >&2
            exit 1
          fi
          if grep -q 'html\[data-startup-enter="pending"\].*opacity:0' site/index.html; then
            echo 'Authenticated shell must remain visible while startup is pending' >&2
            exit 1
          fi
          test $(wc -c < site/betta-runtime.js) -lt 20000
          test $(wc -c < site/betta-runtime-full.js) -gt 300000

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke preview assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /ci /fnb /settings /brand /ihg-history /hotel-factsheet /messages /sw.js /manifest.webmanifest \
            '/app.js?v=2' '/pwa.css?v=2' '/app-controls.css?v=2' '/app-glass.css?v=6' '/app-glass-runtime.js?v=1' \
            '/ci-compact-fixes.css?v=2' '/ci-glass-audit.js?v=2' '/ci-day-cycle-route.js?v=4' /ui-system-registry.js \
            '/startup-skeleton.css?v=2' '/startup-skeleton.js?v=1' '/pwa-version-guard.js?v=2' '/auth-shell.js?v=8' '/bootstrap.js?v=4' \
            '/route-registry.js' '/brand-route-controls.js?v=2' '/betta-runtime.js?v=2' '/betta-runtime-full.js?v=1'; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done

      - name: Browser audit CI authority, real routes, utilities and pull reload
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/ci-glass-preview
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/ui-centralization-budget.mjs
          node scripts/shell-precache-parity-smoke.mjs | tee /tmp/shell-precache-report.json
          node scripts/sw-install-resilience-smoke.mjs | tee /tmp/sw-resilience-report.json
          node scripts/ci-glass-browser-smoke.mjs | tee /tmp/ci-glass-report.json
          node scripts/glass-route-browser-smoke.mjs | tee /tmp/glass-route-report.json
          node scripts/nested-glass-smoke.mjs | tee /tmp/nested-glass-report.json
          node scripts/utility-action-browser-smoke.mjs | tee /tmp/utility-action-report.json
          node scripts/pull-refresh-browser-smoke.mjs | tee /tmp/pull-refresh-report.json

      - name: Upload CI glass screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-glass-preview
          path: |
            /tmp/ci-glass-preview
            /tmp/ci-glass-report.json
            /tmp/glass-route-report.json
            /tmp/utility-action-report.json
            /tmp/pull-refresh-report.json
          if-no-files-found: warn
          retention-days: 14
