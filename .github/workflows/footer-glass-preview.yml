name: Edge Glass Footer Preview

on:
  push:
    branches: [ui-edge-glass-footers]
    paths:
      - "site/footer-route-guard.css"
      - "site/footer-route-guard.js"
      - "site/fnb-share-ui.js"
      - "site/fnb-layout-stability.css"
      - "site/index.html"
      - ".github/workflows/footer-glass-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-glass-footer-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate centralized footer authority and stable F&B actions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < site/footer-route-guard.js
          node --input-type=module --check < site/fnb-share-ui.js
          grep -q -- '--sm-footer-glass-bg:' site/footer-route-guard.css
          grep -q -- '--sm-footer-glass-filter:blur(26px)' site/footer-route-guard.css
          grep -q -- '--sm-footer-height:54px' site/footer-route-guard.css
          grep -q -- '--sm-footer-item-height:42px' site/footer-route-guard.css
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' site/footer-route-guard.css
          grep -q '#app-footer .nav-chip,' site/footer-route-guard.css
          grep -q 'body\[data-route="fnb"\] .fnb-section-rail .fnb-chip{' site/footer-route-guard.css
          grep -q -- '--sm-footer-gap:6px' site/footer-route-guard.css
          grep -q 'rgba(229,236,190,.07)' site/footer-route-guard.css
          grep -q "route:'account',label:'Settings',href:'/account'" site/footer-route-guard.js
          grep -q "const ACCOUNT_PATH='/account'" site/auth-shell.js
          grep -q 'fnb-card-folder' site/fnb-share-ui.js
          grep -q 'Artwork folder' site/fnb-share-ui.js
          grep -q 'padding-bottom:62px' site/fnb-layout-stability.css
          grep -q 'position:absolute!important' site/fnb-layout-stability.css
          grep -q '/footer-route-guard.css?v=8' site/index.html
          grep -q '/fnb-layout-stability.css?v=1' site/index.html
          grep -q '/footer-route-guard.js?v=7' site/index.html
          grep -q '/fnb-share-ui.js?v=3' site/index.html

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl -fsS "$BASE_URL/" | grep -q '/footer-route-guard.css?v=8'
          curl -fsS "$BASE_URL/" | grep -q '/fnb-layout-stability.css?v=1'
          curl -fsS "$BASE_URL/footer-route-guard.css?v=8" | grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))'
          curl -fsS "$BASE_URL/footer-route-guard.js?v=7" | grep -q "label:'Settings',href:'/account'"
          curl -fsS "$BASE_URL/fnb-share-ui.js?v=3" | grep -q 'fnb-card-folder'
          curl -fsS "$BASE_URL/fnb-layout-stability.css?v=1" | grep -q 'padding-bottom:62px'
