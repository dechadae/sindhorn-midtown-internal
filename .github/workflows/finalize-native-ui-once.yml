name: Finalize native app UI
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/finalize-native-ui-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix mobile atmosphere geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/environment.css')
          s=p.read_text()
          s=s.replace('height:100svh;overflow:hidden;background:', 'height:100dvh;min-height:100dvh;overflow:hidden;transform:translateZ(0);background:', 1)
          s=s.replace('.environment-stage{height:100svh}', '.environment-stage{height:100dvh;min-height:100dvh}')
          p.write_text(s)

          p=Path('site/environment.js')
          s=p.read_text()
          s=s.replace('vec2 uv=vUv;\n      float daylight=', 'vec2 uv=vUv;\n      float aspect=clamp(uResolution.x/max(uResolution.y,1.0),.50,2.20);\n      vec2 fieldUv=vec2(uv.x*aspect,uv.y);\n      float daylight=', 1)
          s=s.replace('float cloudNoise=fbm(uv*vec2(3.2,2.1)+wind+vec2(0.,uTime*.002));', 'float cloudNoise=fbm(fieldUv*vec2(3.2,2.1)+wind+vec2(0.,uTime*.002));', 1)
          s=s.replace('vec2 ruv=uv*vec2(58.0,22.0);', 'vec2 ruv=fieldUv*vec2(44.0,22.0);', 1)
          s=s.replace('float vignette=smoothstep(1.08,.28,distance(uv,vec2(.5,.48)));', 'vec2 vignetteDelta=uv-vec2(.5,.48);\n      vignetteDelta.x*=aspect;\n      float vignette=smoothstep(1.08,.28,length(vignetteDelta));', 1)
          p.write_text(s)
          PY
      - name: Build dark-gradient branded app icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import math

          root=Path('site')
          logo=Image.open(root/'assets/brand/sindhorn-midtown-vignette-white.png').convert('RGBA')

          def gradient_icon(size, logo_fraction):
              im=Image.new('RGBA',(size,size),(20,16,29,255))
              px=im.load()
              top=(24,25,39); bottom=(64,42,61)
              for y in range(size):
                  t=y/(size-1)
                  r=int(top[0]*(1-t)+bottom[0]*t)
                  g=int(top[1]*(1-t)+bottom[1]*t)
                  b=int(top[2]*(1-t)+bottom[2]*t)
                  for x in range(size): px[x,y]=(r,g,b,255)
              glow=Image.new('RGBA',(size,size),(0,0,0,0))
              gd=ImageDraw.Draw(glow)
              radius=int(size*.72)
              cx=int(size*.50); cy=int(size*.34)
              for i in range(12,0,-1):
                  rr=int(radius*i/12)
                  alpha=int(7*(13-i))
                  gd.ellipse((cx-rr,cy-rr,cx+rr,cy+rr),fill=(80,122,160,min(alpha,34)))
              glow=glow.filter(ImageFilter.GaussianBlur(size*.075))
              im=Image.alpha_composite(im,glow)
              maxw=int(size*logo_fraction)
              scale=maxw/logo.width
              lh=max(1,int(logo.height*scale))
              mark=logo.resize((maxw,lh),Image.Resampling.LANCZOS)
              im.alpha_composite(mark,((size-maxw)//2,(size-lh)//2))
              return im.convert('RGB')

          icons=root/'icons'; icons.mkdir(exist_ok=True)
          gradient_icon(512,.68).save(icons/'app-512.png',optimize=True)
          gradient_icon(192,.68).save(icons/'app-192.png',optimize=True)
          gradient_icon(180,.66).save(icons/'apple-touch-icon.png',optimize=True)
          gradient_icon(512,.56).save(icons/'maskable-512.png',optimize=True)
          PY
      - name: Update manifest and service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/manifest.webmanifest')
          s=p.read_text().replace('"name":"Sindhorn Midtown Internal"','"name":"Sindhorn Midtown Air Quality"')
          p.write_text(s)
          p=Path('site/sw.js')
          s=p.read_text().replace("sindhorn-midtown-internal-pwa-v4","sindhorn-midtown-internal-pwa-v5")
          s=s.replace(",\n  '/vendor/three.module.js'","")
          p.write_text(s)
          PY
      - name: Rebuild realtime environment bundle
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js
      - name: Verify final shell
        run: |
          grep -q '100dvh' site/environment.css
          grep -q 'fieldUv' site/environment.js
          grep -q 'fieldUv' site/environment.bundle.js
          grep -q 'pwa-v5' site/sw.js
          grep -q 'Sindhorn Midtown Air Quality' site/manifest.webmanifest
          test -s site/icons/app-192.png
          test -s site/icons/app-512.png
          test -s site/icons/maskable-512.png
          test -s site/icons/apple-touch-icon.png
      - name: Commit final app shell and remove helper
        run: |
          rm -f .github/workflows/finalize-native-ui-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site .github/workflows/finalize-native-ui-once.yml
          git commit -m "Polish native app chrome and mobile atmosphere"
          git push origin HEAD:webgl-environment-v1
