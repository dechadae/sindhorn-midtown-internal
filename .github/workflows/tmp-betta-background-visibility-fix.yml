name: Temporary Betta Background Visibility Fix

on:
  push:
    branches: [betta-reference-rebuild]
    paths:
      - '.github/workflows/tmp-betta-background-visibility-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: betta-reference-rebuild
      - name: Patch background shader and gradient stops
        run: |
          python3 - <<'PY'
          from pathlib import Path

          env = Path('site/betta-environment.js')
          s = env.read_text()
          old = """  float vignette=1.0-.22*smoothstep(.38,.92,length((p-.5)*vec2(.92,1.08)));\n  gl_FragColor=vec4(bg*vignette,1.0);\n}"""
          new = """  float vignette=1.0-.16*smoothstep(.38,.92,length((p-.5)*vec2(.92,1.08)));\n  gl_FragColor=vec4(bg*vignette,1.0);\n  #include <colorspace_fragment>\n}"""
          if old not in s:
              raise SystemExit('background shader target not found')
          env.write_text(s.replace(old, new, 1))

          presets = Path('site/betta-fin-presets.js')
          p = presets.read_text()
          replacements = {
              "backgroundGradient:['#010207','#061126','#1a0807']": "backgroundGradient:['#070b18','#102746','#351713']",
              "backgroundGradient:['#020102','#150204','#260706']": "backgroundGradient:['#120508','#36090d','#521611']",
              "backgroundGradient:['#030104','#170612','#2a0b10']": "backgroundGradient:['#100712','#3a1026','#511c20']",
              "backgroundGradient:['#020407','#07131b','#1e090b']": "backgroundGradient:['#08111b','#183647','#45221f']",
              "backgroundGradient:['#010304','#071319','#1b1205']": "backgroundGradient:['#071017','#163847','#46310e']",
              "backgroundGradient:['#030104','#180715','#251605']": "backgroundGradient:['#100713','#3d132b','#553715']",
              "backgroundGradient:['#010304','#07141a','#180c10']": "backgroundGradient:['#071116','#193946','#3c242c']",
              "backgroundGradient:['#010208','#050e22','#0b1635']": "backgroundGradient:['#050b1c','#0c285a','#143472']",
          }
          for old_stop, new_stop in replacements.items():
              if old_stop not in p:
                  raise SystemExit(f'gradient target not found: {old_stop}')
              p = p.replace(old_stop, new_stop, 1)
          presets.write_text(p)
          PY
      - name: Syntax check
        run: |
          node --input-type=module --check < site/betta-environment.js
          node --input-type=module --check < site/betta-fin-presets.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/betta-environment.js site/betta-fin-presets.js
          git commit -m "Make Betta gradient backgrounds visibly colored"
          git push origin HEAD:betta-reference-rebuild
