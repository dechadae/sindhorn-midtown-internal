name: Broken Rebuild Branch Warning

on:
  push:
    branches: [clean-ui-rebuild-preview]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: clean-ui-rebuild-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify branch is explicitly broken
        shell: bash
        run: |
          set -euo pipefail
          test -f BROKEN_BRANCH.md
          grep -q 'BROKEN — DO NOT USE' BROKEN_BRANCH.md
          grep -q 'BROKEN — DO NOT USE' site/index.html
      - name: Deploy broken-branch warning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Verify warning is live
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/" -o /tmp/index.html
          grep -q 'BROKEN — DO NOT USE' /tmp/index.html
