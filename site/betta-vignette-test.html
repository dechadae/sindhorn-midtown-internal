<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Betta Camera Editor</title>
  <link rel="stylesheet" href="/fonts.css?v=1">
  <style>
    :root{color-scheme:dark;font-family:var(--font-ui)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030509;color:#f6f4ef}body{min-height:100dvh}
    #environmentStage{position:fixed;inset:0;display:block;background:#030509}#environmentCanvas{display:block;width:100%;height:100%}
    .topbar{position:fixed;z-index:6;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none}.badge{display:inline-flex;align-items:center;max-width:100%;padding:8px 11px;border-radius:999px;font-size:11px;color:rgba(246,244,239,.72);white-space:nowrap;background:rgba(6,8,13,.56);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(0,0,0,.24)}
    .review{position:fixed;z-index:5;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(8,10,15,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 46px rgba(0,0,0,.32);max-height:calc(100dvh - 92px);overflow:auto;scrollbar-width:none}.review::-webkit-scrollbar{display:none}.review-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}.review-kicker{margin:0 0 3px;font-size:11px;text-transform:uppercase;color:rgba(246,244,239,.58)}.review-title{margin:0;font-size:18px;font-weight:400}.review-sub{margin:4px 0 0;max-width:660px;font-size:10px;line-height:1.4;color:rgba(246,244,239,.5)}.review-state{text-align:right;font-size:11px;line-height:1.4;color:rgba(246,244,239,.68);white-space:nowrap}
    .periods{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.periods::-webkit-scrollbar{display:none}button{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:#f6f4ef;border-radius:999px;padding:9px 12px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease}button:active{transform:scale(.97)}button span{display:block}button small,button em{display:block;margin-top:2px;font-size:9px;font-weight:400;color:rgba(246,244,239,.5);font-style:normal}button em{color:rgba(246,244,239,.35)}button.is-active{background:rgba(184,201,255,.16);border-color:rgba(184,201,255,.4);color:#dbe3ff}.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:9px}.actions button{min-width:0;border-radius:12px;padding-inline:8px}.primary{background:rgba(184,201,255,.13);border-color:rgba(184,201,255,.3)}
    .camera{display:none;margin-top:10px;padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(0,0,0,.18)}.camera.is-open{display:block}.camera-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.camera-title{font-size:12px}.camera-status{font-size:9px;color:rgba(246,244,239,.5);text-align:right}.camera-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}.field{min-width:0}.field-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:9px;color:rgba(246,244,239,.58)}.field output{font-variant-numeric:tabular-nums;color:rgba(246,244,239,.9)}input[type=range]{appearance:none;width:100%;height:24px;margin:0;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:rgba(255,255,255,.16)}input[type=range]::-webkit-slider-thumb{appearance:none;width:17px;height:17px;margin-top:-7px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:#cbd5f6;box-shadow:0 2px 8px rgba(0,0,0,.4)}input[type=range]::-moz-range-track{height:3px;border-radius:999px;background:rgba(255,255,255,.16)}input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:#cbd5f6}.camera-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.camera-actions button{border-radius:11px;padding:9px 6px;font-size:10px}.save{background:rgba(172,212,181,.14);border-color:rgba(172,212,181,.32)}.copy{background:rgba(225,193,137,.12);border-color:rgba(225,193,137,.28)}
    .topbar,.review{transition:opacity .18s ease,visibility .18s ease}.ui-hidden .topbar,.ui-hidden .review{opacity:0;visibility:hidden;pointer-events:none}.ui-hidden #environmentStage{cursor:pointer}
    @media(max-width:620px){.review-head{align-items:flex-start}.review-state{font-size:10px}.review-sub{display:none}.actions{gap:6px}.actions button{font-size:9px;padding:9px 3px}.camera-grid{grid-template-columns:1fr 1fr}.camera-actions{grid-template-columns:1fr 1fr}.camera.is-open~*{}body.camera-open .review{max-height:74dvh}}
    @media(min-width:800px){.topbar{left:50%;right:auto;width:min(980px,calc(100% - 32px));transform:translateX(-50%)}.review{left:50%;right:auto;width:min(980px,calc(100% - 32px));transform:translateX(-50%);bottom:18px;padding:14px}.review-title{font-size:20px}.camera-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div id="environmentStage" aria-hidden="true"><canvas id="environmentCanvas"></canvas></div>
  <div class="topbar"><div class="badge">Betta final engine · camera editor + device tilt · Himawari live</div></div>
  <section class="review" aria-label="Betta fine-tune controls">
    <div class="review-head"><div><p class="review-kicker">Fin + tail composition</p><h1 class="review-title" data-title>Betta Camera Editor</h1><p class="review-sub" data-description>Loading fine-tune renderer…</p></div><div class="review-state"><div data-clock>—</div><div data-state>Loading…</div></div></div>
    <div class="periods" data-periods></div>
    <div class="actions"><button class="primary" type="button" data-live>Live</button><button type="button" data-preview>24h</button><button type="button" data-tilt>Tilt</button><button type="button" data-camera>Camera</button><button type="button" data-hide-ui>Hide UI</button></div>
    <div class="camera" data-camera-panel>
      <div class="camera-head"><div class="camera-title" data-camera-title>Camera · —</div><div class="camera-status" data-camera-status>Adjust, then Preview Position</div></div>
      <div class="camera-grid" data-camera-grid></div>
      <div class="camera-actions"><button class="primary" type="button" data-apply>Preview Position</button><button class="save" type="button" data-save>Save Location</button><button type="button" data-reset>Reset</button><button class="copy" type="button" data-copy>Copy All 8</button></div>
    </div>
  </section>
  <script>
    (()=>{
      const hideButton=document.querySelector('[data-hide-ui]');
      const stage=document.getElementById('environmentStage');
      const hideUI=()=>{document.body.classList.add('ui-hidden');document.body.dataset.uiHidden='true'};
      const showUI=()=>{document.body.classList.remove('ui-hidden');document.body.dataset.uiHidden='false'};
      hideButton?.addEventListener('click',hideUI);
      stage?.addEventListener('pointerup',event=>{if(!document.body.classList.contains('ui-hidden'))return;event.preventDefault();showUI()});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')showUI()});
    })();
  </script>
  <script type="module" src="./betta-vignette-test.js?v=camera-editor-1"></script>
</body></html>
