name: Preview Lunar Phase Fix

on:
  push:
    branches:
      - fix-lunar-phase-render
    paths:
      - "site/**"
      - ".github/workflows/moon-phase-preview.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: lunar-phase-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate lunar phase shell
        shell: bash
        run: |
          set -euo pipefail
          node --check site/moon-phase.js
          node --check site/sw.js
          grep -q '/moon-phase.js?v=1' site/index.html
          grep -q "'/moon-phase.js'" site/sw.js
          grep -q 'atmosphere6-capture2-moon1' site/sw.js
          grep -q 'phaseTexture' site/moon-phase.js
          grep -q 'craterShade' site/moon-phase.js
          grep -q 'uMoonPhase' site/environment.js
          grep -q 'drawDayMoonRepair' site/storm-effects.js

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test lunar phase preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://fix-lunar-phase-render.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/" -o /tmp/root
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/moon-phase.js" -o /tmp/moon
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/sw.js" -o /tmp/sw
          grep -q '/moon-phase.js?v=1' /tmp/root
          grep -q 'phaseTexture' /tmp/moon
          grep -q 'craterShade' /tmp/moon
          grep -q 'atmosphere6-capture2-moon1' /tmp/sw
          grep -q "'/moon-phase.js'" /tmp/sw
