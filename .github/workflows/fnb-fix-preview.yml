name: F&B Detail Sync Fix Preview

on:
  push:
    branches: [fix-fnb-share-detail-sync]
    paths:
      - "site/**"
      - "scripts/generate-fnb-share.mjs"
      - "scripts/fnb-browser-smoke.mjs"
      - ".github/tests/fnb-sharing-regression.test.mjs"
      - ".github/workflows/fnb-fix-preview.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-detail-sync-fix-preview
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate F&B fix
        shell: bash
        run: |
          set -euo pipefail
          for file in site/fnb.js site/fnb-data.js site/fnb-share-ui.js site/fnb-artwork-sync.js scripts/generate-fnb-share.mjs scripts/fnb-browser-smoke.mjs; do
            node --input-type=module --check < "$file"
          done
          PUBLIC_ORIGIN="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev" node scripts/generate-fnb-share.mjs | tee /tmp/fnb-share-report.json
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/fnb-share-report.json','utf8').trim().split('\n').at(-1));
          if(r.promotions!==18||r.activations!==21||r.artworks!==61||r.artworkLinks!==4)throw new Error(`F&B count mismatch: ${JSON.stringify(r)}`);
          NODE
          node --input-type=module --check < site/share/fnb-runtime.js
          node --input-type=module --check < site/share/fnb-public-shell.js
          node .github/tests/fnb-sharing-regression.test.mjs

      - name: Create single-shell browser harness
        shell: bash
        run: |
          cat > site/__fnb-footer-smoke.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/footer-route-guard.css?v=2"></head><body><main id="route-view"><p>Before F&amp;B</p></main><footer id="app-footer"></footer><script>window.__SINDHORN_AUTH_PROFILE__={employee_number:'10639',display_name:'Smoke Test'};</script><script type="module" src="/fnb-share-ui.js"></script><script type="module" src="/footer-route-guard.js?v=5"></script></body></html>
          HTML

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Browser smoke
        env:
          BASE_URL: https://fix-fnb-share-detail-sync.sindhorn-midtown-internal.pages.dev
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          sleep 8
          node scripts/fnb-browser-smoke.mjs
