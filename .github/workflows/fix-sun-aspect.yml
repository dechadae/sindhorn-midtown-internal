name: Fix WebGL sun aspect ratio

on:
  push:
    branches:
      - webgl-environment-v1
    paths:
      - ".github/workflows/fix-sun-aspect.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Correct sun distance for viewport aspect ratio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/environment.js')
          s = p.read_text()
          old = """      float sunDist=distance(uv,uSun);\n      float sunDisc=1.0-smoothstep(sunRadius,sunRadius+.006,sunDist);\n      float sunGlow=exp(-sunDist*mix(38.0,13.0,pollution));"""
          new = """      // Measure the sun in aspect-correct screen space so it stays circular\n      // on phones, desktop windows, and ultrawide viewports. Radius is expressed\n      // relative to viewport height; horizontal UV distance is corrected by W/H.\n      vec2 sunDelta=uv-uSun;\n      sunDelta.x*=uResolution.x/max(uResolution.y,1.0);\n      float sunDist=length(sunDelta);\n      float sunDisc=1.0-smoothstep(sunRadius,sunRadius+.006,sunDist);\n      float sunGlow=exp(-sunDist*mix(38.0,13.0,pollution));"""
          if old not in s:
              raise SystemExit('Expected sun-distance block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify correction
        run: |
          grep -Fq "sunDelta.x*=uResolution.x/max(uResolution.y,1.0);" site/environment.js
          grep -Fq "float sunDist=length(sunDelta);" site/environment.js
          ! grep -Fq "float sunDist=distance(uv,uSun);" site/environment.js

      - name: Commit correction and remove helper
        run: |
          git rm .github/workflows/fix-sun-aspect.yml
          git add site/environment.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep WebGL sun circular at every aspect ratio"
          git push
