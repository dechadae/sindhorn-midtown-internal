name: Temporary Android Betta performance audit

on:
  push:
    branches:
      - android-betta-wallpaper
    paths:
      - "android-betta-wallpaper/tools/apply_performance_audit.py"
      - ".github/workflows/tmp-android-betta-performance-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-betta-wallpaper

      - name: Apply performance audit patch
        run: python3 android-betta-wallpaper/tools/apply_performance_audit.py

      - name: Commit performance audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-betta-wallpaper .github/workflows/android-betta-wallpaper.yml
          git commit -m "Optimize Android Betta frame pacing and CPU overhead"
          git push origin HEAD:android-betta-wallpaper
