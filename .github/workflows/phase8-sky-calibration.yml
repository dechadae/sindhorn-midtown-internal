name: Phase 8 Sky Calibration

on:
  push:
    branches:
      - phase8-directional-sky-calibration
      - main
    paths:
      - "sky-worker/**"
      - "site/sky-calibration.js"
      - "site/sky-color-renderer.js"
      - "site/index.html"
      - "site/app.js"
      - "site/sw.js"
      - ".github/workflows/phase8-sky-calibration.yml"
      - "docs/LIVE-BANGKOK-SKY-CALIBRATION-ARCHITECTURE-OVERRIDE-20260827.md"
      - "docs/PHASE8-DIRECTIONAL-LIVE-BANGKOK-SKY-CALIBRATION-20260827.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-phase8-sky-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PREVIEW_WORKER_URL: https://sindhorn-midtown-sky-preview.decha-dae.workers.dev
  PRODUCTION_WORKER_URL: https://sindhorn-midtown-sky.decha-dae.workers.dev
  PREVIEW_ORIGIN: https://phase8-directional-sky-calib.sindhorn-midtown-internal.pages.dev
  PRODUCTION_ORIGIN: https://sindhorn-midtown-internal.pages.dev

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate directional fusion source
        shell: bash
        run: |
          set -euo pipefail
          node --check sky-worker/src/cameras.js
          node --check sky-worker/src/calibration.js
          node --check sky-worker/src/index.js
          node sky-worker/test.mjs
          grep -q "@cf/qwen/qwen3.8-27b" sky-worker/src/index.js
          grep -q "response_format" sky-worker/src/index.js
          grep -q "sunrise-east" sky-worker/src/calibration.js
          grep -q "sunset-west" sky-worker/src/calibration.js
          grep -q "facing:'east'" sky-worker/src/cameras.js
          grep -q "facing:'west'" sky-worker/src/cameras.js
          grep -q '"binding": "AI"' sky-worker/wrangler.jsonc
          grep -q '"binding": "DB"' sky-worker/wrangler.jsonc
          grep -q '"STATE_PREFIX": "prod"' sky-worker/wrangler.jsonc
          grep -q '"STATE_PREFIX": "preview"' sky-worker/wrangler.preview.jsonc

      - name: Validate PWA calibration client
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sky-calibration.js
          node --check site/sky-color-renderer.js
          node --check site/app.js
          node --check site/sw.js
          grep -q '/sky-calibration.js?v=1' site/index.html
          grep -q '/sky-color-renderer.js?v=1' site/index.html
          grep -q "SindhornSkyCalibration" site/sky-calibration.js
          grep -q "SindhornSkyColorRenderer" site/sky-color-renderer.js
          grep -q 'zenithRgb' site/sky-color-renderer.js
          grep -q 'horizonRgb' site/sky-color-renderer.js
          grep -q 'compositeExport' site/sky-color-renderer.js
          grep -q "SindhornSkyCalibration?.refresh" site/app.js
          grep -q "'/sky-calibration.js'" site/sw.js
          grep -q "'/sky-color-renderer.js'" site/sw.js
          grep -q 'live-sky-color-calibration' site/sw.js
          grep -q "addEventListener('push'" site/sw.js
          grep -q "addEventListener('notificationclick'" site/sw.js

      - name: Validate Worker bundles
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --dry-run --config sky-worker/wrangler.jsonc --outdir /tmp/phase8-prod-worker
          npx --yes wrangler@4.125.0 deploy --dry-run --config sky-worker/wrangler.preview.jsonc --outdir /tmp/phase8-preview-worker

      - name: Deploy preview sky Worker
        if: github.ref_name != 'main'
        run: npx --yes wrangler@4.125.0 deploy --config sky-worker/wrangler.preview.jsonc

      - name: Probe live directional sources
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "${PREVIEW_WORKER_URL}/health" -o /tmp/sky-health.json
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "${PREVIEW_WORKER_URL}/probe" -o /tmp/sky-probe.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/sky-health.json'))
          probe=json.load(open('/tmp/sky-probe.json'))
          assert health.get('ok') is True
          assert health.get('service')=='sindhorn-midtown-sky'
          assert health.get('aiConfigured') is True
          assert health.get('cameraCount',0)>=2
          probes=probe.get('probes') or []
          assert probes and any(p.get('ok') for p in probes), probe
          assert probe.get('mode') in {'sunrise-east','sunset-west','day-consensus','twilight','night'}
          PY

      - name: Run one preview sky evaluation
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 150 --retry 2 --retry-all-errors --retry-delay 3 \
            -H "Origin: ${PREVIEW_ORIGIN}" \
            "${PREVIEW_WORKER_URL}/evaluate" -o /tmp/sky-evaluate.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/sky-evaluate.json'))
          assert 'error' not in data, data
          status=data.get('status') or {}
          calibration=data.get('calibration') or {}
          assert status.get('mode') in {'sunrise-east','sunset-west','day-consensus','twilight','night'}
          assert isinstance(status.get('analyzed'),list) and status['analyzed']
          assert calibration.get('schema')==1
          assert 0 <= float(calibration.get('confidence',0)) <= 1
          sources=calibration.get('sources') or []
          if calibration.get('mode')=='sunrise-east' and sources:
              east=sum(float(s.get('weight',0)) for s in sources if s.get('facing')=='east')
              west=sum(float(s.get('weight',0)) for s in sources if s.get('facing')=='west')
              assert east >= west
          if calibration.get('mode')=='sunset-west' and sources:
              west=sum(float(s.get('weight',0)) for s in sources if s.get('facing')=='west')
              east=sum(float(s.get('weight',0)) for s in sources if s.get('facing')=='east')
              assert west >= east
          PY

      - name: Verify preview calibration endpoint
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Origin: ${PREVIEW_ORIGIN}" "${PREVIEW_WORKER_URL}/calibration" -D /tmp/sky-headers -o /tmp/sky-calibration.json
          grep -qi "access-control-allow-origin: ${PREVIEW_ORIGIN}" /tmp/sky-headers
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/sky-calibration.json'))
          assert data.get('schema')==1
          assert 0 <= float(data.get('confidence',0)) <= 1
          assert 'sources' in data and 'mode' in data
          PY

      - name: Deploy Phase 8 Pages preview
        if: github.ref_name != 'main'
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test Phase 8 Pages preview
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for path in / /sky-calibration.js /sky-color-renderer.js /app.js /sw.js /environment.js /location.js /push-client.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${PREVIEW_ORIGIN}${path}" -o "/tmp/phase8$(echo "$path" | tr '/.' '__')"
          done
          grep -q '/sky-calibration.js?v=1' /tmp/phase8_
          grep -q '/sky-color-renderer.js?v=1' /tmp/phase8_
          grep -q 'sindhorn-midtown-sky-preview' /tmp/phase8_sky-calibration_js
          grep -q 'SindhornSkyCalibration' /tmp/phase8_sky-calibration_js
          grep -q 'SindhornSkyColorRenderer' /tmp/phase8_sky-color-renderer_js
          grep -q 'compositeExport' /tmp/phase8_sky-color-renderer_js
          grep -q 'SindhornSkyCalibration?.refresh' /tmp/phase8_app_js
          grep -q 'live-sky-color-calibration' /tmp/phase8_sw_js
          grep -q "'/sky-calibration.js'" /tmp/phase8_sw_js
          grep -q "'/sky-color-renderer.js'" /tmp/phase8_sw_js
          grep -q "addEventListener('push'" /tmp/phase8_sw_js
          grep -q 'Current location' /tmp/phase8_location_js

      - name: Deploy production sky Worker
        if: github.ref_name == 'main'
        run: npx --yes wrangler@4.125.0 deploy --config sky-worker/wrangler.jsonc

      - name: Verify production sky Worker
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${PRODUCTION_WORKER_URL}/health" -o /tmp/sky-health.json
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${PRODUCTION_WORKER_URL}/calibration" -o /tmp/sky-calibration.json
          python3 - <<'PY'
          import json
          health=json.load(open('/tmp/sky-health.json'))
          calibration=json.load(open('/tmp/sky-calibration.json'))
          assert health.get('ok') is True
          assert health.get('service')=='sindhorn-midtown-sky'
          assert health.get('aiConfigured') is True
          assert calibration.get('schema')==1
          PY

      - name: Verify production PWA promotion
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/" -o /tmp/prod-root \
              && curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/sky-calibration.js" -o /tmp/prod-sky \
              && curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/sky-color-renderer.js" -o /tmp/prod-color \
              && curl --fail --silent --show-error --location "${PRODUCTION_ORIGIN}/sw.js" -o /tmp/prod-sw \
              && grep -q '/sky-calibration.js?v=1' /tmp/prod-root \
              && grep -q '/sky-color-renderer.js?v=1' /tmp/prod-root \
              && grep -q 'sindhorn-midtown-sky.decha-dae.workers.dev' /tmp/prod-sky \
              && grep -q 'SindhornSkyColorRenderer' /tmp/prod-color \
              && grep -q 'live-sky-color-calibration' /tmp/prod-sw; then
              exit 0
            fi
            sleep 3
          done
          echo 'Phase 8 production PWA did not promote within the verification window' >&2
          exit 1
