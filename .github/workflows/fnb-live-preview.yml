name: F&B Live Route Preview

on:
  push:
    branches:
      - fnb-live-integration
      - fnb-cache-hotfix
      - fix-fnb-footer-route
      - fix-fnb-chip-anchor
      - fix-fnb-direct-footer-v4
    paths:
      - "site/index.html"
      - "site/app-transitions.js"
      - "site/pwa-version-guard.js"
      - "site/footer-route-guard.js"
      - "site/footer-route-guard.css"
      - "site/fnb.js"
      - "site/fnb-data.js"
      - "site/fnb.css"
      - "site/sw.js"
      - ".github/workflows/fnb-live-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-live-route-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Validate in-shell F&B module
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app-transitions.js
          node --check site/pwa-version-guard.js
          node --check site/footer-route-guard.js
          node --check site/fnb.js
          node --check site/fnb-data.js
          node --check site/sw.js
          node --input-type=module - <<'NODE'
          import {FNB_PROMOTIONS} from './site/fnb-data.js';
          if(FNB_PROMOTIONS.length!==8) throw new Error(`expected 8 promotions, got ${FNB_PROMOTIONS.length}`);
          const artworks=FNB_PROMOTIONS.reduce((sum,c)=>sum+c.activations.reduce((s,a)=>s+a.artworks.length,0),0);
          if(artworks!==29) throw new Error(`expected 29 artworks, got ${artworks}`);
          const outlets=new Set(FNB_PROMOTIONS.flatMap(c=>c.activations.map(a=>a.outlet)));
          if(outlets.size!==5) throw new Error(`expected 5 outlets, got ${outlets.size}`);
          NODE
          grep -q -- "--fnb-chip-h:44px" site/fnb.css
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))" site/fnb.css
          grep -q "background:transparent" site/fnb.css
          grep -q "mountFnbRoute" site/fnb.js
          ! grep -q "Intentionally empty shell route" site/fnb.js
          grep -q "employee_number||''.*10639" site/fnb.js
          grep -q '/pwa-version-guard.js?v=1' site/index.html
          grep -q '/footer-route-guard.js?v=4' site/index.html
          grep -q '/footer-route-guard.css?v=2' site/index.html
          grep -q "sindhorn-footer-v4-fnb-direct" site/footer-route-guard.js
          grep -q "data.fnbNav\|dataset.fnbNav" site/footer-route-guard.js
          grep -q "FNB_MODULE_URL='/fnb.js?v=4'" site/footer-route-guard.js
          grep -q "module.mountFnbRoute" site/footer-route-guard.js
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))!important" site/footer-route-guard.css
          grep -q "height:44px!important" site/footer-route-guard.css
          grep -q "pwa-v28-footer-fnb-route-repair" site/sw.js
          grep -q "'/footer-route-guard.js'" site/sw.js
          grep -q "'/fnb-data.js'" site/sw.js
          grep -q "'/fnb.css'" site/sw.js
          ! grep -q "<header class=\"appbar\"" site/fnb.js

      - name: Create browser-only F&B click harness
        shell: bash
        run: |
          cat > site/__fnb-footer-smoke.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/footer-route-guard.css?v=2"></head><body><main id="route-view"><p id="before">Before F&amp;B</p></main><footer id="app-footer"></footer><script>window.__SINDHORN_AUTH_PROFILE__={employee_number:'10639',display_name:'Smoke Test'};</script><script type="module" src="/footer-route-guard.js?v=4"></script></body></html>
          HTML

      - name: Deploy branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test shell route and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb" -o /tmp/fnb-shell.html
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb.js?v=4" -o /tmp/fnb.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb-data.js" -o /tmp/fnb-data.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb.css" -o /tmp/fnb.css
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/footer-route-guard.js?v=4" -o /tmp/footer-route-guard.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/footer-route-guard.css" -o /tmp/footer-route-guard.css
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/__fnb-footer-smoke.html" -o /tmp/fnb-footer-smoke.html
          grep -q 'id="environmentStage"' /tmp/fnb-shell.html
          grep -q 'id="route-view"' /tmp/fnb-shell.html
          grep -q '/footer-route-guard.js?v=4' /tmp/fnb-shell.html
          grep -q 'mountFnbRoute' /tmp/fnb.js
          grep -q 'FNB_PROMOTIONS' /tmp/fnb-data.js
          grep -q -- '--fnb-chip-h:44px' /tmp/fnb.css
          grep -q 'background:transparent' /tmp/fnb.css
          grep -q 'sindhorn-footer-v4-fnb-direct' /tmp/footer-route-guard.js
          grep -q "FNB_MODULE_URL='/fnb.js?v=4'" /tmp/footer-route-guard.js
          grep -q 'height:44px!important' /tmp/footer-route-guard.css
          grep -q 'footer-route-guard.js?v=4' /tmp/fnb-footer-smoke.html

      - name: Browser-click F&B footer control
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node --input-type=module - <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          await page.goto(`${process.env.BASE_URL}/__fnb-footer-smoke.html`,{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForSelector('[data-fnb-nav="fnb"]',{timeout:10000});
          const direct=await page.evaluate(async()=>{
            try{await window.SindhornFooterGuard.openFnb();return{ok:true,path:location.pathname,html:document.querySelector('#route-view')?.innerHTML?.slice(0,250)}}catch(error){return{ok:false,name:error?.name,message:error?.message,stack:error?.stack}}
          });
          console.log('direct-open',JSON.stringify(direct));
          console.log('browser-errors',JSON.stringify(errors));
          if(!direct.ok)throw new Error(`Direct F&B mount failed: ${direct.name}: ${direct.message}`);
          const state=await page.evaluate(()=>({path:location.pathname,title:document.querySelector('.fnb-hero h1')?.textContent?.trim(),cards:document.querySelectorAll('.fnb-card').length,footer:Array.from(document.querySelectorAll('#app-footer .nav-chip')).map(x=>x.textContent.trim())}));
          await browser.close();
          if(errors.length)throw new Error(errors.join('\n'));
          if(state.path!=='/fnb')throw new Error(`F&B path did not change: ${state.path}`);
          if(state.title!=='Promotions')throw new Error(`F&B title missing: ${state.title}`);
          if(state.cards!==8)throw new Error(`Expected 8 promotion cards, got ${state.cards}`);
          if(state.footer.join('|')!=='Today|F&B|Messages')throw new Error(`Footer mismatch: ${state.footer.join('|')}`);
          console.log(JSON.stringify(state));
          NODE
