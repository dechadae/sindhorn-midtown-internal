name: Phase 8 Sky Calibration · Research Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-research-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify preserved camera research source only
        shell: bash
        run: |
          set -euo pipefail
          node --check sky-worker/src/cameras.js
          node --check sky-worker/src/calibration.js
          node --check sky-worker/src/index.js
          node sky-worker/test.mjs
          echo "Production rendering no longer consumes this research path."
