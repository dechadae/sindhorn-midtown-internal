name: F&B Workbook Refresh Preview

on:
  push:
    branches:
      - fnb-workbook-refresh-sep-dec
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-workbook-refresh-preview
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Validate refreshed F&B dataset
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < site/fnb-data.js
          node --experimental-default-type=module - <<'NODE'
          import {FNB_PROMOTIONS} from './site/fnb-data.js';
          if(FNB_PROMOTIONS.length!==18) throw new Error(`expected 18 promotions, got ${FNB_PROMOTIONS.length}`);
          const expected=[
            'festive-hamper','fathers-day-bangkok78','korean-oyster-indulgence',
            'seoul-festive-collection','bangkok78-doi-kham-royal-sip',
            'chef-new-signature-creations','festive-afternoon-tea','matcha-moments',
            'festive-horizon-cocktail','festive-celebration-set'
          ];
          const ids=new Set(FNB_PROMOTIONS.map(item=>item.id));
          if(ids.size!==FNB_PROMOTIONS.length) throw new Error('duplicate promotion id');
          for(const id of expected) if(!ids.has(id)) throw new Error(`missing ${id}`);
          const artworkIds=[];
          for(const promo of FNB_PROMOTIONS){
            if(!/^2026-\d{2}-\d{2}$/.test(promo.start)||!/^2026-\d{2}-\d{2}$/.test(promo.end)) throw new Error(`bad date ${promo.id}`);
            if(new Date(`${promo.start}T00:00:00Z`)>new Date(`${promo.end}T00:00:00Z`)) throw new Error(`date order ${promo.id}`);
            if(!Array.isArray(promo.activations)||promo.activations.length<1) throw new Error(`no activation ${promo.id}`);
            for(const activation of promo.activations){
              if(!Array.isArray(activation.artworks)) throw new Error(`missing artworks array ${activation.id}`);
              for(const art of activation.artworks) artworkIds.push(art.id);
            }
          }
          if(new Set(artworkIds).size!==artworkIds.length) throw new Error('duplicate artwork id');
          const source=await (await import('node:fs/promises')).readFile('site/fnb-data.js','utf8');
          for(const typo of ['FESTVE HAMPER','Koeran','AUJU Goodies','Prawn and Logan Salad','PEPERMINT TEA','เเละ']){
            if(source.includes(typo)) throw new Error(`uncorrected source typo: ${typo}`);
          }
          console.log(JSON.stringify({promotions:FNB_PROMOTIONS.length,newNovDec:expected.length,artworkTasks:artworkIds.length}));
          NODE

      - name: Create data review page
        shell: bash
        run: |
          cat > site/__fnb-workbook-review.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/fonts.css?v=1"><style>html{background:#2e273b;color:#faf7f5;font-family:"LINE Seed Sans TH",sans-serif;letter-spacing:0}body{margin:0;padding:28px 18px 60px}.wrap{max-width:720px;margin:auto}h1{font-size:36px;font-weight:100;margin:0 0 6px}.sub{opacity:.6;margin:0 0 24px}.grid{display:grid;gap:10px}.card{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff0a}.meta{font-size:11px;opacity:.58;margin-bottom:5px}.title{font-size:19px;font-weight:400}.summary{font-size:13px;opacity:.76;margin-top:6px}.outlet{font-size:12px;color:#e5ecbe;margin-top:9px}</style></head><body><main class="wrap"><h1>F&B workbook refresh</h1><p class="sub" id="count"></p><div class="grid" id="cards"></div></main><script type="module">import{FNB_PROMOTIONS as D}from'/fnb-data.js';count.textContent=`${D.length} promotions · September–December 2026`;cards.innerHTML=D.map(p=>`<article class="card"><div class="meta">${p.dateLabel}</div><div class="title">${p.title}</div><div class="summary">${p.summary}</div><div class="outlet">${p.activations.map(a=>a.outlet).join(' + ')}</div></article>`).join('')</script></body></html>
          HTML

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://fnb-workbook-refresh-sep-de.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /fnb-data.js /__fnb-workbook-review.html /fnb; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/fnb-data.js" -o /tmp/fnb-data.js
          for token in festive-hamper fathers-day-bangkok78 korean-oyster-indulgence seoul-festive-collection bangkok78-doi-kham-royal-sip chef-new-signature-creations festive-afternoon-tea matcha-moments festive-horizon-cocktail festive-celebration-set; do grep -q "$token" /tmp/fnb-data.js; done
          curl --fail --silent --show-error --location "${BASE_URL}/__fnb-workbook-review.html" -o /tmp/review.html
          grep -q 'F&B workbook refresh' /tmp/review.html
