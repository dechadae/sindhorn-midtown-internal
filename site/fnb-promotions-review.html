function render(){let g=global();$('#sum').innerHTML=`<b>${D.length} promotions</b> · ${g[0]} artworks · ${g[1]} complete`;let visible=['ALL','ANJU',"Bangkok'78",'Sip & Co.'];$('#filters').innerHTML=visible.map(o=>`<button class="chip ${filter===o?'on':''}" data-f="${esc(o)}">${esc(o)}</button>`).join('')+`<button class="chip ${!visible.includes(filter)?'on':''}" id="more">${!visible.includes(filter)?esc(filter):'+2'}</button>`;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});$('#more').onclick=more;let list=filter==='ALL'?D:D.filter(c=>c.a.some(a=>a.o===filter));$('#cards').innerHTML=list.map(c=>{let q=count(c),p=q[0]?q[1]/q[0]*100:0;return `<article class="card"><button class="openpromo" data-open="${c.id}"><div class="status"><span class="u">UPCOMING</span><small>${rel(c)}</small></div><h2>${esc(c.title)}</h2><p class="outlet">${esc(outs(c))}</p><p class="date">${esc(c.date)}</p><div class="prog"><div class="progmeta"><span>ARTWORK</span><b>${q[1]} / ${q[0]}</b></div><div class="track"><i style="width:${p}%"></i></div></div><div class="foot"><span>${esc(c.summary)}</span><span>›</span></div></button></article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));$('#qsum').textContent=`${g[0]-g[1]} remaining · ${g[1]} complete · ${g[0]} total`;$('#qlist').innerHTML=list.map(c=>{let q=count(c);return `<article class="qcard"><button class="qbutton"><div><h2 class="qtitle">${esc(c.title)}</h2><div class="qsub">${esc(c.date)} · ${esc(acts(c).map(a=>a.o).join(' + '))}</div></div><span class="qtally">${q[1]}/${q[0]}</span><i class="chev"></i></button><div class="qbody" hidden>${acts(c).map(a=>`<div class="qout">${esc(a.o)}</div>${a.w.map(task).join('')}`).join('')}</div></article>`}).join('');document.querySelectorAll('.qbutton').forEach(b=>b.onclick=()=>{let c=b.closest('.qcard'),body=c.querySelector('.qbody');c.classList.toggle('open');body.hidden=!body.hidden});bindTasks();document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));$('#promos').hidden=view!=='promos';$('#art').hidden=view!=='art'}
function bindTasks(){if(!E)return;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{S.checks[b.dataset.task]=!done(b.dataset.task);save();render();if(cur)openDetail(cur.id,false)})}
function openDetail(id,hist=true){cur=D.find(c=>c.id===id);if(!cur)return;document.body.classList.add('detail');$('#index').classList.remove('on');$('#detail').classList.add('on');let q=count(cur),times=[...new Set(cur.a.map(a=>a.t))],dis=[...new Set(cur.a.map(a=>a.d))],links=cur.a.map(a=>({a,u:link(a)})).filter(x=>/^https:\/\//.test(x.u||''));let folder=links.length?`<button class="cta" id="folder">VIEW ARTWORK FOLDER${links.length>1?'S':''}</button>`:`<div class="folderempty"><span>Artwork folder</span><small>Not linked yet</small></div>`;if(E)folder+=`<button class="cta2" id="editlink">ADD / CHANGE ARTWORK LINK</button>`;$('#mount').innerHTML=`<div class="detailhero" id="overview"><p class="eyebrow">UPCOMING</p><h1>${esc(cur.title)}</h1><p class="detaildate">${esc(cur.date)}</p><dl class="facts"><div class="fact"><dt>Outlet</dt><dd>${esc(outs(cur))}</dd></div><div class="fact"><dt>Status</dt><dd>Upcoming</dd></div><div class="fact"><dt>Time</dt><dd>${times.length===1?esc(times[0]):'Varies by outlet'}</dd></div><div class="fact"><dt>IHG One Rewards</dt><dd>${dis.length===1?esc(dis[0]):'Varies by outlet'}</dd></div><div class="fact"><dt>Updated</dt><dd>28 August 2026</dd></div><div class="fact"><dt>Artwork</dt><dd>${q[1]} / ${q[0]} complete</dd></div></dl>${folder}</div><section class="sec" id="artwork"><div class="sectop"><h2 class="sectiontitle">Artwork</h2><span class="count">${q[1]} / ${q[0]} COMPLETE</span></div>${cur.a.map(a=>{let d=a.w.filter(w=>done(w[0])).length;return `<article class="group"><div class="ghead"><div><b>${esc(a.o)}</b><span>${esc(a.t)} · IHG One Rewards ${esc(a.d)}</span></div><span>${d}/${a.w.length}</span></div><div class="tasks">${a.w.map(task).join('')}</div></article>`}).join('')}</section><section class="sec" id="brief"><div class="sectop"><h2 class="sectiontitle">Promotion brief</h2></div><article class="textcard"><p class="textlabel">Workbook brief</p><div class="textcopy">${esc(cur.brief)}</div></article></section><section class="sec" id="copy"><div class="sectop"><h2 class="sectiontitle">Copy</h2></div><article class="textcard"><p class="textlabel">English</p><div class="textcopy">${esc(cur.en)}</div></article><article class="textcard"><p class="textlabel">ไทย</p><div class="textcopy th">${esc(cur.th||'Not supplied in the workbook.')}</div></article></section><div class="note">Source · Sep - Oct 2026 F&B Promotions.xlsx · visual review prototype only.</div>`;bindTasks();if($('#folder'))$('#folder').onclick=()=>links.length===1?window.open(links[0].u,'_blank','noopener'):folderSheet(links);if($('#editlink'))$('#editlink').onclick=()=>editLinks(cur);if(hist)history.pushState({id},'',`#${id}`);scrollTo(0,0)}
function closeDetail(hist=true){cur=null;document.body.classList.remove('detail');$('#detail').classList.remove('on');$('#index').classList.add('on');if(hist)history.pushState({},'',location.pathname+location.search);scrollTo(0,0)}$('#back').onclick=()=>history.back();document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go)?.scrollIntoView({behavior:'smooth'}));
function showSheet(title,html){$('#sheettitle').textContent=title;$('#sheetbody').innerHTML=html;$('#sheet').classList.add('on')}function more(){showSheet('More outlets',`<button class="sheetopt" data-mf="Horizon Pool Bar"><span>Horizon Pool Bar</span><small>View promotions</small></button><button class="sheetopt" data-mf="The Lobby Lounge"><span>The Lobby Lounge</span><small>View promotions</small></button>`);document.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{filter=b.dataset.mf;$('#sheet').classList.remove('on');render()})}function folderSheet(L){showSheet('Artwork folders',L.map(x=>`<a class="sheetopt" href="${esc(x.u)}" target="_blank" rel="noopener"><span>${esc(x.a.o)}</span><small>Open ↗</small></a>`).join(''))}function editLinks(c){showSheet('Artwork links',c.a.map(a=>`<label class="copyout">${esc(a.o)}<input class="input" data-link="${a.id}" value="${esc(link(a)||'')}" placeholder="Paste OneDrive or SharePoint folder URL"></label>`).join('')+`<button class="cta" id="savelinks">SAVE LOCAL PREVIEW</button>`);$('#savelinks').onclick=()=>{document.querySelectorAll('[data-link]').forEach(i=>{S.links[i.dataset.link]=i.value.trim()||null});save();$('#sheet').classList.remove('on');openDetail(c.id,false);toast('Local preview saved')}}$('#close').onclick=()=>$('#sheet').classList.remove('on');$('#sheet').onclick=e=>{if(e.target===e.currentTarget)$('#sheet').classList.remove('on')};function toast(t){let x=$('#toast');x.textContent=t;x.hidden=false;setTimeout(()=>x.hidden=true,1800)}window.onpopstate=()=>{let id=location.hash.slice(1);D.some(c=>c.id===id)?openDetail(id,false):closeDetail(false)};render();let init=D.find(c=>'#'+c.id===location.hash);if(init)openDetail(init.id,false);
