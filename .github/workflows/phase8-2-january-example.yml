name: Phase 8.2 January Atmosphere Example

on:
  push:
    branches:
      - phase8-2-bangkok-seasonal-clouds
    paths:
      - "site/january-sunset-example.html"
      - "site/seasonal-sky.js"
      - ".github/workflows/phase8-2-january-example.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: phase8-2-january-example
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate seasonal example
        shell: bash
        run: |
          set -euo pipefail
          node --check site/seasonal-sky.js
          grep -q "2026-01-15T18:20:00+07:00" site/january-sunset-example.html
          grep -q "weatherCode:0" site/january-sunset-example.html
          grep -q "cloudCover:.04" site/january-sunset-example.html
          grep -q "seasonalSkyForState" site/january-sunset-example.html
      - name: Deploy Cloudflare Pages branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Smoke test example
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://phase8-2-bangkok-seasonal-cl.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/january-sunset-example.html" -o /tmp/january.html
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/seasonal-sky.js" -o /tmp/seasonal.js
          grep -q "JANUARY · CLEAR SUNSET" /tmp/january.html
          grep -q "jan-cool-dry" /tmp/seasonal.js
