name: Record Weather WebGL Retirement

on:
  push:
    branches:
      - remove-legacy-weather-webgl
    paths:
      - ".github/workflows/weather-webgl-retirement.yml"
      - "site/sw.js"
      - "site/index.html"
      - "supabase/migrations/20260831121436_archive_legacy_weather_webgl_sources.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-weather-webgl-retirement-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Record retirement and recovery authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          archive_key='legacy-weather-webgl-20260831'
          source_commit='29b0c99941163582b84d376982e459fdf6ead85b'

          agents=Path('AGENTS.md')
          text=agents.read_text()
          old='- The former weather-driven WebGL background, seasonal-sky shader/profile and rain visual are retained as legacy/rollback code and must not be run in parallel with Betta. `site/environment.js` is legacy, and `site/rain-layer-legacy-weather.js` preserves the previous rain overlay. `site/rain-layer.js` is intentionally a no-op in the Betta production architecture.\n'
          new=f'- **2026-08-31 product decision: the former weather-driven WebGL background and its visual compatibility/rollback files were removed from the deployed app.** Exact source bytes are preserved privately in Supabase table `private.legacy_weather_webgl_archive` under archive key `{archive_key}`, sourced from immutable Git commit `{source_commit}`. Do not restore those files to the app without a new explicit product decision.\n'
          if old in text:
              text=text.replace(old,new)
          elif archive_key not in text:
              raise SystemExit('AGENTS product-state retirement marker was not found')

          start=text.find('## Legacy Phase 8.2 weather background')
          end=text.find('## Camera / Workers AI status', start)
          if start != -1 and end != -1:
              replacement=f'''## Retired Phase 8.2 weather background\n\nThe previous Bangkok seasonal/weather WebGL renderer is no longer shipped in `site/`. On 2026-08-31 the product owner explicitly retired it from the app for performance and architecture simplification.\n\nRecovery source is stored privately in Supabase:\n\n- table: `private.legacy_weather_webgl_archive`\n- archive key: `{archive_key}`\n- source commit: `{source_commit}`\n- archived files: 13\n- archived bytes: 1,169,050\n\nThis private archive includes the generated legacy bundle, renderer, seasonal profile, GLSL shader, legacy rain/storm/sun visual helpers, camera/sky visual research helpers, cloud tester source and deterministic legacy fixtures/tests. It is recovery/research material only and is not exposed to app clients.\n\nThe older Phase 8.2 architecture documents remain historical documentation; they no longer describe files that ship with the app.\n\n'''
              text=text[:start]+replacement+text[end:]
          agents.write_text(text)

          betta=Path('docs/BETTA-PRODUCTION-ATMOSPHERE-20260831.md')
          text=betta.read_text()
          start=text.find('## Legacy background code — retained intentionally')
          end=text.find('## Compatibility surface', start)
          if start != -1 and end != -1:
              replacement=f'''## Legacy weather WebGL — retired from the app\n\nOn 2026-08-31 the product owner explicitly removed the previous weather-driven WebGL stack from the deployed application. It is no longer a rollback path inside `site/`.\n\nBefore deletion, Supabase copied the exact source bytes from immutable Git commit `{source_commit}` into private table `private.legacy_weather_webgl_archive`, archive key `{archive_key}`. The archive contains 13 files / 1,169,050 bytes and has no `anon` or `authenticated` table grants.\n\nOperational weather and current-rain data remain active UI/data services. Only the retired weather/seasonal visual renderer and its visual compatibility/research files were removed. The Sindhorn Betta renderer remains the sole persistent WebGL visual.\n\n'''
              text=text[:start]+replacement+text[end:]
          elif archive_key not in text:
              raise SystemExit('Betta legacy section was not found')
          start=text.find('## Rollback')
          if start != -1:
              text=text[:start]+f'''## Recovery\n\nThe retired weather WebGL is recoverable only from Supabase archive `{archive_key}` or immutable Git history at `{source_commit}`. Reintroducing it into the app requires a new explicit product decision and a new preview/validation cycle.\n'''
          betta.write_text(text)

          archive=Path('docs/LEGACY-WEATHER-WEBGL-SUPABASE-ARCHIVE-20260831.md')
          archive.write_text(f'''# Legacy Weather WebGL Supabase Archive — 2026-08-31\n\nStatus: retired from deployed app; private recovery copy retained.\n\n## Archive identity\n\n- Supabase project: `sjpvhgxacsiorrtijqua`\n- Table: `private.legacy_weather_webgl_archive`\n- Archive key: `{archive_key}`\n- Source repository: `dechadae/sindhorn-midtown-internal`\n- Source commit: `{source_commit}`\n- Files: 13\n- Total source bytes: 1,169,050\n- RLS: enabled\n- `anon` / `authenticated` table grants: none\n\n## Archived files\n\n- `site/environment.js`\n- `site/environment.bundle.js`\n- `site/seasonal-sky.js`\n- `site/atmosphere-shader.js`\n- `site/rain-layer-legacy-weather.js`\n- `site/rain-layer.js`\n- `site/sun-dimmer.js`\n- `site/storm-effects.js`\n- `site/sky-calibration.js`\n- `site/sky-color-renderer.js`\n- `site/cloud-tester.js`\n- `site/phase8-2-fixtures.js`\n- `site/phase8-2-seasonal-clouds.test.mjs`\n\nEvery row stores exact source text, byte length and SHA-256 digest fetched directly by Supabase from the immutable source commit before app deletion.\n\n## Product boundary\n\nTMD/MET Norway weather, current-rain authority and AirBKK remain production data/UI services. They no longer have a separate weather-driven WebGL visual layer. The Sindhorn Betta renderer remains the app's sole persistent WebGL visual.\n''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -n "$(git status --porcelain -- AGENTS.md docs)"; then
            git add AGENTS.md docs
            git commit -m "Record retired weather WebGL Supabase archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
