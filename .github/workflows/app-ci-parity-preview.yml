name: App CI Parity Preview

on:
  push:
    branches: [app-ci-parity-preview]
    paths:
      - "site/**"
      - "scripts/app-ci-parity-*.mjs"
      - "scripts/ci-library-*.mjs"
      - "scripts/ui-shape-*.mjs"
      - "docs/APP-CI-PARITY-AUDIT-20260830.md"
      - "docs/CI-UI-ADAPTATION.md"
      - "docs/SINGLE-SHELL-ROUTER-INVARIANT-20260828.md"
      - "docs/SETTINGS-FIXED-RAIL-AND-DEVELOPER-CI-OVERRIDE-20260830.md"
      - "AGENTS.md"
      - ".github/workflows/app-ci-parity-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: app-ci-parity-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate parity source contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/route-registry.js site/brand.js site/ui-system-registry.js \
            scripts/app-ci-parity-contract-test.mjs scripts/app-ci-parity-browser-smoke.mjs \
            scripts/ci-library-contract-test.mjs scripts/ci-library-browser-smoke.mjs \
            scripts/ui-shape-browser-smoke.mjs scripts/ui-shape-source-audit.mjs; do
            node --input-type=module --check < "$file"
          done
          node scripts/app-ci-parity-contract-test.mjs
          node scripts/ci-library-contract-test.mjs
          node scripts/ui-shape-source-audit.mjs | tee /tmp/ui-shape-source-audit.json
          grep -q 'LINE Seed Sans TH' site/fonts.css
          grep -q '/app-action-card.css?v=1' site/index.html
          grep -q "UI_SYSTEM_VERSION='1.3.0-preview'" site/ui-system-registry.js
          grep -q 'app-action-card-control' site/brand.js

      - name: Verify protected systems unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          for file in \
            site/auth-shell.js site/auth-client.js site/capabilities.js site/login.js \
            site/environment.js site/atmosphere-shader.js site/seasonal-sky.js site/weather-authority.js \
            site/rain-now.js site/rain-layer.js site/location.js site/sw.js site/push-client.js \
            site/fnb.js site/fnb-data.js site/fnb-share-ui.js \
            site/business-card-settings.js site/business-card-component.js site/business-card-public.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw preview smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in \
            / /fnb /messages /brand /ihg-history /hotel-factsheet /settings /ci \
            /login.html /business-card.html /app-action-card.css /brand.js /brand.css \
            /ui-system-registry.js /route-registry.js /app-shapes.css; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          curl --fail --silent --show-error "${BASE_URL}/brand.js" -o /tmp/brand.js
          grep -q 'app-action-card-control' /tmp/brand.js
          curl --fail --silent --show-error "${BASE_URL}/ui-system-registry.js" -o /tmp/registry.js
          grep -q "UI_SYSTEM_VERSION='1.3.0-preview'" /tmp/registry.js

      - name: Cross-route browser parity smoke
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/app-ci-parity
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/ci-library-browser-smoke.mjs | tee /tmp/ci-library-browser-report.json
          node scripts/ui-shape-browser-smoke.mjs | tee /tmp/ui-shape-browser-report.json
          node scripts/app-ci-parity-browser-smoke.mjs | tee /tmp/app-ci-parity-browser-report.json

      - name: Upload parity screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-ci-parity-preview
          path: |
            /tmp/app-ci-parity
            /tmp/ci-library-browser-report.json
            /tmp/ui-shape-browser-report.json
            /tmp/app-ci-parity-browser-report.json
            /tmp/ui-shape-source-audit.json
          if-no-files-found: warn
          retention-days: 14
