name: Rain Now Authority Preview

on:
  push:
    branches:
      - fix-rain-now-authority
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: rain-now-authority-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate rain authority and Phase 8.2
        shell: bash
        run: |
          set -euo pipefail
          node --check site/location.js
          node --check site/rain-now.js
          node --check site/weather-authority.js
          node site/weather-authority.test.mjs
          node site/phase8-2-seasonal-clouds.test.mjs
          grep -q "enableHighAccuracy:true" site/location.js
          grep -q "Current device location" site/location.js
          ! grep -q "toFixed(4).*Current location" site/location.js
          grep -q "rain-now.js" site/index.html
          grep -q "const DPR=2" site/environment.js
          grep -q "document.addEventListener('sindhorn:weather-updated',start)" site/rain-layer.js

      - name: Deploy Cloudflare branch preview
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
          BASE_URL="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /location.js /rain-now.js /weather-authority.js /environment.js /rain-layer.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke
            test -s /tmp/smoke
          done
          curl --fail --silent --show-error "${BASE_URL}/rain-now.js" -o /tmp/rain-now
          grep -q "resolveWeatherAuthority" /tmp/rain-now
          curl --fail --silent --show-error "${BASE_URL}/location.js" -o /tmp/location
          grep -q "Current device location" /tmp/location
          curl --fail --silent --show-error "${BASE_URL}/environment.js" -o /tmp/environment
          grep -q "const DPR=2" /tmp/environment
