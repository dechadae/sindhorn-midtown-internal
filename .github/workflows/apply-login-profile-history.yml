name: Apply login profile and History preview

on:
  push:
    branches:
      - preview-login-profile-fix

permissions:
  contents: write

concurrency:
  group: apply-login-profile-history
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed source edits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-login-profile-history.py
          node --input-type=module --check < site/settings.js
          node --input-type=module --check < site/ihg-history.js
          node --input-type=module --check < site/login.js
          if git diff --quiet; then
            echo 'Source already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/settings.js site/login.html site/auth-brand.css site/ihg-history.js
          git commit -m 'Align login, employee profile and History spacing'
          git push origin HEAD:preview-login-profile-fix
