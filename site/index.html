<!-- The app shell, built on the UI Library and nothing else. Same
     stylesheets the library page loads, so what /ci demonstrates is literally
     what renders here. Served at / since r17; the legacy document and its
     routes redirect here (site/_redirects) and the hash names the page.

     Sign-in gates every route: shell.js mounts the sign-in page until an
     employee with a permanent code has a session, and the navbar stays
     visible but locked meanwhile. The hotel logo is Home; the account chip
     opens Settings, whose four tabs replace the navbar's four while open.
     Messages is the masthead icon beside the chip (r20) - the footer's
     tabs are Today, F&B, Jobs and Brand, and Messages keeps that footer
     beneath it with no tab current. Like the chip, the icon has two states
     (r23): while Messages is open it is a close mark that returns to the
     page the employee came from.

     THE SPLIT, so reinstall requirement 1 cannot regress by accident:

     - Shell = markup, CSS, JS. Ships from this repo, deployed to Cloudflare
       Pages, precached by sw.js, versioned by bumping VERSION in sw.js. A
       shell update reaches an installed user the next time the app opens -
       no reinstall, because the PWA identity (id/start_url/scope in
       manifest.webmanifest) never changes.

     - Data = whatever a page needs to display: today's numbers, F&B posts,
       brand assets metadata. Loaded at runtime from Supabase as JSON over
       fetch/RPC, never as HTML or CSS. It is not part of the precached
       shell and is not versioned with it.

     The previous production app violated this: header.html, today.html,
     footer.html and ui.css were markup and CSS fetched from a Supabase
     table (public.sindhorn_app_files) at boot. That is shell material
     shipped as data, so the service worker could not precache it, first
     launch depended on a network round trip, and the shell and that pack
     could disagree - which is what produced the "solid purple bar" failure
     documented elsewhere in this repo's history.

     This shell does not do that. Nothing here is fetched from Supabase.
     When a page needs Supabase data it fetches JSON into a shell that is
     already fully painted - never markup or style. -->

<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/line-seed-sans-th-thin.woff2">

<div class="environment-stage" id="environmentStage" aria-hidden="true"><canvas class="environment-canvas" id="environmentCanvas"></canvas></div>

<header class="app-masthead">

  <div class="app-masthead-tools">
    <button class="app-masthead-action app-control" type="button" data-masthead-route="messages" data-mode="messages" aria-label="Messages" hidden><svg viewBox="0 0 20 20" aria-hidden="true" data-icon="messages"><path d="M3 5h14v10H8l-5 3z"/></svg><svg viewBox="0 0 20 20" aria-hidden="true" data-icon="close"><path d="M5 5l10 10M15 5L5 15"/></svg><span class="app-badge app-masthead-badge" data-message-badge hidden></span></button>
    <button class="app-masthead-account app-control" type="button" data-mode="initials" aria-label="Settings" hidden><span>—</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
</header>

<main class="app-page is-shell" id="routeView">
</main>

<nav class="app-navbar" aria-label="Primary" data-mode="app" data-locked>
  <div class="app-navbar-set" data-set="app">
    <button class="app-navbar-button" type="button" data-route="today" aria-current="page" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 6h16M4 18h10"/></svg>
      <span>Today</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="fnb" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 11v10M17 3c-1.5 2-1.5 5 0 7v11"/></svg>
      <span>F&amp;B</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="jobs" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9zM6 5.5h12V20H6zM9 12l2 2 4-4"/></svg>
      <span>Jobs</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="brand" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.4 5 5.6.7-4 3.9 1 5.4-5-2.7-5 2.7 1-5.4-4-3.9 5.6-.7z"/></svg>
      <span>Brand</span>
    </button>
  </div>
  <div class="app-navbar-set" data-set="settings" inert>
    <button class="app-navbar-button" type="button" data-route="settings/me" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
      <span>Me</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="settings/admin" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-5-6.7"/></svg>
      <span>Admin</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="settings/broadcast" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l7 4V6l-7 4zM18 9a4 4 0 0 1 0 6"/></svg>
      <span>Broadcast</span>
    </button>
    <button class="app-navbar-button" type="button" data-route="settings/system" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M9 10v9"/></svg>
      <span>System</span>
    </button>
  </div>
</nav>
