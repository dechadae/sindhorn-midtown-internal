name: Phase 8 Sky Color Renderer · Research Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify preserved historical client files are not production-loaded
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sky-calibration.js
          node --check site/sky-color-renderer.js
          ! grep -q '/sky-calibration.js' site/index.html
          ! grep -q '/sky-color-renderer.js' site/index.html
          ! grep -q "'/sky-calibration.js'" site/sw.js
          ! grep -q "'/sky-color-renderer.js'" site/sw.js
