name: Deploy Sindhorn Midtown Internal

on:
  push:
    branches:
      - main
      - design-unification-pass
      - phase1-foundation
      - english-only-interface
      - fnb-action-plan-redesign
      - today-guidance-details-fnb
      - phase9-single-shell-router
      - hotfix-phase9-deploy-gate
      - hotfix-phase8-2-deploy-validation
      - webgl-environment-v1
      - hybrid-shell-v15
      - atmosphere-tester-v1
      - hotfix-rain-svg-pane
      - rain-realism-type-consistency
      - promote-atmosphere-tester
      - fix-duplicate-sun-final
      - fix-celestial-v2-import
      - fix-soft-luminous-sun
      - sun-post-cloud-composite
      - fix-blue-cloudy-sky
      - fix-sun-statusbar
      - revert-capture-dim-sun
      - user-local-location
      - storm-rain-realism
      - capture-normal-layout
      - fix-skip-link-flash
      - fix-lunar-phase-v2
      - fix-lunar-phase-shader
      - live-location-fixtures
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell candidate
        shell: bash
        run: |
          set -euo pipefail
          # These all ship as ES modules (<script type="module">), and plain
          # `node --check` parses as CommonJS - it silently PASSES module files
          # with real syntax errors. Parse them as modules instead.
          for file in site/route-registry.js site/app-transitions.js site/auth-shell.js site/auth-client.js site/login.js site/account.js site/admin.js site/fnb.js site/fnb-data.js site/location.js site/bootstrap.js site/live-data.js site/environment.js site/atmosphere-shader.js site/seasonal-sky.js site/rain-layer.js site/sun-dimmer.js site/screen-capture.js site/notification-inbox.js site/push-client.js site/phase8-2-fixtures.js site/phase8-2-browser-smoke.mjs site/presentation-recovery.js site/app.js site/sw.js worker/src/index.js auth-worker/src/index.js; do
            if ! node --input-type=module --check < "$file" 2>/tmp/modcheck.err; then
              echo "ES module syntax error in $file"; cat /tmp/modcheck.err; exit 1
            fi
          done
          node --experimental-default-type=module site/phase8-2-seasonal-clouds.test.mjs
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site'); fallback=root/'fallback'
          manifest=json.loads((fallback/'manifest.json').read_text())
          bootstrap=(root/'bootstrap.js').read_text(); auth_shell=(root/'auth-shell.js').read_text(); registry=(root/'route-registry.js').read_text(); transitions=(root/'app-transitions.js').read_text()
          shell_version=int(re.search(r'const SHELL_VERSION=(\d+);',bootstrap).group(1))
          assert manifest['minimumShell']==shell_version==17
          for item in manifest['resources']:
              assert hashlib.sha256((fallback/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']
          index=(root/'index.html').read_text(); sw=(root/'sw.js').read_text(); env=(root/'environment.js').read_text(); shader=(root/'atmosphere-shader.js').read_text(); seasonal=(root/'seasonal-sky.js').read_text(); fixtures=(root/'phase8-2-fixtures.js').read_text()
          assert '/auth-shell.js' in index and '/auth-shell.css' in index
          assert '/account.css' in index and '/admin.css' in index
          assert 'src="/location.js"' not in index and 'src="/bootstrap.js"' not in index
          assert "await initAuth" in auth_shell and "location.replace(loginUrl())" in auth_shell
          assert "loadClassicScript('/location.js')" in auth_shell and "await import('./bootstrap.js')" in auth_shell
          assert "const ACCOUNT_PATH='/account'" in auth_shell and "/account.html" not in auth_shell
          assert "dataset.appRoute='account'" in auth_shell
          for token in ("resources:Object.freeze(['today.html','guidance.html','details.html'])","fnb:Object.freeze({path:'/fnb'","account:Object.freeze({path:'/account'","admin:Object.freeze({path:'/admin'","kind:'local'","mount:'mountFnbRoute'","mount:'mountAccountRoute'","mount:'mountAdminRoute'"):
              assert token in registry,token
          assert "guidance:Object.freeze" not in registry and "details:Object.freeze" not in registry
          assert "['/guidance','today']" in registry and "['/details','today']" in registry
          assert "import {ROUTES,canonicalRoute,routeForPath}" in bootstrap
          assert 'mountLocalRoute' in bootstrap and "routeHost.dataset.shellRoute=route" in bootstrap
          assert 'packMarkup' in bootstrap and 'normalizeFooterNavigation' in bootstrap
          assert "dataset.appRoute='fnb'" in bootstrap and "querySelectorAll('[data-app-route=\"guidance\"],[data-app-route=\"details\"]')" in bootstrap
          assert 'routeOnlyFade' in transitions and 'appRouteFromAnchor' in transitions
          assert 'startViewTransition' not in transitions and 'view-transition' not in transitions.lower()
          redirects_raw=(root/'_redirects').read_text()
          assert redirects_raw.endswith('\n'),'_redirects needs a trailing newline or its last rule is dropped'
          # Only real rule lines are contracts; comments explain the traps below
          # and must not themselves trip the checks.
          rules=[l.strip() for l in redirects_raw.splitlines() if l.strip() and not l.lstrip().startswith('#')]
          for token in ('/guidance / 301','/details / 301','/account.html /account 301','/admin.html /admin 301'):
              assert token in rules,token
          # Cloudflare Pages canonicalises /index.html to / with a 308, so any
          # rewrite pointing at /index.html stops being a rewrite and becomes a
          # real redirect that strips the requested SPA path. Keep the target "/".
          assert not any('/index.html' in r and r.endswith('200') for r in rules),'SPA rewrite target must be "/" not "/index.html"'
          # A catch-all splat is evaluated ahead of static assets on Pages and
          # would serve index.html for /sw.js, /login.html and every stylesheet.
          assert not any(r.startswith('/*') for r in rules),'catch-all splat shadows static assets - list routes explicitly'
          # Registry and _redirects must stay in sync, or a new route ships
          # 308-ing to Today on direct load exactly as /fnb and /messages did.
          for path in sorted(set(re.findall(r"path:'(/[a-z]*)'",registry))):
              if path=='/':continue
              assert f'{path} / 200' in rules,f'{path} is in route-registry.js but missing its "_redirects" SPA fallback line'
          assert '/sky-calibration.js' not in index and '/sky-color-renderer.js' not in index
          assert '/seasonal-sky.js?v=1' not in index
          assert '/storm-effects.js' not in index
          assert "'/sky-calibration.js'" not in sw and "'/sky-color-renderer.js'" not in sw and "'/storm-effects.js'" not in sw
          assert "'/atmosphere-shader.js'" in sw and "'/seasonal-sky.js'" in sw and "'/fnb.js'" in sw
          assert 'pwa-v23-bangkok-seasonal-clouds' in sw
          assert "addEventListener('push'" in sw and "addEventListener('notificationclick'" in sw
          assert "NOTIFICATION_DB='sindhorn-midtown-notification-inbox'" in sw
          assert "url.pathname.startsWith('/fnb')" in sw
          for token in ('seasonalSkyForState','ATMOSPHERE_VERTEX_SHADER','ATMOSPHERE_FRAGMENT_SHADER','createAtmosphereNoiseTexture'):
              assert token in env,token
          assert "renderer:'bangkok-seasonal-clouds-v2'" in env and 'const DPR=2' in env
          assert 'ensureSnowCanvas' in env and 'ensureHailCanvas' in env and 'renderExport' in env and 'antialias:false' in env
          for token in ('High veil / cirrus','Mid broken cloud','Low convective / monsoon','uHighCoverage','uMidCoverage','uLowCoverage','uSun','uSolarAltitude','sunDisc','Visible sun disc','texture2D(uNoise','AirBKK PM2.5 optics'):
              assert token in shader,token
          assert 'MONTHLY=[' in seasonal and 'bangkokSeasonalProfile' in seasonal and 'cloudMorphologyForWeather' in seasonal
          assert fixtures.count("labelEn:")==11
          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'
          app=(root/'app.js').read_text(); push=(root/'push-client.js').read_text()
          assert "messages:'/messages'" in app and "navigator.serviceWorker.register('/sw.js',{scope:'/'})" in app
          assert "new Set(['today','messages'])" in app
          assert 'pushManager.subscribe' in push and 'Notification.requestPermission' not in push
          assert 'letter-spacing:0!important' in (root/'auth-shell.css').read_text()
          assert 'letter-spacing:0!important' in (root/'account.css').read_text()
          assert 'letter-spacing:0!important' in (root/'admin.css').read_text()
          PY

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test deployed shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then BASE_URL="https://sindhorn-midtown-internal.pages.dev"; else BASE_URL="https://${GITHUB_REF_NAME:0:28}.sindhorn-midtown-internal.pages.dev"; fi
          sleep 8
          for path in / /fnb /messages /account /admin /route-registry.js /app-transitions.js /auth-shell.js /auth-shell.css /auth-client.js /login.html /login.js /account.js /account.css /admin.js /admin.css /fnb.js /location.js /bootstrap.js /environment.js /atmosphere-shader.js /seasonal-sky.js /rain-layer.js /sun-dimmer.js /screen-capture.js /manifest.webmanifest /phase8-2-fixtures.js /notification-inbox.js /push-client.js /sw.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          for path in / /fnb /messages /account /admin; do
            curl --fail --silent --show-error --location "${BASE_URL}${path}" -o /tmp/app-route.html
            grep -q '/auth-shell.js' /tmp/app-route.html
            grep -q 'id="route-view"' /tmp/app-route.html
          done
          # Direct-load guard. Deliberately WITHOUT --location: every authenticated
          # route must serve the shell at its own URL, not redirect to "/". A 308
          # here means the SPA loses the requested path before its JavaScript runs,
          # so refresh, bookmark, share-a-link and installed-PWA cold start all
          # land on Today. The checks above use --location and therefore followed
          # that redirect silently, which is why this shipped unnoticed.
          for path in /fnb /messages /account /admin; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}${path}")
            if [ "$code" != "200" ]; then
              echo "FAIL ${path} returned ${code} (expected 200 with the URL preserved)"
              exit 1
            fi
          done
          for legacy in /guidance /details; do
            curl --fail --silent --show-error --location "${BASE_URL}${legacy}" -o /tmp/legacy-environment.html
            grep -q '/auth-shell.js' /tmp/legacy-environment.html
          done
          curl --fail --silent --show-error --location "${BASE_URL}/account.html" -o /tmp/legacy-account.html
          grep -q '/auth-shell.js' /tmp/legacy-account.html
          curl --fail --silent --show-error --location "${BASE_URL}/admin.html" -o /tmp/legacy-admin.html
          grep -q '/auth-shell.js' /tmp/legacy-admin.html
          curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html
          curl --fail --silent --show-error --location "${BASE_URL}/auth-shell.js" -o /tmp/auth-shell.js
          curl --fail --silent --show-error --location "${BASE_URL}/route-registry.js" -o /tmp/route-registry.js
          curl --fail --silent --show-error --location "${BASE_URL}/bootstrap.js" -o /tmp/bootstrap.js
          curl --fail --silent --show-error --location "${BASE_URL}/environment.js" -o /tmp/environment.js
          curl --fail --silent --show-error --location "${BASE_URL}/atmosphere-shader.js" -o /tmp/shader.js
          curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js
          grep -q '/auth-shell.js' /tmp/root.html
          ! grep -q 'src="/bootstrap.js"' /tmp/root.html
          ! grep -q 'src="/location.js"' /tmp/root.html
          grep -q "await import('./bootstrap.js')" /tmp/auth-shell.js
          grep -q "loadClassicScript('/location.js')" /tmp/auth-shell.js
          grep -q 'masthead-user' /tmp/auth-shell.js
          grep -q "ACCOUNT_PATH='/account'" /tmp/auth-shell.js
          grep -q "path:'/fnb'" /tmp/route-registry.js
          grep -q "path:'/account'" /tmp/route-registry.js
          grep -q "path:'/admin'" /tmp/route-registry.js
          grep -q "today.html','guidance.html','details.html" /tmp/route-registry.js
          grep -q 'normalizeFooterNavigation' /tmp/bootstrap.js
          ! grep -q '/sky-calibration.js' /tmp/root.html
          ! grep -q '/sky-color-renderer.js' /tmp/root.html
          ! grep -q '/storm-effects.js' /tmp/root.html
          grep -q 'bangkok-seasonal-clouds-v2' /tmp/environment.js
          grep -q 'Low convective / monsoon' /tmp/shader.js
          grep -q 'Visible sun disc' /tmp/shader.js
          grep -q 'texture2D(uNoise' /tmp/shader.js
          grep -q 'pwa-v23-bangkok-seasonal-clouds' /tmp/sw.js
          ! grep -q "'/sky-calibration.js'" /tmp/sw.js
          grep -q "addEventListener('push'" /tmp/sw.js
          curl --fail --silent --show-error --location "${BASE_URL}/location.js" -o /tmp/location.js
          grep -q 'navigator.geolocation.getCurrentPosition' /tmp/location.js
          grep -q 'sindhorn:location-updated' /tmp/location.js