name: F&B Share Release Gate

on:
  push:
    branches: [fix-fnb-share-release-gate]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate F&B share regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3 >/dev/null 2>&1
          node .github/tests/fnb-sharing-regression.test.mjs
