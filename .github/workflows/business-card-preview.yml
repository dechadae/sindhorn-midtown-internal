name: Digital Business Card Preview

on:
  push:
    branches:
      - preview-digital-business-card
      - hotfix-business-card-*
    paths:
      - "functions/**"
      - "site/business-card*"
      - "site/qr-v6.js"
      - "site/settings-route-v3.js"
      - "site/route-registry.js"
      - "scripts/business-card-*"
      - "supabase/migrations/20260829191503_sindhorn_digital_business_cards.sql"
      - "supabase/migrations/20260829192257_sindhorn_business_card_e164_regex_fix.sql"
      - "supabase/migrations/20260829195459_sindhorn_business_card_shortlink_v2.sql"
      - ".github/workflows/business-card-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: business-card-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Cloudflare branch preview URL
        shell: bash
        run: |
          set -euo pipefail
          alias="${GITHUB_REF_NAME:0:28}"
          echo "PREVIEW_BASE_URL=https://${alias}.sindhorn-midtown-internal.pages.dev" >> "$GITHUB_ENV"

      - name: Validate business card contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < site/business-card-core.js
          node --input-type=module --check < site/qr-v6.js
          node --input-type=module --check < site/business-card-public.js
          node --input-type=module --check < site/business-card-settings.js
          node --input-type=module --check < site/settings-route-v3.js
          node --input-type=module --check < site/route-registry.js
          node --input-type=module --check < 'functions/[slug].js'
          node --input-type=module --check < scripts/business-card-contract-test.mjs
          node --input-type=module --check < scripts/business-card-browser-smoke.mjs
          node --experimental-default-type=module scripts/business-card-contract-test.mjs | tee /tmp/business-card-contract.json
          grep -q 'Sindhorn Midtown Hotel Bangkok, Vignette Collection by IHG' site/business-card.html site/business-card-settings.js supabase/migrations/20260829195459_sindhorn_business_card_shortlink_v2.sql
          grep -q 'sindhorn-midtown-vignette-white.png' site/business-card-public.js site/business-card-settings.js supabase/migrations/20260829195459_sindhorn_business_card_shortlink_v2.sql
          grep -q 'business_card.read' site/business-card-settings.js supabase/migrations/20260829191503_sindhorn_digital_business_cards.sql
          grep -q 'business_card.manage_self' site/business-card-settings.js supabase/migrations/20260829191503_sindhorn_digital_business_cards.sql
          grep -q 'settings-route-v3.js?v=8' site/route-registry.js
          grep -q 'preloadSettingsBusinessCard' site/settings-route-v3.js site/business-card-settings.js
          grep -q "root.style.visibility='hidden'" site/settings-route-v3.js
          ! grep -q 'business-card-settings-actions is-loading' site/business-card-settings.js
          grep -q 'qrStyledSvg' site/qr-v6.js site/business-card-public.js
          grep -q 'visualViewport' site/settings-route-v3.js
          grep -q -- '--settings-scroll-clearance' site/settings-route-v3.js site/business-card-settings.css
          grep -q 'destination_type' supabase/migrations/20260829195459_sindhorn_business_card_shortlink_v2.sql
          grep -q "business_card:" supabase/migrations/20260829195459_sindhorn_business_card_shortlink_v2.sql
          grep -q '\\.vcf' 'functions/[slug].js'
          grep -Fq "business_mobile_e164 ~ '^[+][1-9][0-9]{7,14}$'" supabase/migrations/20260829192257_sindhorn_business_card_e164_regex_fix.sql
          ! grep -qiE 'personal_email|sindhorn_private_contacts|auth_user_id|employee_number' site/business-card.html site/business-card-public.js site/business-card-core.js 'functions/[slug].js'
          npx --yes wrangler@4.125.0 pages functions build functions --outfile /tmp/business-card-functions.js >/tmp/functions-build.log
          test -s /tmp/business-card-functions.js

      - name: Verify live public RPC surface
        shell: bash
        run: |
          set -euo pipefail
          API='https://sjpvhgxacsiorrtijqua.supabase.co/rest/v1/rpc/sindhorn_public_business_card'
          KEY='sb_publishable_NcIExScIXkqsK1ZNNu5a-Q_zZ4afIHz'
          curl --fail --silent --show-error "$API" -H "apikey: $KEY" -H 'content-type: application/json' --data '{"p_slug":"dechak"}' -o /tmp/public-card.json
          jq -e '.slug=="dechak" and .displayName=="Decha Kokaew" and .positionTitle=="Senior Graphic Designer" and .hotelName=="Sindhorn Midtown Hotel Bangkok, Vignette Collection by IHG" and .hotelLogoPath=="/assets/brand/sindhorn-midtown-vignette-white.png"' /tmp/public-card.json >/dev/null
          ! grep -qiE '10639|super_admin|developer|employee_id|employeeNumber|auth_user_id|personal_email' /tmp/public-card.json
          curl --fail --silent --show-error 'https://sjpvhgxacsiorrtijqua.supabase.co/rest/v1/fg_shortlinks?code=eq.dechak&select=code,target_path,destination_type,active' -H "apikey: $KEY" -o /tmp/anon-shortlink.json
          jq -e 'length==0' /tmp/anon-shortlink.json >/dev/null

      - name: Verify protected modules unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          for file in \
            site/settings.js site/settings.css site/settings-refinements.css site/capabilities.js site/auth-client.js \
            site/footer-route-guard.js site/footer-route-guard.css \
            site/fnb.js site/fnb.css site/fnb-data.js site/fnb-approved-polish.css \
            site/ihg-history.js site/ihg-history.css site/app.js site/bootstrap.js site/auth-shell.js \
            site/environment.js site/atmosphere-shader.js site/rain-now.js site/rain-layer.js \
            site/seasonal-sky.js site/weather-authority.js site/sw.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw public card and route smoke
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for path in /dechak /settings /account /admin /fnb /ihg-history /messages /route-registry.js /business-card-public.js /business-card-settings.js /settings-route-v3.js /qr-v6.js /assets/brand/sindhorn-midtown-vignette-white.png; do
            code="$(curl --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 -o /tmp/response -w '%{http_code}' "${PREVIEW_BASE_URL}${path}")"
            echo "route ${path} -> ${code} ($(wc -c </tmp/response) bytes)"
            test "$code" = '200'
            test -s /tmp/response
          done
          curl --fail --silent --show-error "${PREVIEW_BASE_URL}/dechak" -o /tmp/dechak.html
          grep -q 'Decha Kokaew' /tmp/dechak.html
          grep -q 'Senior Graphic Designer' /tmp/dechak.html
          grep -q 'Sindhorn Midtown Hotel Bangkok, Vignette Collection by IHG' /tmp/dechak.html
          grep -q 'sindhorn-midtown-vignette-white.png' /tmp/dechak.html
          grep -q 'businessCardBootstrap' /tmp/dechak.html
          ! grep -qiE '10639|super_admin|developer|personal_email|auth_user_id|employee_id' /tmp/dechak.html

          curl --fail --silent --show-error -D /tmp/vcf-head "${PREVIEW_BASE_URL}/dechak.vcf" -o /tmp/dechak.vcf
          grep -qi 'content-type: text/vcard' /tmp/vcf-head
          grep -q 'FN:Decha Kokaew' /tmp/dechak.vcf
          grep -Fq 'ORG:Sindhorn Midtown Hotel Bangkok\, Vignette Collection by IHG' /tmp/dechak.vcf
          grep -q 'EMAIL;TYPE=WORK:decha.kokaew@ihg.com' /tmp/dechak.vcf
          ! grep -qiE '10639|super_admin|developer|personal_email|auth_user_id|employee_id' /tmp/dechak.vcf

          head_code="$(curl --silent --show-error --head -o /tmp/dechak-head -w '%{http_code}' "${PREVIEW_BASE_URL}/dechak")"
          test "$head_code" = '200'
          grep -qi 'cache-control: no-store' /tmp/dechak-head

          unknown="$(curl --silent --show-error -o /tmp/unknown -w '%{http_code}' "${PREVIEW_BASE_URL}/zzzzzz")"
          test "$unknown" = '200' -o "$unknown" = '404'
          ! grep -q 'businessCardBootstrap' /tmp/unknown
          ! grep -q 'Decha Kokaew' /tmp/unknown

          vcf_unknown="$(curl --silent --show-error -D /tmp/unknown-vcf-head -o /tmp/unknown-vcf -w '%{http_code}' "${PREVIEW_BASE_URL}/zzzzzz.vcf")"
          test "$vcf_unknown" = '200' -o "$vcf_unknown" = '404'
          ! grep -qi 'content-type: text/vcard' /tmp/unknown-vcf-head

          legacy_shortlink="$(curl --silent --show-error -o /tmp/legacy-shortlink -w '%{http_code}' "${PREVIEW_BASE_URL}/enqfhp")"
          test "$legacy_shortlink" = '200' -o "$legacy_shortlink" = '301' -o "$legacy_shortlink" = '302' -o "$legacy_shortlink" = '307' -o "$legacy_shortlink" = '308'
          ! grep -q 'businessCardBootstrap' /tmp/legacy-shortlink

          curl --fail --silent --show-error "${PREVIEW_BASE_URL}/route-registry.js" -o /tmp/routes.js
          grep -q "path:'/settings'" /tmp/routes.js
          grep -q 'settings-route-v3.js?v=8' /tmp/routes.js
          curl --fail --silent --show-error "${PREVIEW_BASE_URL}/settings-route-v3.js" -o /tmp/settings-route-v3.js
          grep -q 'preloadSettingsBusinessCard' /tmp/settings-route-v3.js
          grep -q "root.style.visibility='hidden'" /tmp/settings-route-v3.js
          curl --fail --silent --show-error "${PREVIEW_BASE_URL}/qr-v6.js" -o /tmp/qr-v6.js
          grep -q 'qrStyledSvg' /tmp/qr-v6.js
          echo 'raw route smoke passed'

      - name: Mobile browser and VCF smoke
        shell: bash
        env:
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}
          SCREENSHOT_DIR: /tmp/business-card-mobile
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/business-card-browser-smoke.mjs | tee /tmp/business-card-browser-report.json

      - name: Upload business card smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: business-card-preview-smoke
          path: |
            /tmp/business-card-mobile
            /tmp/business-card-browser-report.json
            /tmp/business-card-contract.json
            /tmp/functions-build.log
            /tmp/public-card.json
            /tmp/dechak.vcf
          if-no-files-found: warn
          retention-days: 14
