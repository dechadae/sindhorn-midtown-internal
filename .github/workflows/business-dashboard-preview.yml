name: Daily Business Dashboard Preview

on:
  push:
    branches: [daily-business-dashboard-preview]
    paths:
      - "site/index.html"
      - "site/app.js"
      - "site/sw.js"
      - "site/business-dashboard.js"
      - "site/business-dashboard-data.js"
      - "site/business-dashboard.css"
      - "site/route-registry.js"
      - "site/ui-system-registry.js"
      - "site/ci-specimen-fixes.css"
      - "supabase/migrations/*daily_business_dashboard*.sql"
      - "scripts/business-dashboard-browser-smoke.mjs"
      - "scripts/business-dashboard-pwa-smoke.mjs"
      - "scripts/business-dashboard-ci-audit.mjs"
      - "scripts/business-dashboard-ci-parity-smoke.mjs"
      - ".github/workflows/business-dashboard-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: daily-business-dashboard-preview
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate route, shell and module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in site/route-registry.js site/business-dashboard-data.js site/business-dashboard.js site/app.js site/sw.js scripts/business-dashboard-browser-smoke.mjs scripts/business-dashboard-pwa-smoke.mjs scripts/business-dashboard-ci-audit.mjs scripts/business-dashboard-ci-parity-smoke.mjs; do
            node --input-type=module --check < "$file"
          done
          grep -q "today:Object.freeze({path:'/',title:'Today | Sindhorn Midtown Internal',kind:'local'" site/route-registry.js
          grep -q "sindhorn_business_dashboard_read_model" site/business-dashboard-data.js
          grep -q "business-dashboard-route" site/business-dashboard.js site/business-dashboard.css
          grep -q "SindhornBusinessDashboard.*refresh" site/app.js
          grep -q "business-dashboard.js" site/sw.js
          grep -q "hotel-factsheet.css" site/sw.js
          grep -q "pwa-v31-line-seed-sans-th-v33-business-dashboard-ci-r1" site/sw.js
          grep -q "<title>Today | Sindhorn Midtown Internal</title>" site/index.html
          if grep -Eqi 'border-radius:[[:space:]]*(50%|999px|9999px)' site/business-dashboard.css; then
            echo 'Circular/capsule dashboard UI is not allowed'; exit 1
          fi
          if grep -Eq 'letter-spacing:[[:space:]]*[^0!]' site/business-dashboard.css; then
            echo 'Non-zero dashboard letter spacing detected'; exit 1
          fi

      - name: Audit Today against UI Library source
        shell: bash
        run: node scripts/business-dashboard-ci-audit.mjs | tee /tmp/business-dashboard-ci-audit.json

      - name: Verify protected product systems are untouched
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          for file in site/environment.js site/atmosphere-shader.js site/seasonal-sky.js site/weather-authority.js site/rain-now.js site/rain-layer.js site/auth-shell.js site/auth-client.js site/capabilities.js site/fnb.js site/fnb-data.js site/brand.js site/ihg-history.js site/hotel-factsheet-route.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw route and module smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://daily-business-dashboard-pre.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /route-registry.js /business-dashboard.js /business-dashboard-data.js /business-dashboard.css /hotel-factsheet.css /app.js /sw.js /manifest.webmanifest; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          curl --fail --silent --show-error "${BASE_URL}/route-registry.js" -o /tmp/routes.js
          grep -q "kind:'local',module:'./business-dashboard.js?v=2'" /tmp/routes.js
          curl --fail --silent --show-error "${BASE_URL}/sw.js" -o /tmp/sw.js
          grep -q "business-dashboard-data.js" /tmp/sw.js
          grep -q "hotel-factsheet.css" /tmp/sw.js

      - name: Mobile, CI-parity and installed-PWA smoke
        shell: bash
        env:
          BASE_URL: https://daily-business-dashboard-pre.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/business-dashboard-preview
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/business-dashboard-browser-smoke.mjs | tee /tmp/business-dashboard-browser-report.json
          node scripts/business-dashboard-ci-parity-smoke.mjs | tee /tmp/business-dashboard-ci-parity-report.json
          node scripts/business-dashboard-pwa-smoke.mjs | tee /tmp/business-dashboard-pwa-report.json

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: business-dashboard-preview
          path: |
            /tmp/business-dashboard-preview
            /tmp/business-dashboard-browser-report.json
            /tmp/business-dashboard-ci-audit.json
            /tmp/business-dashboard-ci-parity-report.json
            /tmp/business-dashboard-pwa-report.json
          if-no-files-found: warn
          retention-days: 14
