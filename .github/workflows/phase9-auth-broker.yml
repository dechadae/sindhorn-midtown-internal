name: Phase 9 Supabase Employee Auth

on:
  push:
    branches:
      - phase9-internal-auth-broadcast
      - phase9-contact-otp
      - main
    paths:
      - "site/auth-client.js"
      - "site/shell.js"
      - "site/signin-page.js"
      - "site/settings-admin.js"
      - "site/qr-v6.js"
      - "site/fonts.css"
      - "test/auth-client.test.mjs"
      - "supabase/migrations/*phase9*"
      - "docs/PHASE9-*"
      - ".github/workflows/phase9-auth-broker.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/auth-client.js"
      - "site/shell.js"
      - "site/signin-page.js"
      - "site/settings-admin.js"
      - "site/qr-v6.js"
      - "site/fonts.css"
      - "test/auth-client.test.mjs"
      - "supabase/migrations/*phase9*"
      - "docs/PHASE9-*"
      - ".github/workflows/phase9-auth-broker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check site/auth-client.js
          node --input-type=module --check < site/shell.js
          node --input-type=module --check < site/signin-page.js
          node --input-type=module --check < site/settings-admin.js
          node --check site/qr-v6.js
          node --check test/auth-client.test.mjs

      - name: Supabase-only auth client test
        run: node test/auth-client.test.mjs

      - name: Security and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sindhorn_manual_activate" site/auth-client.js
          grep -q "authBackend:'supabase'" site/auth-client.js
          grep -q "token_hash:tokenHash,type:'email'" site/auth-client.js
          # r18: sign-in and admin live inside the shell (#signin, #settings/admin);
          # an invitation is /#signin?i=<employee>&c=<code>, and the shell
          # translates the legacy /login.html#i=..&c=.. form on arrival.
          grep -q "sindhorn_admin_list_users_v3" site/settings-admin.js
          grep -q "sindhorn_admin_upsert_contact_v2" site/settings-admin.js
          grep -q "sindhorn_admin_revoke_access_v2" site/settings-admin.js
          grep -q "sindhorn_admin_issue_activation_code_v2" site/settings-admin.js
          grep -q "/#signin?i=" site/settings-admin.js
          grep -q "history.replaceState" site/signin-page.js
          grep -q "#signin?i=" site/shell.js
          # r32: the zero-tracking lock holds without !important (font-architecture.test.mjs owns the full check)
          grep -qF "*,*::before,*::after{letter-spacing:0}" site/fonts.css
          test ! -e site/login.html
          test ! -e site/admin.html
          ! grep -R -q -E 'BREVO|TURNSTILE|/otp/request|/otp/verify|sindhorn-midtown-auth.*workers\.dev' \
            site/shell.js site/signin-page.js site/settings-admin.js site/auth-client.js
          ! grep -R -E 'sb_secret_|SUPABASE_(SERVICE_ROLE|SECRET)_KEY[[:space:]]*=' \
            site/shell.js site/signin-page.js site/settings-admin.js site/auth-client.js site/fonts.css

          latest_admin_migration="$(ls supabase/migrations/*phase9_post_acceptance_admin_users_and_retire_legacy_auth.sql)"
          grep -q "sindhorn_admin_list_users_v3" "$latest_admin_migration"
          grep -q "sindhorn_admin_upsert_contact_v2" "$latest_admin_migration"
          grep -q "sindhorn_admin_revoke_access_v2" "$latest_admin_migration"
          grep -q "drop function if exists public.sindhorn_bootstrap_activation_prepare" "$latest_admin_migration"
          grep -q "drop function if exists public.sindhorn_contact_login_lookup" "$latest_admin_migration"
          grep -q "email_enabled=false" "$latest_admin_migration"
          grep -q "sms_enabled=false" "$latest_admin_migration"

      - name: QR encoder smoke
        run: |
          node --input-type=module - <<'NODE'
          import {qrMatrix,qrSvg} from './site/qr-v6.js';
          const url='https://sindhorn-midtown-internal.pages.dev/#signin?i=10639&c=123456';
          const matrix=qrMatrix(url);
          if(!Array.isArray(matrix)||matrix.length!==41||matrix.some(row=>row.length!==41)) throw new Error('unexpected QR matrix shape');
          const dark=matrix.flat().filter(Boolean).length;
          if(dark<450||dark>1250) throw new Error(`unexpected QR dark module count ${dark}`);
          const svg=qrSvg(url);
          if(!svg.includes('<svg')||!svg.includes('viewBox="0 0 49 49"')) throw new Error('QR SVG render failed');
          console.log(`QR encoder smoke passed; dark modules=${dark}`);
          NODE
