name: F&B Modal + App Icon Polish

on:
  push:
    branches: [fnb-modal-icon-polish]
    paths: [".github/workflows/fnb-modal-icon-polish.yml", "site/fnb-approved-polish.css"]

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Validate source
        run: |
          grep -q 'z-index:220!important' site/fnb-approved-polish.css
          grep -q '#route-view{z-index:30!important}' site/fnb-approved-polish.css
          grep -q 'text-transform:none!important' site/fnb-approved-polish.css
          ! grep -Eq 'letter-spacing:[[:space:]]*[^0;!]' site/fnb-approved-polish.css
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch=fnb-modal-icon-polish
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser modal verification
        env:
          BASE_URL: https://fnb-modal-icon-polish.sindhorn-midtown-internal.pages.dev
          CI_SMOKE_EMPLOYEE_NUMBER: ${{ secrets.CI_SMOKE_EMPLOYEE_NUMBER }}
          CI_SMOKE_PIN: ${{ secrets.CI_SMOKE_PIN }}
        run: |
          sleep 8
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},serviceWorkers:'block'});
          const page=await context.newPage();
          await page.goto(process.env.BASE_URL+'/login.html',{waitUntil:'domcontentloaded'});
          await page.fill('#employeeNumber',process.env.CI_SMOKE_EMPLOYEE_NUMBER);
          for(let i=0;i<6;i++) await page.fill(`[data-pin-login-digit="${i}"]`,process.env.CI_SMOKE_PIN[i]);
          await page.click('#pinLoginButton');
          await page.waitForURL(url=>new URL(url).pathname==='/',{timeout:20000,waitUntil:'commit'});
          await page.waitForFunction(()=>document.documentElement.dataset.shellLoading==='false');
          await page.evaluate(()=>window.SindhornNavigation.transitionToRoute('fnb'));
          await page.waitForURL(url=>new URL(url).pathname==='/fnb',{timeout:12000});
          await page.locator('[data-open]').first().click();
          await page.waitForSelector('.fnb-detail:not([hidden])');
          await page.evaluate(()=>{
            const layer=document.querySelector('[data-sheet-layer]');
            layer.querySelector('[data-sheet-title]').textContent='Artwork links';
            layer.querySelector('[data-sheet-body]').innerHTML='<div class="fnb-link-field"><label>Sip & Co.</label><input type="url" placeholder="Paste OneDrive or SharePoint folder URL"></div><p class="fnb-sheet-note">Saved on this device only.</p><button class="fnb-action is-primary" type="button" data-save-links>Save</button>';
            layer.classList.add('is-open'); layer.setAttribute('aria-hidden','false');
          });
          await page.waitForSelector('.fnb-sheet-layer.is-open');
          await page.waitForTimeout(450);
          const state=await page.evaluate(()=>{
            const layer=document.querySelector('.fnb-sheet-layer.is-open');
            const sheet=layer.querySelector('.fnb-sheet');
            const action=layer.querySelector('[data-save-links]');
            if(!sheet||!action) throw new Error('active modal content missing');
            const footer=document.querySelector('#app-footer .app-tabbar');
            const lr=layer.getBoundingClientRect(),sr=sheet.getBoundingClientRect(),fr=footer.getBoundingClientRect();
            const lc=getComputedStyle(layer),ac=getComputedStyle(action);
            const footerPoint=document.elementFromPoint((fr.left+fr.right)/2,(fr.top+fr.bottom)/2);
            const headerPoint=document.elementFromPoint(innerWidth/2,70);
            return {layer:{top:lr.top,left:lr.left,right:lr.right,bottom:lr.bottom},center:{x:(sr.left+sr.right)/2,y:(sr.top+sr.bottom)/2},viewport:{x:innerWidth/2,y:innerHeight/2},z:lc.zIndex,backdrop:lc.backdropFilter||lc.webkitBackdropFilter,transform:ac.textTransform,footerCovered:Boolean(footerPoint?.closest?.('.fnb-sheet-layer')),headerCovered:Boolean(headerPoint?.closest?.('.fnb-sheet-layer'))};
          });
          console.log('F&B centered modal',JSON.stringify(state));
          if(Math.abs(state.layer.top)>1||Math.abs(state.layer.left)>1||Math.abs(state.layer.right-390)>1||Math.abs(state.layer.bottom-844)>1) throw new Error('dim layer not full viewport');
          if(Math.abs(state.center.x-state.viewport.x)>3||Math.abs(state.center.y-state.viewport.y)>12) throw new Error('modal not centered');
          if(Number(state.z)<200||!state.footerCovered||!state.headerCovered) throw new Error('persistent shell not dimmed');
          if(state.transform!=='none'||state.backdrop==='none') throw new Error('button case or backdrop invalid');
          await page.screenshot({path:'fnb-centered-modal.png',fullPage:true});
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fnb-centered-modal-${{ github.run_id }}
          path: fnb-centered-modal.png
          if-no-files-found: error
          retention-days: 7
