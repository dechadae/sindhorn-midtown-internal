name: Deploy Sindhorn Midtown Internal

on:
  push:
    branches:
      - main
      - performance-audit-post-weather-webgl
    paths:
      - "site/**"
      - "scripts/generate-fnb-share.mjs"
      - "scripts/generate-pwa-icons.mjs"
      - "scripts/*-smoke.mjs"
      - ".github/tests/**"
      - ".github/workflows/deploy.yml"
      - "supabase/migrations/**"
      - "docs/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate public F&B shares and launcher icons
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3 >/dev/null 2>&1
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export PUBLIC_ORIGIN="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            export PUBLIC_ORIGIN="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi
          node scripts/generate-fnb-share.mjs
          node scripts/generate-pwa-icons.mjs

      - name: Validate current shell candidate
        shell: bash
        run: |
          set -euo pipefail
          # r18: the shell at / and its lazy page modules, the Betta sources,
          # the service worker and the Workers. r30: the public /share pages are
          # the same shell, so there is no second runtime to check. r31: the
          # business card at /<slug> is the same shell too, cut by the Pages
          # worker from index.html with site/public-page.js.
          MODULES=(
            site/shell.js site/auth-client.js site/signin-page.js site/today.js site/fnb-page.js
            site/fnb-read-model.js site/fnb-artwork-copy.js site/messages-page.js site/brand-page.js site/settings-page.js
            site/settings-me.js site/settings-admin.js site/settings-broadcast.js site/capabilities.js
            site/notification-inbox.js site/broadcast-inbox.js site/push-client.js site/push-config.js
            site/app-view.js site/app-dialog.js site/app-select.js site/app-toast.js site/app-code.js
            site/qr-v6.js site/business-dashboard-data.js site/business-card-core.js
            site/business-card-page.js site/public-page.js
            site/ci-library.js site/ci-page.js site/voice-page.js site/app-format.js
            site/betta-environment.js site/betta-satellite.js site/betta-day-periods.js
            site/betta-fin-presets.js site/betta-fin-shader.js site/betta-vignette-palettes.js
            site/sw.js site/_worker.js worker/src/index.js auth-worker/src/index.js
          )
          for file in "${MODULES[@]}"; do
            test -s "$file"
            node --input-type=module --check < "$file"
          done
          # The committed Betta bundle must be a fresh build of its sources.
          node scripts/build-betta-runtime.mjs --check
          node --input-type=module --check < scripts/generate-fnb-share.mjs
          node --input-type=module --check < scripts/generate-pwa-icons.mjs
          # r30: the generated share pages are HTML only; their scripts are the
          # shell's own modules, checked above. Every page must be the shell in
          # public mode - no navbar, no account, no service-worker registration.
          test -s site/share/fnb.html
          python3 - <<'PY'
          from pathlib import Path
          pages=sorted(Path('site/share').rglob('*.html'))
          assert len(pages)>1, 'share generation produced no promotion pages'
          for page in pages:
              html=page.read_text()
              assert 'data-public="fnb"' in html, f'{page} is not the shell in public mode'
              assert 'src="/shell.js"' in html, f'{page} does not load the shell'
              for banned in ('app-navbar','app-masthead-account','data-masthead-route','rel="manifest"','apple-mobile-web-app','fnb-public-shell','betta-runtime.js'):
                  assert banned not in html, f'{page} still carries {banned}'
          PY
          node .github/tests/font-architecture.test.mjs
          node site/betta-day-periods.test.mjs
          node site/betta-vignette-palettes.test.mjs

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site')
          retired=(
            'environment.js','environment.bundle.js','seasonal-sky.js','atmosphere-shader.js',
            'rain-layer-legacy-weather.js','rain-layer.js','sun-dimmer.js','storm-effects.js',
            'sky-calibration.js','sky-color-renderer.js','cloud-tester.js',
            'phase8-2-fixtures.js','phase8-2-seasonal-clouds.test.mjs'
          )
          for name in retired:
              assert not (root/name).exists(), f'retired weather WebGL file still ships: {name}'

          index=(root/'index.html').read_text()
          sw=(root/'sw.js').read_text()
          betta=(root/'betta-environment.js').read_text()

          # r18: the legacy shell, its pages, the fallback pack and the legacy
          # weather modules are gone. Nothing may bring them back.
          legacy=(
            'login.html','login.js','bootstrap.js','auth-shell.js','app.js','route-registry.js',
            'app-transitions.js','app-glass-runtime.js','footer-route-guard.js','startup-skeleton.js',
            'pwa-version-guard.js','presentation-recovery.js','screen-capture.js','account.html','admin.html',
            'settings.js','settings-route-v3.js','brand.js','hotel-factsheet.js','ihg-history.js','fnb-route.js',
            'business-dashboard.js','onboarding.js','ci.js','ui-system-registry.js',
            'location.js','live-data.js','rain-now.js','weather-authority.js','vendor/html2canvas.min.js'
          )
          precache=re.search(r"const SHELL=\[(.*?)\];",sw,re.S).group(1)
          for name in legacy:
              assert not (root/name).exists(), f'legacy source deleted in r18 is back: {name}'
              assert f"'/{name}'" not in precache, f'legacy source in the service-worker precache: {name}'
              assert f'/{name}' not in index, f'legacy source referenced by the shell: {name}'
          assert not (root/'fallback').exists(), 'the fallback pack was retired in r18'

          assert "sindhorn-midtown-internal-pwa-v41-performance-r1" in sw
          for name in retired:
              assert f"'/{name}'" not in sw, f'retired file remains in service-worker cache: {name}'
              assert f'/{name}' not in index, f'retired file remains in app shell: {name}'

          # Performance audit: the tree-shaken Betta bundle is the only Three.js
          # payload in the install path. The shell imports it directly; the
          # public /share pages are the same shell, so it is the only runtime.
          shell_js=(root/'shell.js').read_text()
          assert "'/betta-runtime-full.js'" in sw and "'/betta-runtime-full.js?v=1'" in sw
          assert "import('/betta-runtime-full.js?v=1')" in shell_js
          assert "'/vendor/three.module.js'" not in sw
          assert (root/'vendor/three.module.js').exists(), 'Three source must remain available for reproducible Betta builds'
          # r30: the Supabase presentation pack that served /share retired.
          # Nothing may bring it back, and the shell must not reference it.
          share_pack=('betta-runtime.js','shell.css','environment.css','fnb.js','fnb-data.js','fnb-share-ui.js',
            'fnb-artwork-sync.js','fnb.css','fnb-approved-polish.css','fnb-refinements.css','fnb-layout-stability.css')
          for name in share_pack:
              assert not (root/name).exists(), f'share pack retired in r30 is back: {name}'
              assert f"'/{name}'" not in precache, f'share pack file in the service-worker precache: {name}'
              assert f'/{name}' not in index, f'share pack file referenced by the shell: {name}'
          assert 'export function selectField' not in (root/'app-select.js').read_text(), 'the legacy F&B selector retired in r30'
          # r31: the standalone business card document, its renderer, its
          # dialog standard and the override sheet retired; the card is the
          # shell in public mode, served by site/_worker.js on every path.
          card_legacy=('business-card.html','business-card-public.js','business-card-renderer.js','business-card-component.css',
            'business-card-public.css','settings-dialog-standard.css','settings-dialog-standard.js','app-shapes.css')
          for name in card_legacy:
              assert not (root/name).exists(), f'business card file retired in r31 is back: {name}'
              assert f"'/{name}'" not in precache, f'retired business card file in the service-worker precache: {name}'
              assert f'/{name}' not in index, f'retired business card file referenced by the shell: {name}'
          assert not Path('functions').exists(), 'functions/ is never deployed beside _worker.js (advanced mode); the card lives in site/_worker.js'
          routes=json.loads((root/'_routes.json').read_text())
          assert '/*' in routes['include'], 'site/_routes.json must send every path through _worker.js so /<slug> reaches the card'
          worker=(root/'_worker.js').read_text()
          assert "from './public-page.js'" in worker and "from './business-card-core.js'" in worker and 'env.ASSETS.fetch(request)' in worker
          assert "'/business-card-page.js'" in precache, 'Settings > Me imports business-card-page.js; it must be precached'
          # The shell only registers its service worker in the app, never on a
          # public page, and the sky mode contract must hold in the engine.
          assert "['fnb', 'card'].includes(document.body.dataset.public)" in shell_js and '!PUBLIC' in shell_js
          assert "setBettaMode" in betta and "prefers-reduced-motion: reduce" in betta and "'sindhorn-midtown:betta-mode:v1'" in betta
          assert '/shell.js' in index and 'manifest.webmanifest?v=5' in index
          redirects=(root/'_redirects').read_text()
          for line in ('/next / 301','/login.html / 301','/fnb /#fnb 301','/messages /#messages 301','/settings /#settings/me 301','/admin /#settings/admin 301','/hotel-factsheet /#brand/factsheet 301'):
              assert line in redirects, f'missing r17 redirect: {line}'
          assert "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" in betta
          assert "dataset.environmentInput='satellite-only'" in betta
          assert 'const DPR=2' in betta and 'preserveDrawingBuffer:false' in betta
          assert 'startSatelliteStream' in betta

          # The shell routes by hash inside one document; no page movement API.
          assert 'startViewTransition' not in shell_js
          for name in ('today','fnb','messages','brand','settings','signin','card'):
              assert f"{name}:" in shell_js, f'shell route missing: {name}'

          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'

          migration=Path('supabase/migrations/20260831121436_archive_legacy_weather_webgl_sources.sql').read_text()
          assert 'private.legacy_weather_webgl_archive' in migration
          assert 'enable row level security' in migration.lower()
          assert 'revoke all' in migration.lower()
          PY

      - name: Guard the design system before shipping
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          # These need no deployed URL, so they block the deploy rather than
          # reporting after production has already changed.
          node scripts/ui-centralization-budget.mjs
          node scripts/page-centralization-audit.mjs
          node scripts/shell-precache-parity-smoke.mjs
          node scripts/sw-install-resilience-smoke.mjs
          node scripts/ci-page-render-smoke.mjs
          # Every saved Betta period must still be drawn by its seed under the
          # code about to ship (anon read, no credential). All eight periods
          # have been saved since 5 Sep 2026, so an unsaved period is a
          # regression too: --require-all.
          node scripts/betta-periods-release-smoke.mjs --require-all
          # The IDUI methodology export (docs/idui) is rebuilt from the library
          # at every release and stamped with the service-worker VERSION; a
          # stale export fails here rather than drifting from the app.
          node scripts/build-idui.mjs --check

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke deployed shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          else
            PREVIEW_BRANCH="${GITHUB_REF_NAME:0:28}"
            PREVIEW_BRANCH="${PREVIEW_BRANCH%-}"
            BASE_URL="https://${PREVIEW_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi

          retired_clean(){
            local retired result code type
            for retired in environment.js environment.bundle.js seasonal-sky.js atmosphere-shader.js rain-layer-legacy-weather.js rain-layer.js sun-dimmer.js storm-effects.js sky-calibration.js sky-color-renderer.js cloud-tester.js phase8-2-fixtures.js phase8-2-seasonal-clouds.test.mjs; do
              result=$(curl --silent --show-error --location --output /tmp/retired-response --write-out '%{http_code}|%{content_type}' "${BASE_URL}/${retired}") || return 1
              code="${result%%|*}"
              type="${result#*|}"
              if [ "$code" = "200" ]; then
                case "$type" in text/html*) ;; *) return 1 ;; esac
                grep -qi '<!doctype html\|<html' /tmp/retired-response || return 1
              elif [ "$code" != "404" ]; then
                return 1
              fi
            done
          }

          # Cloudflare's stable branch aliases can lag the immutable deployment
          # URL. Wait for the alias to expose this exact cache generation AND for
          # every retired source path to stop serving JavaScript; never accept a
          # stale deployment as success.
          # The generation is the VERSION of the service worker in this checkout,
          # so the post-deploy smokes never run against the previous shell.
          expected_version=$(grep -o "const VERSION='[^']*'" site/sw.js | head -1)
          test -n "$expected_version"
          promoted=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js \
              && grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/sw.js \
              && grep -qF "$expected_version" /tmp/sw.js \
              && retired_clean; then
                promoted=true
                break
            fi
            sleep 3
          done
          test "$promoted" = true

          paths=(
            / /fnb /messages /settings /account /admin /shell.js /auth-client.js
            /today.js /business-dashboard-data.js /betta-runtime-full.js /betta-environment.js
            /notification-inbox.js /broadcast-inbox.js /push-client.js
            /manifest.webmanifest /sw.js /share/fnb
          )
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html
          curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js
          curl --fail --silent --show-error --location "${BASE_URL}/betta-environment.js" -o /tmp/betta.js
          ! grep -q '/rain-layer.js' /tmp/root.html
          ! grep -q '/sun-dimmer.js' /tmp/root.html
          grep -q 'src="/shell.js"' /tmp/root.html
          grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/sw.js
          ! grep -q "'/vendor/three.module.js'" /tmp/sw.js
          ! grep -q "'/bootstrap.js'" /tmp/sw.js
          # r18: deleted sources must not be served as JavaScript. The query
          # string bypasses edge entries a colo may still hold from an older
          # deployment (nothing references these paths, so they can only age
          # out), so this proves the deployment rather than the cache.
          for legacy in bootstrap.js route-registry.js auth-shell.js login.js location.js business-card-public.js business-card-renderer.js; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${BASE_URL}/${legacy}?deploy=${GITHUB_SHA}")
            ctype=$(curl --silent --show-error --location --output /dev/null --write-out '%{content_type}' "${BASE_URL}/${legacy}?deploy=${GITHUB_SHA}")
            case "$code:$ctype" in 404:*|200:text/html*) ;; *) echo "legacy ${legacy} still served (${code} ${ctype})"; exit 1 ;; esac
          done
          grep -q "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" /tmp/betta.js
          grep -q "dataset.environmentInput='satellite-only'" /tmp/betta.js
          # r31: the Pages worker answers every six-character path with the
          # shell in card mode (an unknown slug shows the page's unavailable
          # state) and /<slug>.vcf with a contact or a 404 - never the SPA
          # fallback. Proven on a slug no card can own, so the check does not
          # depend on any employee's card being published.
          card=$(curl --silent --show-error --location --output /tmp/card.html --write-out '%{http_code}|%{content_type}' "${BASE_URL}/zzzzz0?deploy=${GITHUB_SHA}")
          case "$card" in 200\|text/html*) ;; *) echo "card route not served by the worker (${card})"; exit 1 ;; esac
          grep -q 'data-public="card"' /tmp/card.html
          grep -q 'data-public-id="zzzzz0"' /tmp/card.html
          ! grep -q 'app-navbar' /tmp/card.html
          ! grep -q 'rel="manifest"' /tmp/card.html
          vcf=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${BASE_URL}/zzzzz0.vcf?deploy=${GITHUB_SHA}")
          test "$vcf" = "404"
          # The shell itself and its modules still come from the asset store
          # through the worker's passthrough.
          curl --fail --silent --show-error --location "${BASE_URL}/?deploy=${GITHUB_SHA}" -o /tmp/root2.html
          ! grep -q 'data-public=' /tmp/root2.html
          type=$(curl --silent --show-error --location --output /dev/null --write-out '%{content_type}' "${BASE_URL}/shell.js?deploy=${GITHUB_SHA}")
          case "$type" in *javascript*) ;; *) echo "shell.js not served as JavaScript through the worker (${type})"; exit 1 ;; esac


      - name: Sign into the live shell with the CI test account
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          BASE_URL: https://sindhorn-midtown-internal.pages.dev
          CI_SMOKE_EMPLOYEE_NUMBER: ${{ secrets.CI_SMOKE_EMPLOYEE_NUMBER }}
          CI_SMOKE_PIN: ${{ secrets.CI_SMOKE_PIN }}
        run: |
          set -euo pipefail
          # The new shell gates every route behind sign-in, so its pages can
          # only be proven on the live URL with a real session. Credentials
          # come from repository secrets and are never echoed.
          node scripts/next-signin-smoke.mjs

      - name: Guard the glass material on the live app
        shell: bash
        env:
          BASE_URL: https://sindhorn-midtown-internal.pages.dev
        run: |
          set -euo pipefail
          # These need a deployed URL, so they necessarily verify after the fact.
          # A failure here means the live app regressed and must be rolled back.
          node scripts/nested-glass-smoke.mjs
          # ci-glass-browser-smoke tested /ci as an SPA route: it waits for the shell
          # masthead, tabbar and window.SindhornUiLibrary, none of which exist on a
          # standalone page. Superseded by ci-page-render-smoke, which asserts 17
          # components instead of a probe list and runs before the deploy, not after.
          # glass-route, utility-action and pull-refresh browser smokes injected the
          # legacy bootstrap into /fnb, /settings and /hotel-factsheet; those paths
          # redirect to the r17 shell, whose material nested-glass-smoke now covers.
