name: Phase 6 Pages Preview

on:
  push:
    branches:
      - phase6-web-push
    paths:
      - "site/**"
      - "worker/**"
      - ".github/workflows/phase6-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: sindhorn-midtown-phase6-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Phase 6 source
        shell: bash
        run: |
          set -euo pipefail
          node --check site/push-config.js
          node --check site/push-client.js
          node --check site/sw.js
          node --check worker/src/index.js
          grep -q '/push-client.js?v=1' site/index.html
          grep -q "pushManager.subscribe" site/push-client.js
          grep -q "enableFromGesture" site/push-client.js
          ! grep -q "Notification.requestPermission" site/push-client.js
          grep -q "'/vapid-public-key'" site/push-client.js
          grep -q "'/subscribe'" site/push-client.js
          grep -q "pwa-v18-web-push" site/sw.js
          grep -q "addEventListener('push'" site/sw.js
          grep -q "addEventListener('notificationclick'" site/sw.js
          grep -q "buildPushPayload" worker/src/index.js
          grep -q "scheduled" worker/src/index.js
          grep -q "push_subscriptions" worker/src/index.js
          grep -q "monitor_state" worker/src/index.js

      - name: Install Worker dependency
        run: npm install --prefix worker --no-audit --no-fund

      - name: Ensure D1 database and bind local config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 d1 list --json > /tmp/d1-list.json
          DB_ID="$(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/d1-list.json'))
          if isinstance(rows,dict): rows=rows.get('result') or rows.get('databases') or []
          for row in rows:
              if row.get('name')=='sindhorn-midtown-alerts':
                  print(row.get('uuid') or row.get('id') or row.get('database_id') or '')
                  break
          PY
          )"
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@4.125.0 d1 create sindhorn-midtown-alerts --json > /tmp/d1-create.json
            DB_ID="$(python3 - <<'PY'
          import json
          row=json.load(open('/tmp/d1-create.json'))
          if isinstance(row,dict) and isinstance(row.get('result'),dict): row=row['result']
          print(row.get('uuid') or row.get('id') or row.get('database_id') or '')
          PY
            )"
          fi
          test -n "$DB_ID"
          DB_ID="$DB_ID" python3 - <<'PY'
          import json,os
          path='worker/wrangler.jsonc'
          data=json.load(open(path))
          data['d1_databases']=[{'binding':'DB','database_name':'sindhorn-midtown-alerts','database_id':os.environ['DB_ID']}]
          open(path,'w').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          npx --yes wrangler@4.125.0 deploy --dry-run --config worker/wrangler.jsonc --outdir /tmp/phase6-worker
          test -n "$(find /tmp/phase6-worker -type f -maxdepth 2 -print -quit)"

      - name: Deploy initial alert Worker
        run: npx --yes wrangler@4.125.0 deploy --config worker/wrangler.jsonc

      - name: Provision stable VAPID secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS="$(npx --yes wrangler@4.125.0 secret list --config worker/wrangler.jsonc --format json 2>/dev/null || printf '[]')"
          HAS_PUBLIC="$(printf '%s' "$SECRETS" | jq -r 'map(.name) | index("VAPID_SERVER_PUBLIC_KEY") != null')"
          HAS_PRIVATE="$(printf '%s' "$SECRETS" | jq -r 'map(.name) | index("VAPID_SERVER_PRIVATE_KEY") != null')"
          if [ "$HAS_PUBLIC" != "true" ] || [ "$HAS_PRIVATE" != "true" ]; then
            mkdir -p /tmp/vapidgen
            cd /tmp/vapidgen
            npm init -y >/dev/null 2>&1
            npm install web-push@3.6.7 --no-audit --no-fund >/dev/null 2>&1
            node - <<'NODE' >/tmp/vapid.json
          const webpush=require('/tmp/vapidgen/node_modules/web-push');
          process.stdout.write(JSON.stringify(webpush.generateVAPIDKeys()));
          NODE
            cd "$GITHUB_WORKSPACE"
            jq -r '.publicKey' /tmp/vapid.json | npx --yes wrangler@4.125.0 secret put VAPID_SERVER_PUBLIC_KEY --config worker/wrangler.jsonc
            jq -r '.privateKey' /tmp/vapid.json | npx --yes wrangler@4.125.0 secret put VAPID_SERVER_PRIVATE_KEY --config worker/wrangler.jsonc
            rm -f /tmp/vapid.json
          fi

      - name: Deploy configured alert Worker
        run: npx --yes wrangler@4.125.0 deploy --config worker/wrangler.jsonc

      - name: Resolve Worker URL and bind local client
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success") and d.get("result",{}).get("subdomain"); print(d["result"]["subdomain"])')"
          WORKER_URL="https://sindhorn-midtown-alerts.${SUBDOMAIN}.workers.dev"
          printf "export const PUSH_API_BASE='%s';\n" "$WORKER_URL" > site/push-config.js
          echo "worker_url=${WORKER_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify Worker health and VAPID
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${WORKER_URL}/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('service')=='sindhorn-midtown-alerts'
          assert d.get('vapidConfigured') is True
          assert isinstance(d.get('subscriptions'),int)
          PY
          ORIGIN="https://phase6-web-push.sindhorn-midtown-internal.pages.dev"
          curl --fail --silent --show-error -H "Origin: ${ORIGIN}" "${WORKER_URL}/vapid-public-key" -o /tmp/key.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/key.json'))
          assert isinstance(d.get('publicKey'),str) and len(d['publicKey'])>50
          PY

      - name: Deploy Pages branch preview
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          BASE_URL="https://phase6-web-push.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /guidance /details /push-config.js /push-client.js /sw.js /app.js /environment.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          curl --fail --silent --show-error "${BASE_URL}/push-config.js" -o /tmp/push-config
          grep -Fq "${WORKER_URL}" /tmp/push-config
          curl --fail --silent --show-error "${BASE_URL}/push-client.js" -o /tmp/push-client
          grep -q "pushManager.subscribe" /tmp/push-client
          grep -q "enableFromGesture" /tmp/push-client
          ! grep -q "Notification.requestPermission" /tmp/push-client
          curl --fail --silent --show-error "${BASE_URL}/sw.js" -o /tmp/sw
          grep -q "pwa-v18-web-push" /tmp/sw
          grep -q "addEventListener('push'" /tmp/sw
          grep -q "addEventListener('notificationclick'" /tmp/sw

      - name: Commit verified Cloudflare bindings to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- worker/wrangler.jsonc site/push-config.js; then
            git add worker/wrangler.jsonc site/push-config.js
            git commit -m "Bind Phase 6 Web Push Cloudflare resources"
            git push origin HEAD:phase6-web-push
          fi
