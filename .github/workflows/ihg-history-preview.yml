name: IHG History Preview

on:
  push:
    branches: [preview-ihg-history]
    paths:
      - "site/route-registry.js"
      - "site/_redirects"
      - "site/ihg-history.js"
      - "site/ihg-history-data.js"
      - "site/ihg-history.css"
      - "scripts/ihg-history-browser-smoke.mjs"
      - ".github/workflows/ihg-history-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ihg-history-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate isolated route and history data
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < site/ihg-history.js
          node --input-type=module --check < site/ihg-history-data.js
          node --input-type=module --check < site/route-registry.js
          node --input-type=module --check < scripts/ihg-history-browser-smoke.mjs
          node --experimental-default-type=module --input-type=module <<'NODE'
          import {IHG_HISTORY_PERIODS,IHG_HISTORY_SOURCE} from './site/ihg-history-data.js';
          const counts=IHG_HISTORY_PERIODS.map(period=>period.milestones.length);
          const milestones=counts.reduce((sum,n)=>sum+n,0);
          if(IHG_HISTORY_PERIODS.length!==10)throw new Error(`Expected 10 periods, found ${IHG_HISTORY_PERIODS.length}`);
          if(milestones!==76)throw new Error(`Expected 76 milestones, found ${milestones}`);
          if(IHG_HISTORY_PERIODS[0].period!=='1777–1899')throw new Error('Opening period mismatch');
          if(IHG_HISTORY_PERIODS.at(-1).period!=='2020–Present')throw new Error('Closing period mismatch');
          if(IHG_HISTORY_PERIODS.at(-1).milestones.at(-1)[0]!=='2026')throw new Error('Latest milestone is not 2026');
          if(!IHG_HISTORY_PERIODS.at(-1).milestones.at(-1)[1].includes('Noted Collection'))throw new Error('Latest Noted Collection milestone missing');
          if(IHG_HISTORY_SOURCE!=='https://www.ihgplc.com/en/about-us/our-history')throw new Error('Official source URL mismatch');
          console.log(JSON.stringify({periods:IHG_HISTORY_PERIODS.length,milestones,counts}));
          NODE
          grep -q "path:'/ihg-history'" site/route-registry.js
          grep -q "^/ihg-history / 200$" site/_redirects
          grep -q 'aria-expanded="false"' site/ihg-history.js
          grep -q 'aria-hidden="true"' site/ihg-history.js
          grep -q 'LINE Seed Sans TH' site/fonts.css
          grep -q 'letter-spacing:0!important' site/ihg-history.css
          ! grep -qiE 'Poppins|Noto|IBM Plex|Vignette Sans' site/ihg-history.css site/ihg-history.js site/ihg-history-data.js
          ! grep -qi 'ihg.history' site/footer-route-guard.js

      - name: Verify protected production modules unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          for file in \
            site/footer-route-guard.js site/footer-route-guard.css \
            site/fnb.js site/fnb.css site/fnb-data.js site/fnb-approved-polish.css \
            site/app.js site/bootstrap.js site/auth-shell.js site/auth-client.js \
            site/capabilities.js site/settings.js site/settings-route-v3.js site/settings.css site/settings-refinements.css \
            site/environment.js site/atmosphere-shader.js site/rain-now.js site/rain-layer.js \
            site/seasonal-sky.js site/weather-authority.js site/sw.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw route and module smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /ihg-history /ihg-history.js /ihg-history-data.js /ihg-history.css /route-registry.js /fnb /settings; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          curl --fail --silent --show-error "${BASE_URL}/ihg-history.js" -o /tmp/history.js
          grep -q 'mountIhgHistoryRoute' /tmp/history.js
          curl --fail --silent --show-error "${BASE_URL}/ihg-history-data.js" -o /tmp/history-data.js
          grep -q 'Noted Collection' /tmp/history-data.js
          curl --fail --silent --show-error "${BASE_URL}/route-registry.js" -o /tmp/routes.js
          grep -q "path:'/settings'" /tmp/routes.js
          grep -q "path:'/ihg-history'" /tmp/routes.js

      - name: Mobile browser and visual parity smoke
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/ihg-history-parity
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/ihg-history-browser-smoke.mjs | tee /tmp/ihg-history-browser-report.json

      - name: Upload parity screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ihg-history-parity-screenshots
          path: |
            /tmp/ihg-history-parity
            /tmp/ihg-history-browser-report.json
          if-no-files-found: warn
          retention-days: 14
