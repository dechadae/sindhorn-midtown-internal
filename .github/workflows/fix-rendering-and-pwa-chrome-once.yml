name: Fix PM2.5 rendering and PWA chrome
on:
  push:
    branches: [fix-rendering-and-pwa-chrome]
    paths: ['.github/workflows/fix-rendering-and-pwa-chrome-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Apply renderer, layout and fullscreen fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Overfill the fixed atmosphere slightly so mobile dynamic-viewport rounding
          # can never expose a rectangular canvas edge.
          p=Path('site/environment.css')
          s=p.read_text()
          old='.environment-stage{position:fixed;z-index:0;inset:0;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;transform:translateZ(0);background:'
          new='.environment-stage{position:fixed;z-index:0;inset:-12px;width:auto;height:auto;min-width:calc(100% + 24px);min-height:calc(100dvh + 24px);overflow:hidden;transform:translateZ(0);background:'
          assert old in s
          s=s.replace(old,new,1)
          old='.environment-canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .75s cubic-bezier(.2,.75,.2,1)}'
          new='.environment-canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;opacity:0;transform:translateZ(0);transform-origin:50% 50%;will-change:opacity,transform;transition:opacity .75s cubic-bezier(.2,.75,.2,1)}'
          assert old in s
          s=s.replace(old,new,1)
          old='.environment-stage{height:100dvh;min-height:100dvh}'
          new='.environment-stage{height:auto;min-height:calc(100dvh + 24px)}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Make clouds softer and continuous, while lowering mobile fill cost enough
          # to render at native refresh instead of the previous 30fps cap.
          p=Path('site/environment.js')
          s=p.read_text()
          old='float fbm(vec2 p){float v=0.,a=.52;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+17.13;a*=.5;}return v;}'
          new='float fbm(vec2 p){float v=0.,a=.52;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+17.13;a*=.5;}return v;}'
          assert old in s
          s=s.replace(old,new,1)
          old='''      float cloudiness=uCloud*uWeatherKnown;\n      vec2 wind=uWind*uTime*.035;\n      float cloudNoise=fbm(fieldUv*vec2(3.2,2.1)+wind+vec2(0.,uTime*.002));\n      float cloudMask=smoothstep(.52-.26*cloudiness,.82-.34*cloudiness,cloudNoise)*cloudiness;'''
          new='''      float cloudiness=uCloud*uWeatherKnown;\n      vec2 wind=uWind*uTime*.028;\n      vec2 cloudUv=fieldUv*vec2(1.55,1.02)+wind*.65;\n      float broad=fbm(cloudUv+vec2(0.,uTime*.0012));\n      float detail=fbm(cloudUv*1.73+vec2(broad*.45,-broad*.28)+wind*.35+vec2(9.7,3.4));\n      float cloudNoise=mix(broad,detail,.38);\n      float cloudMask=smoothstep(.49-.22*cloudiness,.82-.30*cloudiness,cloudNoise)*cloudiness;\n      cloudMask*=smoothstep(.00,.18,uv.y);'''
          assert old in s
          s=s.replace(old,new,1)
          old="const renderer = new THREE.WebGLRenderer({"
          new="const lowPowerDevice=((navigator.deviceMemory||8)<=4)||((navigator.hardwareConcurrency||8)<=4);\n\nconst renderer = new THREE.WebGLRenderer({"
          assert old in s
          s=s.replace(old,new,1)
          old='renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));'
          new='renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowPowerDevice ? 1.0 : 1.25));'
          assert old in s
          s=s.replace(old,new,1)
          old='''  if (!reducedMotion && now - lastFrame < 32) {\n    raf = requestAnimationFrame(render);\n    return;\n  }'''
          new='''  if (!reducedMotion && now - lastFrame < 15) {\n    raf = requestAnimationFrame(render);\n    return;\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Move Save Compact Image below the realtime weather block, which makes it
          # the final control on the Today route instead of interrupting the live report.
          p=Path('site/index.html')
          s=p.read_text()
          save='''  <div class="report-actionbar">\n    <button class="action quick-save" type="button" id="saveImageBtn">Save compact image / <span lang="th">บันทึกภาพ</span></button>\n  </div>\n\n'''
          assert s.count(save)==1
          s=s.replace(save,'',1)
          weather_end='''    <a class="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather data by Open-Meteo.com</a>\n  </div>\n'''
          assert weather_end in s
          s=s.replace(weather_end,weather_end+'\n'+save,1)
          p.write_text(s)

          # 4) Make the Save control use the same smoked/frosted material as the native
          # tab bar, and guarantee the masthead remains at the physical top in fullscreen.
          p=Path('site/pwa.css')
          s=p.read_text()
          s += '''\n\n/* v6 rendering + native chrome polish */\nbody.environment-ready .report-actionbar{position:relative;z-index:6;margin:24px 0 4px;padding:0}\nbody.environment-ready .report-actionbar .quick-save{min-height:58px;border:1px solid rgba(255,255,255,.22)!important;border-radius:22px!important;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(28,25,35,.52))!important;color:#FAF7F5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.055),0 14px 36px rgba(13,11,18,.18)!important;backdrop-filter:blur(28px) saturate(175%) contrast(1.03);-webkit-backdrop-filter:blur(28px) saturate(175%) contrast(1.03);transition:transform .12s ease,background-color .18s ease,border-color .18s ease}\nbody.environment-ready .report-actionbar .quick-save:active{transform:scale(.985)}\nbody.environment-ready .app-tabbar{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(27,24,34,.58));border-color:rgba(255,255,255,.21);backdrop-filter:blur(32px) saturate(175%) contrast(1.04);-webkit-backdrop-filter:blur(32px) saturate(175%) contrast(1.04)}\nbody.is-fullscreen .masthead{position:fixed!important;top:0!important;left:0;right:0;width:100%;z-index:110!important}\nbody.is-fullscreen main{padding-top:clamp(78px,20vw,92px)}\n@media (prefers-reduced-motion:reduce){body.environment-ready .report-actionbar .quick-save{transition:none}}\n'''
          p.write_text(s)

          # 5) Force installed PWAs to replace the old cached shell immediately.
          p=Path('site/sw.js')
          s=p.read_text()
          assert "sindhorn-midtown-internal-pwa-v5" in s
          s=s.replace("sindhorn-midtown-internal-pwa-v5","sindhorn-midtown-internal-pwa-v6",1)
          p.write_text(s)

          Path('site/version.txt').write_text(
            'production-build: main\n'
            'rendering-fix: seamless-cloud-field-v6\n'
            'pwa-spa: fullscreen-top-header-frosted-save-v6\n'
          )
          PY

      - name: Rebuild flat-background branded install icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root=Path('site')
          logo=Image.open(root/'assets/brand/sindhorn-midtown-vignette-white.png').convert('RGBA')
          bg=(46,39,59,255)  # exactly manifest background_color, so Android splash masking disappears visually

          def icon(size, fraction):
              im=Image.new('RGBA',(size,size),bg)
              maxw=int(size*fraction)
              scale=maxw/logo.width
              h=max(1,int(logo.height*scale))
              mark=logo.resize((maxw,h),Image.Resampling.LANCZOS)
              im.alpha_composite(mark,((size-maxw)//2,(size-h)//2))
              return im.convert('RGB')

          icons=root/'icons'
          icon(512,.68).save(icons/'app-512.png',optimize=True)
          icon(192,.68).save(icons/'app-192.png',optimize=True)
          icon(180,.66).save(icons/'apple-touch-icon.png',optimize=True)
          icon(512,.56).save(icons/'maskable-512.png',optimize=True)

          # Assert all four corners match the manifest splash background exactly.
          for name in ['app-512.png','app-192.png','apple-touch-icon.png','maskable-512.png']:
              im=Image.open(icons/name).convert('RGB')
              expected=bg[:3]
              pts=[(0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)]
              assert all(im.getpixel(pt)==expected for pt in pts), name
          PY

      - name: Rebuild bundled Three.js environment
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js

      - name: Static verification
        run: |
          grep -q 'inset:-12px' site/environment.css
          grep -q 'cloudUv=fieldUv' site/environment.js
          grep -q 'cloudUv=fieldUv' site/environment.bundle.js
          grep -q 'lowPowerDevice' site/environment.bundle.js
          grep -q 'pwa-v6' site/sw.js
          grep -q 'body.is-fullscreen .masthead' site/pwa.css
          test "$(grep -o 'id="saveImageBtn"' site/index.html | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          s=Path('site/index.html').read_text()
          assert s.index('id="weatherNow"') < s.index('id="saveImageBtn"') < s.index('id="adviceTitle"')
          PY

      - name: Browser QA at mobile viewport
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/pm25-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/check.cjs <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            const info=await page.evaluate(()=>{
              const stage=document.getElementById('environmentStage');
              const save=document.getElementById('saveImageBtn');
              const weather=document.getElementById('weatherNow');
              const mast=document.querySelector('.masthead');
              const rect=stage.getBoundingClientRect();
              const saveStyle=getComputedStyle(save);
              document.body.classList.add('is-fullscreen');
              const mastStyle=getComputedStyle(mast);
              return {
                stage:{x:rect.x,y:rect.y,w:rect.width,h:rect.height},
                saveAfterWeather:!!(weather.compareDocumentPosition(save)&Node.DOCUMENT_POSITION_FOLLOWING),
                saveBackdrop:saveStyle.backdropFilter||saveStyle.webkitBackdropFilter,
                mastPosition:mastStyle.position,
                mastTop:mastStyle.top,
                nav:!!document.querySelector('.app-tabbar'),
                webgl:!!document.getElementById('environmentCanvas')
              };
            });
            console.log(JSON.stringify(info));
            if(info.stage.x>-8||info.stage.y>-8||info.stage.w<406||info.stage.h<860)throw new Error('atmosphere does not overfill viewport');
            if(!info.saveAfterWeather)throw new Error('save button is not below weather');
            if(!info.saveBackdrop||info.saveBackdrop==='none')throw new Error('save control is not frosted glass');
            if(info.mastPosition!=='fixed'||parseFloat(info.mastTop)!==0)throw new Error('fullscreen masthead is not fixed at top');
            if(!info.nav||!info.webgl)throw new Error('app chrome or WebGL missing');
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'/tmp/pm25-v6-qa.png',fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check.cjs

      - name: Commit fixes and remove helper
        run: |
          rm -f .github/workflows/fix-rendering-and-pwa-chrome-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site .github/workflows/fix-rendering-and-pwa-chrome-once.yml
          git commit -m "Fix seamless atmosphere and native PWA chrome"
          git push origin HEAD:fix-rendering-and-pwa-chrome
