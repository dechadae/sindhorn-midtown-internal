name: Today Motion Lab Preview

on:
  push:
    branches:
      - lab-today-motion
    paths:
      - "site/today-motion-lab.html"
      - "site/today-motion-lab.css"
      - "site/today-motion-lab.js"
      - "site/betta-runtime.js"
      - "site/environment.css"
      - ".github/workflows/today-motion-lab-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: today-motion-lab-preview
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Validate isolated lab
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < site/today-motion-lab.js
          grep -Fq 'Progress experiment · synthetic data' site/today-motion-lab.html
          grep -Fq 'today-motion-lab.js?v=4' site/today-motion-lab.html
          grep -Fq "__TODAY_PROGRESS_LAB_VERSION__='v4-raf'" site/today-motion-lab.js
          grep -Fq 'data-progress-card' site/today-motion-lab.html
          ! grep -Fq 'lab-scan' site/today-motion-lab.html
          ! grep -Fq 'data-progress-line' site/today-motion-lab.html
          ! grep -Fq '/rest/v1/' site/today-motion-lab.js
      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch=lab-today-motion
      - name: Smoke exact lab generation
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://lab-today-motion.sindhorn-midtown-internal.pages.dev"
          promoted=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "${BASE_URL}/today-motion-lab.html" -o /tmp/lab.html \
              && grep -Fq 'today-motion-lab.js?v=4' /tmp/lab.html \
              && curl --fail --silent --show-error --location "${BASE_URL}/today-motion-lab.js?v=4" -o /tmp/lab.js \
              && grep -Fq "__TODAY_PROGRESS_LAB_VERSION__='v4-raf'" /tmp/lab.js; then
              promoted=true
              break
            fi
            sleep 3
          done
          test "$promoted" = true
          for path in /today-motion-lab.css?v=2 /betta-runtime.js /environment.css /assets/brand/sindhorn-midtown-vignette-white.png; do
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/lab-asset
            test -s /tmp/lab-asset
          done
      - name: Validate mobile progress animation in Chromium
        env:
          BASE_URL: https://lab-today-motion.sindhorn-midtown-internal.pages.dev
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module - <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
          const errors=[];page.on('pageerror',error=>errors.push(String(error)));
          await page.goto(`${process.env.BASE_URL}/today-motion-lab.html`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>window.__TODAY_PROGRESS_LAB_VERSION__==='v4-raf',{timeout:30000});
          const fill=page.locator('[data-progress-card]').first().locator('.lab-progress i');
          const scale=async()=>fill.evaluate(node=>new DOMMatrixReadOnly(getComputedStyle(node).transform).a);
          await page.waitForFunction(()=>{
            const node=document.querySelector('[data-progress-card] .lab-progress i');
            if(!node)return false;
            return new DOMMatrixReadOnly(getComputedStyle(node).transform).a>.82;
          },{timeout:5000});
          const before=await scale();
          await page.locator('[data-replay]').click();
          await page.waitForTimeout(120);
          const during=await scale();
          await page.waitForFunction(()=>{
            const node=document.querySelector('[data-progress-card] .lab-progress i');
            if(!node)return false;
            return new DOMMatrixReadOnly(getComputedStyle(node).transform).a>.82;
          },{timeout:5000});
          const after=await scale();
          const state=await page.evaluate(()=>({cards:document.querySelectorAll('[data-progress-card]').length,globalPulse:!!document.querySelector('[data-progress-line]'),scan:!!document.querySelector('.lab-scan'),version:window.__TODAY_PROGRESS_LAB_VERSION__}));
          if(state.cards!==8||state.globalPulse||state.scan||state.version!=='v4-raf')throw new Error(`lab structure failed ${JSON.stringify(state)}`);
          if(!(before>.82&&during>=0&&during<before*.8&&after>before*.98))throw new Error(`progress replay did not animate smoothly: ${before} | ${during} | ${after}`);
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('TODAY_PROGRESS_LAB_PASS',JSON.stringify({before,during,after,...state}));
          await browser.close();
          NODE
