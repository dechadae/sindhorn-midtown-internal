name: PWA SPA browser QA
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/pwa-spa-qa-once.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Endpoint checks
        run: |
          BASE='https://webgl-environment-v1.sindhorn-midtown-internal.pages.dev'
          curl -fsS "$BASE/" >/tmp/root.html
          curl -fsS "$BASE/guidance" >/tmp/guidance.html
          curl -fsS "$BASE/details" >/tmp/details.html
          curl -fsS "$BASE/manifest.webmanifest" | python3 -m json.tool >/dev/null
          curl -fsS "$BASE/icons/app-192.png" >/dev/null
          curl -fsS "$BASE/icons/app-512.png" >/dev/null
          grep -q 'fullscreenToggle' /tmp/root.html
          grep -q 'manifest.webmanifest' /tmp/root.html
      - name: Browser checks
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.cjs <<'EOF'
          const {chromium}=require('playwright');
          const BASE='https://webgl-environment-v1.sindhorn-midtown-internal.pages.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:390,height:844},{width:1440,height:1000}]){
              const context=await browser.newContext({viewport});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('page:'+e));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await page.goto(BASE+'/',{waitUntil:'networkidle'});
              if(await page.locator('#themeToggle').count())throw new Error('theme toggle remains');
              if(await page.locator('#fullscreenToggle').count()!==1)throw new Error('fullscreen toggle missing');
              if(await page.locator('.app-tabbar a').count()!==3)throw new Error('tabbar missing');
              const order=await page.evaluate(()=>{const r=document.querySelector('#report'),w=document.querySelector('#weatherNow');return !!(r&&w&&(r.compareDocumentPosition(w)&Node.DOCUMENT_POSITION_FOLLOWING));});
              if(!order)throw new Error('PM2.5 is not above weather');
              const navBefore=await page.evaluate(()=>performance.getEntriesByType('navigation').length);
              await page.click('[data-app-route="guidance"]');
              if(new URL(page.url()).pathname!='/guidance')throw new Error('guidance history route failed');
              if(await page.locator('main > .section:not([data-app-route-hidden])').count()<1)throw new Error('guidance has no visible sections');
              await page.click('[data-app-route="details"]');
              if(new URL(page.url()).pathname!='/details')throw new Error('details history route failed');
              if(await page.locator('main > .section:not([data-app-route-hidden])').count()<1)throw new Error('details has no visible sections');
              const navAfter=await page.evaluate(()=>performance.getEntriesByType('navigation').length);
              if(navAfter!==navBefore)throw new Error('SPA navigation caused document reload');
              await page.goto(BASE+'/guidance',{waitUntil:'networkidle'});
              if(new URL(page.url()).pathname!='/guidance')throw new Error('direct guidance route failed');
              const sw=await page.evaluate(async()=>{if(!('serviceWorker'in navigator))return false;const reg=await navigator.serviceWorker.ready;return !!reg.active;});
              if(!sw)throw new Error('service worker not active');
              const manifest=await page.evaluate(()=>document.querySelector('link[rel="manifest"]')?.getAttribute('href'));
              if(manifest!='/manifest.webmanifest')throw new Error('manifest link wrong');
              if(errors.length)throw new Error(errors.join(' | '));
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa.cjs
      - name: Remove QA helper
        if: always()
        run: |
          rm -f .github/workflows/pwa-spa-qa-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add .github/workflows/pwa-spa-qa-once.yml
          git commit -m "Remove one-time PWA SPA QA helper" || true
          git push origin HEAD:webgl-environment-v1 || true
