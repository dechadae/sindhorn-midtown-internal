name: Android Betta Wallpaper

on:
  push:
    branches:
      - android-betta-wallpaper
    paths:
      - "android-betta-wallpaper/**"
      - ".github/workflows/android-betta-wallpaper.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: android-betta-wallpaper
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate OpenGL ES shaders
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          source = pathlib.Path('android-betta-wallpaper/app/src/main/java/com/sindhornmidtown/betta/wallpaper/BettaShaders.kt').read_text()
          shaders = {
              'BACKGROUND_VERTEX': 'vert',
              'BACKGROUND_FRAGMENT': 'frag',
              'FIN_VERTEX': 'vert',
              'FIN_FRAGMENT': 'frag',
          }
          with tempfile.TemporaryDirectory() as tmp:
              for name, stage in shaders.items():
                  match = re.search(rf'const val {name}\s*=\s*"""(.*?)"""', source, re.S)
                  if not match:
                      raise SystemExit(f'Could not extract {name}')
                  path = pathlib.Path(tmp) / f'{name}.{stage}'
                  path.write_text(match.group(1).strip() + '\n')
                  subprocess.run(['glslangValidator', '-S', stage, str(path)], check=True)
          PY

      - name: Guard final Betta parity
        run: python3 android-betta-wallpaper/tools/verify_pwa_parity.py

      - name: Guard Android performance contract
        run: python3 android-betta-wallpaper/tools/verify_performance_contract.py

      - name: Build debug APK
        run: gradle -p android-betta-wallpaper :app:assembleDebug --stacktrace

      - name: Stage direct-download APK
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          cp android-betta-wallpaper/app/build/outputs/apk/debug/app-debug.apk site/downloads/sindhorn-betta-wallpaper.apk
          test -s site/downloads/sindhorn-betta-wallpaper.apk
          python3 - <<'PY'
          import json, os
          path='site/downloads/sindhorn-betta-wallpaper.apk'
          with open('site/downloads/sindhorn-betta-wallpaper.json','w') as f:
              json.dump({'ok':True,'version':'0.1.5','variant':'debug','bytes':os.path.getsize(path)},f)
          PY

      - name: Deploy APK download preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch=android-betta-wallpaper

      - name: Smoke direct APK download
        run: |
          set -euo pipefail
          BASE_URL="https://android-betta-wallpaper.sindhorn-midtown-internal.pages.dev"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${BASE_URL}/downloads/sindhorn-betta-wallpaper.json" -o /tmp/meta.json \
              && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/meta.json'))
          assert d['ok'] is True
          assert d['version'] == '0.1.5'
          assert d['bytes'] > 100000
          PY
            then break; fi
            sleep 3
          done
          curl --fail --silent --show-error --location "${BASE_URL}/downloads/sindhorn-betta-wallpaper.apk" -o /tmp/betta.apk
          test "$(stat -c %s /tmp/betta.apk)" -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: sindhorn-betta-wallpaper-apk
          path: android-betta-wallpaper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
