name: Migrate approved PM2.5 v5 baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-v5.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install migration browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture canonical v5 source from Flipgazine loader
        run: |
          cat > migrate-v5.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const OLD_URL = 'https://flipgazine.pages.dev/sindhornmidtown/pm25.html';
          const NEW_URL = 'https://sindhorn-midtown-internal.pages.dev/';

          function findHtml(value) {
            if (typeof value === 'string' && value.includes('<!doctype html>') && value.includes('Live Air Quality | Sindhorn Midtown Hotel Bangkok')) return value;
            if (Array.isArray(value)) {
              for (const item of value) { const hit = findHtml(item); if (hit) return hit; }
            } else if (value && typeof value === 'object') {
              for (const item of Object.values(value)) { const hit = findHtml(item); if (hit) return hit; }
            }
            return null;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            let captured = null;

            page.on('response', async response => {
              if (captured || !response.url().includes('supabase.co')) return;
              try {
                const text = await response.text();
                if (!text.includes('Live Air Quality | Sindhorn Midtown Hotel Bangkok')) return;
                try { captured = findHtml(JSON.parse(text)); } catch (_) {}
              } catch (_) {}
            });

            await page.goto(OLD_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#pmValue', { timeout: 30000 });
            await page.waitForTimeout(2500);
            await browser.close();

            if (!captured) throw new Error('Could not capture canonical site_files HTML from the live loader');

            captured = captured
              .replaceAll(OLD_URL, NEW_URL)
              .replaceAll('https://flipgazine.pages.dev/sindhornmidtown/pm25.html', NEW_URL);

            if (!captured.includes('Readability-only font-size adjustments v5')) throw new Error('Captured source is not approved v5');
            if (captured.includes('Editorial typography redesign v4')) throw new Error('Captured source contains reverted v4 experiment');

            fs.writeFileSync('site/index.html', captured);
            console.log('Migrated bytes:', Buffer.byteLength(captured));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node migrate-v5.cjs

      - name: Verify migration invariants
        run: |
          grep -q 'Readability-only font-size adjustments v5' site/index.html
          grep -q 'https://sindhorn-midtown-internal.pages.dev/' site/index.html
          ! grep -q 'Editorial typography redesign v4' site/index.html
          ! grep -q 'class="aqi-stamp"' site/index.html
          grep -q 'stations.airbkk.com/api/web/data' site/index.html
          grep -q 'Save compact image' site/index.html

      - name: Commit migrated baseline and remove one-time workflow
        run: |
          rm -f migrate-v5.cjs package.json package-lock.json
          git rm .github/workflows/migrate-v5.yml
          git add site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate approved PM2.5 v5 baseline"
          git push
