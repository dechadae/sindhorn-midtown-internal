name: Edge Glass Footer Preview

on:
  push:
    branches: [ui-edge-glass-footers]
    paths:
      - "site/footer-route-guard.css"
      - "site/index.html"
      - ".github/workflows/footer-glass-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edge-glass-footer-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate centralized footer authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--sm-footer-glass-bg:' site/footer-route-guard.css
          grep -q -- '--sm-footer-glass-filter:blur(26px)' site/footer-route-guard.css
          grep -q '#app-footer .app-tabbar,' site/footer-route-guard.css
          grep -q 'body\[data-route="fnb"\] .fnb-section-rail{' site/footer-route-guard.css
          grep -q 'left:0!important;' site/footer-route-guard.css
          grep -q 'right:0!important;' site/footer-route-guard.css
          grep -q 'border-radius:0!important;' site/footer-route-guard.css
          grep -q '/footer-route-guard.css?v=7' site/index.html

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl -fsS "$BASE_URL/" | grep -q '/footer-route-guard.css?v=7'
          curl -fsS "$BASE_URL/footer-route-guard.css?v=7" | grep -q -- '--sm-footer-glass-bg:'
          curl -fsS "$BASE_URL/footer-route-guard.css?v=7" | grep -q 'border-radius:0!important;'
