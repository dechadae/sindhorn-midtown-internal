          from pathlib import Path
          p=Path('site/sw.js'); s=p.read_text(); s=s.replace("sindhorn-midtown-internal-pwa-v12","sindhorn-midtown-internal-pwa-v13",1)
          old="'/assets/fonts/vignette-sans-light.woff','/assets/fonts/vignette-sans-regular.woff','/assets/fonts/vignette-sans-semibold.woff',\n  '/assets/fonts/ibm-plex-sans-thai-light.woff2','/assets/fonts/ibm-plex-sans-thai-regular.woff2','/assets/fonts/ibm-plex-sans-thai-semibold.woff2'"
          new="'/assets/fonts/noto-sans-200.woff2','/assets/fonts/noto-sans-300.woff2','/assets/fonts/noto-sans-400.woff2','/assets/fonts/noto-sans-500.woff2','/assets/fonts/noto-sans-600.woff2',\n  '/assets/fonts/noto-sans-thai-300.woff2','/assets/fonts/noto-sans-thai-400.woff2','/assets/fonts/noto-sans-thai-500.woff2','/assets/fonts/noto-sans-thai-600.woff2','/vendor/html2canvas.min.js'"
          assert old in s; s=s.replace(old,new,1); p.write_text(s)

          p=Path('site/version.txt'); s=p.read_text(); s += 'environment: weather-first-full-quality-tilt-v13\nui: noto-voice-footer-luxury-transitions-v13\ncapture: full-home-atmosphere-v13\n'; p.write_text(s)

          p=Path('AGENTS.md'); s=p.read_text(); s=s.replace('- Respect `prefers-reduced-motion` and mobile performance constraints.\n- Stop or heavily throttle rendering when hidden or offscreen.', '- The user explicitly requires full atmospheric motion and full visual quality on mobile; do not lower renderer DPR, cloud complexity, animation cadence, or celestial quality relative to desktop.\n- Mobile device tilt is part of the default atmosphere. Use DeviceOrientation continuously where the platform allows it; on iOS request permission from the first user gesture because the OS requires that gesture.\n- Stop rendering only when the document is actually hidden; do not degrade the visible scene.')
          s += '\n## v13 visual authority\n\n- App typography is Noto Sans / Noto Sans Thai throughout UI and content. The official hotel logo remains artwork.\n- Realtime atmosphere resolves **weather first** (sky, sun/moon, clouds, precipitation, visibility), then applies PM2.5 haze/extinction and suspended particulate as the final optical layer.\n- The sticky footer follows the Flipgazine Voice bottom-nav contract: full-width frosted rail with independent compact navigation chips.\n- Save Image means a full-length capture of the Today route atmosphere/content; masthead, sticky footer, app footer and the Save button itself are excluded.\n'; p.write_text(s)

          p=Path('docs/REALTIME-ENVIRONMENT-PLAN.md'); s=p.read_text(); s=s.replace('## Performance\n\n- HTML is always the functional layer.\n- Cap mobile device pixel ratio.\n- Prefer approximately 30 fps for slow ambient motion.\n- Respect `prefers-reduced-motion`.\n- Stop rendering when the page is hidden; throttle where appropriate.\n- Avoid heavy post-processing and large environment textures.', '## Rendering fidelity authority\n\n- HTML remains the functional layer, but the visible WebGL environment must use the same quality target on mobile and desktop.\n- Renderer DPR is fixed at 2 for the current app; do not reduce quality based on device-memory or hardware-concurrency heuristics.\n- Render ambient motion on every display-synchronised animation frame while the app is visible.\n- Do not disable atmospheric motion because of `prefers-reduced-motion`; the user explicitly chose a continuously living environmental surface.\n- Stop rendering when the document is actually hidden.\n- Mobile tilt is always part of the visual system. Android/device-orientation capable browsers attach immediately; iOS requests orientation permission from the first user gesture as required by the platform.\n- Weather resolves first. Clouds, overcast, fog, rain and storm state must be visibly represented from the weather code and cloud cover before any PM2.5 optics are applied.\n- PM2.5 is a final optical layer: haze, saturation/contrast loss, solar diffusion and suspended particulate. It never invents cloud/rain/weather.\n- Celestial edges must be high precision and anti-aliased; the moon must not degrade to a pixelated sprite.')
          s += '\n## Full-page capture\n\nThe Save action captures the complete Today route as a long PNG using the live HTML composition plus an offscreen full-resolution render of the same current environment state. It excludes the masthead, sticky navigation/footer, reference footer and Save control. This is a web-app capture feature, not generated imagery.\n'; p.write_text(s)

          p=Path('docs/CI-UI-ADAPTATION.md'); s=p.read_text(); s += '\n\n## v13 typography and footer authority\n\n- Noto Sans is the app-wide English/UI typeface; Noto Sans Thai is mandatory for Thai glyphs, including mixed status copy such as `ข้อมูลล่าสุด`.\n- English remains eminent through scale, tracking and placement; Thai remains correctly shaped and readable.\n- Header logo artwork is reduced by 10% from the v12 size.\n- Guidance/Details route kickers are semantic (`AIR QUALITY CARE`, `CURRENT OBSERVATION`) with no redundant page numbers.\n- Sticky navigation uses the Flipgazine Voice-page footer contract: edge-to-edge frosted rail, compact independent chips, no oversized rounded dock.\n- Route changes use a short out/in depth transition while header, environment and sticky footer remain persistent.\n'; p.write_text(s)
          PY

      - name: Build Three.js bundle and verify syntax
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js
          node --check site/app.js
          node --check site/sw.js

      - name: Static contract checks
        run: |
          grep -q 'precision highp float' site/environment.js
          grep -q 'const activePixelRatio=2' site/environment.js
          grep -q 'WEATHER FIRST' site/environment.js
          grep -q 'uWeatherType' site/environment.js
          grep -q 'DeviceOrientationEvent.requestPermission' site/environment.js
          ! grep -q 'lowPowerDevice' site/environment.js
          ! grep -q 'adaptQuality' site/environment.js
          grep -q 'Noto Sans Thai' site/index.html
          grep -q 'id="connectionTh" lang="th"' site/index.html
          grep -q 'Save full page' site/index.html
          grep -q 'html2canvas.min.js' site/index.html
          grep -q 'Air quality care' site/app.js
          grep -q 'Current observation' site/app.js
          grep -q 'bottom-nav' site/app.js
          grep -q 'pwa-v13' site/sw.js
          test -s site/vendor/html2canvas.min.js
          test -s site/assets/fonts/noto-sans-300.woff2
          test -s site/assets/fonts/noto-sans-thai-400.woff2

      - name: Mobile and desktop browser QA
        run: |
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/v13-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/v13-check.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          function airPayload(){return {status:'Success',message:[{MeasIndex:'114','PM2.5':8.6,aqi:14,DateTime:'2026-08-25 20:00:00',Area:'ถนนพระราม 4 แขวงวังใหม่ เขตปทุมวัน',District:'ปทุมวัน'}]};}
          function weatherPayload(){return {current:{temperature_2m:30,apparent_temperature:35,relative_humidity_2m:72,precipitation:0,rain:0,showers:0,weather_code:3,cloud_cover:100,wind_speed_10m:9,wind_direction_10m:270,wind_gusts_10m:18,visibility:9000,is_day:0,time:'2026-08-25T20:00'}};}
          async function setup(page){
            await page.route('**/api.open-meteo.com/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(weatherPayload())}));
            await page.route('**/stations.airbkk.com/api/web/data',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(airPayload())}));
          }
          async function inspect(page){
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:60000});
            await page.waitForFunction(()=>document.body.classList.contains('environment-ready')&&document.body.dataset.environmentWeather==='live',{timeout:15000});
            await page.waitForTimeout(800);
            return page.evaluate(()=>{
              const c=document.getElementById('environmentCanvas'),r=c.getBoundingClientRect(),logo=document.querySelector('.brand-lockup'),th=document.getElementById('connectionTh'),nav=document.querySelector('.app-tabbar');
              return{quality:document.body.dataset.environmentQuality,effectiveCloud:Number(document.body.dataset.environmentCloudEffective),weatherType:document.body.dataset.environmentWeatherType,canvasCss:[r.width,r.height],canvasPixels:[c.width,c.height],logoWidth:logo.getBoundingClientRect().width,thaiFont:getComputedStyle(th).fontFamily,nav:{left:nav.getBoundingClientRect().left,right:nav.getBoundingClientRect().right,width:nav.getBoundingClientRect().width,radius:getComputedStyle(nav).borderRadius},kicker:document.querySelector('.route-kicker')?.textContent||''};
            });
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2});
            const mp=await mobile.newPage();await setup(mp);const mi=await inspect(mp);console.log('mobile',mi);
            if(mi.quality!=='2.00')throw new Error('mobile renderer is not full DPR2');
            if(mi.effectiveCloud<.90||mi.weatherType!=='overcast')throw new Error('overcast weather is not authoritative');
            if(mi.canvasPixels[0]<mi.canvasCss[0]*1.9)throw new Error('mobile backing resolution reduced');
            if(!/Noto Sans Thai/i.test(mi.thaiFont))throw new Error('Thai live status is not Noto Sans Thai');
            if(Math.abs(mi.logoWidth-99)>2)throw new Error('mobile logo is not 10% reduced');
            if(mi.nav.left>1||Math.abs(mi.nav.width-390)>2||mi.nav.radius!=='0px')throw new Error('footer is not Voice-style edge rail');
            await mp.click('[data-app-route="guidance"]');await mp.waitForTimeout(700);const g=await mp.evaluate(()=>({route:document.body.dataset.route,kicker:document.querySelector('.route-kicker').textContent,heading:document.querySelector('.route-hero h1').textContent}));if(g.route!=='guidance'||/^\d/.test(g.kicker)||!g.kicker.toLowerCase().includes('air quality'))throw new Error('guidance kicker/transition failed');
            await mp.click('[data-app-route="today"]');await mp.waitForTimeout(650);
            const downloadPromise=mp.waitForEvent('download',{timeout:30000});await mp.click('#saveImageBtn');const download=await downloadPromise;const path=await download.path();const b=fs.readFileSync(path);const w=b.readUInt32BE(16),h=b.readUInt32BE(20);console.log('capture',download.suggestedFilename(),w,h);if(w<760||h<1600||Math.abs(w/h-1)<.08)throw new Error('save is not a long full-page capture');
            const tilt=await mp.evaluate(async()=>{const e=new Event('deviceorientation');Object.defineProperty(e,'gamma',{value:16});Object.defineProperty(e,'beta',{value:55});window.dispatchEvent(e);await new Promise(r=>setTimeout(r,60));return document.body.dataset.environmentTilt||''});console.log('tilt',tilt);
            await mobile.close();
            const desktop=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:2});const dp=await desktop.newPage();await setup(dp);const di=await inspect(dp);console.log('desktop',di);if(di.quality!=='2.00')throw new Error('desktop renderer differs from mobile quality');if(di.effectiveCloud<.90)throw new Error('desktop weather cloud mismatch');await desktop.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/v13-check.cjs

