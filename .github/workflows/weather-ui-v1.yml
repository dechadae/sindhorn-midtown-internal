name: Add realtime weather UI

on:
  push:
    branches:
      - webgl-environment-v1
    paths:
      - ".github/workflows/weather-ui-v1.yml"
      - "scripts/weather_patch.py"

permissions:
  contents: write

jobs:
  wire-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply weather integration
        run: python scripts/weather_patch.py

      - name: Verify weather integration
        run: |
          grep -q 'id="weatherNow"' site/index.html
          grep -q 'Current weather readout v1' site/environment.css
          grep -q 'api.open-meteo.com/v1/forecast' site/environment.js
          grep -q 'weatherLabel(code)' site/environment.js
          grep -q 'uVisibilityKm' site/environment.js
          grep -q 'Readability-only font-size adjustments v5' site/index.html
          ! grep -q 'Editorial typography redesign v4' site/index.html

      - name: Commit integration and clean helpers
        run: |
          git rm .github/workflows/weather-ui-v1.yml scripts/weather_patch.py
          git add site/index.html site/environment.css site/environment.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add realtime current weather to environment"
          git push
