name: F&B Public Share Hotfix Preview

on:
  push:
    branches:
      - hotfix-fnb-public-share
    paths:
      - "scripts/generate-fnb-share.mjs"
      - ".github/workflows/fnb-public-share-hotfix-preview.yml"
      - ".github/tests/fnb-sharing-regression.test.mjs"
      - "site/fnb*.js"
      - "site/fnb*.css"
      - "site/betta-runtime.js"
      - "site/environment.css"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-public-share-hotfix-preview
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Generate public F&B shares
        env:
          PUBLIC_ORIGIN: https://hotfix-fnb-public-share.sindhorn-midtown-internal.pages.dev
        run: node scripts/generate-fnb-share.mjs

      - name: Validate generated public boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < scripts/generate-fnb-share.mjs
          node --input-type=module --check < site/share/fnb-public-shell.js
          node .github/tests/fnb-sharing-regression.test.mjs
          grep -Fq "from '/betta-runtime.js?v=1'" site/share/fnb-public-shell.js
          ! grep -Fq "/environment.js" site/share/fnb-public-shell.js
          grep -Fq "/share/fnb-public-shell.js?v=9&runtime=betta1" site/share/fnb.html

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch=hotfix-fnb-public-share

      - name: Smoke generated public assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://hotfix-fnb-public-share.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /share/fnb /share/fnb/fried-chicken-waffles /share/fnb-public-shell.js /betta-runtime.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/share-smoke
            test -s /tmp/share-smoke
          done
          curl --fail --silent --show-error --location "${BASE_URL}/share/fnb-public-shell.js" -o /tmp/public-shell.js
          grep -Fq "from '/betta-runtime.js?v=1'" /tmp/public-shell.js
          ! grep -Fq "/environment.js" /tmp/public-shell.js

      - name: Validate public page in Chromium
        env:
          BASE_URL: https://hotfix-fnb-public-share.sindhorn-midtown-internal.pages.dev
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node --input-type=module - <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];const requests=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('request',r=>requests.push(r.url()));
          await page.goto(`${process.env.BASE_URL}/share/fnb`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('.fnb-card',{timeout:60000});
          await page.waitForSelector('[data-fnb-data-updated]',{timeout:60000});
          await page.waitForFunction(()=>document.body.dataset.environmentRenderer==='sindhorn-betta-satellite-v1',{timeout:60000});
          const state=await page.evaluate(()=>({
            cards:document.querySelectorAll('.fnb-card').length,
            updated:document.querySelector('[data-fnb-data-updated]')?.textContent?.trim()||'',
            renderer:document.body.dataset.environmentRenderer||'',
            input:document.body.dataset.environmentInput||'',
            canvas:!!document.querySelector('#environmentCanvas'),
            environmentVisible:document.querySelector('#environmentStage')?.hidden===false
          }));
          if(state.cards<1||!state.updated||state.renderer!=='sindhorn-betta-satellite-v1'||state.input!=='satellite-only'||!state.canvas||!state.environmentVisible)throw new Error(`public index failed ${JSON.stringify(state)}`);
          if(requests.some(url=>/\/environment\.js(?:[?#]|$)/.test(url)))throw new Error('public share requested retired /environment.js');
          await page.goto(`${process.env.BASE_URL}/share/fnb/fried-chicken-waffles`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('.fnb-detail-title',{timeout:60000});
          const detail=await page.evaluate(()=>({title:document.querySelector('.fnb-detail-title')?.textContent?.trim(),updated:[...document.querySelectorAll('.fnb-fact')].find(x=>x.querySelector('span')?.textContent?.trim()==='Updated')?.querySelector('b')?.textContent?.trim()||''}));
          if(detail.title!=='Fried Chicken & Waffles'||!detail.updated)throw new Error(`public detail failed ${JSON.stringify(detail)}`);
          if(errors.length)throw new Error(`browser errors: ${errors.join(' | ')}`);
          await browser.close();
          NODE
