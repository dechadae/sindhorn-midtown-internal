<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2E273B">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Sign in · Sindhorn Midtown Internal</title>
  <link rel="stylesheet" href="/internal-auth.css?v=4">
</head>
<body class="login-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="brand-row">
        <img class="brand-logo" src="/assets/brand/sindhorn-midtown-vignette-black.png" alt="Sindhorn Midtown Hotel Bangkok, Vignette Collection">
        <div class="lang-toggle" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="th" aria-pressed="false" class="thai">ไทย</button>
        </div>
      </div>

      <p class="eyebrow" data-i18n="eyebrow">Internal employee access</p>
      <h1 id="loginTitle" data-i18n="title">Employee sign in.</h1>
      <p id="loginSupport" class="support" data-i18n="support">Enter your Employee ID and the one-time code provided by an administrator.</p>

      <div id="loginControls" class="stack">
        <form id="employeeForm" class="stack">
          <div class="field">
            <label for="employeeNumber" data-i18n="employeeId">Employee ID</label>
            <input id="employeeNumber" name="employeeNumber" inputmode="text" autocomplete="username" maxlength="64" required aria-describedby="employeeHint">
          </div>

          <fieldset class="otp-fieldset">
            <legend data-i18n="activationCode">One-time code</legend>
            <div id="otpCodeGroup" class="otp-code" role="group" aria-label="6-digit one-time code">
              <input class="otp-digit" data-otp-digit="0" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]" maxlength="1" aria-label="Digit 1 of 6" required>
              <input class="otp-digit" data-otp-digit="1" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 2 of 6" required>
              <input class="otp-digit" data-otp-digit="2" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 3 of 6" required>
              <input class="otp-digit" data-otp-digit="3" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 4 of 6" required>
              <input class="otp-digit" data-otp-digit="4" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 5 of 6" required>
              <input class="otp-digit" data-otp-digit="5" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 6 of 6" required>
            </div>
            <input id="activationCode" name="activationCode" type="hidden">
          </fieldset>

          <button id="employeeButton" class="primary" type="submit" data-i18n="employeeButton">Sign in</button>
          <p id="employeeHint" class="note" data-i18n="hint">Your administrator generates this code for your first sign-in or account recovery. Each code works once and expires after 15 minutes.</p>
        </form>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="signedCard" class="signed-card" aria-live="polite">
        <div id="signedName" class="signed-name"></div>
        <div id="signedMeta" class="signed-meta"></div>
        <div class="signed-actions">
          <a href="/" data-i18n="openApp">Open app</a>
          <a id="adminLink" href="/admin.html" class="hidden" data-i18n="admin">Admin</a>
          <button id="signOutButton" type="button" data-i18n="signOut">Sign out</button>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/login.js?v=4"></script>
</body>
</html>
