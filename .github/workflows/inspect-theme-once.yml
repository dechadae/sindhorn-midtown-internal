name: Inspect theme code once
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/inspect-theme-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Theme references
        run: |
          grep -n -C 8 -E 'themeToggle|THEME|data-theme|prefers-color-scheme|theme-color' site/index.html || true
