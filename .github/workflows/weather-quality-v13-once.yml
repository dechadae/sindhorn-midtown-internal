              float haze=pow(horizon,1.75)*pollution*(.18+.36*uHumidity);
              sky=mix(sky,vec3(.60,.56,.52),haze);
              float sunHaze=exp(-sunDist*10.0)*sunAbove*pollution;
              sky+=vec3(.60,.49,.38)*sunHaze*.09;

