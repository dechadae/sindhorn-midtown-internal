name: F&B Browser Import Diagnostic

on:
  push:
    branches: [fix-fnb-direct-footer-v4]
    paths: [".github/workflows/fnb-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check deployed module bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://fix-fnb-direct-footer-v4.sindhorn-midtown-internal.pages.dev
          curl -fsSL "$BASE/fnb.js?v=4" -o /tmp/fnb.js
          curl -fsSL "$BASE/fnb-data.js" -o /tmp/fnb-data.js
          echo "fnb type/size $(wc -c </tmp/fnb.js)"
          echo "data size $(wc -c </tmp/fnb-data.js)"
          node --check /tmp/fnb.js
          node --check /tmp/fnb-data.js
          tail -c 300 /tmp/fnb.js | cat
      - name: Probe Chromium module imports
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node --input-type=module - <<'NODE'
          import {chromium} from 'playwright';
          const base='https://fix-fnb-direct-footer-v4.sindhorn-midtown-internal.pages.dev';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('console',m.type(),m.text(),JSON.stringify(m.location())));
          page.on('pageerror',e=>console.log('pageerror',e.message,e.stack));
          await page.goto(`${base}/__fnb-footer-smoke.html`,{waitUntil:'domcontentloaded'});
          const probes=await page.evaluate(async()=>{
            const out=[];
            for(const url of ['/fnb-data.js?diag=1','/fnb.js?v=4']){
              try{const mod=await import(url);out.push({url,ok:true,keys:Object.keys(mod)})}
              catch(error){out.push({url,ok:false,name:error?.name,message:error?.message,stack:error?.stack})}
            }
            return out;
          });
          console.log(JSON.stringify(probes,null,2));
          await browser.close();
          if(probes.some(x=>!x.ok))process.exit(1);
          NODE
