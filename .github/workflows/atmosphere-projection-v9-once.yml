name: Atmosphere projection v9
on:
  push:
    branches: [atmosphere-projection-v9]
    paths: ['.github/workflows/atmosphere-projection-v9-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Apply v9 atmosphere
        run: python3 .github/scripts/atmosphere_projection_v9.py
      - name: Rebuild Three.js bundle
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js
      - name: Static checks
        run: |
          grep -q 'cloudRelief=' site/environment.js
          grep -q 'moonDiscTransmission' site/environment.bundle.js
          grep -q 'const skyY' site/environment.js
          grep -q 'pwa-v9' site/sw.js
      - name: Browser QA and screenshot
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > check.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(2500);
            const d=await page.evaluate(()=>({ready:document.body.classList.contains('environment-ready'),sunY:+document.body.dataset.environmentSunY,moonY:+document.body.dataset.environmentMoonY,moonAlt:+document.body.dataset.environmentMoonAltitude,cloud:+document.body.dataset.environmentCloud,weather:document.body.dataset.environmentWeather}));
            console.log('ENV',JSON.stringify(d));
            if(!d.ready||!Number.isFinite(d.sunY)||!Number.isFinite(d.moonY))throw new Error('celestial projection state missing');
            if(d.sunY<.08||d.sunY>.88||d.moonY<.08||d.moonY>.88)throw new Error('projection out of bounds');
            await page.addStyleTag({content:'.masthead,main,.app-tabbar,.environment-debug{visibility:hidden!important}'});
            await page.screenshot({path:'atmosphere-v9.png'});
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: atmosphere-v9
          path: atmosphere-v9.png
      - name: Commit generated changes
        run: |
          rm -f .github/workflows/atmosphere-projection-v9-once.yml .github/scripts/atmosphere_projection_v9.py
          git config user.name dechadae
          git config user.email decha.dae@gmail.com
          git add site .github/workflows/atmosphere-projection-v9-once.yml .github/scripts/atmosphere_projection_v9.py
          git commit -m 'Improve celestial projection and overcast atmosphere'
          git push origin HEAD:atmosphere-projection-v9
