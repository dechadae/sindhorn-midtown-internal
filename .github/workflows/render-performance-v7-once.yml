name: Adaptive WebGL performance v7
on:
  push:
    branches: [render-performance-v7]
    paths: ['.github/workflows/render-performance-v7-once.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Optimize realtime atmosphere for mobile GPUs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/environment.js')
          s=p.read_text()

          old="""const lowPowerDevice=((navigator.deviceMemory||8)<=4)||((navigator.hardwareConcurrency||8)<=4);\n\nconst renderer = new THREE.WebGLRenderer({"""
          new="""const lowPowerDevice=((navigator.deviceMemory||8)<=4)||((navigator.hardwareConcurrency||8)<=4);\nconst maxPixelRatio=lowPowerDevice ? 0.72 : 1.0;\nlet activePixelRatio=Math.min(window.devicePixelRatio || 1,maxPixelRatio);\n\nconst renderer = new THREE.WebGLRenderer({"""
          assert old in s
          s=s.replace(old,new,1)

          old='renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowPowerDevice ? 1.0 : 1.25));'
          new="renderer.setPixelRatio(activePixelRatio);\ndocument.body.dataset.environmentQuality=activePixelRatio.toFixed(2);"
          assert old in s
          s=s.replace(old,new,1)

          old='    precision highp float;'
          new='    precision mediump float;'
          assert old in s
          s=s.replace(old,new,1)

          old='float fbm(vec2 p){float v=0.,a=.52;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+17.13;a*=.5;}return v;}'
          new='float fbm(vec2 p){float v=0.,a=.54;for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.03+17.13;a*=.5;}return v;}'
          assert old in s
          s=s.replace(old,new,1)

          old="""    `renderer: ${reducedMotion ? 'static/reduced motion' : '30 fps adaptive'}`"""
          new="""    `renderer: ${reducedMotion ? 'static/reduced motion' : 'display-synced adaptive'} · scale ${activePixelRatio.toFixed(2)}`"""
          assert old in s
          s=s.replace(old,new,1)

          old="""let visible = true;\nlet pageVisible = !document.hidden;\nlet raf = 0;\nlet lastFrame = 0;\nconst start = performance.now();\n\nfunction render(now) {\n  raf = 0;\n  if (!visible || !pageVisible) return;\n  if (!reducedMotion && now - lastFrame < 15) {\n    raf = requestAnimationFrame(render);\n    return;\n  }\n  lastFrame = now;\n  uniforms.uTime.value = reducedMotion ? 0 : (now - start) / 1000;\n  renderer.render(scene, camera);\n  if (!reducedMotion) raf = requestAnimationFrame(render);\n}\n"""
          new="""let visible = true;\nlet pageVisible = !document.hidden;\nlet raf = 0;\nlet lastFrame = 0;\nlet perfSamples = [];\nlet lastQualityChange = 0;\nconst start = performance.now();\n\nfunction adaptQuality(delta,now) {\n  if (reducedMotion || !Number.isFinite(delta) || delta <= 0 || now-lastQualityChange < 1500) return;\n  perfSamples.push(delta);\n  if (perfSamples.length < 36) return;\n  const avg=perfSamples.reduce((a,b)=>a+b,0)/perfSamples.length;\n  perfSamples=[];\n  if (avg > 24 && activePixelRatio > 0.50) {\n    activePixelRatio=Math.max(0.50,activePixelRatio*0.82);\n    renderer.setPixelRatio(activePixelRatio);\n    document.body.dataset.environmentQuality=activePixelRatio.toFixed(2);\n    lastQualityChange=now;\n    resize();\n  }\n}\n\nfunction render(now) {\n  raf = 0;\n  if (!visible || !pageVisible) return;\n  const delta=lastFrame ? now-lastFrame : 16.7;\n  lastFrame = now;\n  adaptQuality(delta,now);\n  uniforms.uTime.value = reducedMotion ? 0 : (now - start) / 1000;\n  renderer.render(scene, camera);\n  if (!reducedMotion) raf = requestAnimationFrame(render);\n}\n"""
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)

          p=Path('site/sw.js')
          s=p.read_text()
          assert "sindhorn-midtown-internal-pwa-v6" in s
          s=s.replace("sindhorn-midtown-internal-pwa-v6","sindhorn-midtown-internal-pwa-v7",1)
          p.write_text(s)

          Path('site/version.txt').write_text(
            'production-build: main\n'
            'rendering-fix: seamless-cloud-field-v7-adaptive\n'
            'renderer: display-synced-adaptive-resolution\n'
            'pwa-spa: fullscreen-top-header-frosted-save-v7\n'
          )
          PY

      - name: Rebuild bundled Three.js environment
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js

      - name: Static verification
        run: |
          grep -q 'precision mediump float' site/environment.js
          grep -q 'display-synced adaptive' site/environment.js
          grep -q 'activePixelRatio' site/environment.bundle.js
          grep -q 'pwa-v7' site/sw.js
          grep -q 'seamless-cloud-field-v7-adaptive' site/version.txt

      - name: Browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3});
            await context.addInitScript(()=>{
              Object.defineProperty(navigator,'deviceMemory',{configurable:true,get:()=>4});
              Object.defineProperty(navigator,'hardwareConcurrency',{configurable:true,get:()=>4});
            });
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(4500);
            const info=await page.evaluate(()=>{
              const c=document.getElementById('environmentCanvas');
              const s=document.getElementById('environmentStage').getBoundingClientRect();
              return {quality:document.body.dataset.environmentQuality,canvasW:c.width,canvasH:c.height,stageW:s.width,stageH:s.height,ready:document.body.classList.contains('environment-ready')};
            });
            console.log(JSON.stringify(info));
            if(!info.ready)throw new Error('environment not ready');
            if(Number(info.quality)>0.73)throw new Error('low-power quality did not cap');
            if(info.canvasW>=info.stageW*1.5||info.canvasH>=info.stageH*1.5)throw new Error('canvas backing buffer is too large for low-power mode');
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'/tmp/v7.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs

      - name: Commit optimized renderer and remove helper
        run: |
          rm -f .github/workflows/render-performance-v7-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site .github/workflows/render-performance-v7-once.yml
          git commit -m "Optimize realtime atmosphere for mobile GPUs"
          git push origin HEAD:render-performance-v7
