name: Temporary Betta 3D Tilt Pass

on:
  push:
    branches:
      - betta-reference-rebuild
    paths:
      - .github/workflows/tmp-betta-3d-tilt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: betta-reference-rebuild
      - name: Apply patch
        run: python3 scripts/tmp-betta-3d-tilt.py
      - name: Validate
        run: |
          node --input-type=module --check < site/betta-fin-presets.js
          node --input-type=module --check < site/betta-environment.js
          node --input-type=module --check < site/betta-vignette-test.js
          node site/betta-vignette-palettes.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/betta-fin-presets.js site/betta-environment.js site/betta-vignette-test.html site/betta-vignette-test.js site/betta-vignette-palettes.test.mjs
          git commit -m "Add 3D Betta poses and calibrated device tilt"
          git push origin HEAD:betta-reference-rebuild
