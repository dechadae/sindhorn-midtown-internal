name: Upgrade preview to PWA SPA
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/pwa-spa-upgrade-once.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Convert app shell and remove theme system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site/index.html')
          s = p.read_text()
          s = s.replace('<html lang="en" style="background:#FAF7F5">','<html lang="en" class="app-shell">')
          s = s.replace('<meta name="theme-color" content="#FAF7F5">','<meta name="theme-color" content="#2E273B">')
          s = s.replace('<meta name="color-scheme" content="light dark">','<meta name="color-scheme" content="dark">')
          s = s.replace('<meta name="fg-pwa" content="off">\n','')
          s = re.sub(r'<script>\s*\(function\(\)\{\s*var key=\'sindhorn-midtown:pm25:theme:v1\';.*?</script>\s*','',s,count=1,flags=re.S)

          pwa_head = '''<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sindhorn Midtown">
<meta name="application-name" content="Sindhorn Midtown">
<meta name="format-detection" content="telephone=no">
'''
          desc = '<meta name="description" content="Live bilingual PM2.5 and Thai AQI report for Sindhorn Midtown Hotel Bangkok, using official Bangkok Metropolitan Administration data.">\n'
          if pwa_head not in s:
              s = s.replace(desc, desc + pwa_head, 1)
          s = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="192x192" href="/icons/app-192.png">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">', s, count=1)

          full_btn = '''      <button class="fullscreen-toggle" type="button" id="fullscreenToggle" aria-pressed="false" aria-label="Enter full screen / เต็มหน้าจอ" title="Full screen / เต็มหน้าจอ">
        <svg class="enter-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8.5 3.5h-5v5M15.5 3.5h5v5M8.5 20.5h-5v-5M20.5 15.5v5h-5"/></svg>
        <svg class="exit-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8.5 8.5h-5v-5M15.5 8.5h5v-5M8.5 15.5h-5v5M20.5 20.5v-5h-5"/></svg>
      </button>'''
          s, n = re.subn(r'      <button class="theme-toggle"[^>]*>.*?      </button>', full_btn, s, count=1, flags=re.S)
          assert n == 1, 'theme button not found'

          s = re.sub(r"\n\s*var THEME_KEY='[^']+';",'',s,count=1)
          s = re.sub(r"\n\s*var themeQuery=.*?;",'',s,count=1)
          s = s.replace("    saveImage:document.getElementById('saveImageBtn'),\n    theme:document.getElementById('themeToggle')","    saveImage:document.getElementById('saveImageBtn')")
          s, n = re.subn(r'\n  function storedTheme\(\).*?\n  function updateMetric', '\n  function updateMetric', s, count=1, flags=re.S)
          assert n == 1, 'theme functions not found'
          s = '\n'.join(line for line in s.splitlines() if 'themeQuery' not in line and 'applyTheme(' not in line and 'els.theme' not in line)
          s = s.replace('.theme-toggle','.fullscreen-toggle')

          if '<link rel="stylesheet" href="/pwa.css">' not in s:
              s = s.replace('<link rel="stylesheet" href="/environment.css">','<link rel="stylesheet" href="/environment.css">\n<link rel="stylesheet" href="/pwa.css">',1)
          if '<script type="module" src="/app.js"></script>' not in s:
              s = s.replace('</body>','<script type="module" src="/app.js"></script>\n</body>',1)
          p.write_text(s + ('\n' if not s.endswith('\n') else ''))

          ep = Path('site/environment.css')
          e = ep.read_text().replace('.theme-toggle','.fullscreen-toggle').replace('independent from UI theme','independent from app chrome')
          ep.write_text(e)
          PY
      - name: Create SPA controller
        run: |
          cat > site/app.js <<'EOF'
          const ROUTES = Object.freeze({today:'/', guidance:'/guidance', details:'/details'});
          const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
          const main = document.querySelector('main');
          const fullscreenButton = document.getElementById('fullscreenToggle');
          const intro = main?.querySelector('.intro');
          const report = main?.querySelector('#report');
          const saveBar = main?.querySelector('.report-actionbar');
          const weather = main?.querySelector('.weather-now');
          const sections = main ? [...main.querySelectorAll(':scope > .section')] : [];

          const routeForSection = section => {
            const heading = (section.querySelector('.section-title')?.textContent || '').toLowerCase();
            if (heading.includes('guidance') || heading.includes('คำแนะนำ') || heading.includes('scale') || heading.includes('ระดับ')) return 'guidance';
            return 'details';
          };

          const groups = {
            today: [intro, report, saveBar, weather].filter(Boolean),
            guidance: sections.filter(section => routeForSection(section) === 'guidance'),
            details: sections.filter(section => routeForSection(section) === 'details')
          };

          const nav = document.createElement('nav');
          nav.className = 'app-tabbar';
          nav.setAttribute('aria-label','App navigation / เมนูแอป');
          nav.innerHTML = `
            <a href="/" data-app-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5v8H5v-8Z"/><path d="M9.5 19.5v-5h5v5"/></svg><span>Today<small lang="th">วันนี้</small></span></a>
            <a href="/guidance" data-app-route="guidance"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.7 2.2"/></svg><span>Guidance<small lang="th">คำแนะนำ</small></span></a>
            <a href="/details" data-app-route="details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12M6 12h12M6 19h12"/><circle cx="3.5" cy="5" r=".8" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="3.5" cy="19" r=".8" fill="currentColor" stroke="none"/></svg><span>Details<small lang="th">ข้อมูล</small></span></a>`;
          document.body.appendChild(nav);

          const pathToRoute = path => path.startsWith('/guidance') ? 'guidance' : path.startsWith('/details') ? 'details' : 'today';
          const allRouteNodes = [...new Set(Object.values(groups).flat())];

          function applyRoute(route, {replace=false, scroll=true}={}) {
            if (!ROUTES[route]) route = 'today';
            const mutate = () => {
              document.body.dataset.route = route;
              allRouteNodes.forEach(node => node.toggleAttribute('data-app-route-hidden', !groups[route].includes(node)));
              nav.querySelectorAll('[data-app-route]').forEach(link => {
                const active = link.dataset.appRoute === route;
                link.toggleAttribute('aria-current', active);
                link.classList.toggle('is-active', active);
              });
            };
            if (document.startViewTransition && !reducedMotion.matches) document.startViewTransition(mutate);
            else mutate();
            const target = ROUTES[route];
            if (location.pathname !== target) history[replace ? 'replaceState' : 'pushState']({route},'',target);
            if (scroll) window.scrollTo({top:0,behavior:reducedMotion.matches?'auto':'smooth'});
          }

          nav.addEventListener('click', event => {
            const link = event.target.closest('[data-app-route]');
            if (!link) return;
            event.preventDefault();
            applyRoute(link.dataset.appRoute);
          });
          addEventListener('popstate', () => applyRoute(pathToRoute(location.pathname), {replace:true,scroll:false}));
          applyRoute(pathToRoute(location.pathname), {replace:true,scroll:false});
          document.body.classList.add('app-spa-ready');

          function updateFullscreenState() {
            const active = !!document.fullscreenElement;
            document.body.classList.toggle('is-fullscreen', active);
            fullscreenButton?.classList.toggle('is-active', active);
            fullscreenButton?.setAttribute('aria-pressed', active ? 'true' : 'false');
            fullscreenButton?.setAttribute('aria-label', active ? 'Exit full screen / ออกจากเต็มหน้าจอ' : 'Enter full screen / เต็มหน้าจอ');
          }

          if (fullscreenButton) {
            if (!document.documentElement.requestFullscreen && !document.exitFullscreen) fullscreenButton.hidden = true;
            fullscreenButton.addEventListener('click', async () => {
              try {
                if (document.fullscreenElement) await document.exitFullscreen();
                else await document.documentElement.requestFullscreen({navigationUI:'hide'});
              } catch (_) {}
            });
            document.addEventListener('fullscreenchange', updateFullscreenState);
            updateFullscreenState();
          }

          if ('serviceWorker' in navigator) {
            addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(()=>{}), {once:true});
          }
          EOF
      - name: Create native app styling
        run: |
          cat > site/pwa.css <<'EOF'
          html.app-shell{background:#2E273B;color:#FAF7F5;overscroll-behavior:none}
          body{min-height:100dvh;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
          body.app-spa-ready{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
          [data-app-route-hidden]{display:none!important}

          .fullscreen-toggle{position:relative;display:grid;flex:0 0 44px;width:44px;height:44px;padding:0;place-items:center;border:1px solid rgba(250,247,245,.64);border-radius:50%;background:transparent;color:#FAF7F5;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
          .fullscreen-toggle svg{position:absolute;width:19px;height:19px;fill:none;transition:opacity .22s ease,transform .32s cubic-bezier(.2,.75,.2,1)}
          .fullscreen-toggle .enter-fullscreen{opacity:1;transform:scale(1)}
          .fullscreen-toggle .exit-fullscreen{opacity:0;transform:scale(.72)}
          .fullscreen-toggle.is-active .enter-fullscreen{opacity:0;transform:scale(.72)}
          .fullscreen-toggle.is-active .exit-fullscreen{opacity:1;transform:scale(1)}
          .fullscreen-toggle:active{transform:scale(.96)}

          .app-tabbar{position:fixed;z-index:40;left:50%;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(420px,calc(100vw - 24px));min-height:58px;padding:5px;border:1px solid rgba(250,247,245,.20);border-radius:22px;background:rgba(32,27,42,.42);box-shadow:0 10px 34px rgba(0,0,0,.16);backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%)}
          .app-tabbar a{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:48px;padding:5px 9px;border-radius:17px;color:rgba(250,247,245,.64);text-decoration:none;font-size:.76rem;font-weight:600;letter-spacing:.035em;transition:background-color .18s ease,color .18s ease,transform .12s ease}
          .app-tabbar a svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.45;flex:0 0 auto}
          .app-tabbar a span{display:flex;flex-direction:column;line-height:1.08;white-space:nowrap}
          .app-tabbar a small{margin-top:2px;font-size:.82em;font-weight:400;opacity:.78}
          .app-tabbar a.is-active{color:#FAF7F5;background:rgba(250,247,245,.12)}
          .app-tabbar a:active{transform:scale(.97)}

          body[data-route="guidance"] main,body[data-route="details"] main{padding-top:18px}
          body[data-route="guidance"] .section:first-of-type,body[data-route="details"] .section:first-of-type{border-top-color:rgba(250,247,245,.42)}

          main{view-transition-name:app-content}
          .environment-stage{view-transition-name:none}
          ::view-transition-old(app-content){animation:app-out .18s ease both}
          ::view-transition-new(app-content){animation:app-in .28s cubic-bezier(.2,.75,.2,1) both}
          @keyframes app-out{to{opacity:0;transform:translateY(-5px)}}
          @keyframes app-in{from{opacity:0;transform:translateY(7px)}}

          @media (display-mode:standalone),(display-mode:fullscreen){
            body{padding-top:env(safe-area-inset-top)}
            .masthead{padding-top:2px}
          }
          @media (min-width:900px){
            .app-tabbar{bottom:18px;width:390px}
          }
          @media (max-width:420px){
            .app-tabbar{left:12px;right:12px;transform:none;width:auto;bottom:max(8px,env(safe-area-inset-bottom));border-radius:20px}
            .app-tabbar a{gap:5px;padding-inline:5px;font-size:.70rem}
            .app-tabbar a svg{width:18px;height:18px}
          }
          @media (prefers-reduced-motion:reduce){
            .fullscreen-toggle svg,.app-tabbar a{transition:none}
            ::view-transition-old(app-content),::view-transition-new(app-content){animation:none}
          }
          EOF
      - name: Create manifest and service worker
        run: |
          cat > site/manifest.webmanifest <<'EOF'
          {
            "id":"/",
            "name":"Sindhorn Midtown Internal",
            "short_name":"Sindhorn Midtown",
            "description":"Live air quality, Thai AQI and realtime Bangkok weather for Sindhorn Midtown Hotel Bangkok.",
            "lang":"en-TH",
            "start_url":"/",
            "scope":"/",
            "display":"standalone",
            "display_override":["fullscreen","standalone"],
            "orientation":"any",
            "background_color":"#2E273B",
            "theme_color":"#2E273B",
            "categories":["weather","utilities"],
            "icons":[
              {"src":"/icons/app-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/icons/app-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"/icons/maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ],
            "shortcuts":[
              {"name":"Today","short_name":"Today","url":"/","icons":[{"src":"/icons/app-192.png","sizes":"192x192"}]},
              {"name":"Guidance","short_name":"Guidance","url":"/guidance","icons":[{"src":"/icons/app-192.png","sizes":"192x192"}]},
              {"name":"Details","short_name":"Details","url":"/details","icons":[{"src":"/icons/app-192.png","sizes":"192x192"}]}
            ]
          }
          EOF
          cat > site/sw.js <<'EOF'
          const VERSION='sindhorn-midtown-internal-pwa-v1';
          const SHELL=[
            '/', '/index.html', '/environment.css', '/environment.js', '/pwa.css', '/app.js', '/manifest.webmanifest',
            '/icons/app-192.png','/icons/app-512.png','/icons/maskable-512.png','/icons/apple-touch-icon.png'
          ];
          self.addEventListener('install',event=>{
            event.waitUntil(caches.open(VERSION).then(cache=>cache.addAll(SHELL)).then(()=>self.skipWaiting()));
          });
          self.addEventListener('activate',event=>{
            event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==VERSION).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
          });
          self.addEventListener('fetch',event=>{
            const request=event.request;
            if(request.method!=='GET') return;
            const url=new URL(request.url);
            if(request.mode==='navigate'){
              event.respondWith(fetch(request).then(response=>{
                const copy=response.clone();caches.open(VERSION).then(cache=>cache.put('/index.html',copy));return response;
              }).catch(()=>caches.match('/index.html')));
              return;
            }
            if(url.origin!==location.origin) return;
            event.respondWith(caches.match(request).then(cached=>{
              const network=fetch(request).then(response=>{
                if(response.ok){const copy=response.clone();caches.open(VERSION).then(cache=>cache.put(request,copy));}
                return response;
              }).catch(()=>cached);
              return cached||network;
            }));
          });
          self.addEventListener('message',event=>{if(event.data==='SKIP_WAITING')self.skipWaiting();});
          EOF
      - name: Create hotel-logo app icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from io import BytesIO
          from PIL import Image
          Path('site/icons').mkdir(parents=True, exist_ok=True)
          url='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png'
          logo=Image.open(BytesIO(urlopen(url,timeout=30).read())).convert('RGBA')
          def make(size,name,width_ratio):
              canvas=Image.new('RGBA',(size,size),(46,39,59,255))
              target_w=int(size*width_ratio)
              target_h=int(target_w*logo.height/logo.width)
              logo2=logo.resize((target_w,target_h),Image.Resampling.LANCZOS)
              x=(size-target_w)//2;y=(size-target_h)//2
              canvas.alpha_composite(logo2,(x,y))
              canvas.convert('RGB').save('site/icons/'+name,'PNG',optimize=True)
          make(192,'app-192.png',.76)
          make(512,'app-512.png',.76)
          make(512,'maskable-512.png',.58)
          make(180,'apple-touch-icon.png',.72)
          PY
      - name: Update architecture documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AGENTS.md');s=p.read_text()
          s=s.replace('Preserve its bilingual content, AirBKK behavior, caching, theme handling, accessibility, and readability improvements unless the user explicitly changes them.','Preserve its bilingual content, AirBKK behavior, caching, accessibility, and readability improvements unless the user explicitly changes them. The user has explicitly removed the UI theme system in favor of a realtime environment plus fullscreen app control.')
          marker='## Real-time environment architecture\n'
          block='''## PWA / SPA architecture\n\n- This app is a full installable PWA with a single persistent HTML/WebGL shell.\n- Use History API client-side routes for `/`, `/guidance`, and `/details`; never force a full page reload for in-app navigation.\n- `manifest.webmanifest`, `sw.js`, `app.js`, and `pwa.css` are part of the canonical app shell.\n- The official Sindhorn Midtown / Vignette hotel lockup is the app icon artwork.\n- The top-right utility control is fullscreen, not a light/dark theme switch.\n- Day/night appearance is driven by realtime Bangkok astronomy and weather, never by a UI theme preference.\n- Service-worker navigation fallback must keep direct SPA routes and cached/offline use functional.\n\n'''
          if block not in s:s=s.replace(marker,block+marker)
          p.write_text(s)
          Path('docs/PWA-SPA-ARCHITECTURE.md').write_text('''# Sindhorn Midtown Internal — PWA / SPA Architecture\n\n## App shell\nThe logo/date masthead, realtime WebGL atmosphere and bottom navigation persist while route content changes client-side.\n\n## Routes\n- `/` — live PM2.5 / Thai AQI report followed by current weather.\n- `/guidance` — health guidance and AQI interpretation.\n- `/details` — reading details, source and methodology.\n\nNavigation uses the History API and Cloudflare Pages SPA fallback.\n\n## PWA\n`manifest.webmanifest` defines standalone/fullscreen-capable installation and uses the official hotel lockup for app icons. `sw.js` caches the same-origin app shell and falls back to `index.html` for offline SPA navigation. Live AirBKK and weather requests remain network-owned; existing application caches handle last-good readings.\n\n## Native-app interaction\nA persistent safe-area-aware bottom tab bar provides route navigation. The top utility button uses the browser Fullscreen API. Installed standalone mode respects device safe areas. Route changes use View Transitions where supported and respect reduced-motion preferences.\n\n## Environment rule\nThere is no UI light/dark theme. Physical day/night, sun position, clouds, rain and pollution are realtime environment state.\n''')
          PY
      - name: Static verification
        run: |
          python3 -m json.tool site/manifest.webmanifest >/dev/null
          node --check site/app.js
          node --check site/sw.js
          grep -q 'id="fullscreenToggle"' site/index.html
          grep -q 'rel="manifest" href="/manifest.webmanifest"' site/index.html
          grep -q 'src="/app.js"' site/index.html
          grep -q 'href="/pwa.css"' site/index.html
          ! grep -q 'themeToggle\|THEME_KEY\|themeQuery\|applyTheme(\|fg-pwa' site/index.html
          test -f site/icons/app-192.png
          test -f site/icons/app-512.png
          test -f site/icons/maskable-512.png
          test -f site/icons/apple-touch-icon.png
          python3 - <<'PY'
          from PIL import Image
          for f,size in [('app-192.png',(192,192)),('app-512.png',(512,512)),('maskable-512.png',(512,512)),('apple-touch-icon.png',(180,180))]:
              assert Image.open('site/icons/'+f).size==size,(f,Image.open('site/icons/'+f).size)
          PY
      - name: Browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/pwa-server.log 2>&1 &
          SERVER_PID=$!
          cat > qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const viewport of [{width:390,height:844},{width:1440,height:1000}]){
              const page=await browser.newPage({viewport});
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              if(await page.locator('#themeToggle').count()) throw new Error('theme toggle still present');
              if(await page.locator('#fullscreenToggle').count()!==1) throw new Error('fullscreen toggle missing');
              if(await page.locator('.app-tabbar a').count()!==3) throw new Error('SPA tabbar missing');
              const manifest=await page.evaluate(()=>document.querySelector('link[rel=manifest]')?.getAttribute('href'));
              if(manifest!=='/manifest.webmanifest') throw new Error('manifest link incorrect');
              const order=await page.evaluate(()=>{const r=document.querySelector('#report'),w=document.querySelector('#weatherNow');return !!(r&&w&&(r.compareDocumentPosition(w)&Node.DOCUMENT_POSITION_FOLLOWING));});
              if(!order) throw new Error('PM2.5 report is not above weather');
              await page.click('[data-app-route="guidance"]');
              if(new URL(page.url()).pathname!=='/guidance') throw new Error('guidance route failed');
              await page.click('[data-app-route="details"]');
              if(new URL(page.url()).pathname!=='/details') throw new Error('details route failed');
              await page.click('[data-app-route="today"]');
              if(new URL(page.url()).pathname!=='/') throw new Error('today route failed');
              const sw=await page.evaluate(async()=>{if(!('serviceWorker' in navigator))return false;const r=await navigator.serviceWorker.ready;return !!r.active;});
              if(!sw) throw new Error('service worker not active');
              if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa.cjs
          kill $SERVER_PID
          rm -f qa.cjs package.json package-lock.json
          rm -rf node_modules
      - name: Commit upgrade and remove helpers
        run: |
          rm -f .github/workflows/pwa-spa-upgrade-once.yml .github/workflows/inspect-theme-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add AGENTS.md docs/PWA-SPA-ARCHITECTURE.md site .github/workflows
          git commit -m "Upgrade preview to fullscreen PWA SPA"
          git push origin HEAD:webgl-environment-v1
