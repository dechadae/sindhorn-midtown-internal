name: Phase 8.2 Atmosphere Lab

on:
  push:
    branches:
      - phase8-2-bangkok-seasonal-clouds
    paths:
      - "site/january-sunset-example.html"
      - "site/cloud-tester.html"
      - "site/cloud-tester.js"
      - "site/seasonal-sky.js"
      - ".github/workflows/phase8-2-january-example.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: phase8-2-atmosphere-lab
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Phase 8.2 lab
        shell: bash
        run: |
          set -euo pipefail
          node --check site/seasonal-sky.js
          node --check site/cloud-tester.js
          grep -q "2026-01-15T18:20:00+07:00" site/january-sunset-example.html
          grep -q "seasonalSkyForState" site/january-sunset-example.html
          grep -q "CLOUD MORPHOLOGY" site/cloud-tester.html
          grep -q "HIGH VEIL / CIRRUS" site/cloud-tester.html
          grep -q "MID BROKEN CLOUD" site/cloud-tester.html
          grep -q "LOW CONVECTIVE / MONSOON" site/cloud-tester.html
          grep -q "AUTO MORPHOLOGY" site/cloud-tester.html
          grep -q "cloudMorphologyForWeather" site/cloud-tester.js
          grep -q "uHighCoverage" site/cloud-tester.js
          grep -q "uMidCoverage" site/cloud-tester.js
          grep -q "uLowCoverage" site/cloud-tester.js
          grep -q "renderer.setPixelRatio(2)" site/cloud-tester.js
      - name: Deploy Cloudflare Pages branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Smoke test Phase 8.2 lab
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://phase8-2-bangkok-seasonal-cl.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /cloud-tester.html /cloud-tester.js /seasonal-sky.js /vendor/three.module.js /january-sunset-example.html; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/lab-response
            test -s /tmp/lab-response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/cloud-tester.html" -o /tmp/cloud.html
          curl --fail --silent --show-error --location "${BASE_URL}/cloud-tester.js" -o /tmp/cloud.js
          curl --fail --silent --show-error --location "${BASE_URL}/seasonal-sky.js" -o /tmp/seasonal.js
          grep -q "CLOUD MORPHOLOGY" /tmp/cloud.html
          grep -q "COPY STATE LINK" /tmp/cloud.html
          grep -q "cloudMorphologyForWeather" /tmp/cloud.js
          grep -q "uConnected" /tmp/cloud.js
          grep -q "uBaseDarkness" /tmp/cloud.js
          grep -q "jan-cool-dry" /tmp/seasonal.js
