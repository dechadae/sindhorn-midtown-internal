name: Bangkok iOS-Style Weather Animation Lab
on:
  push:
    branches: [lab-volumetric-clouds]
    paths:
      - "site/volumetric-weather-final*"
      - ".github/workflows/volumetric-weather-final.yml"
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: bangkok-ios-weather-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Validate Bangkok sky and iOS-style compositor
        shell: bash
        run: |
          set -euo pipefail
          node --check site/volumetric-weather-final.js
          node --check site/volumetric-weather-final-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          h=Path('site/volumetric-weather-final.html').read_text(); base=Path('site/volumetric-weather-final.js').read_text(); tuned=Path('site/volumetric-weather-final-tuned.js').read_text()
          assert '12-MONTH BANGKOK PALETTE' in h and 'IOS-STYLE CLOUD SCENE' in h
          assert all(m in h for m in ['January','February','March','April','May','June','July','August','September','October','November','December'])
          for t in ["from './seasonal-sky.js'",'const DPR=2','wetCanvas','refractOffset','rainLayer','snowLayer','heatOffset','currentBolt','triggerLightning','preserveDrawingBuffer:false','antialias:false']:
              assert t in base,t
          for t in ['ellipseSdf','smin','bankSdf','cloudBank','farL=cloudBank','mainL=cloudBank','nearL=cloudBank','ios-weather-style-bangkok-compositor-v11','UNPACK_FLIP_Y_WEBGL,true','refractOffset=wetNormal*.0090']:
              assert t in tuned,t
          assert 'for(int i=0;i<12;i++)' not in tuned
          PY
  preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Deploy isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Smoke deployed animation assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME:0:28}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /volumetric-weather-final.html /volumetric-weather-final.js /volumetric-weather-final-tuned.js /seasonal-sky.js; do curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/final-response; test -s /tmp/final-response; done
          curl --fail --silent --show-error --location "${BASE_URL}/volumetric-weather-final-tuned.js" -o /tmp/tuned.js
          grep -q 'ios-weather-style-bangkok-compositor-v11' /tmp/tuned.js
          grep -q 'ellipseSdf' /tmp/tuned.js
          grep -q 'UNPACK_FLIP_Y_WEBGL,true' /tmp/tuned.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render tester evidence
        env:
          VOLUMETRIC_FINAL_BASE_URL: https://lab-volumetric-clouds.sindhorn-midtown-internal.pages.dev
        run: node site/volumetric-weather-final-smoke.mjs
      - name: Upload weather animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangkok-ios-weather-evidence
          path: volumetric-weather-final-artifacts
          if-no-files-found: error
          retention-days: 14
