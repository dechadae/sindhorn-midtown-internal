name: Phase 6 Web Push Release

on:
  push:
    branches:
      - phase6-web-push-release
      - fix-phase6-v21-gate
      - fix-alerts-preparing-v21
      - bust-push-client-v2
      - cleanup-sample-alert-20260827
      - hotfix-phase6-location-gate
      - fix-airbkk-proxy-worker
      - fix-airbkk-worker-request
      - fix-airbkk-client-proxy
      - today-v4-notifications-phase-b
      - main
    paths:
      - "worker/**"
      - "site/live-data.js"
      - "site/push-config.js"
      - "site/push-client.js"
      - "site/notification-inbox.js"
      - "site/index.html"
      - "site/sw.js"
      - "scripts/business-notification-worker-smoke.mjs"
      - ".github/workflows/phase6-web-push-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-phase6-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://sindhorn-midtown-alerts.decha-dae.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell and Worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          node --check site/live-data.js
          node --check site/push-client.js
          node --check site/push-config.js
          node --check site/notification-inbox.js
          node --check site/sw.js
          node --check site/location.js
          grep -q '/push-client.js?v=2' site/index.html
          grep -q "pushManager.subscribe" site/push-client.js
          grep -q "enableFromGesture" site/push-client.js
          ! grep -q "Notification.requestPermission" site/push-client.js
          grep -q "navigator.serviceWorker.register('/sw.js',{scope:'/'})" site/push-client.js
          grep -q "PREPARE_TIMEOUT_MS" site/push-client.js
          grep -q "Retry alerts" site/push-client.js
          grep -q "const VERSION='sindhorn-midtown-internal-pwa-v" site/sw.js
          grep -q "'/location.js'" site/sw.js
          grep -q "'/push-config.js'" site/sw.js
          grep -q "'/push-client.js'" site/sw.js
          grep -q "addEventListener('push'" site/sw.js
          grep -q "addEventListener('notificationclick'" site/sw.js
          grep -q "Current device location" site/location.js
          grep -q "weatherLocationEn" site/location.js
          grep -q "import {PUSH_API_BASE} from './push-config.js'" site/live-data.js
          grep -q "PUSH_API_BASE+'/air-current'" site/live-data.js
          ! grep -q "stations.airbkk.com/api/web/data" site/live-data.js
          grep -Fq "sindhorn-midtown-alerts.decha-dae.workers.dev" site/index.html
          ! grep -Fq "stations.airbkk.com" site/index.html
          grep -q "buildPushPayload" worker/src/index.js
          grep -q "scheduled" worker/src/index.js
          grep -q "push_subscriptions" worker/src/index.js
          grep -q "monitor_state" worker/src/index.js
          grep -q "url.pathname==='/air-current'" worker/src/index.js
          grep -q "origin_not_allowed" worker/src/index.js
          grep -Fq "'origin':'https://official.airbkk.com'" worker/src/index.js
          grep -Fq "'referer':'https://official.airbkk.com/'" worker/src/index.js
          ! grep -q "test-alert" worker/src/index.js
          ! grep -q "sampleAlertPayload" worker/src/index.js
          grep -q 'database_name' worker/wrangler.jsonc
          grep -q 'database_id' worker/wrangler.jsonc
          grep -Fq "${WORKER_URL}" site/push-config.js
          if [ "${GITHUB_REF_NAME}" = "today-v4-notifications-phase-b" ]; then
            grep -q "business_notification_dispatches" worker/src/index.js
            grep -q "url.pathname==='/business-update'" worker/src/index.js
            grep -q "BUSINESS_UPDATE_TOKEN" worker/src/index.js
            grep -q "businessUpdatePayload" worker/src/index.js
            grep -q "secureTokenEqual" worker/src/index.js
            grep -q "business-fnb-update" site/notification-inbox.js
            grep -q "business-rooms-update" site/notification-inbox.js
            grep -q "business updates are on" site/push-client.js
            ! grep -R "BUSINESS_UPDATE_TOKEN" site scripts/business-notification-messages-smoke.mjs
          fi

      - name: Verify AirBKK upstream public-client contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
            -X POST 'https://stations.airbkk.com/api/web/data' \
            -H 'User-Agent: Mozilla/5.0' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Origin: https://official.airbkk.com' \
            -H 'Referer: https://official.airbkk.com/' \
            --data '{"message":"Request data"}' -o /tmp/airbkk-upstream.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          d=json.load(open('/tmp/airbkk-upstream.json'))
          assert d.get('status')=='Success' and isinstance(d.get('message'),list)
          rows=d['message']; now=datetime.now(timezone(timedelta(hours=7)))
          def valid(row):
              try:
                  pm=float(row.get('PM2.5'))
                  observed=datetime.strptime(str(row.get('DateTime')),'%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone(timedelta(hours=7)))
              except Exception:return False
              age=(now-observed).total_seconds()
              return 0 <= pm <= 500 and -900 <= age <= 43200
          pinned=[row for station in ('114','139','65') for row in rows if str(row.get('MeasIndex'))==station and valid(row)]
          assert pinned, 'No current pinned AirBKK station reading'
          print('AirBKK upstream current:',pinned[0].get('MeasIndex'),pinned[0].get('PM2.5'),pinned[0].get('aqi'),pinned[0].get('DateTime'))
          PY

      - name: Install Worker dependency
        run: npm install --prefix worker --no-audit --no-fund

      - name: Validate business notification contract
        if: github.ref_name == 'today-v4-notifications-phase-b'
        run: node scripts/business-notification-worker-smoke.mjs

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.125.0 deploy --dry-run --config worker/wrangler.jsonc --outdir /tmp/phase6-worker

      - name: Verify live Worker health and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${WORKER_URL}/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('service')=='sindhorn-midtown-alerts'
          assert d.get('vapidConfigured') is True
          assert isinstance(d.get('subscriptions'),int)
          PY
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ORIGIN="https://sindhorn-midtown-internal.pages.dev"
          else
            BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
            ORIGIN="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          fi
          curl --fail --silent --show-error -H "Origin: ${ORIGIN}" "${WORKER_URL}/vapid-public-key" -D /tmp/key-headers -o /tmp/key.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/key.json'))
          assert isinstance(d.get('publicKey'),str) and len(d['publicKey'])>50
          PY
          grep -qi "access-control-allow-origin: ${ORIGIN}" /tmp/key-headers

      - name: Deploy alert Worker on production merge
        if: github.ref_name == 'main'
        run: npx --yes wrangler@4.125.0 deploy --config worker/wrangler.jsonc

      - name: Verify production AirBKK proxy
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://sindhorn-midtown-internal.pages.dev"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            -H "Origin: ${ORIGIN}" "${WORKER_URL}/air-current" -D /tmp/air-headers -o /tmp/air.json
          grep -qi "access-control-allow-origin: ${ORIGIN}" /tmp/air-headers
          python3 - <<'PY'
          import json
          from datetime import datetime
          d=json.load(open('/tmp/air.json'))
          assert str(d.get('stationId')) in {'114','139','65'}
          pm=float(d['pm']); aqi=float(d['aqi'])
          assert 0 <= pm <= 500 and 0 <= aqi <= 500
          datetime.fromisoformat(str(d['observedAt']).replace('Z','+00:00'))
          PY

      - name: Deploy branch Pages preview
        if: github.ref_name != 'main'
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test branch preview
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
          BASE_URL="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /guidance /details /messages /location.js /live-data.js /push-config.js /push-client.js /notification-inbox.js /sw.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke
            test -s /tmp/smoke
          done
          CLIENT="$(curl --fail --silent --show-error "${BASE_URL}/push-client.js")"
          AIR_CLIENT="$(curl --fail --silent --show-error "${BASE_URL}/live-data.js")"
          INBOX="$(curl --fail --silent --show-error "${BASE_URL}/notification-inbox.js")"
          ROOT="$(curl --fail --silent --show-error "${BASE_URL}/")"
          grep -q '/push-client.js?v=2' <<<"${ROOT}"
          grep -q 'pushManager.subscribe' <<<"${CLIENT}"
          grep -q "navigator.serviceWorker.register('/sw.js',{scope:'/'})" <<<"${CLIENT}"
          grep -q 'PREPARE_TIMEOUT_MS' <<<"${CLIENT}"
          grep -q 'Retry alerts' <<<"${CLIENT}"
          grep -q "PUSH_API_BASE+'/air-current'" <<<"${AIR_CLIENT}"
          ! grep -q 'stations.airbkk.com/api/web/data' <<<"${AIR_CLIENT}"
          grep -q 'sindhorn-midtown-alerts.decha-dae.workers.dev' <<<"${ROOT}"
          ! grep -q 'stations.airbkk.com' <<<"${ROOT}"
          grep -q 'Current device location' <(curl --fail --silent --show-error "${BASE_URL}/location.js")
          SW="$(curl --fail --silent --show-error "${BASE_URL}/sw.js")"
          grep -q "'/location.js'" <<<"${SW}"
          grep -q "addEventListener('push'" <<<"${SW}"
          grep -q "addEventListener('notificationclick'" <<<"${SW}"
          if [ "${GITHUB_REF_NAME}" = "today-v4-notifications-phase-b" ]; then
            grep -q 'business updates are on' <<<"${CLIENT}"
            grep -q 'business-fnb-update' <<<"${INBOX}"
            grep -q 'business-rooms-update' <<<"${INBOX}"
          fi
