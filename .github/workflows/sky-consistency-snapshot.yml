name: Sky Consistency Snapshot

on:
  push:
    branches:
      - phase8-directional-sky-calibration
    paths:
      - ".github/workflows/sky-consistency-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKY_WORKER_URL: https://sindhorn-midtown-sky.decha-dae.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install transient frame sampler
        run: python3 -m pip install --quiet pillow

      - name: Capture live production sky state
        shell: bash
        run: |
          set -euo pipefail
          date -u +"UTC_NOW=%Y-%m-%dT%H:%M:%SZ"
          TZ=Asia/Bangkok date +"BANGKOK_NOW=%Y-%m-%dT%H:%M:%S%z"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "${SKY_WORKER_URL}/health" -o /tmp/health.json
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "${SKY_WORKER_URL}/calibration" -o /tmp/calibration.json
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 "${SKY_WORKER_URL}/sources" -o /tmp/sources.json

          npx --yes wrangler@4.125.0 d1 execute DB --remote --config sky-worker/wrangler.jsonc \
            --command "SELECT camera_id,frame_hash,observed_at,analysis_json,updated_at FROM sky_camera_observations WHERE camera_id LIKE 'prod:%' ORDER BY camera_id" \
            --json > /tmp/d1-observations.json

          python3 - <<'PY'
          import json, datetime, re, urllib.request, io, hashlib, statistics, colorsys
          from PIL import Image

          now=datetime.datetime.now(datetime.timezone.utc)
          health=json.load(open('/tmp/health.json'))
          cal=json.load(open('/tmp/calibration.json'))
          d1=json.load(open('/tmp/d1-observations.json'))

          rows=[]
          if isinstance(d1,list):
              for block in d1:
                  if isinstance(block,dict) and isinstance(block.get('results'),list):
                      rows.extend(block['results'])
          elif isinstance(d1,dict) and isinstance(d1.get('results'),list):
              rows=d1['results']

          observations=[]
          for row in rows:
              try:
                  obs=json.loads(row.get('analysis_json') or '{}')
              except Exception:
                  obs={}
              observed=obs.get('frameFetchedAt') or row.get('observed_at')
              age_min=None
              if observed:
                  try:
                      dt=datetime.datetime.fromisoformat(observed.replace('Z','+00:00'))
                      age_min=(now-dt).total_seconds()/60
                  except Exception:
                      pass
              observations.append({
                  'cameraId': str(row.get('camera_id','')).removeprefix('prod:'),
                  'frameFetchedAt': observed,
                  'ageMinutes': None if age_min is None else round(age_min,2),
                  'frameHash': row.get('frame_hash'),
                  'facing': obs.get('facing'),
                  'quality': obs.get('quality'),
                  'confidence': obs.get('confidence'),
                  'zenithRgb': obs.get('zenithRgb'),
                  'horizonRgb': obs.get('horizonRgb'),
                  'luminance': obs.get('luminance'),
                  'saturation': obs.get('saturation'),
                  'warmth': obs.get('warmth'),
                  'cloudOpacity': obs.get('cloudOpacity'),
                  'cloudDarkness': obs.get('cloudDarkness'),
                  'haze': obs.get('haze'),
                  'horizonContrast': obs.get('horizonContrast'),
                  'sunGlow': obs.get('sunGlow'),
                  'stormConfidence': obs.get('stormConfidence'),
              })

          cameras=[
            ('bang-yi-khan-east-317138','east','https://opencctv.org/cameras/thailand/bangkok/bang-yi-khan-subdistrict/bang-yi-khan-subdistrict-east-krung-thon-bridge-sang-hi-saphan-krung-thon-sang-hee-317138'),
            ('bang-yi-khan-west-317474','west','https://opencctv.org/cameras/thailand/bangkok/bang-yi-khan-subdistrict/bang-yi-khan-subdistrict-west-saphan-krung-thon-sang-hee-dbf-apartments-by-the-river-krung-thon-bridge-sang-hi-chao-phraya-317474'),
            ('bang-phlat-east-318260','east','https://opencctv.org/cameras/thailand/bangkok/bang-phlat-subdistrict/bang-phlat-subdistrict-east-saphan-krung-thon-sang-hee-krung-thon-bridge-sang-hi-318260'),
            ('bang-phlat-west-318457','west','https://opencctv.org/cameras/thailand/bangkok/bang-phlat-subdistrict/bang-phlat-subdistrict-west-krung-thon-bridge-sang-hi-saphan-krung-thon-sang-hee-318457'),
          ]

          def fetch_bytes(url,accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':'SindhornMidtownSkyCalibration/1.0','Accept':accept})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read(),r.headers.get('content-type','')

          def resolve_image(page_url):
              body,_=fetch_bytes(page_url,'text/html')
              text=body.decode('utf-8','ignore').replace('\\/','/').replace('&amp;','&')
              m=re.search(r'https://images-webcams\.windy\.com/[A-Za-z0-9_./?=&%\-]+',text,re.I)
              if not m:
                  m=re.search(r'https://[^\"\'<>\s]+\.(?:jpe?g|png|webp)(?:\?[^\"\'<>\s]*)?',text,re.I)
              return m.group(0) if m else None

          def region_stats(img,box):
              crop=img.crop(box).convert('RGB')
              crop.thumbnail((240,160))
              px=list(crop.getdata())
              if not px:return None
              # Suppress near-black structural pixels and very saturated signage/vehicle colors.
              filtered=[]
              for r,g,b in px:
                  mx=max(r,g,b); mn=min(r,g,b)
                  sat=0 if mx==0 else (mx-mn)/mx
                  lum=(0.2126*r+0.7152*g+0.0722*b)/255
                  if lum<0.10 or sat>0.72:
                      continue
                  filtered.append((r,g,b))
              use=filtered if len(filtered)>=max(100,len(px)//5) else px
              med=[round(statistics.median([p[i] for p in use])) for i in range(3)]
              mean=[round(sum(p[i] for p in use)/len(use)) for i in range(3)]
              lums=[(0.2126*r+0.7152*g+0.0722*b)/255 for r,g,b in use]
              sats=[]
              for r,g,b in use:
                  _,s,_=colorsys.rgb_to_hsv(r/255,g/255,b/255);sats.append(s)
              return {'medianRgb':med,'meanRgb':mean,'luminance':round(sum(lums)/len(lums),4),'saturation':round(sum(sats)/len(sats),4),'samplePixels':len(use)}

          raw_samples=[]
          for camera_id,facing,page_url in cameras:
              entry={'cameraId':camera_id,'facing':facing,'sourcePage':page_url,'fetchedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  image_url=resolve_image(page_url)
                  if not image_url: raise RuntimeError('image URL not found')
                  data,ctype=fetch_bytes(image_url,'image/avif,image/webp,image/png,image/jpeg,*/*')
                  img=Image.open(io.BytesIO(data));img.load();w,h=img.size
                  entry.update({'ok':True,'imageUrl':image_url,'contentType':ctype.split(';')[0],'width':w,'height':h,'sha256':hashlib.sha256(data).hexdigest()})
                  entry['upperSkySample']=region_stats(img,(0,0,w,max(1,round(h*.28))))
                  entry['upperMidSample']=region_stats(img,(0,round(h*.18),w,max(round(h*.18)+1,round(h*.46))))
                  entry['horizonBandSample']=region_stats(img,(0,round(h*.32),w,max(round(h*.32)+1,round(h*.58))))
              except Exception as e:
                  entry.update({'ok':False,'error':str(e)})
              raw_samples.append(entry)

          visual=cal.get('visual') or {}
          mode=str(cal.get('mode') or 'fallback')
          confidence=max(0,min(1,float(cal.get('confidence') or 0)))
          cap=.46 if mode in ('sunrise-east','sunset-west') else .34 if mode=='twilight' else .16 if mode=='night' else .28
          haze=max(0,min(1,float(visual.get('haze') or 0)))
          overlay_alpha=max(0,min(cap,confidence*cap*(.90+haze*.10)))

          def hexrgb(rgb):
              if not isinstance(rgb,list) or len(rgb)!=3: return None
              return '#'+''.join(f'{max(0,min(255,int(round(float(x))))):02X}' for x in rgb)
          z=visual.get('zenithRgb');h=visual.get('horizonRgb');mid=None
          if isinstance(z,list) and isinstance(h,list) and len(z)==3 and len(h)==3:
              mid=[round(float(z[i])*.42+float(h[i])*.58) for i in range(3)]

          out={
              'capturedAt': now.isoformat(),
              'health': health,
              'calibration': cal,
              'cameraObservations': observations,
              'rawFrameSamples': raw_samples,
              'rendererComparison': {
                  'mode': mode,'confidence': confidence,'cap': cap,'effectiveOverlayAlpha': round(overlay_alpha,4),
                  'zenithRgb': z,'zenithHex': hexrgb(z),'midRgb': mid,'midHex': hexrgb(mid),'horizonRgb': h,'horizonHex': hexrgb(h),
                  'topAppliedAlpha': round(overlay_alpha*.88,4),'midAppliedAlpha': round(overlay_alpha*.72,4),'horizonAppliedAlpha': round(overlay_alpha,4)
              }
          }
          print('SKY_SNAPSHOT_JSON_BEGIN')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('SKY_SNAPSHOT_JSON_END')
          PY
