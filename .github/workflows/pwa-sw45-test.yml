name: PWA SW45 Test Preview

on:
  push:
    branches:
      - test-pwa-sw45
    paths:
      - "site/sw.js"
      - ".github/workflows/pwa-sw45-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate service worker
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sw.js
          grep -q 'PRECACHE_CONCURRENCY=8' site/sw.js
          ! grep -q 'client.navigate(client.url)' site/sw.js
          grep -q "if(cached&&validResponse(url.pathname,cached))return cached" site/sw.js
      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"
      - name: Smoke preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /sw.js /manifest.webmanifest '/betta-runtime.js?v=1'; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
