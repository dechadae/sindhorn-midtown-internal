name: macOS BETTA Release

on:
  push:
    branches: [macos-betta-metal-lab, macos-betta-diagnostics, macos-betta-imagine-1.1, macos-betta-imagine-1.1.1, macos-betta-imagine-1.1.2, macos-betta-imagine-1.1.3, macos-betta-display-1.2]
    paths:
      - 'macos-betta-metal/**'
      - '.github/workflows/macos-betta-metal-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify experimental AI layer is removed
        working-directory: macos-betta-metal
        run: |
          test ! -e Sources/BettaMetalLab/BettaImagineAppleIntelligence.swift
          test ! -e Sources/BettaMetalLab/BettaImagineModels.swift
          test ! -e Sources/BettaMetalLab/BettaImagineWindowController.swift
          ! grep -R -n -E 'FoundationModels|Apple Intelligence|BettaImagine|Imagine…|Imagine\.\.\.' Sources/BettaMetalLab
      - name: Verify Display Art interaction sources
        working-directory: macos-betta-metal
        run: |
          test -s Sources/BettaMetalLab/BettaDisplayArtController.swift
          test -s Sources/BettaMetalLab/BettaWaterInteraction.swift
          grep -q 'Display Art' Sources/BettaMetalLab/BettaLivingGalleryView.swift
          grep -q 'BettaWaterInteractionStore' Sources/BettaMetalLab/BettaRenderer.swift
          grep -q 'interactionStrength' Sources/BettaMetalLab/ShadersSafe.metal
          grep -q 'primaryRadiusScreenWidth = .26' Sources/BettaMetalLab/ShadersSafe.metal
          grep -q 'primaryRadiusScreenWidthFraction: Float = 0.26' Sources/BettaMetalLab/BettaWaterInteraction.swift
          grep -q 'Escape' Sources/BettaMetalLab/BettaDisplayArtController.swift
      - name: Compile runtime-safe Metal shader
        working-directory: macos-betta-metal
        run: |
          xcrun -sdk macosx metal -mmacosx-version-min=13.0 -c Sources/BettaMetalLab/ShadersSafe.metal -o "$RUNNER_TEMP/BettaShadersSafe.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/BettaShadersSafe.air" -o "$RUNNER_TEMP/BettaShadersSafe.metallib"
          test -s "$RUNNER_TEMP/BettaShadersSafe.metallib"
      - name: Swift self-test
        working-directory: macos-betta-metal
        run: swift run BettaMetalLab --self-test
      - name: Build BETTA 1.2.1 release
        working-directory: macos-betta-metal
        run: ./scripts/build-app.sh
      - name: Inspect BETTA 1.2.1 app
        working-directory: macos-betta-metal
        run: |
          file "dist/BETTA.app/Contents/MacOS/BettaMetalLab"
          file "dist/BETTA.app/Contents/MacOS/BettaMetalLab" | grep -q 'arm64'
          codesign -dv --verbose=2 "dist/BETTA.app" 2>&1
          codesign --verify --deep --strict "dist/BETTA.app"
          plutil -lint "dist/BETTA.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/BETTA.app/Contents/Info.plist")" = "1.2.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "dist/BETTA.app/Contents/Info.plist")" = "27"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "dist/BETTA.app/Contents/Info.plist")" = "BETTA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "dist/BETTA.app/Contents/Info.plist")" = "com.sindhornmidtown.BettaMetalLab"
          /usr/libexec/PlistBuddy -c 'Print :BettaGitSHA' "dist/BETTA.app/Contents/Info.plist"
          test -s "dist/BETTA.app/Contents/Resources/BettaShaders.metallib"
          cmp Sources/BettaMetalLab/ShadersSafe.metal "dist/BETTA.app/Contents/Resources/Shaders.metal"
          test -s "dist/BETTA-1.2.1-macOS-arm64.zip"
          test -s "dist/BETTA-1.2.1-macOS-arm64.dmg"
          ! strings "dist/BETTA.app/Contents/MacOS/BettaMetalLab" | grep -q 'Apple Intelligence'
          strings "dist/BETTA.app/Contents/MacOS/BettaMetalLab" | grep -q 'Display Art'
      - name: Runtime Metal pipeline smoke when GPU is exposed
        working-directory: macos-betta-metal
        run: |
          cat > "$RUNNER_TEMP/metal-smoke.swift" <<'SWIFT'
          import Foundation
          import Metal

          guard CommandLine.arguments.count > 1 else { fatalError("metallib path required") }
          guard let device = MTLCreateSystemDefaultDevice() else {
              print("Metal runtime smoke: SKIP — runner exposes no Metal device")
              exit(0)
          }
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let library = try device.makeLibrary(URL: url)
          guard let fv = library.makeFunction(name: "finVertex"),
                let ff = library.makeFunction(name: "finFragment"),
                let bv = library.makeFunction(name: "backgroundVertex"),
                let bf = library.makeFunction(name: "backgroundFragment") else {
              fatalError("required Metal functions missing")
          }
          let vd = MTLVertexDescriptor()
          vd.attributes[0].format = .float; vd.attributes[0].offset = 0; vd.attributes[0].bufferIndex = 0
          vd.attributes[1].format = .float; vd.attributes[1].offset = 4; vd.attributes[1].bufferIndex = 0
          vd.attributes[2].format = .float; vd.attributes[2].offset = 8; vd.attributes[2].bufferIndex = 0
          vd.layouts[0].stride = 12
          vd.layouts[0].stepFunction = .perVertex
          let fin = MTLRenderPipelineDescriptor()
          fin.vertexFunction = fv; fin.fragmentFunction = ff; fin.vertexDescriptor = vd
          fin.colorAttachments[0].pixelFormat = .bgra8Unorm
          fin.depthAttachmentPixelFormat = .depth32Float
          _ = try device.makeRenderPipelineState(descriptor: fin)
          let bg = MTLRenderPipelineDescriptor()
          bg.vertexFunction = bv; bg.fragmentFunction = bf
          bg.colorAttachments[0].pixelFormat = .bgra8Unorm
          bg.depthAttachmentPixelFormat = .depth32Float
          _ = try device.makeRenderPipelineState(descriptor: bg)
          print("Metal runtime smoke: PASS on \(device.name)")
          SWIFT
          xcrun swift "$RUNNER_TEMP/metal-smoke.swift" "dist/BETTA.app/Contents/Resources/BettaShaders.metallib"
      - name: Upload BETTA 1.2.1 release
        uses: actions/upload-artifact@v4
        with:
          name: BETTA-1.2.1-macOS-arm64
          path: |
            macos-betta-metal/dist/BETTA-1.2.1-macOS-arm64.zip
            macos-betta-metal/dist/BETTA-1.2.1-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30
