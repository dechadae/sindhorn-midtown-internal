<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2E273B">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>My account · Sindhorn Midtown Internal</title>
  <link rel="stylesheet" href="/app-transitions.css">
  <link rel="stylesheet" href="/internal-auth.css?v=5">
  <link rel="stylesheet" href="/auth-brand.css?v=2">
  <link rel="stylesheet" href="/account.css?v=1">
</head>
<body class="account-page">
  <main class="account-shell">
    <section class="account-card" aria-labelledby="accountTitle">
      <div class="account-brand-row">
        <a class="account-home" href="/" aria-label="Open Sindhorn Midtown Internal">
          <img class="brand-logo" src="/assets/brand/sindhorn-midtown-vignette-black.png" alt="Sindhorn Midtown Hotel Bangkok, Vignette Collection">
        </a>
        <a class="account-close" href="/" aria-label="Close account dashboard">×</a>
      </div>

      <div class="account-identity">
        <div id="accountAvatar" class="account-avatar" aria-hidden="true">SM</div>
        <div class="account-heading">
          <p class="account-eyebrow">Employee account <span lang="th">บัญชีพนักงาน</span></p>
          <h1 id="accountTitle">My account</h1>
          <p id="accountName" class="account-name">Loading…</p>
        </div>
      </div>

      <dl class="account-details">
        <div><dt>Employee ID <span lang="th">รหัสพนักงาน</span></dt><dd id="accountEmployee">—</dd></div>
        <div><dt>Role <span lang="th">สิทธิ์การใช้งาน</span></dt><dd id="accountRole">—</dd></div>
        <div><dt>Preferred language <span lang="th">ภาษาที่ต้องการ</span></dt><dd id="accountLanguage">—</dd></div>
        <div><dt>Permanent code <span lang="th">รหัสถาวร</span></dt><dd id="accountPin">Set</dd></div>
        <div><dt>Account status <span lang="th">สถานะบัญชี</span></dt><dd id="accountStatus">Active</dd></div>
      </dl>

      <div class="account-actions">
        <a class="account-primary" href="/">Open app <span lang="th">เปิดแอป</span></a>
        <a id="accountAdmin" class="account-secondary hidden" href="/admin.html">Admin <span lang="th">ผู้ดูแลระบบ</span></a>
        <button id="accountSignOut" class="account-secondary" type="button">Sign out <span lang="th">ออกจากระบบ</span></button>
      </div>
      <p id="accountStatusMessage" class="account-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/app-transitions.js"></script>
  <script type="module" src="/account.js?v=2"></script>
</body>
</html>
