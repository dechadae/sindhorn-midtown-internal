<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E273B">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sindhorn Midtown</title>

<!-- The new app shell, built on the UI Library and nothing else. Same
     stylesheets the library page loads, so what /ci demonstrates is literally
     what renders here.

     Public and unauthenticated on purpose while the pages are being built.
     Auth returns before any page that reads from Supabase lands here.

     THE SPLIT, so reinstall requirement 1 cannot regress by accident:

     - Shell = markup, CSS, JS. Ships from this repo, deployed to Cloudflare
       Pages, precached by sw.js, versioned by bumping VERSION in sw.js. A
       shell update reaches an installed user the next time the app opens -
       no reinstall, because the PWA identity (id/start_url/scope in
       manifest.webmanifest) never changes.

     - Data = whatever a page needs to display: today's numbers, F&B posts,
       brand assets metadata. Loaded at runtime from Supabase as JSON over
       fetch/RPC, never as HTML or CSS. It is not part of the precached
       shell and is not versioned with it.

     The current production app violates this: header.html, today.html,
     footer.html and ui.css are markup and CSS fetched from a Supabase
     table (public.sindhorn_app_files) at boot. That is shell material
     shipped as data, so the service worker cannot precache it, first
     launch depends on a network round trip, and the shell and that pack
     can disagree - which is what produced the "solid purple bar" failure
     documented elsewhere in this repo's history.

     This shell does not do that. Nothing here is fetched from Supabase.
     When a page needs Supabase data it will fetch JSON into a shell that
     is already fully painted, the same way Settings and F&B already read
     rows today - never markup or style. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/line-seed-sans-th-regular.woff2">
<link rel="stylesheet" href="/fonts.css?v=1">
<link rel="stylesheet" href="/app-tokens.css?v=2">
<link rel="stylesheet" href="/app-glass.css?v=7">
<link rel="stylesheet" href="/app-components.css?v=8">
<link rel="stylesheet" href="/app-shell.css?v=1">
</head>
<body>

<div class="environment-stage" id="environmentStage" aria-hidden="true"><canvas class="environment-canvas" id="environmentCanvas"></canvas></div>

<header class="app-masthead">
  <img class="app-masthead-logo" src="/assets/brand/sindhorn-midtown-vignette-white.png" alt="Sindhorn Midtown Hotel Bangkok, Vignette Collection">
</header>

<main class="app-page is-shell" id="routeView">
</main>

<nav class="app-navbar" aria-label="Primary">
  <button class="app-navbar-button" type="button" data-route="today" aria-current="page" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 6h16M4 18h10"/></svg>
    <span>Today</span>
  </button>
  <button class="app-navbar-button" type="button" data-route="fnb" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 11v10M17 3c-1.5 2-1.5 5 0 7v11"/></svg>
    <span>F&amp;B</span>
  </button>
  <button class="app-navbar-button" type="button" data-route="brand" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.4 5 5.6.7-4 3.9 1 5.4-5-2.7-5 2.7 1-5.4-4-3.9 5.6-.7z"/></svg>
    <span>Brand</span>
  </button>
  <button class="app-navbar-button" type="button" data-route="ci" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 10h16M9 10v9"/></svg>
    <span>CI</span>
  </button>
</nav>

<script type="module">
/* The full WebGL runtime directly. betta-runtime.js is a bootstrap that paints
   a still frame and waits for a startup signal the old app shell emits; a page
   outside that shell never receives it, and the glass would be frosting a
   photograph. */
(async () => {
  try {
    const betta = await import('/betta-runtime-full.js?v=1');
    await betta.initEnvironment();
    document.getElementById('environmentStage')?.setAttribute('data-ready', 'true');
  } catch (error) {
    console.warn('Atmosphere unavailable; the shell renders over the flat ground.', error);
  }
})();

// Today is the current view - the Today footer button already carries
// aria-current="page". There is no router yet; F&B, Brand and CI stay
// disabled placeholders until each is built.
import('./today.js').then(({ mountToday }) => mountToday(document.getElementById('routeView')));
</script>

</body>
</html>
