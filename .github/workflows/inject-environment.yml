name: Wire realtime environment preview

on:
  push:
    branches:
      - webgl-environment-v1
    paths:
      - ".github/workflows/inject-environment.yml"

permissions:
  contents: write
  deployments: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Inject progressive environment hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          if '/environment.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="/environment.css">\n</head>', 1)
          stage = '<div class="environment-stage" id="environmentStage" hidden aria-hidden="true"><canvas class="environment-canvas" id="environmentCanvas"></canvas></div>'
          if 'id="environmentStage"' not in s:
              s = s.replace('<body data-level="very-good">', '<body data-level="very-good">\n' + stage, 1)
          if '/environment.js' not in s:
              s = s.replace('</body>', '<script type="module" src="/environment.js"></script>\n</body>', 1)
          p.write_text(s)
          PY

      - name: Verify baseline and enhancement invariants
        run: |
          grep -q 'Readability-only font-size adjustments v5' site/index.html
          grep -q 'id="environmentStage"' site/index.html
          grep -q '/environment.css' site/index.html
          grep -q '/environment.js' site/index.html
          grep -q 'stations.airbkk.com/api/web/data' site/index.html
          ! grep -q 'Editorial typography redesign v4' site/index.html

      - name: Commit preview wiring and remove one-time workflow
        run: |
          git rm .github/workflows/inject-environment.yml
          git add site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire realtime environment preview"
          git push

      - name: Deploy WebGL preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy site --project-name=sindhorn-midtown-internal --branch=webgl-environment-v1
