name: Cool Vignette Betta Preview

on:
  push:
    branches:
      - betta-cool-vignette
    paths:
      - "site/betta-vignette-**"
      - "site/betta-fin-presets.js"
      - "site/betta-environment.js"
      - "site/betta-fin-shader.js"
      - "site/betta-day-periods.js"
      - "site/betta-satellite.js"
      - ".github/workflows/betta-vignette-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: betta-vignette-preview
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Validate Vignette palette contract
        run: |
          set -euo pipefail
          for file in site/betta-vignette-palettes.js site/betta-vignette-test.js site/betta-vignette-browser-smoke.mjs site/betta-fin-presets.js site/betta-environment.js site/betta-fin-shader.js site/betta-day-periods.js; do
            node --input-type=module --check < "$file"
          done
          node site/betta-vignette-palettes.test.mjs
          node site/betta-day-periods.test.mjs

      - name: Verify branch-only scope
        run: |
          set -euo pipefail
          test -f site/betta-vignette-test.html
          test -f site/betta-vignette-test.js
          test -f site/betta-vignette-palettes.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('site/betta-vignette-palettes.js').read_text()
          assert "background" not in text.lower(), 'Vignette grade must not alter backgrounds'
          for token in ('motionSpeed','turbulence','motionAmplitude','edgeFlutter','currentStrength'):
              assert token not in text, f'Vignette grade must not alter {token}'
          html=Path('site/betta-vignette-test.html').read_text()
          assert 'bootstrap.js' not in html and 'login' not in html.lower(), 'public reviewer must remain independent of auth shell'
          PY

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch=betta-cool-vignette

      - name: Smoke public reviewer and satellite
        run: |
          set -euo pipefail
          BASE_URL="https://betta-cool-vignette.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /betta-vignette-test.html /betta-vignette-test.js /betta-vignette-palettes.js /betta-environment.js /betta-fin-presets.js /betta-fin-shader.js /betta-day-periods.js /betta-satellite.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke
            test -s /tmp/smoke
          done
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/api/betta-satellite?kind=latest" -o /tmp/satellite.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/satellite.json'))
          assert data.get('ok') is True,data
          assert data.get('satellite')=='Himawari-9',data
          assert data.get('provider')=='JMA',data
          PY

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate public mobile and desktop renderer
        env:
          BETTA_VIGNETTE_BASE_URL: https://betta-cool-vignette.sindhorn-midtown-internal.pages.dev
        run: node site/betta-vignette-browser-smoke.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cool-vignette-betta-evidence
          path: betta-vignette-artifacts
          if-no-files-found: warn
          retention-days: 14
