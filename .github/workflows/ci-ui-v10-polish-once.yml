name: Sindhorn CI UI v10 polish
on:
  push:
    branches: [flipgazine-ci-ui-v10]
    paths: ['.github/workflows/ci-ui-v10-polish-once.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Apply route visibility and compact mobile hierarchy
        run: |
          cat >> site/ci-ui.css <<'CSS'

          /* v10 final route + mobile polish. Hidden SPA groups must beat every
             surface/component display declaration, including environment-ready rules. */
          [data-app-route-hidden],
          body.environment-ready [data-app-route-hidden],
          body.environment-ready .report-actionbar[data-app-route-hidden],
          body.environment-ready .weather-now[data-app-route-hidden]{display:none!important}

          /* Keep the date visible on the smallest supported phone. The prior baseline
             hid it below 360px; the CI header has enough room after compacting type. */
          @media(max-width:359px){
            .today{display:block!important;min-width:76px!important}
            .today .en{font-size:.56rem!important;letter-spacing:.11em!important}
            .today .th{font-size:.67rem!important}
            .masthead-inner{gap:7px!important}
            .masthead-tools{gap:6px!important}
          }

          /* Today must remain immediately useful on launch. Use the original compact
             information geometry, but retain the larger/readable v10 type and CI styling. */
          @media(max-width:520px){
            body[data-route="today"].environment-ready{
              --type-label:.72rem;
              --type-body:.90rem;
              --type-subhead:1.06rem;
            }
            body[data-route="today"] .intro{padding:24px 0 17px!important}
            body[data-route="today"] .eyebrow{margin-bottom:8px!important;font-size:.64rem!important}
            body[data-route="today"] h1{font-size:clamp(2.4rem,11.3vw,3.05rem)!important;line-height:.94!important}
            body[data-route="today"] h1 :lang(th){margin-top:6px!important;font-size:.43em!important}
            body[data-route="today"] .intro-copy{display:none!important}
            body[data-route="today"] .report-head{padding:11px 0!important}
            body[data-route="today"] .station strong{font-size:.67rem!important;letter-spacing:.12em!important}
            body[data-route="today"] .station span{font-size:.82rem!important;line-height:1.3!important}
            body[data-route="today"] .connection{font-size:.64rem!important;min-height:24px!important}
            body[data-route="today"] .reading{padding:20px 0 18px!important}
            body[data-route="today"] .metric-label{margin-bottom:12px!important}
            body[data-route="today"] .metric-label strong{font-size:.70rem!important}
            body[data-route="today"] .metric-label span{font-size:.72rem!important;line-height:1.22!important}
            body[data-route="today"] .number-line{min-height:78px!important}
            body[data-route="today"] .pm-value{font-size:clamp(5rem,24vw,6.2rem)!important;line-height:.70!important}
            body[data-route="today"] .unit{font-size:.93rem!important}
            body[data-route="today"] .observed{margin-top:13px!important;font-size:.78rem!important;line-height:1.35!important}
            body[data-route="today"] .aqi-line{margin:0!important;padding:7px 0 5px 14px!important;gap:10px!important}
            body[data-route="today"] .aqi-label{font-size:.67rem!important;line-height:1.3!important}
            body[data-route="today"] .aqi-value{font-size:3.55rem!important;line-height:.80!important}
            body[data-route="today"] .status-panel{padding:16px 0 18px!important}
            body[data-route="today"] .status-index{margin-bottom:8px!important;font-size:.66rem!important}
            body[data-route="today"] .category-en{display:inline!important;font-size:clamp(1.82rem,8.4vw,2.25rem)!important;line-height:1!important}
            body[data-route="today"] .category-th{display:inline!important;margin:0 0 0 8px!important;font-size:1.02rem!important;line-height:1.2!important}
            body[data-route="today"] .guidance-lead{margin:10px 0 0!important;padding-top:9px!important;font-size:.90rem!important;line-height:1.42!important}
            body[data-route="today"] .guidance-lead :lang(th){display:inline!important;margin-left:.32em!important;font-size:1em!important}
          }
          CSS

          # Service worker cache identity changes because ci-ui.css changed.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/sw.js')
          s=p.read_text()
          assert "sindhorn-midtown-internal-pwa-v10" in s
          p.write_text(s.replace("sindhorn-midtown-internal-pwa-v10","sindhorn-midtown-internal-pwa-v10.1",1))
          p=Path('site/version.txt')
          s=p.read_text()
          if 'ui-polish:' not in s:
            s += 'ui-polish: route-isolation-date-visible-first-view-v10.1\n'
          p.write_text(s)
          PY

      - name: Static checks
        run: |
          grep -q 'report-actionbar\[data-app-route-hidden\]' site/ci-ui.css
          grep -q 'body\[data-route="today"\]' site/ci-ui.css
          grep -q 'pwa-v10.1' site/sw.js
          node --check site/app.js
          node --check site/environment.bundle.js

      - name: Browser QA routes and first viewport
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > polish-check.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{w:390,h:844,label:'390'},{w:320,h:720,label:'320'}]){
              const context=await browser.newContext({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('page:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1800);
              const today=await page.evaluate(()=>{
                const date=document.querySelector('.today');
                const status=document.querySelector('.status-panel');
                const guidance=document.querySelector('.guidance-lead');
                const nav=document.querySelector('.app-tabbar');
                const sr=status.getBoundingClientRect(), gr=guidance.getBoundingClientRect(), nr=nav.getBoundingClientRect();
                return {
                  route:document.body.dataset.route,
                  dateDisplay:getComputedStyle(date).display,
                  dateWidth:date.getBoundingClientRect().width,
                  statusTop:sr.top,statusBottom:sr.bottom,
                  guidanceTop:gr.top,guidanceBottom:gr.bottom,
                  navTop:nr.top,
                  width:document.documentElement.scrollWidth,
                  envReady:document.body.classList.contains('environment-ready')
                };
              });
              console.log('TODAY '+vp.label,JSON.stringify(today));
              await page.screenshot({path:`today-polish-${vp.label}.png`,fullPage:false});
              if(today.route!=='today'||today.dateDisplay==='none'||today.dateWidth<40)throw new Error('date missing '+vp.label);
              if(today.width>vp.w+1)throw new Error('horizontal overflow '+vp.label);
              // At 390x844 the status meaning and beginning of guidance must be visible above the fixed nav.
              if(vp.w===390&&(today.statusTop>=today.navTop||today.guidanceTop>=today.navTop))throw new Error('today meaning is still below nav');

              await page.click('[data-app-route="guidance"]');
              await page.waitForTimeout(350);
              const guidanceRoute=await page.evaluate(()=>({
                route:document.body.dataset.route,
                saveDisplay:getComputedStyle(document.getElementById('saveImageBtn')).display,
                weatherDisplay:getComputedStyle(document.getElementById('weatherNow')).display,
                hero:document.querySelector('.route-hero h1')?.textContent.trim(),
                width:document.documentElement.scrollWidth
              }));
              console.log('GUIDANCE '+vp.label,JSON.stringify(guidanceRoute));
              if(vp.w===390)await page.screenshot({path:'guidance-polish-390.png',fullPage:false});
              if(guidanceRoute.route!=='guidance'||guidanceRoute.saveDisplay!=='none'||guidanceRoute.weatherDisplay!=='none'||!guidanceRoute.hero.includes('Guidance')||guidanceRoute.width>vp.w+1)throw new Error('guidance route isolation failed');

              await page.click('[data-app-route="details"]');
              await page.waitForTimeout(350);
              const detailsRoute=await page.evaluate(()=>({
                route:document.body.dataset.route,
                saveDisplay:getComputedStyle(document.getElementById('saveImageBtn')).display,
                weatherDisplay:getComputedStyle(document.getElementById('weatherNow')).display,
                hero:document.querySelector('.route-hero h1')?.textContent.trim(),
                width:document.documentElement.scrollWidth
              }));
              console.log('DETAILS '+vp.label,JSON.stringify(detailsRoute));
              if(vp.w===390)await page.screenshot({path:'details-polish-390.png',fullPage:false});
              if(detailsRoute.route!=='details'||detailsRoute.saveDisplay!=='none'||detailsRoute.weatherDisplay!=='none'||!detailsRoute.hero.includes('Reading details')||detailsRoute.width>vp.w+1)throw new Error('details route isolation failed');

              await page.evaluate(()=>document.body.classList.add('is-fullscreen'));
              const full=await page.evaluate(()=>{const h=document.querySelector('.masthead');const r=h.getBoundingClientRect();return{top:r.top,position:getComputedStyle(h).position}});
              if(full.position!=='fixed'||Math.abs(full.top)>1)throw new Error('fullscreen top header failed');
              if(errors.length)throw new Error(errors.join('\n'));
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node polish-check.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sindhorn-ci-ui-v10-polish
          path: |
            today-polish-390.png
            today-polish-320.png
            guidance-polish-390.png
            details-polish-390.png
          if-no-files-found: ignore

      - name: Commit verified polish and remove helper
        run: |
          rm -f .github/workflows/ci-ui-v10-polish-once.yml
          git config user.name dechadae
          git config user.email decha.dae@gmail.com
          git add site/ci-ui.css site/sw.js site/version.txt .github/workflows/ci-ui-v10-polish-once.yml
          git commit -m 'Polish route isolation and mobile first view'
          git push origin HEAD:flipgazine-ci-ui-v10
