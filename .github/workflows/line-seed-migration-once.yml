name: One-shot LINE Seed Sans TH Migration

on:
  push:
    branches: [typography-line-seed-sans-th]
    paths:
      - ".github/workflows/line-seed-migration-once.yml"
      - ".github/scripts/line_seed_migrate.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: typography-line-seed-sans-th
          fetch-depth: 0

      - name: Fetch licensed LINE Seed Sans TH WOFF2 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/fonts
          base="https://raw.githubusercontent.com/lazywasabi/thai-web-fonts/ab4fd8ebd39f522cee8bdf290a0c10f20a05b19e/fonts/LINESeedSansTH"
          curl --fail --silent --show-error --location "$base/LINESeedSansTH-Thin.woff2" -o site/assets/fonts/line-seed-sans-th-thin.woff2
          curl --fail --silent --show-error --location "$base/LINESeedSansTH-Regular.woff2" -o site/assets/fonts/line-seed-sans-th-regular.woff2
          curl --fail --silent --show-error --location "$base/LINESeedSansTH-Bold.woff2" -o site/assets/fonts/line-seed-sans-th-bold.woff2
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/line/seed/0564884c67ebdb3b31e90e2106c2d061f953b6a0/OFL.txt" -o site/assets/fonts/OFL-LINE-SEED.txt
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('site/assets/fonts').glob('line-seed-sans-th-*.woff2'):
              data=path.read_bytes()
              assert data[:4]==b'wOF2',f'{path} is not WOFF2'
              assert len(data)>10000,f'{path} suspiciously small'
              print(path,len(data))
          license=Path('site/assets/fonts/OFL-LINE-SEED.txt').read_text()
          assert 'SIL OPEN FONT LICENSE Version 1.1' in license
          assert 'LY Corporation' in license
          PY

      - name: Apply single-family typography migration
        run: python3 .github/scripts/line_seed_migrate.py

      - name: Validate migrated architecture
        shell: bash
        run: |
          set -euo pipefail
          node site/font-architecture.test.mjs
          node --input-type=module --check < site/sw.js
          node --input-type=module --check < site/fnb.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          banned=re.compile(r'Vignette Sans|Noto Sans Thai|Noto Sans|Poppins|IBM Plex Sans Thai',re.I)
          offenders=[]
          for root in (Path('site'),Path('.github/workflows')):
              for path in root.rglob('*'):
                  if not path.is_file() or 'vendor' in path.parts or path.name=='environment.bundle.js':continue
                  if path.suffix.lower() not in {'.css','.html','.js','.mjs','.json','.webmanifest','.yml','.yaml'}:continue
                  text=path.read_text(errors='ignore')
                  if banned.search(text):offenders.append(str(path))
          assert not offenders,'retired font references remain in production: '+', '.join(offenders)
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add -A
          git commit -m "Migrate entire PWA to LINE Seed Sans TH"
          git push origin HEAD:typography-line-seed-sans-th
