name: Betta Fin Visual Lab Preview

on:
  push:
    branches: [betta-fin-lab]
    paths:
      - "site/betta-fin-lab.html"
      - "site/betta-fin-lab.css"
      - "site/betta-fin-lab.js"
      - "site/betta-fin-shader.js"
      - "site/betta-fin-presets.js"
      - "scripts/betta-fin-contract-test.mjs"
      - "scripts/betta-fin-browser-smoke.mjs"
      - "docs/BETTA-FIN-LAB-ARCHITECTURE-20260830.md"
      - ".github/workflows/betta-fin-lab-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: betta-fin-lab-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate lab syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          for file in site/betta-fin-lab.js site/betta-fin-shader.js site/betta-fin-presets.js scripts/betta-fin-contract-test.mjs scripts/betta-fin-browser-smoke.mjs; do
            node --input-type=module --check < "$file"
          done
          node scripts/betta-fin-contract-test.mjs

      - name: Verify production systems are untouched
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          for file in \
            site/index.html site/app.js site/bootstrap.js site/route-registry.js \
            site/auth-shell.js site/auth-client.js site/capabilities.js \
            site/environment.js site/atmosphere-shader.js site/live-data.js site/weather-authority.js \
            site/rain-now.js site/rain-layer.js site/seasonal-sky.js site/sw.js \
            site/fnb.js site/fnb.css site/fnb-approved-polish.css \
            site/settings.js site/settings.css site/settings-route-v3.js \
            site/messages.js site/messages.css site/footer-route-guard.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw preview smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in /betta-fin-lab.html /betta-fin-lab.css /betta-fin-lab.js /betta-fin-shader.js /betta-fin-presets.js /vendor/three.module.js /fonts.css; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Browser rendering and mobile-oriented profile
        shell: bash
        env:
          BETTA_BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          BETTA_SCREENSHOT_DIR: betta-fin-artifacts
        run: node scripts/betta-fin-browser-smoke.mjs

      - name: Upload visual and performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: betta-fin-lab-evidence
          path: betta-fin-artifacts
          if-no-files-found: warn
          retention-days: 14
