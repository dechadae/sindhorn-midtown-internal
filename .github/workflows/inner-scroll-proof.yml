name: Business Card Inner Scroll Proof
on:
  push:
    branches: [hotfix-business-card-inner-scroll]
    paths: ['.github/workflows/inner-scroll-proof.yml']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify immutable preview and fixed shell
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://2292fdc3.sindhorn-midtown-internal.pages.dev'
          for n in {1..12}; do
            code="$(curl -sS -o /tmp/card -w '%{http_code}' "$BASE/dechak" || true)"
            echo "attempt $n -> $code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const base='https://2292fdc3.sindhorn-midtown-internal.pages.dev';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const response=await page.goto(base+'/dechak',{waitUntil:'networkidle'});
          if(response?.status()!==200)throw new Error('card status '+response?.status());
          const panel=page.locator('.public-card-panel');
          const scroll=page.locator('[data-card-scroll]');
          await panel.waitFor({state:'visible'});
          const before=await panel.evaluate(node=>{const r=node.getBoundingClientRect(),s=getComputedStyle(node);return{top:r.top,left:r.left,right:r.right,bottom:r.bottom,width:r.width,height:r.height,radius:s.borderRadius,overflow:s.overflow}});
          const viewport=page.viewportSize();
          const left=before.left,right=viewport.width-before.right;
          if(Math.abs(left-right)>1)throw new Error(`side margins differ: ${left} vs ${right}`);
          if(before.top<8||before.bottom>viewport.height-8)throw new Error(`card corners not fully visible: ${JSON.stringify(before)}`);
          if(!before.radius.includes('22px')&&!before.radius.includes('24px'))throw new Error(`rounded shell missing: ${before.radius}`);
          const scrollBefore=await scroll.evaluate(node=>({top:node.scrollTop,height:node.clientHeight,scrollHeight:node.scrollHeight,overflowY:getComputedStyle(node).overflowY}));
          if(scrollBefore.overflowY!=='auto'||scrollBefore.scrollHeight<=scrollBefore.height)throw new Error(`inner scroll unavailable: ${JSON.stringify(scrollBefore)}`);
          await scroll.evaluate(node=>{node.scrollTop=Math.min(500,node.scrollHeight-node.clientHeight)});
          await page.waitForTimeout(100);
          const scrollAfter=await scroll.evaluate(node=>node.scrollTop);
          const after=await panel.evaluate(node=>{const r=node.getBoundingClientRect();return{top:r.top,left:r.left,right:r.right,bottom:r.bottom,width:r.width,height:r.height}});
          for(const key of ['top','left','right','bottom','width','height'])if(Math.abs(before[key]-after[key])>.5)throw new Error(`outer card moved on ${key}: ${before[key]} -> ${after[key]}`);
          if(scrollAfter<=0)throw new Error('inner content did not scroll');
          if(await page.evaluate(()=>window.scrollY)!==0)throw new Error('page moved instead of card content');
          await page.screenshot({path:'/tmp/inner-scroll-proof.png'});
          console.log(JSON.stringify({before,after,leftMargin:left,rightMargin:right,scrollBefore,scrollAfter},null,2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: inner-scroll-proof
          path: /tmp/inner-scroll-proof.png
          retention-days: 7
