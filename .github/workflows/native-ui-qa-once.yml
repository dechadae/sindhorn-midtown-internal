name: Native UI browser QA
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/native-ui-qa-once.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > qa.cjs <<'EOF'
          const {chromium}=require('playwright');
          const BASE='https://webgl-environment-v1.sindhorn-midtown-internal.pages.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:390,height:844,name:'mobile'},{width:1440,height:1000,name:'desktop'}]){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('page:'+String(e)));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.app-tabbar');
              await page.waitForFunction(()=>document.body.classList.contains('environment-ready'));
              await page.waitForTimeout(2500);
              const layout=await page.evaluate(()=>{
                const header=document.querySelector('.masthead').getBoundingClientRect();
                const tab=document.querySelector('.app-tabbar').getBoundingClientRect();
                const canvas=document.querySelector('#environmentCanvas');
                const c=canvas.getBoundingClientRect();
                return {
                  headerPosition:getComputedStyle(document.querySelector('.masthead')).position,
                  headerHeight:header.height,
                  tabCenter:tab.left+tab.width/2,
                  viewportCenter:innerWidth/2,
                  canvasCssRatio:c.width/c.height,
                  canvasBufferRatio:canvas.width/canvas.height,
                  stageHeight:document.querySelector('#environmentStage').getBoundingClientRect().height,
                  innerHeight,
                  manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href'),
                  themeToggle:!!document.querySelector('#themeToggle'),
                  logoSrc:document.querySelector('.brand-lockup .logo-dark')?.getAttribute('src')
                };
              });
              if(layout.headerPosition!=='sticky')throw new Error(vp.name+': header not sticky');
              if(vp.name==='desktop'&&layout.headerHeight>92)throw new Error('desktop header too tall: '+layout.headerHeight);
              if(Math.abs(layout.tabCenter-layout.viewportCenter)>1.5)throw new Error(vp.name+': tab bar not centered');
              if(Math.abs(layout.canvasCssRatio-layout.canvasBufferRatio)>.015)throw new Error(vp.name+': canvas aspect mismatch '+JSON.stringify(layout));
              if(Math.abs(layout.stageHeight-layout.innerHeight)>3)throw new Error(vp.name+': atmosphere viewport mismatch '+JSON.stringify(layout));
              if(layout.manifest!='/manifest.webmanifest'||layout.themeToggle)throw new Error(vp.name+': PWA shell mismatch');
              if(!layout.logoSrc?.includes('sindhorn-midtown'))throw new Error(vp.name+': hotel logo missing');
              const n0=await page.evaluate(()=>performance.getEntriesByType('navigation').length);
              await page.click('[data-app-route="guidance"]');
              await page.waitForFunction(()=>document.body.dataset.route==='guidance');
              await page.click('[data-app-route="details"]');
              await page.waitForFunction(()=>document.body.dataset.route==='details');
              if(await page.evaluate(()=>performance.getEntriesByType('navigation').length)!==n0)throw new Error(vp.name+': SPA route caused reload');
              await page.goto(BASE+'/',{waitUntil:'domcontentloaded'});
              const sw=await page.evaluate(async()=>!!(await navigator.serviceWorker.ready).active);
              if(!sw)throw new Error(vp.name+': service worker inactive');
              const relevant=errors.filter(x=>!x.includes('api.open-meteo.com')&&!x.includes('stations.airbkk.com'));
              if(relevant.length)throw new Error(vp.name+': '+relevant.join(' | '));
              await page.screenshot({path:`${vp.name}.png`,fullPage:false});
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa.cjs
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-qa-screens
          path: |
            mobile.png
            desktop.png
      - name: Remove helper
        if: always()
        run: |
          rm -f .github/workflows/native-ui-qa-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add .github/workflows/native-ui-qa-once.yml
          git commit -m "Remove native UI QA helper" || true
          git push origin HEAD:webgl-environment-v1 || true
