name: Upgrade preview to PWA SPA
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/pwa-spa-upgrade-once.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install icon tooling
        run: python3 -m pip install --quiet pillow
      - name: Apply PWA SPA conversion
        run: python3 scripts/apply_pwa_upgrade.py
      - name: Static verification
        run: |
          python3 -m json.tool site/manifest.webmanifest >/dev/null
          node --check site/app.js
          node --check site/sw.js
          grep -q 'id="fullscreenToggle"' site/index.html
          grep -q 'rel="manifest" href="/manifest.webmanifest"' site/index.html
          grep -q 'src="/app.js"' site/index.html
          grep -q 'href="/pwa.css"' site/index.html
          ! grep -q 'themeToggle\|THEME_KEY\|themeQuery\|applyTheme(\|fg-pwa' site/index.html
          test -f site/icons/app-192.png
          test -f site/icons/app-512.png
          test -f site/icons/maskable-512.png
          test -f site/icons/apple-touch-icon.png
      - name: Commit conversion and remove helpers
        run: |
          rm -f .github/workflows/pwa-spa-upgrade-once.yml .github/workflows/inspect-theme-once.yml scripts/apply_pwa_upgrade.py
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add AGENTS.md docs site .github/workflows scripts
          git commit -m "Upgrade preview to fullscreen PWA SPA"
          git push origin HEAD:webgl-environment-v1
