name: Sindhorn bilingual hierarchy v11 finalize
on:
  push:
    branches: [bilingual-hierarchy-v11]
    paths: ['.github/workflows/bilingual-hierarchy-v11-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Apply bilingual hierarchy
        run: python3 scripts/apply-bilingual-v11.py

      - name: Static checks
        run: |
          grep -q 'English typography remains eminent' site/ci-ui.css
          grep -q 'guidance-lead instruction-copy' site/index.html
          grep -q 'id="everyoneTh"' site/index.html
          grep -q 'id="sensitiveTh"' site/index.html
          grep -q 'disclaimer instruction-copy' site/index.html
          grep -q 'pwa-v11' site/sw.js
          node --check site/app.js
          node --check site/environment.bundle.js

      - name: Browser QA bilingual hierarchy and routes
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/qa-bilingual-v11.cjs

      - name: Commit verified hierarchy and remove temporary helpers
        run: |
          rm -f .github/workflows/bilingual-hierarchy-v11-once.yml scripts/apply-bilingual-v11.py scripts/qa-bilingual-v11.cjs
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site docs AGENTS.md .github/workflows/bilingual-hierarchy-v11-once.yml scripts/apply-bilingual-v11.py scripts/qa-bilingual-v11.cjs
          git commit -m "Apply bilingual hierarchy with eminent English typography"
          git push origin HEAD:bilingual-hierarchy-v11
