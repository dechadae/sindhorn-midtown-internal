name: PWA Fast Startup Preview

on:
  push:
    branches:
      - fix-pwa-fast-startup
      - preview-ci-glass
    paths:
      - "site/**"
      - "scripts/ci-glass-browser-smoke.mjs"
      - "scripts/utility-action-browser-smoke.mjs"
      - "scripts/pull-refresh-browser-smoke.mjs"
      - ".github/workflows/pwa-fast-startup-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate production startup, glass, utility and pull-reload contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sw.js
          for file in \
            site/pwa-version-guard.js site/betta-runtime.js site/betta-runtime-full.js site/auth-shell.js site/app.js \
            site/startup-skeleton.js site/ui-system-registry.js site/ci-day-cycle-route.js site/ci-glass-audit.js \
            site/settings-route-v3.js site/brand-route-controls.js site/fnb-share-ui.js \
            scripts/ci-glass-browser-smoke.mjs scripts/utility-action-browser-smoke.mjs scripts/pull-refresh-browser-smoke.mjs; do
            node --input-type=module --check < "$file"
          done
          grep -q "sindhorn-midtown-internal-pwa-v47-skeleton-pulse-r1" site/sw.js
          grep -q "PRECACHE_CONCURRENCY=8" site/sw.js
          grep -q "betta-runtime-full.js?v=1" site/betta-runtime.js
          grep -q "betta-runtime.js?v=2" site/index.html
          grep -q "auth-shell.js?v=7" site/index.html
          grep -q "bootstrap.js?v=3" site/auth-shell.js site/index.html
          grep -q "app.js?v=2" site/bootstrap.js
          grep -q "pwa.css?v=2" site/index.html
          grep -q "startup-skeleton.css?v=2" site/index.html
          grep -q "startup-skeleton.js?v=1" site/index.html
          grep -q "data-startup-skeleton" site/startup-skeleton.js
          grep -q "sindhorn-skeleton-surface-pulse" site/startup-skeleton.css
          grep -q "sindhorn-skeleton-line-pulse" site/startup-skeleton.css
          grep -q "sindhorn-betta-bootstrap-first-frame" site/betta-runtime.js
          grep -q "sindhorn:betta-first-frame" site/pwa-version-guard.js
          grep -q '"name":"Sindhorn Midtown Internal"' site/manifest.webmanifest
          grep -q "addEventListener('fetch'" site/sw.js
          grep -q "app-controls.css?v=2" site/index.html
          grep -q "app-glass.css?v=5" site/index.html
          grep -q "brand-route-controls.js?v=2" site/index.html
          grep -q "ci-compact-fixes.css?v=2" site/index.html
          grep -q -- "--app-glass-surface-filter:blur(32px)" site/app-glass.css
          grep -q -- "--app-glass-control-filter:blur(20px)" site/app-glass.css
          grep -q -- "--app-glass-surface-fill:rgba(46,39,59,.64)" site/app-glass.css
          grep -q "#route-view :is" site/app-glass.css
          grep -q "\.message-clear" site/app-glass.css
          grep -q "\.settings-add" site/app-glass.css
          grep -q "\.settings-system-library-card" site/app-glass.css
          grep -q "Utility actions are transparent affordances" site/app-glass.css
          grep -q "backdrop-filter:none!important" site/app-controls.css
          grep -q "\.app-utility-action" site/app-controls.css site/app-glass.css site/ui-system-registry.js
          grep -q "Sign out, Share and Back to top" site/app-controls.css site/ui-system-registry.js
          grep -q "fresh.className='app-utility-action settings-hero-signout'" site/settings-route-v3.js
          grep -q "className='app-utility-action fnb-action-control fnb-share-button'" site/fnb-share-ui.js
          grep -q "button.className='app-utility-action'" site/brand-route-controls.js
          grep -q "classList.add('app-utility-action')" site/ci-day-cycle-route.js
          grep -q "fnb-refinements.css?v=2" site/fnb-route.js
          grep -q "fnb-share-ui.js?v=4" site/fnb-route.js
          grep -q "fnb-route.js?v=2" site/route-registry.js
          grep -q "settings-route-v3.js?v=14&r=utility-action-1" site/route-registry.js
          grep -q "ci-day-cycle-route.js?v=3" site/route-registry.js
          grep -q "business-card-settings.css?v=12" site/settings-route-v3.js
          grep -q "settings-hero>.settings-hero-signout.*position:absolute" site/business-card-settings.css
          grep -q "\[data-betta-period\]" site/ci-compact-fixes.css
          grep -q "font-size:12px!important" site/ci-compact-fixes.css
          grep -q "Translucency always blurs" site/ui-system-registry.js
          grep -q "Utility actions are frameless and right aligned" site/ui-system-registry.js
          grep -q "1.3.0-preview" site/ui-system-registry.js
          grep -q "mountCiGlassAudit" site/ci-day-cycle-route.js site/ci-glass-audit.js
          grep -q "\.factsheet-picture" site/app-glass.css
          grep -q "Factsheet image-frame blur is active" site/ci-glass-audit.js
          grep -q "dataset.shellPullRefresh='true'" site/app.js
          grep -q "pull-refresh-spinner" site/app.js site/pwa.css
          grep -q "Release to reload" site/app.js
          grep -q "mountRoute?.(routeAtStart,{animate:false})" site/app.js
          grep -q "sindhornPullReloadRing" site/pwa.css
          if grep -q "ENVIRONMENT_ROUTES" site/app.js; then
            echo 'Pull-to-reload must not be route-gated' >&2
            exit 1
          fi
          if grep -q "pull-refresh-icon" site/app.js; then
            echo 'Legacy pull arrow/icon container must not return' >&2
            exit 1
          fi
          if grep -q "navigator.vibrate" site/app.js; then
            echo 'Pull-to-reload must remain haptic-free' >&2
            exit 1
          fi
          if grep -Eq "fresh\.className=.*fnb-.*settings-hero-signout" site/settings-route-v3.js; then
            echo 'Hero sign out must never inherit framed F&B button classes' >&2
            exit 1
          fi
          if grep -Eq "sindhorn-skeleton-sheen|translateX\(" site/startup-skeleton.css; then
            echo 'Directional skeleton sweep must not return' >&2
            exit 1
          fi
          if grep -Eq "bezierCurveTo|\.ellipse\(" site/betta-runtime.js; then
            echo 'Temporary bootstrap fish artwork must not return' >&2
            exit 1
          fi
          if grep -q "client.navigate(client.url)" site/sw.js; then
            echo 'Activation-time client navigation must not return' >&2
            exit 1
          fi
          if grep -q 'html\[data-startup-enter="pending"\].*opacity:0' site/index.html; then
            echo 'Authenticated shell must remain visible while startup is pending' >&2
            exit 1
          fi
          test $(wc -c < site/betta-runtime.js) -lt 20000
          test $(wc -c < site/betta-runtime-full.js) -gt 300000

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke preview assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /ci /fnb /settings /hotel-factsheet /sw.js /manifest.webmanifest '/app.js?v=2' '/pwa.css?v=2' '/app-controls.css?v=2' '/app-glass.css?v=5' '/ci-compact-fixes.css?v=2' '/ci-glass-audit.js?v=1' '/ci-day-cycle-route.js?v=3' /ui-system-registry.js '/fnb-route.js?v=2' '/fnb-refinements.css?v=2' '/fnb-share-ui.js?v=4' '/startup-skeleton.css?v=2' '/startup-skeleton.js?v=1' '/pwa-version-guard.js?v=2' '/auth-shell.js?v=7' '/bootstrap.js?v=3' '/route-registry.js' '/settings-route-v3.js?v=14&r=utility-action-1' '/business-card-settings.css?v=12' '/brand-route-controls.js?v=2' '/betta-runtime.js?v=2' '/betta-runtime-full.js?v=1'; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done

      - name: Browser audit developer UI and appwide pull reload
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/ci-glass-preview
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/ci-glass-browser-smoke.mjs | tee /tmp/ci-glass-report.json
          node scripts/utility-action-browser-smoke.mjs | tee /tmp/utility-action-report.json
          node scripts/pull-refresh-browser-smoke.mjs | tee /tmp/pull-refresh-report.json

      - name: Upload CI glass screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-glass-preview
          path: |
            /tmp/ci-glass-preview
            /tmp/ci-glass-report.json
            /tmp/utility-action-report.json
            /tmp/pull-refresh-report.json
          if-no-files-found: warn
          retention-days: 14
