name: Night atmosphere v8 branch
on:
  push:
    branches:
      - night-atmosphere-v8-fix
    paths:
      - .github/workflows/night-atmosphere-v8-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Apply realtime night atmosphere
        run: python3 .github/scripts/night_atmosphere_v8.py
      - name: Rebuild Three.js bundle
        run: |
          npx --yes esbuild@0.25.9 site/environment.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/environment.bundle.js
          node --check site/environment.bundle.js
      - name: Static checks
        run: |
          grep -q 'lunarPosition' site/environment.js
          grep -q 'uMoonAltitude' site/environment.bundle.js
          grep -q 'overcast=' site/environment.js
          grep -q 'pwa-v8' site/sw.js
      - name: Browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > check.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/?debug=1',{waitUntil:'networkidle'});
            await page.waitForTimeout(2500);
            const d=await page.evaluate(()=>({
              ready:document.body.classList.contains('environment-ready'),
              moon:+document.body.dataset.environmentMoonAltitude,
              illum:+document.body.dataset.environmentMoonIllumination,
              cloud:document.body.dataset.environmentCloud,
              weather:document.body.dataset.environmentWeather,
              quality:document.body.dataset.environmentQuality,
              canvasOpacity:getComputedStyle(document.getElementById('environmentCanvas')).opacity
            }));
            console.log('ENV',JSON.stringify(d));
            if(!d.ready||!Number.isFinite(d.moon)||!Number.isFinite(d.illum))throw new Error('lunar state missing');
            if(d.canvasOpacity!=='1')throw new Error('canvas not visible');
            if(errors.length)throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - name: Commit generated changes
        run: |
          rm -f .github/workflows/night-atmosphere-v8-once.yml .github/scripts/night_atmosphere_v8.py
          git config user.name dechadae
          git config user.email decha.dae@gmail.com
          git add site .github/workflows/night-atmosphere-v8-once.yml .github/scripts/night_atmosphere_v8.py
          git commit -m 'Add realtime moon and visible night atmosphere'
          git push origin HEAD:night-atmosphere-v8-fix
