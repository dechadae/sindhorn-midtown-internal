name: Launch Hardening

on:
  push:
    branches:
      - phase7-launch-hardening
      - phase8-2-bangkok-seasonal-clouds
      - main
    paths:
      - "site/**"
      - "sky-worker/wrangler.jsonc"
      - ".github/workflows/launch-hardening.yml"
      - ".github/workflows/phase8-2-seasonal-clouds.yml"
      - "docs/PHASE6-WEB-PUSH-IMPLEMENTATION-20260826.md"
      - "docs/PHASE7-LAUNCH-HARDENING-20260827.md"
      - "docs/BANGKOK-SEASONAL-SKY-AND-CLOUD-ARCHITECTURE-OVERRIDE-20260827.md"
      - "docs/PHASE8.2-BANGKOK-SEASONAL-CLOUD-MORPHOLOGY-PLAN-20260827.md"
      - "docs/PHASE8.2-IMPLEMENTATION-20260827.md"
      - "docs/ANDROID-WEB-PUSH-ACCEPTANCE-20260827.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sindhorn-midtown-launch-hardening-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify frozen PWA identity, Messages, push and Phase 8.2 architecture
        shell: bash
        run: |
          set -euo pipefail
          for file in site/bootstrap.js site/route-registry.js site/app-transitions.js site/footer-route-guard.js site/app.js site/push-client.js site/notification-inbox.js site/environment.js site/atmosphere-shader.js site/seasonal-sky.js site/phase8-2-fixtures.js site/sw.js; do node --check "$file"; done
          node --experimental-default-type=module site/phase8-2-seasonal-clouds.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site')
          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'
          assert 'display_override' not in pwa
          bootstrap=(root/'bootstrap.js').read_text(); registry=(root/'route-registry.js').read_text(); transitions=(root/'app-transitions.js').read_text(); footer_guard=(root/'footer-route-guard.js').read_text(); footer_css=(root/'footer-route-guard.css').read_text(); fallback=json.loads((root/'fallback/manifest.json').read_text())
          shell=int(re.search(r'const SHELL_VERSION=(\d+);',bootstrap).group(1)); assert shell==17 and fallback['minimumShell']==shell
          assert "FALLBACK_REQUIRED=[...REQUIRED,'messages.html']" in bootstrap
          assert "fnb:Object.freeze({path:'/fnb'" in registry and "messages:Object.freeze({path:'/messages'" in registry
          assert "mount:'mountFnbRoute'" in registry and "kind:'local'" in registry
          assert "routeLink.dataset.appRoute" in transitions and 'transitionToRoute' in transitions
          assert "sindhorn-footer-v4-fnb-direct" in footer_guard and "route:'fnb'" in footer_guard and "route:'messages'" in footer_guard
          assert "FNB_MODULE_URL='/fnb.js?v=4'" in footer_guard and 'module.mountFnbRoute' in footer_guard and "dataset.fnbNav='fnb'" in footer_guard
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))!important' in footer_css and 'height:44px!important' in footer_css
          for item in fallback['resources']: assert hashlib.sha256((root/'fallback'/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']
          fallback_today=(root/'fallback'/'today.html').read_text(); assert 'saveImageBtn' not in fallback_today and 'report-actionbar' not in fallback_today
          app=(root/'app.js').read_text(); assert "navigator.serviceWorker.register('/sw.js',{scope:'/'})" in app and 'performPullRefresh' in app
          inbox=(root/'notification-inbox.js').read_text()
          for token in ('sindhorn-midtown-notification-inbox','messageList','messageClearBtn','SINDHORN_NOTIFICATION_STORED','markAllRead'): assert token in inbox
          push=(root/'push-client.js').read_text(); assert 'pushManager.subscribe' in push and 'enableFromGesture' in push and 'Notification.requestPermission' not in push and 'PREPARE_TIMEOUT_MS' in push
          index=(root/'index.html').read_text(); sw=(root/'sw.js').read_text(); env=(root/'environment.js').read_text(); shader=(root/'atmosphere-shader.js').read_text()
          assert '/footer-route-guard.js?v=4' in index and '/footer-route-guard.css?v=2' in index
          assert '/sky-calibration.js' not in index and '/sky-color-renderer.js' not in index and '/storm-effects.js' not in index
          assert "'/sky-calibration.js'" not in sw and "'/sky-color-renderer.js'" not in sw and "'/storm-effects.js'" not in sw
          assert 'pwa-v23-bangkok-seasonal-clouds' in sw and "'/atmosphere-shader.js'" in sw and "'/seasonal-sky.js'" in sw
          assert "'/footer-route-guard.js'" in sw and "'/footer-route-guard.css'" in sw and "'/fnb.js'" in sw and "'/fnb-data.js'" in sw and "'/fnb.css'" in sw
          assert "addEventListener('push'" in sw and "addEventListener('notificationclick'" in sw and 'storeNotification' in sw and 'markNotificationRead' in sw
          assert "renderer:'bangkok-seasonal-clouds-v2'" in env and 'const DPR=2' in env and 'renderExport' in env and 'antialias:false' in env and 'ensureSnowCanvas' in env and 'ensureHailCanvas' in env
          for token in ('High veil / cirrus','Mid broken cloud','Low convective / monsoon','uSun','uSolarAltitude','sunDisc','Visible sun disc','texture2D(uNoise','AirBKK PM2.5 optics'): assert token in shader,token
          wrangler=json.loads(Path('sky-worker/wrangler.jsonc').read_text()); assert wrangler.get('triggers',{}).get('crons')==[]
          assert Path('sky-worker/src/index.js').exists() and Path('site/sky-calibration.js').exists() and Path('site/sky-color-renderer.js').exists()
          PY

      - name: Verify production shell and Environmental Alerts Worker
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          ALERT_WORKER="https://sindhorn-midtown-alerts.decha-dae.workers.dev"
          promoted=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html \
              && curl --fail --silent --show-error --location "${BASE_URL}/route-registry.js" -o /tmp/route-registry.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/footer-route-guard.js" -o /tmp/footer-route-guard.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/footer-route-guard.css" -o /tmp/footer-route-guard.css \
              && curl --fail --silent --show-error --location "${BASE_URL}/fnb.js?v=4" -o /tmp/fnb.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/fnb-data.js" -o /tmp/fnb-data.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/fnb.css" -o /tmp/fnb.css \
              && curl --fail --silent --show-error --location "${BASE_URL}/environment.js" -o /tmp/environment.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/atmosphere-shader.js" -o /tmp/shader.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/notification-inbox.js" -o /tmp/notification-inbox.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js \
              && grep -q '/footer-route-guard.js?v=4' /tmp/root.html \
              && grep -q "path:'/fnb'" /tmp/route-registry.js \
              && grep -q 'sindhorn-footer-v4-fnb-direct' /tmp/footer-route-guard.js \
              && grep -q "FNB_MODULE_URL='/fnb.js?v=4'" /tmp/footer-route-guard.js \
              && grep -q 'module.mountFnbRoute' /tmp/footer-route-guard.js \
              && grep -q 'height:44px!important' /tmp/footer-route-guard.css \
              && grep -q 'mountFnbRoute' /tmp/fnb.js \
              && grep -q 'FNB_PROMOTIONS' /tmp/fnb-data.js \
              && grep -q 'background:transparent' /tmp/fnb.css \
              && ! grep -q '/sky-calibration.js' /tmp/root.html \
              && ! grep -q '/sky-color-renderer.js' /tmp/root.html \
              && ! grep -q '/storm-effects.js' /tmp/root.html \
              && grep -q 'bangkok-seasonal-clouds-v2' /tmp/environment.js \
              && grep -q 'Low convective / monsoon' /tmp/shader.js \
              && grep -q 'Visible sun disc' /tmp/shader.js \
              && grep -q 'pwa-v23-bangkok-seasonal-clouds' /tmp/sw.js; then promoted=true; break; fi
            sleep 3
          done
          test "$promoted" = true
          for path in /fnb /messages /location.js /push-config.js /push-client.js /notification-inbox.js /manifest.webmanifest; do curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o "/tmp/$(basename "$path" | sed 's/^$/root/')"; done
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${ALERT_WORKER}/health" -o /tmp/alert-health.json
          grep -q 'Current location' /tmp/location.js
          grep -q 'pushManager.subscribe' /tmp/push-client.js
          ! grep -q 'Notification.requestPermission' /tmp/push-client.js
          grep -q 'SindhornNotificationInbox' /tmp/notification-inbox.js
          python3 - <<'PY'
          import json
          pwa=json.load(open('/tmp/manifest.webmanifest')); assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'
          alert=json.load(open('/tmp/alert-health.json')); assert alert.get('ok') is True and alert.get('service')=='sindhorn-midtown-alerts' and alert.get('vapidConfigured') is True
          last=alert.get('lastEvaluation') or {}; assert last.get('airOk') is True and last.get('weatherOk') is True
          PY

      - name: Verify active Supabase UI pack integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, urllib.parse, urllib.request
          bootstrap=Path('site/bootstrap.js').read_text(); base=re.search(r"const SUPABASE_URL='([^']+)'",bootstrap).group(1); key=re.search(r"const SUPABASE_KEY='([^']+)'",bootstrap).group(1); table=re.search(r"const TABLE='([^']+)'",bootstrap).group(1)
          query=urllib.parse.urlencode({'select':'pack_id,path,content,content_type,content_sha256,enabled','enabled':'eq.true','order':'pack_id.desc,path.asc'})
          req=urllib.request.Request(f'{base}/rest/v1/{table}?{query}',headers={'apikey':key,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response: rows=json.load(response)
          packs={int(row['pack_id']) for row in rows}; assert packs=={38},packs
          rowmap={row['path']:row for row in rows}; manifest_row=rowmap['manifest.json']; assert hashlib.sha256(manifest_row['content'].encode()).hexdigest()==manifest_row['content_sha256']
          manifest=json.loads(manifest_row['content']); assert manifest['appPack']==38 and manifest['minimumShell']==17 and manifest['environmentConfig']==3
          assert 'messages.html' in rowmap and 'environment-config.json' in rowmap
          today=rowmap['today.html']['content']; assert 'saveImageBtn' not in today and 'report-actionbar' not in today
          for item in manifest['resources']:
              row=rowmap[item['path']]; assert row['content_sha256']==item['sha256'] and hashlib.sha256(row['content'].encode()).hexdigest()==item['sha256']
          PY
