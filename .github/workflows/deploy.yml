name: Deploy Sindhorn Midtown Internal

on:
  push:
    branches:
      - main
      - webgl-environment-v1
      - hybrid-shell-v15
      - atmosphere-tester-v1
      - hotfix-rain-svg-pane
      - rain-realism-type-consistency
      - wet-glass-shader-v1
      - wet-glass-shader-v2
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check site/bootstrap.js
          node --check site/live-data.js
          node --check site/environment.js
          node --check site/rain-layer.js
          node --check site/atmosphere-tester.js
          node --check site/tester-celestials.js
          node --check site/presentation-recovery.js
          node --check site/app.js
          node --check site/sw.js
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site'); fallback=root/'fallback'
          manifest=json.loads((fallback/'manifest.json').read_text())
          bootstrap=(root/'bootstrap.js').read_text()
          match=re.search(r'const SHELL_VERSION=(\d+);',bootstrap)
          assert match,'bootstrap shell version missing'
          shell_version=int(match.group(1))
          assert manifest['minimumShell']==shell_version,f"fallback minimumShell {manifest['minimumShell']} != shell {shell_version}"
          for item in manifest['resources']:
              data=(fallback/item['path']).read_bytes(); digest=hashlib.sha256(data).hexdigest()
              assert digest==item['sha256'],f"fallback hash mismatch: {item['path']}"
          index=(root/'index.html').read_text()
          assert '/rain-layer.js?v=4' in index
          rain=(root/'rain-layer.js').read_text()
          assert 'rainPaneSvg' in rain
          assert 'rainPaneCanvas' not in rain
          assert 'desynchronized:true' not in rain
          assert 'tester-celestials.js?v=1' in rain
          tester=(root/'atmosphere-tester.html').read_text()
          assert 'ATMOSPHERE TESTER' in tester and '/atmosphere-tester.js' in tester and '/rain-layer.js?v=4' in tester
          assert '/tester-celestials.js?v=1' in tester
          celestial=(root/'tester-celestials.js').read_text()
          assert 'sunEclipse' in celestial and 'moonEclipse' in celestial
          wet=(root/'wet-glass-tester.html').read_text()
          assert 'WET GLASS' in wet and 'SIM_SIZE=512' in wet and 'uSceneTex' in wet and 'window.WetGlassLab' in wet
          module=re.search(r'<script type="module">(.*?)</script>',wet,re.S)
          assert module,'wet-glass inline module missing'
          Path('/tmp/wet-glass-tester.mjs').write_text(module.group(1))
          sw=(root/'sw.js').read_text()
          assert 'isAppRoute' in sw and 'rain4' in sw
          PY
          node --check /tmp/wet-glass-tester.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test deployed shell
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          else
            BRANCH_ALIAS="${GITHUB_REF_NAME:0:28}"
            BASE_URL="https://${BRANCH_ALIAS}.sindhorn-midtown-internal.pages.dev"
          fi
          sleep 8
          for path in / /guidance /details /bootstrap.js /environment.js /rain-layer.js /atmosphere-tester.html /atmosphere-tester.js /tester-celestials.js /wet-glass-tester.html /presentation-recovery.js /app.js /sw.js /fallback/manifest.json /fallback/ui.css; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke-response
            test -s /tmp/smoke-response
          done
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/" -o /tmp/smoke-root
          grep -q '/bootstrap.js' /tmp/smoke-root
          grep -q '/rain-layer.js?v=4' /tmp/smoke-root
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/rain-layer.js" -o /tmp/smoke-rain
          grep -q 'rainPaneSvg' /tmp/smoke-rain
          ! grep -q 'rainPaneCanvas' /tmp/smoke-rain
          grep -q 'tester-celestials.js?v=1' /tmp/smoke-rain
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/atmosphere-tester.html" -o /tmp/smoke-tester
          grep -q 'ATMOSPHERE TESTER' /tmp/smoke-tester
          grep -q '/rain-layer.js?v=4' /tmp/smoke-tester
          grep -q '/tester-celestials.js?v=1' /tmp/smoke-tester
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/tester-celestials.js" -o /tmp/smoke-celestial
          grep -q 'sunEclipse' /tmp/smoke-celestial
          grep -q 'moonEclipse' /tmp/smoke-celestial
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/wet-glass-tester.html" -o /tmp/smoke-wet
          grep -q 'SIM_SIZE=512' /tmp/smoke-wet
          grep -q 'uSceneTex' /tmp/smoke-wet
          grep -q 'window.WetGlassLab' /tmp/smoke-wet
          SHELL_VERSION="$(node -e "const fs=require('fs');const m=fs.readFileSync('site/bootstrap.js','utf8').match(/const SHELL_VERSION=(\\d+);/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/fallback/manifest.json" -o /tmp/smoke-manifest
          grep -q "\"minimumShell\": ${SHELL_VERSION}" /tmp/smoke-manifest
