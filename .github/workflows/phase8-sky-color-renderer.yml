name: Phase 8 Sky Color Renderer

on:
  push:
    branches:
      - phase8-directional-sky-calibration
      - main
    paths:
      - "site/sky-color-renderer.js"
      - "site/sky-calibration.js"
      - "site/index.html"
      - "site/sw.js"
      - ".github/workflows/phase8-sky-color-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-phase8-color-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKY_WORKER_URL: https://sindhorn-midtown-sky.decha-dae.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate live sky color integration
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sky-color-renderer.js
          node --check site/sky-calibration.js
          node --check site/sw.js
          grep -q '/sky-color-renderer.js?v=1' site/index.html
          grep -q "id='skyCalibrationCanvas'\|id=\"skyCalibrationCanvas\"\|canvas.id='skyCalibrationCanvas'" site/sky-color-renderer.js
          grep -q 'sunrise-east' site/sky-color-renderer.js
          grep -q 'sunset-west' site/sky-color-renderer.js
          grep -q 'zenithRgb' site/sky-color-renderer.js
          grep -q 'horizonRgb' site/sky-color-renderer.js
          grep -q 'compositeExport' site/sky-color-renderer.js
          grep -q 'SindhornSkyColorRenderer' site/sky-color-renderer.js
          grep -q "'/sky-color-renderer.js'" site/sw.js
          grep -q 'pwa-v21-live-sky-color-calibration' site/sw.js

      - name: Verify live sky calibration backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${SKY_WORKER_URL}/health" -o /tmp/sky-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/sky-health.json'))
          assert data.get('ok') is True
          assert data.get('service')=='sindhorn-midtown-sky'
          assert data.get('aiConfigured') is True
          PY

      - name: Deploy Pages preview
        if: github.ref_name != 'main'
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test Pages preview
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://phase8-directional-sky-calib.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /sky-calibration.js /sky-color-renderer.js /sw.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/phase8-response
            test -s /tmp/phase8-response
          done
          curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html
          curl --fail --silent --show-error --location "${BASE_URL}/sky-color-renderer.js" -o /tmp/sky-color.js
          curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js
          grep -q '/sky-color-renderer.js?v=1' /tmp/root.html
          grep -q 'SindhornSkyColorRenderer' /tmp/sky-color.js
          grep -q 'compositeExport' /tmp/sky-color.js
          grep -q 'pwa-v21-live-sky-color-calibration' /tmp/sw.js

      - name: Verify production promotion
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          promoted=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html \
              && curl --fail --silent --show-error --location "${BASE_URL}/sky-color-renderer.js" -o /tmp/sky-color.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js \
              && grep -q '/sky-color-renderer.js?v=1' /tmp/root.html \
              && grep -q 'SindhornSkyColorRenderer' /tmp/sky-color.js \
              && grep -q 'pwa-v21-live-sky-color-calibration' /tmp/sw.js; then
              promoted=true
              break
            fi
            sleep 4
          done
          test "$promoted" = true
