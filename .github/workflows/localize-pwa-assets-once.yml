name: Localize PWA shell assets
on:
  push:
    branches: [webgl-environment-v1]
    paths: ['.github/workflows/localize-pwa-assets-once.yml']
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download canonical app-shell assets
        run: |
          set -euo pipefail
          mkdir -p site/vendor site/assets/brand site/assets/fonts
          curl -fsSL 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js' -o site/vendor/three.module.js
          BASE='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand'
          curl -fsSL "$BASE/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png" -o site/assets/brand/sindhorn-midtown-vignette-white.png
          curl -fsSL "$BASE/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png" -o site/assets/brand/sindhorn-midtown-vignette-black.png
          curl -fsSL "$BASE/vignette/v1/fonts/vignette-sans-light.woff" -o site/assets/fonts/vignette-sans-light.woff
          curl -fsSL "$BASE/vignette/v1/fonts/vignette-sans-regular.woff" -o site/assets/fonts/vignette-sans-regular.woff
          curl -fsSL "$BASE/vignette/v1/fonts/vignette-sans-semibold.woff" -o site/assets/fonts/vignette-sans-semibold.woff
          curl -fsSL "$BASE/vignette/v1/fonts/ibm-plex-sans-thai-light.woff2" -o site/assets/fonts/ibm-plex-sans-thai-light.woff2
          curl -fsSL "$BASE/vignette/v1/fonts/ibm-plex-sans-thai-regular.woff2" -o site/assets/fonts/ibm-plex-sans-thai-regular.woff2
          curl -fsSL "$BASE/vignette/v1/fonts/ibm-plex-sans-thai-semibold.woff2" -o site/assets/fonts/ibm-plex-sans-thai-semibold.woff2
      - name: Point app shell to local assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/environment.js')
          s=p.read_text().replace("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","/vendor/three.module.js")
          p.write_text(s)
          p=Path('site/index.html');s=p.read_text()
          replacements={
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png':'/assets/brand/sindhorn-midtown-vignette-white.png',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png':'/assets/brand/sindhorn-midtown-vignette-black.png',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-light.woff':'/assets/fonts/vignette-sans-light.woff',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-regular.woff':'/assets/fonts/vignette-sans-regular.woff',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-semibold.woff':'/assets/fonts/vignette-sans-semibold.woff',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-light.woff2':'/assets/fonts/ibm-plex-sans-thai-light.woff2',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-regular.woff2':'/assets/fonts/ibm-plex-sans-thai-regular.woff2',
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-semibold.woff2':'/assets/fonts/ibm-plex-sans-thai-semibold.woff2'
          }
          for a,b in replacements.items():s=s.replace(a,b)
          p.write_text(s)
          p=Path('site/sw.js');s=p.read_text()
          s=s.replace("sindhorn-midtown-internal-pwa-v1","sindhorn-midtown-internal-pwa-v2")
          old="'/icons/app-192.png','/icons/app-512.png','/icons/maskable-512.png','/icons/apple-touch-icon.png'"
          new="'/icons/app-192.png','/icons/app-512.png','/icons/maskable-512.png','/icons/apple-touch-icon.png',\n  '/vendor/three.module.js','/assets/brand/sindhorn-midtown-vignette-white.png','/assets/brand/sindhorn-midtown-vignette-black.png',\n  '/assets/fonts/vignette-sans-light.woff','/assets/fonts/vignette-sans-regular.woff','/assets/fonts/vignette-sans-semibold.woff',\n  '/assets/fonts/ibm-plex-sans-thai-light.woff2','/assets/fonts/ibm-plex-sans-thai-regular.woff2','/assets/fonts/ibm-plex-sans-thai-semibold.woff2'"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Verify self-contained shell
        run: |
          node --check site/environment.js
          node --check site/sw.js
          grep -q "from '/vendor/three.module.js'" site/environment.js
          ! grep -q 'cdn.jsdelivr.net/npm/three' site/environment.js
          grep -q '/assets/brand/sindhorn-midtown-vignette-white.png' site/index.html
          grep -q '/assets/fonts/vignette-sans-light.woff' site/index.html
          test -s site/vendor/three.module.js
          find site/assets -type f -size 0 -print -quit | (! grep .)
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/localize-pwa-assets-once.yml
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site .github/workflows/localize-pwa-assets-once.yml
          git commit -m "Make PWA shell self-contained offline"
          git push origin HEAD:webgl-environment-v1
