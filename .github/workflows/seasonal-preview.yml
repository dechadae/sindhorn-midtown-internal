name: Seasonal Thailand Twilight Preview

on:
  push:
    branches:
      - seasonal-thailand-twilight
    paths:
      - "site/**"
      - ".github/workflows/seasonal-preview.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: sindhorn-midtown-seasonal-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate seasonal compositor
        shell: bash
        run: |
          set -euo pipefail
          node --check site/seasonal-sky.js
          node --check site/storm-effects.js
          node --check site/screen-capture.js
          node --check site/sw.js
          grep -q '/seasonal-sky.js?v=1' site/index.html
          grep -q 'storm-effects.js?v=2' site/index.html
          grep -q 'screen-capture.js?v=3' site/index.html
          grep -q "doy>=46&&doy<135" site/seasonal-sky.js
          grep -q "doy>=135&&doy<288" site/seasonal-sky.js
          grep -q "season==='rainy'" site/seasonal-sky.js
          grep -q 'twilightStrength' site/seasonal-sky.js
          grep -q 'uSolar' site/environment.js || true
          grep -q 'wrapExport' site/seasonal-sky.js
          grep -q "'/seasonal-sky.js'" site/sw.js
          grep -q 'atmosphere7-seasonal1' site/sw.js

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test seasonal preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://seasonal-thailand-twilight.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in / /seasonal-sky.js /storm-effects.js /screen-capture.js /sw.js; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/smoke
            test -s /tmp/smoke
          done
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/" -o /tmp/root
          grep -q '/seasonal-sky.js?v=1' /tmp/root
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/seasonal-sky.js" -o /tmp/seasonal
          grep -q 'rainy' /tmp/seasonal
          grep -q 'twilightStrength' /tmp/seasonal
          grep -q 'wrapExport' /tmp/seasonal
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/sw.js" -o /tmp/sw
          grep -q 'atmosphere7-seasonal1' /tmp/sw
