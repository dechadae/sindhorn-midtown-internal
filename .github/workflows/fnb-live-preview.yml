name: F&B Live Route Preview

on:
  push:
    branches:
      - fnb-live-integration
      - fnb-cache-hotfix
      - fix-fnb-footer-route
      - fix-fnb-chip-anchor
    paths:
      - "site/index.html"
      - "site/app-transitions.js"
      - "site/pwa-version-guard.js"
      - "site/footer-route-guard.js"
      - "site/footer-route-guard.css"
      - "site/fnb.js"
      - "site/fnb-data.js"
      - "site/fnb.css"
      - "site/sw.js"
      - ".github/workflows/fnb-live-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: fnb-live-route-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Validate in-shell F&B module
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app-transitions.js
          node --check site/pwa-version-guard.js
          node --check site/footer-route-guard.js
          node --check site/fnb.js
          node --check site/fnb-data.js
          node --check site/sw.js
          node --input-type=module - <<'NODE'
          import {FNB_PROMOTIONS} from './site/fnb-data.js';
          if(FNB_PROMOTIONS.length!==8) throw new Error(`expected 8 promotions, got ${FNB_PROMOTIONS.length}`);
          const artworks=FNB_PROMOTIONS.reduce((sum,c)=>sum+c.activations.reduce((s,a)=>s+a.artworks.length,0),0);
          if(artworks!==29) throw new Error(`expected 29 artworks, got ${artworks}`);
          const outlets=new Set(FNB_PROMOTIONS.flatMap(c=>c.activations.map(a=>a.outlet)));
          if(outlets.size!==5) throw new Error(`expected 5 outlets, got ${outlets.size}`);
          NODE
          grep -q -- "--fnb-chip-h:44px" site/fnb.css
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))" site/fnb.css
          grep -q "background:transparent" site/fnb.css
          grep -q "mountFnbRoute" site/fnb.js
          ! grep -q "Intentionally empty shell route" site/fnb.js
          grep -q "employee_number||''.*10639" site/fnb.js
          grep -q '/pwa-version-guard.js?v=1' site/index.html
          grep -q '/footer-route-guard.js?v=2' site/index.html
          grep -q '/footer-route-guard.css?v=2' site/index.html
          grep -q "sindhorn-footer-v3-anchor" site/footer-route-guard.js
          grep -q "document.createElement('a')" site/footer-route-guard.js
          grep -q "control.href=item.href" site/footer-route-guard.js
          ! grep -q "fnbFallback" site/footer-route-guard.js
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))!important" site/footer-route-guard.css
          grep -q "height:44px!important" site/footer-route-guard.css
          grep -q "pwa-v28-footer-fnb-route-repair" site/sw.js
          grep -q "client.navigate(client.url)" site/sw.js
          grep -q "'/footer-route-guard.js'" site/sw.js
          grep -q "'/footer-route-guard.css'" site/sw.js
          grep -q "'/fnb-data.js'" site/sw.js
          grep -q "'/fnb.css'" site/sw.js
          grep -q "fnbRouteIsBlank" site/pwa-version-guard.js
          grep -q "host.style.removeProperty('opacity')" site/app-transitions.js
          ! grep -q "<header class=\"appbar\"" site/fnb.js

      - name: Deploy branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Smoke test shell route and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb" -o /tmp/fnb-shell.html
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb.js" -o /tmp/fnb.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb-data.js" -o /tmp/fnb-data.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/fnb.css" -o /tmp/fnb.css
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/footer-route-guard.js" -o /tmp/footer-route-guard.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/footer-route-guard.css" -o /tmp/footer-route-guard.css
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/pwa-version-guard.js" -o /tmp/pwa-version-guard.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/app-transitions.js" -o /tmp/app-transitions.js
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 "${BASE_URL}/sw.js" -o /tmp/sw.js
          grep -q 'id="environmentStage"' /tmp/fnb-shell.html
          grep -q 'id="route-view"' /tmp/fnb-shell.html
          grep -q '/pwa-version-guard.js?v=1' /tmp/fnb-shell.html
          grep -q '/footer-route-guard.js?v=2' /tmp/fnb-shell.html
          grep -q '/footer-route-guard.css?v=2' /tmp/fnb-shell.html
          grep -q 'mountFnbRoute' /tmp/fnb.js
          ! grep -q 'Intentionally empty shell route' /tmp/fnb.js
          grep -q 'FNB_PROMOTIONS' /tmp/fnb-data.js
          grep -q -- '--fnb-chip-h:44px' /tmp/fnb.css
          grep -q 'background:transparent' /tmp/fnb.css
          grep -q 'sindhorn-footer-v3-anchor' /tmp/footer-route-guard.js
          grep -q "document.createElement('a')" /tmp/footer-route-guard.js
          ! grep -q 'fnbFallback' /tmp/footer-route-guard.js
          grep -q 'height:44px!important' /tmp/footer-route-guard.css
          grep -q 'fnbRouteIsBlank' /tmp/pwa-version-guard.js
          grep -q "host.style.removeProperty('opacity')" /tmp/app-transitions.js
          grep -q 'pwa-v28-footer-fnb-route-repair' /tmp/sw.js
          grep -q 'client.navigate(client.url)' /tmp/sw.js
