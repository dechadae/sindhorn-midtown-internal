name: Apply login and position tweaks

on:
  push:
    branches:
      - preview-login-profile-fix

permissions:
  contents: write

concurrency:
  group: apply-login-position-tweaks
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed source edits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-login-position-tweaks.py
          node --input-type=module --check < site/settings.js
          node --input-type=module --check < scripts/login-profile-history-browser-smoke.mjs
          if git diff --quiet; then
            echo 'Source already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/login.html site/auth-brand.css site/settings.js scripts/login-profile-history-browser-smoke.mjs .github/workflows/login-profile-history-preview.yml
          git commit -m 'Refine login inputs logo and position editor'
          git push origin HEAD:preview-login-profile-fix
