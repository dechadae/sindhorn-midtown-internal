name: Footer Typography Release Gate

on:
  push:
    branches: [fix-footer-font-token-release]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate typography and F&B regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3 >/dev/null 2>&1
          node .github/tests/font-architecture.test.mjs
          node .github/tests/fnb-sharing-regression.test.mjs
          node --experimental-default-type=module site/phase8-2-seasonal-clouds.test.mjs
