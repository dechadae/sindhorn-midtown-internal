<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E273B">
<title>January Clear Sunset · Sindhorn Midtown Atmosphere</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111522;color:#faf7f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.info{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;padding:12px 14px;border:1px solid rgba(250,247,245,.18);border-radius:16px;background:rgba(31,29,42,.34);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:11px;line-height:1.45;letter-spacing:.02em;max-width:min(420px,calc(100vw - 36px))}.info strong{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;margin-bottom:3px}.muted{opacity:.68}
</style>
</head>
<body>
<canvas id="sky" aria-label="January clear-sky sunset atmosphere example"></canvas>
<div class="info"><strong>JANUARY · CLEAR SUNSET</strong><div>15 Jan 2026 · 18:20 Bangkok · sun −3.3° / 249°</div><div class="muted">Clear sky · 4% cloud · RH 58% · visibility 30 km · PM2.5 18 µg/m³</div></div>
<script type="module">
import {seasonalSkyForState} from './seasonal-sky.js';
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d',{alpha:false});
const state={date:new Date('2026-01-15T18:20:00+07:00'),solarAltitude:-3.2577,solarAzimuth:249.0968,weather:{weatherCode:0,cloudCover:.04,humidity:.58,rain:0,showers:0,precipitation:0,storm:0}};
const seasonal=seasonalSkyForState(state);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const rgb=v=>`rgb(${v.map(x=>Math.round(clamp(x)*255)).join(',')})`;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const haze=[0.70,0.62,0.59];
function resize(){const dpr=Math.max(1,Math.min(3,devicePixelRatio||1));canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);const top=seasonal.top,horizon=seasonal.horizon;
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,rgb(mix(top,[0.17,0.20,0.34],.08)));g.addColorStop(.54,rgb(mix(top,horizon,.46)));g.addColorStop(.82,rgb(mix(top,horizon,.80)));g.addColorStop(1,rgb(mix(horizon,haze,.10+seasonal.hazePrior*.12)));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 const sunX=w*.74,sunY=h*1.02;const halo=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(w,h)*.54);halo.addColorStop(0,'rgba(255,174,111,.34)');halo.addColorStop(.18,'rgba(246,141,118,.18)');halo.addColorStop(.42,'rgba(215,114,153,.10)');halo.addColorStop(.72,'rgba(128,91,159,.045)');halo.addColorStop(1,'rgba(90,71,137,0)');ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
 const horizonGlow=ctx.createLinearGradient(0,h*.68,0,h);horizonGlow.addColorStop(0,'rgba(255,170,116,0)');horizonGlow.addColorStop(.58,'rgba(241,139,124,.05)');horizonGlow.addColorStop(1,'rgba(210,120,151,.11)');ctx.fillStyle=horizonGlow;ctx.fillRect(0,0,w,h);
 const vignette=ctx.createRadialGradient(w*.5,h*.48,Math.min(w,h)*.12,w*.5,h*.48,Math.max(w,h)*.76);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(14,15,25,.18)');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);
 for(let i=0;i<1800;i++){const x=(i*73)%Math.max(1,w),y=(i*151)%Math.max(1,h),a=((i*47)%17)/2550;ctx.fillStyle=`rgba(255,255,255,${a.toFixed(4)})`;ctx.fillRect(x,y,1,1)} }
addEventListener('resize',resize,{passive:true});resize();
</script>
</body>
</html>
