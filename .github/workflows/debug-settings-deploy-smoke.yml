name: Debug Settings Deploy Smoke

on:
  push:
    branches: [hotfix-settings-deploy-gate-v2]
    paths:
      - ".github/workflows/debug-settings-deploy-smoke.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe branch preview
        shell: bash
        run: |
          set -u
          BASE_URL="https://hotfix-settings-deploy-gate.sindhorn-midtown-internal.pages.dev"
          for path in / /fnb /messages /settings /account /admin /route-registry.js /app-transitions.js /auth-shell.js /auth-shell.css /auth-client.js /login.html /login.js /capabilities.js /settings.js /settings-route-v3.js /settings.css /settings-refinements.css /fnb.js /fnb-share-ui.js /fnb-refinements.css /location.js /bootstrap.js /environment.js /atmosphere-shader.js /seasonal-sky.js /rain-layer.js /sun-dimmer.js /screen-capture.js /manifest.webmanifest /phase8-2-fixtures.js /notification-inbox.js /push-client.js /sw.js /share/fnb; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}${path}" || true)
            echo "$code $path"
          done
