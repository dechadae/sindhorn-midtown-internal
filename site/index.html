<!doctype html>
<html lang="en" data-deploy="github-actions">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#2E273B">
  <title>Sindhorn Midtown Internal</title>
  <style>
    :root{color-scheme:dark;--bg:#2E273B;--fg:#FAF7F5;--muted:rgba(250,247,245,.68);--line:rgba(250,247,245,.2)}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:28px}
    main{width:min(100%,620px)}
    .kicker{margin:0 0 18px;color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.4rem,10vw,5.4rem);font-weight:300;line-height:.92;letter-spacing:-.035em}
    p{margin:24px 0 0;color:var(--muted);font-size:1.05rem;line-height:1.6}
    .status{display:flex;align-items:center;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .dot{width:9px;height:9px;border-radius:50%;background:#83A968;box-shadow:0 0 0 5px rgba(131,169,104,.12)}
  </style>
</head>
<body>
  <main>
    <p class="kicker">Sindhorn Midtown · Internal</p>
    <h1>Deployment connected.</h1>
    <p>This is the temporary deployment smoke test. The approved PM2.5 v5 experience will be migrated here before the real-time weather, astronomy and air-quality WebGL environment is developed.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>GitHub → Wrangler → Cloudflare Pages</div>
  </main>
</body>
</html>
