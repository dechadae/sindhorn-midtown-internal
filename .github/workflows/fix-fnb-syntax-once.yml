name: One-shot F&B Syntax Repair

on:
  push:
    branches: [fix-fnb-direct-footer-v4]
    paths: [".github/workflows/fix-fnb-syntax-once.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-fnb-direct-footer-v4
          fetch-depth: 0
      - name: Repair malformed scrollIntoView object
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('site/fnb.js')
          text=path.read_text()
          old="q('#'+section.dataset.section)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start');return}"
          new="q('#'+section.dataset.section)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}"
          if old not in text:
              raise SystemExit('Expected malformed F&B scrollIntoView expression not found')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check site/fnb.js
          git diff --check
          git diff -- site/fnb.js
      - name: Commit repaired module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site/fnb.js
          git commit -m "Fix F&B browser parse error"
          git push origin HEAD:fix-fnb-direct-footer-v4
