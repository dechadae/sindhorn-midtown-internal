        run: |
          rm -f .github/workflows/weather-quality-v13-once.yml
          rm -f package.json package-lock.json
          git config user.name "dechadae"
          git config user.email "decha.dae@gmail.com"
          git add site docs AGENTS.md .github/workflows/weather-quality-v13-once.yml
          git commit -m "Upgrade weather fidelity and premium mobile experience"
