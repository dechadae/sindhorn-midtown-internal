name: Launch Hardening

on:
  push:
    branches:
      - main
      - performance-audit-post-weather-webgl
    paths:
      - "site/**"
      - "sky-worker/wrangler.jsonc"
      - ".github/workflows/launch-hardening.yml"
      - "docs/**"
      - "AGENTS.md"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sindhorn-midtown-launch-hardening-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify current PWA, Betta, weather-data and navigation architecture
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/bootstrap.js site/route-registry.js site/app-transitions.js site/footer-route-guard.js
            site/business-dashboard.js site/business-dashboard-data.js site/business-dashboard-motion.js site/app.js
            site/push-client.js site/notification-inbox.js site/betta-environment.js site/betta-satellite.js
            site/betta-day-periods.js site/location.js site/rain-now.js site/weather-authority.js
            site/live-data.js site/sw.js site/screen-capture.js
          )
          for file in "${files[@]}"; do
            test -s "$file"
            node --input-type=module --check < "$file"
          done
          node site/betta-day-periods.test.mjs
          node site/betta-vignette-palettes.test.mjs
          node site/weather-authority.test.mjs

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site')
          retired=(
            'environment.js','environment.bundle.js','seasonal-sky.js','atmosphere-shader.js',
            'rain-layer-legacy-weather.js','rain-layer.js','sun-dimmer.js','storm-effects.js',
            'sky-calibration.js','sky-color-renderer.js','cloud-tester.js',
            'phase8-2-fixtures.js','phase8-2-seasonal-clouds.test.mjs'
          )
          for name in retired:
              assert not (root/name).exists(), name

          pwa=json.loads((root/'manifest.webmanifest').read_text())
          assert pwa['id']=='/' and pwa['start_url']=='/' and pwa['scope']=='/' and pwa['display']=='standalone'

          bootstrap=(root/'bootstrap.js').read_text()
          registry=(root/'route-registry.js').read_text()
          transitions=(root/'app-transitions.js').read_text()
          footer=(root/'footer-route-guard.js').read_text()
          index=(root/'index.html').read_text()
          sw=(root/'sw.js').read_text()
          betta=(root/'betta-environment.js').read_text()
          location=(root/'location.js').read_text()
          rain=(root/'rain-now.js').read_text()
          weather=(root/'weather-authority.js').read_text()
          capture=(root/'screen-capture.js').read_text()

          fallback=json.loads((root/'fallback/manifest.json').read_text())
          shell=int(re.search(r'const SHELL_VERSION=(\d+);',bootstrap).group(1))
          assert shell==17 and fallback['minimumShell']==shell
          for item in fallback['resources']:
              assert hashlib.sha256((root/'fallback'/item['path']).read_bytes()).hexdigest()==item['sha256'], item['path']

          for token in (
            "today:Object.freeze({path:'/'",
            "fnb:Object.freeze({path:'/fnb'",
            "messages:Object.freeze({path:'/messages'",
            "brand:Object.freeze({path:'/brand'",
            "hotelFactsheet:Object.freeze({path:'/hotel-factsheet'",
            "settings:Object.freeze({path:'/settings'",
            "ci:Object.freeze({path:'/ci'",
          ):
              assert token in registry, token
          assert "['/guidance','today']" in registry and "['/details','today']" in registry
          assert "['/account','settings']" in registry and "['/admin','settings']" in registry
          assert 'startViewTransition' not in transitions
          assert "route:'today'" in footer and "route:'fnb'" in footer and "route:'messages'" in footer

          # Betta is the only persistent WebGL visual.
          # Derive the pin: bootstrap.js and auth-shell.js must import the same build, or
          # the browser evaluates two module instances and initEnvironment runs twice.
          import re as _re
          _b=_re.search(r"await import\('(\./betta-runtime\.js\?v=\d+)'\)",bootstrap)
          assert _b, 'bootstrap.js must import the Betta runtime'
          assert "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" in betta
          assert "dataset.environmentInput='satellite-only'" in betta
          assert 'startSatelliteStream' in betta
          assert 'const DPR=2' in betta and 'preserveDrawingBuffer:false' in betta
          for name in retired:
              assert f"'/{name}'" not in sw, name
              assert f'/{name}' not in index, name

          # Performance audit: no full Three.js or capture library in startup/install.
          assert "sindhorn-midtown-internal-pwa-v41-performance-r1" in sw
          assert "'/betta-runtime-full.js'" in sw and "'/betta-runtime.js'" not in sw  # r17: the shell imports the full runtime
          assert "'/vendor/three.module.js'" not in sw
          assert "'/vendor/html2canvas.min.js'" not in sw
          assert '/vendor/html2canvas.min.js' not in index
          assert "script.src='/vendor/html2canvas.min.js'" in capture
          assert (root/'vendor/three.module.js').exists()
          assert (root/'vendor/html2canvas.min.js').exists()

          # Operational weather remains data/UI only.
          assert 'sindhorn-weather-core' in location
          assert 'open_meteo_used:false' in location
          assert 'sindhorn-weather-core' in rain
          assert 'resolveWeatherAuthority' in rain
          assert 'effectiveWeatherSnapshot' in weather

          # r17: the shell imports the self-contained full runtime; the satellite
          # module is bundled into it, so the precache lists the bundle only.
          assert "'/betta-satellite.js'" not in sw
          assert "addEventListener('push'" in sw and "addEventListener('notificationclick'" in sw

          wrangler=json.loads(Path('sky-worker/wrangler.jsonc').read_text())
          assert wrangler.get('triggers',{}).get('crons')==[]
          assert Path('sky-worker/src/index.js').exists()

          migration=Path('supabase/migrations/20260831121436_archive_legacy_weather_webgl_sources.sql').read_text()
          assert 'private.legacy_weather_webgl_archive' in migration
          assert 'enable row level security' in migration.lower()
          PY

      - name: Install Chromium renderer
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Authenticated Betta lifecycle and frame review
        env:
          CI_SMOKE_EMPLOYEE_NUMBER: ${{ secrets.CI_SMOKE_EMPLOYEE_NUMBER }}
          CI_SMOKE_PIN: ${{ secrets.CI_SMOKE_PIN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export PHASE82_BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          else
            SAFE_BRANCH="${GITHUB_REF_NAME:0:28}"
            SAFE_BRANCH="${SAFE_BRANCH%-}"
            export PHASE82_BASE_URL="https://${SAFE_BRANCH}.sindhorn-midtown-internal.pages.dev"
          fi
          # Deploy runs in parallel with this workflow; the browser review must
          # see the generation this checkout describes, never the one before it.
          expected_version=$(grep -o "const VERSION='[^']*'" site/sw.js | head -1)
          test -n "$expected_version"
          ready=false
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error --location "${PHASE82_BASE_URL}/sw.js" -o /tmp/preview-sw.js \
              && grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/preview-sw.js \
              && grep -qF "$expected_version" /tmp/preview-sw.js; then
                ready=true; break
            fi
            sleep 10
          done
          test "$ready" = true
          node site/phase8-2-browser-smoke.mjs

      - name: Verify production shell and Environmental Alerts Worker
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://sindhorn-midtown-internal.pages.dev"
          ALERT_WORKER="https://sindhorn-midtown-alerts.decha-dae.workers.dev"

          retired_clean(){
            local retired result code type
            for retired in environment.js environment.bundle.js seasonal-sky.js atmosphere-shader.js rain-layer-legacy-weather.js rain-layer.js sun-dimmer.js storm-effects.js sky-calibration.js sky-color-renderer.js cloud-tester.js phase8-2-fixtures.js phase8-2-seasonal-clouds.test.mjs; do
              result=$(curl --silent --show-error --location --output /tmp/retired-response --write-out '%{http_code}|%{content_type}' "${BASE_URL}/${retired}") || return 1
              code="${result%%|*}"
              type="${result#*|}"
              if [ "$code" = "200" ]; then
                case "$type" in text/html*) ;; *) return 1 ;; esac
                grep -qi '<!doctype html\|<html' /tmp/retired-response || return 1
              elif [ "$code" != "404" ]; then
                return 1
              fi
            done
          }

          expected_version=$(grep -o "const VERSION='[^']*'" site/sw.js | head -1)
          test -n "$expected_version"
          promoted=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "${BASE_URL}/" -o /tmp/root.html \
              && grep -q 'src="/shell.js"' /tmp/root.html \
              && curl --fail --silent --show-error --location "${BASE_URL}/bootstrap.js" -o /tmp/bootstrap.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/betta-environment.js" -o /tmp/betta.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/location.js" -o /tmp/location.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/rain-now.js" -o /tmp/rain-now.js \
              && curl --fail --silent --show-error --location "${BASE_URL}/sw.js" -o /tmp/sw.js \
              && grep -qE "await import\('\./betta-runtime\.js\?v=[0-9]+'\)" /tmp/bootstrap.js \
              && grep -q "dataset.environmentRenderer='sindhorn-betta-satellite-v1'" /tmp/betta.js \
              && grep -q "dataset.environmentInput='satellite-only'" /tmp/betta.js \
              && grep -q 'sindhorn-weather-core' /tmp/location.js \
              && grep -q 'sindhorn-weather-core' /tmp/rain-now.js \
              && grep -q 'sindhorn-midtown-internal-pwa-v41-performance-r1' /tmp/sw.js \
              && grep -qF "$expected_version" /tmp/sw.js \
              && ! grep -q "'/vendor/three.module.js'" /tmp/sw.js \
              && ! grep -q "'/vendor/html2canvas.min.js'" /tmp/sw.js \
              && ! grep -q '/vendor/html2canvas.min.js' /tmp/root.html \
              && ! grep -q '/rain-layer.js' /tmp/root.html \
              && ! grep -q '/sun-dimmer.js' /tmp/root.html \
              && retired_clean; then
                promoted=true; break
            fi
            sleep 3
          done
          test "$promoted" = true

          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "${ALERT_WORKER}/health" -o /tmp/alert-health.json
          python3 - <<'PY'
          import json
          alert=json.load(open('/tmp/alert-health.json'))
          assert alert.get('ok') is True
          assert alert.get('service')=='sindhorn-midtown-alerts'
          assert alert.get('vapidConfigured') is True
          last=alert.get('lastEvaluation') or {}
          assert last.get('airOk') is True and last.get('weatherOk') is True
          PY
