name: Brand Factsheet Preview

on:
  push:
    branches: [preview-brand-factsheet]
    paths:
      - "site/index.html"
      - "site/route-registry.js"
      - "site/_redirects"
      - "site/footer-route-guard.js"
      - "site/footer-route-guard.css"
      - "site/factsheet-footer-align.js"
      - "site/route-hero-standard.css"
      - "site/brand-route-controls.js"
      - "site/brand.js"
      - "site/brand.css"
      - "site/hotel-factsheet-route.js"
      - "site/hotel-factsheet.js"
      - "site/hotel-factsheet.css"
      - "site/hotel-factsheet-data.js"
      - "scripts/brand-factsheet-contract-test.mjs"
      - "scripts/brand-factsheet-browser-smoke.mjs"
      - "scripts/brand-factsheet-navigation-smoke.mjs"
      - "scripts/brand-route-controls-smoke.mjs"
      - ".github/workflows/brand-factsheet-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: brand-factsheet-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate routes, data and syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/brand.js site/brand-route-controls.js site/hotel-factsheet-route.js site/hotel-factsheet.js site/hotel-factsheet-data.js \
            site/route-registry.js site/footer-route-guard.js site/factsheet-footer-align.js \
            scripts/brand-factsheet-contract-test.mjs scripts/brand-factsheet-browser-smoke.mjs scripts/brand-factsheet-navigation-smoke.mjs scripts/brand-route-controls-smoke.mjs; do
            node --input-type=module --check < "$file"
          done
          node scripts/brand-factsheet-contract-test.mjs
          grep -q 'LINE Seed Sans TH' site/fonts.css
          ! grep -qiE 'Poppins|Noto|IBM Plex|Vignette Sans' \
            site/brand.js site/brand.css site/brand-route-controls.js site/hotel-factsheet.js site/hotel-factsheet.css site/hotel-factsheet-data.js
          python - <<'PY'
          from pathlib import Path
          files = [
              'site/brand.js','site/brand.css','site/brand-route-controls.js','site/hotel-factsheet.js',
              'site/hotel-factsheet.css','site/hotel-factsheet-data.js'
          ]
          for name in files:
              text = Path(name).read_text(encoding='utf-8')
              if any('\u0e00' <= ch <= '\u0e7f' for ch in text):
                  raise SystemExit(f'Thai UI text detected in {name}')
          PY

      - name: Verify protected systems unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          for file in \
            site/fnb.js site/fnb.css site/fnb-data.js site/fnb-approved-polish.css \
            site/ihg-history.js site/ihg-history.css site/ihg-history-data.js \
            site/app.js site/bootstrap.js site/app-transitions.js site/app-transitions.css \
            site/auth-shell.js site/auth-client.js site/capabilities.js \
            site/settings.js site/settings-route-v3.js site/settings.css site/settings-refinements.css \
            site/environment.js site/atmosphere-shader.js site/rain-now.js site/rain-layer.js \
            site/seasonal-sky.js site/weather-authority.js site/sw.js; do
            git diff --exit-code "$base" HEAD -- "$file"
          done

      - name: Deploy Cloudflare branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 pages deploy site --project-name=sindhorn-midtown-internal --branch="${GITHUB_REF_NAME}"

      - name: Raw route and module smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GITHUB_REF_NAME}.sindhorn-midtown-internal.pages.dev"
          sleep 8
          for path in \
            /brand /hotel-factsheet /ihg-history \
            /brand.js /brand.css /brand-route-controls.js /hotel-factsheet-route.js /hotel-factsheet.js /hotel-factsheet.css /hotel-factsheet-data.js \
            /route-registry.js /route-hero-standard.css /footer-route-guard.js /footer-route-guard.css /factsheet-footer-align.js /fnb /settings; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 2 "${BASE_URL}${path}" -o /tmp/response
            test -s /tmp/response
          done
          curl --fail --silent --show-error "${BASE_URL}/route-registry.js" -o /tmp/routes.js
          grep -q "path:'/brand'" /tmp/routes.js
          grep -q "path:'/hotel-factsheet'" /tmp/routes.js
          grep -q "path:'/ihg-history'" /tmp/routes.js
          grep -q "settings-route-v3.js?v=9&r=5" /tmp/routes.js
          curl --fail --silent --show-error "${BASE_URL}/hotel-factsheet-data.js" -o /tmp/facts.js
          grep -q "roomsAndSuites:393" /tmp/facts.js
          grep -q "meetingMaxGuests:120" /tmp/facts.js

      - name: Mobile browser smoke
        shell: bash
        env:
          BASE_URL: https://${{ github.ref_name }}.sindhorn-midtown-internal.pages.dev
          SCREENSHOT_DIR: /tmp/brand-factsheet-preview
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/brand-factsheet-browser-smoke.mjs | tee /tmp/brand-factsheet-browser-report.json
          node scripts/brand-factsheet-navigation-smoke.mjs | tee /tmp/brand-factsheet-navigation-report.json
          node scripts/brand-route-controls-smoke.mjs | tee /tmp/brand-route-controls-report.json

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: brand-factsheet-preview
          path: |
            /tmp/brand-factsheet-preview
            /tmp/brand-factsheet-browser-report.json
            /tmp/brand-factsheet-navigation-report.json
            /tmp/brand-route-controls-report.json
          if-no-files-found: warn
          retention-days: 14
