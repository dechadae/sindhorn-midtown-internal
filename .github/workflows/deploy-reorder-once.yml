name: Deploy reordered PM2.5 weather layout
on:
  push:
    paths:
      - '.github/workflows/deploy-reorder-once.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: webgl-environment-v1
      - name: Deploy current preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy site --project-name=sindhorn-midtown-internal --branch=webgl-environment-v1
      - name: Remove one-time deployment helper
        run: |
          git rm .github/workflows/deploy-reorder-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time reorder deploy helper"
          git push